[project]
name = "bcbs-mo-mrf"
version = "0.1.0"
description = "BCBS-MO PT/rehab MRF pipeline + MRF Explorer dashboard"
requires-python = ">=3.11"

[project.scripts]
mrfx = "mrfx.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mrfx", "src"]

[tool.setuptools.package-data]
mrfx = ["web/*"]

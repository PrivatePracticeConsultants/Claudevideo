# Normalize reporting_entity_name variants to one payer label
# (substring match, case-insensitive).
payer_name_map:
  "Anthem": "Anthem"
  "Blue Cross and Blue Shield of Kansas City": "Blue KC"
  "BKC": "Blue KC"      # Blue KC's MRF files report the entity name as just "BKC"
  "BCBSMI": "BCBS Michigan"
  "bcbsla": "BCBS Louisiana"

# Files parsed at the same time when grinding pasted links (each is its own
# CPU process; the database stays single-writer, and a died worker restarts
# automatically). 0 = auto: uses (your CPU cores - 1), capped at 8 — the
# fastest safe setting on any machine. Set a specific number to pin it (still
# capped at cores-1), or 1 to process strictly one file at a time.
parallel_ingests: 0

# Files DOWNLOADED at the same time to feed the parsers above. 0 = auto: 6,
# the same per-host connection limit a web browser uses. This is deliberately
# NOT tied to your processor count — downloading waits on the network, not the
# CPU. 1 = strictly one download at a time. Concurrent downloads each reserve
# their remaining size, so together they can never fill your disk.
parallel_downloads: 0

# Connections used for ONE file, via HTTP byte-range requests (like a download
# manager). 1 = off. Raise this when the queue is a few VERY LARGE files and
# downloading is the slow stage: many payer CDNs throttle each connection, so
# one 5 GB file arrives at a fraction of your line speed no matter how fast your
# internet is, and splitting it into 4 ranges fetches 4 pieces at once.
#
# When it does NOT help: hundreds of small files (parallel_downloads above is
# already the right lever there), a server that refuses range requests (mrfx
# detects this and silently falls back to one connection), or a link you are
# resuming a partial download of.
#
# It MULTIPLIES open connections (segments x parallel_downloads), so on a flaky
# CDN that drops connections a high value raises the failure rate. Pair a higher
# segment count with a LOWER parallel_downloads — e.g. segments 4, downloads 2.
download_segments: 1

# How long to wait for the NEXT piece of data before hanging up and
# reconnecting. This is the gap BETWEEN bytes, not a limit on how long a file
# may take — a big file that keeps streaming, however slowly, is never affected.
#
# This is the setting that governs "downloads stall". Payer CDNs regularly
# accept a connection and then go silent mid-file; until this fires, that
# download is holding one of your download slots doing nothing. It used to be
# 900 (15 minutes per silent episode, per slot). When it fires the app
# reconnects and resumes from exactly where it stopped — nothing is re-downloaded
# and nothing is lost. Lower it (e.g. 60) if a payer's CDN drops out constantly.
download_timeout_seconds: 120

# Give up on a download that goes this many seconds with NO forward progress —
# a flaky server (CDN) that keeps closing the connection early and won't resume.
# Without this, one bad file can tie up a download slot for over an hour and
# stall everything else; with it the file fails fast (its partial bytes are kept
# for a later retry) so the others keep flowing. A slow-but-steady large
# download is never affected. Lower it to abandon dead files sooner; 0 disables.
download_stall_seconds: 600

# Hard cap (seconds) on how long ANY single download may run before it's set
# aside so it stops blocking other files from ingesting. The stall setting above
# only catches downloads making NO progress; this also catches ones trickling in
# so slowly they'd hold a slot for hours (the "694 minutes downloading" case).
# Its partial bytes are kept — press retry to resume. Default 3 hours; raise it
# if you routinely pull very large files over a slow link, or set 0 to disable.
download_max_seconds: 10800

inbox_dir: data/inbox
processed_dir: data/processed
failed_dir: data/failed
store_dir: data/mrfx_store
move_processed: true          # false = leave files in inbox, track via checkpoint

# Memory ceiling (GB) for the analytics database (rollup rebuilds + dashboard
# queries). 8 is the sweet spot on a 32 GB machine: the rebuild sizes its work
# to fit on the first try (instead of failing upward into retries) while
# leaving headroom for the parser workers, Windows, and your browser.
# Remove the line to let the app choose automatically from available RAM.
duckdb_memory_gb: 8

# Where DuckDB writes temporary SPILL scratch during the heavy end-of-batch
# rollup. Unset = AUTOMATIC: if your store is on a slow spinning hard drive and
# you have a roomy SSD, the app routes the spill to the SSD by itself (this is
# what stalls the parser workers while a rollup runs); otherwise a folder inside
# store_dir. Set this only to force a specific fast disk. Example:
# duckdb_temp_dir: "C:\\mrfx_spill"

enrichment:
  # How provider names/geography get filled in behind the raw NPI numbers.
  #   api  = look each NPI up over the internet (no download, but rate-limited —
  #          a big book can take DAYS).
  #   bulk = one fast local pass over the NPPES monthly file (minutes for the
  #          whole book, then instant). RECOMMENDED for large books.
  #   off  = don't identify names.
  # For bulk: download the FULL monthly .zip from
  # https://download.cms.gov/nppes/NPI_Files.html and point bulk_csv_path at it
  # (keep the .zip — no need to unzip). Just setting bulk_csv_path is enough —
  # whenever that file is present it is used automatically (one fast local pass),
  # even if mode is left at 'api'; setting mode: bulk is the explicit form. See
  # "Make provider names fill in fast" in GETTING_STARTED.md.
  mode: api                   # api | bulk | off
  # On Windows keep the path in single quotes (or use forward slashes) so the
  # backslashes read correctly:
  # bulk_csv_path: 'E:\NPPES_Data_Dissemination_July_2026_V2.zip'

# Keep ONLY therapist rows (PT/OT/SLP + therapy clinics, by NPPES taxonomy) at
# ingest, dropping the MDs/DOs/NPs who merely bill a 97xxx code. Shrinks the
# store several-fold and speeds every rebuild/query. Off by default. It
# PERMANENTLY drops those rows (re-ingest to recover) and needs the NPPES data
# loaded first (enrichment.mode: bulk) — until the lookup cache is built it
# ingests everything and logs a warning. TIN-only rates are always kept. Tip:
# run `mrfx enrich --bulk <file>` once to build the cache before ingesting.
# CAVEAT: this filter is applied at PARSE time, so it is the one setting an app
# update cannot repair. If a later version widens which taxonomies count as
# therapy, the practice directory is rebuilt automatically but rows already
# dropped at ingest are gone — re-ingest those files to pick them up.
# therapy_only_ingest: false

port: 8377
confirm_over_gb: 5.0          # files above this wait for confirmation in the Files view

registry_path: config/payer_registry.yaml
registry_overrides_path: config/registry_overrides.yaml

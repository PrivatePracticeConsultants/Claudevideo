# MRF Explorer configuration (validated by mrfx/config.py).

codes:
  # false = extract only cpt_codes below. true = ingest EVERY billing code —
  # expect orders of magnitude more rows and hours-long parses on big payers.
  all_codes: false
  # The codes collected from every file. This list IS the ingest filter — a code
  # that isn't here is never extracted, and adding one later only affects files
  # ingested AFTER the change (re-add a link to pick it up in old files).
  #
  # DELETING this whole list is the recommended setting: it then collects the
  # app's full PT/OT/SLP catalog and picks up new codes automatically on every
  # update. It's spelled out here only so you can SEE what's collected and trim
  # it if you want smaller, faster ingests. `mrfx status` prints what's active
  # and warns if a whole discipline is being dropped.
  #
  # Every entry is a real, currently-active CPT/HCPCS code, verified against the
  # CMS 2026 MPFS file and Therapy Code List.
  cpt_codes:
    - "97161"   # PT          PT eval, low complexity
    - "97162"   # PT          PT eval, moderate complexity
    - "97163"   # PT          PT eval, high complexity

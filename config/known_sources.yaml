  - name: UnitedHealthcare (national)
    url: https://transparency-in-coverage.uhc.com/
    kind: page
    queueable: true
    verified: "2026-07-09"
    notes: >-
      React portal — the app finds its file-listing API automatically and
      expands it like an index. Verified live: 86,722 files listed (7,133
      in-network rate files totaling ~89 TB compressed); rate files queue
      first, allowed-amounts entries are excluded, and queueing caps at
      max_toc_files (default 2000, alphabetical) — raise it in
      config/mrfx.yaml or paste specific file links for deeper reach. The
      Missouri Provider Network file ingested 88,649 therapy rows as
      "UnitedHealthcare Insurance Company". Large-file stress tests
      (2026-07-09): Oxford Liberty Network (0.58 GB compressed) 5,590,693
      rows; River Valley Heritage (1.70 GB / ~17 GB uncompressed) 9,832,954
      rows; River Valley PS1-77_EL (3.39 GB / ~34 GB uncompressed, 102
      chunks) 29,688,251 rows; Charter 617 (8.85 GB / ~88 GB uncompressed,
      264 chunks, above the default confirm_over_gb=5 guard — raised to 12
      for the test) 63,987,440 rows in 3.8 h, surviving a kill/resume and a
      disk-full episode mid-run — the largest single file tested. Parses at
      <1 GB memory. Files named "...NDC..." are drug
      pricing and are skipped at queue time. Employer plans under an opt-out
      book live at private-transparency-in-coverage.uhc.com.


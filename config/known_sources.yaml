# Known MRF sources — the app's memory of where it has already been.
#
# Every entry below was tested live against the real payer infrastructure
# (dates and results in `verified` / `notes`). Entries with `queueable: true`
# are safe to hand straight to the URL queue: `mrfx add --known` or the
# "Queue tested payer indexes" button on the Files tab. `queueable: false` entries
# are portals that need a human click (JavaScript file lists, signed links) —
# open them in a browser and paste the actual file links.
#
# {FIRST_OF_MONTH} in a URL is replaced with the first day of the current
# month (e.g. 2026-07-01) when the link is queued — these payers republish
# their index monthly under a dated name. If a link 404s in the first days of
# a month, the payer hasn't posted yet; retry the row a few days later.


# payer_registry.yaml
# Seed registry of payer MRF sources for the MRF Explorer.
#
# HONESTY CONTRACT:
#   verified: true   → URL was confirmed pointing at a live MRF landing/index page.
#   verified: false  → licensee mapping is correct, but the URL is a best-known
#                      landing page or is left null; CONFIRM before trusting.
#                      The dashboard must show these with a "verify" badge and let
#                      the user paste the confirmed URL (which flips verified→true
#                      locally). Never present an unverified URL as authoritative.
#
# The split-vs-inline (provider_reference) behavior is PER FILE and changes monthly.
# Do not encode it here. `mrfx preflight` on the actual file is the source of truth.
#
# National payers below already cover all 50 states from a single portal. The
# per-state section only resolves the correct BCBS licensee, which is the part
# that actually varies by state.

national_payers:
  - name: UnitedHealthcare
    mrf_url: https://transparency-in-coverage.uhc.com/
    verified: true
    notes: >
      Opens to index files; unselect "Index file" to see in-network files.
      Download API throttles bulk pulls. Choice/Choice Plus files ~86GB.
      Opt-out employer book at https://private-transparency-in-coverage.uhc.com/
  - name: Aetna (CVS Health)
    mrf_url: https://health1.aetna.com/app/public/#/one/insurerCode=AETNACVS_I&brandCode=ALICSI/machine-readable-transparency-in-coverage
    verified: true
  - name: Cigna
    mrf_url: https://www.cigna.com/legal/compliance/machine-readable-files
    verified: true
    notes: TOC approach; individual files stated up to ~1TB.
  - name: Centene
    mrf_url: https://www.centene.com/price-transparency-files.html
    verified: true
    notes: >
      Per-brand TOCs (Ambetter, Health Net, WellCare, Fidelis, QualChoice, MHN).
      Contact price_transparency@centene.com
  - name: Humana
    mrf_url: null
    verified: false
    notes: Humana has relocated its MRF entry point more than once. Search "Humana transparency in coverage machine readable files" for the current public link.
  - name: Kaiser Permanente
    mrf_url: null
    verified: false
    notes: Published by region (CA, CO, GA, HI, MD/VA/DC, OR/WA). Search "Kaiser Permanente transparency in coverage machine readable files <region>".

# Elevance/Anthem publishes a national master index covering all its states:
#   https://antm-pt-prod-dataz-nogbd-nophi-us-east1.s3.amazonaws.com/anthem/YYYY-MM-01_anthem_index.json.gz
# The known -phi-/-nophi- URL bug applies. Portal: https://www.anthem.com/machine-readable-file/search
elevance_master_index_pattern: https://antm-pt-prod-dataz-nogbd-nophi-us-east1.s3.amazonaws.com/anthem/{YYYY-MM}-01_anthem_index.json.gz


# home.yaml — the wall-panel control screen.
#
# Composed to match the reference design: a room scene on the left, a tall
# weather card with real forecast rows in the middle, a gradient thermostat
# dial with chunky toggles on the right. Everything is core cards — the "designed"
# chrome is generated SVG art (scripts/generate-hero-art.py) with every number
# overlaid live by picture-elements, so nothing here is a mock-up: it is the
# running house, drawn well.
title: Home
views:
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 3
    dense_section_placement: true

    badges:
      - type: entity
        entity: input_select.house_mode
        name: Mode
        color: blue
      - type: entity
        entity: alarm_control_panel.house
        name: Alarm
        color: red
        state_content: state
      - type: entity
        entity: binary_sensor.anyone_home
        name: Home
        color: green
        visibility:
          - condition: state
            entity: binary_sensor.anyone_home
            state_not: unavailable
      - type: entity
        entity: sensor.outdoor_temperature
        name: Outside
        color: cyan
      - type: entity
        entity: sensor.house_secure_summary
        name: Security
        color: amber

    sections:
      # ---------------------------------------------------------------
      # NEEDS ATTENTION — conditional; the row is invisible when all is well.
      # ---------------------------------------------------------------
      - type: grid
        column_span: 3
        cards:
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.perimeter_open_count
                above: 0
            card:
              type: markdown
              content: >-
                ### 🚪 Open

                {{ state_attr('sensor.perimeter_open_count', 'open_names')
                   | join(', ') }}

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.internet_up
                state: "off"
            card:
              type: markdown
              content: >-
                ### 🌐 Internet is down

                DNS reports `{{ states('sensor.dns_resolution') }}`.
                Runbook → "internet down".

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.mold_risk
                state: "on"
            card:
              type: markdown
              content: >-
                ### 💧 Humidity high

                {{ state_attr('binary_sensor.mold_risk', 'zone') }} at
                {{ states('sensor.house_max_humidity') }}% RH.

          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.automations_paused
                state: "on"
            card:
              type: markdown
              content: >-
                ### ⏸ Automations are paused

                Nothing is running automatically.

          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.low_battery_devices
                above: 0
            card:
              type: markdown
              content: >-
                ### 🔋 {{ states('sensor.low_battery_devices') }} low batteries

                {{ (state_attr('sensor.low_battery_devices', 'devices') or [])
                   | map('replace', 'sensor.', '') | join(', ') }}

      # ===============================================================
      # LEFT — the room scene, then the house controls.
      # ===============================================================
      - type: grid
        cards:
          - type: picture-elements
            image: /local/hero/room.svg
            elements:
              - type: icon
                icon: mdi:home-heart
                style:
                  top: 14%
                  left: 6%
                  transform: none
                  color: "#ffb357"
                  "--mdc-icon-size": 26px
              - type: state-label
                entity: input_select.house_mode
                prefix: "House · "
                style:
                  top: 13.5%
                  left: 13%
                  transform: none
                  font-size: 22px
                  font-weight: "600"
                  color: "#f2f5ff"
                  text-transform: capitalize
              # the reference's orange action button → straight to Rooms
              - type: icon
                icon: mdi:arrow-right
                tap_action:
                  action: navigate
                  navigation_path: /dash-rooms/home
                style:
                  top: 86%
                  left: 90%
                  color: "#0b0e16"
                  background: "#ff9f43"
                  border-radius: 50%
                  padding: 10px
                  "--mdc-icon-size": 24px
              - type: state-label
                entity: sensor.house_secure_summary
                prefix: "Control every room · "
                tap_action:
                  action: navigate
                  navigation_path: /dash-rooms/home
                style:
                  top: 87%
                  left: 6%
                  transform: none
                  font-size: 14px
                  color: "#c9d2e8"

          - type: heading
            heading: House
            heading_style: title
            icon: mdi:home-heart

          - type: tile
            entity: input_select.house_mode
            name: Mode
            icon: mdi:home-heart
            color: blue
            features:
              - type: select-options

          - type: tile
            entity: alarm_control_panel.house
            name: Alarm
            color: red
            features:
              - type: alarm-modes
                modes:
                  - armed_home
                  - armed_away
                  - armed_night
                  - disarmed

          # chunky square toggles, reference-style
          - type: tile
            entity: input_boolean.guest_mode
            name: Guests
            icon: mdi:account-supervisor
            color: purple
            vertical: true
            grid_options:
              columns: 6
              rows: 2
            features:
              - type: toggle

          - type: tile
            entity: input_boolean.pet_at_home
            name: Dog home
            icon: mdi:dog
            color: amber
            vertical: true
            grid_options:
              columns: 6
              rows: 2
            features:
              - type: toggle

          - type: tile
            entity: input_boolean.automations_paused
            name: Pause all
            icon: mdi:pause-octagon
            color: red
            features:
              - type: toggle

      # ===============================================================
      # MIDDLE — the weather column: reactive hero + forecast panel.
      # ===============================================================
      - type: grid
        cards:
          - type: heading
            heading: Outside
            heading_style: title
            icon: mdi:weather-partly-cloudy

          - type: picture-elements
            image: /local/hero/partly.svg
            elements:
              - type: image
                entity: sensor.weather_condition_raw
                image: /local/hero/partly.svg
                state_image:
                  sunny: /local/hero/sunny.svg
                  clear-night: /local/hero/clear-night.svg
                  partlycloudy: /local/hero/partly.svg
                  windy: /local/hero/partly.svg
                  windy-variant: /local/hero/partly.svg
                  cloudy: /local/hero/cloudy.svg
                  fog: /local/hero/fog.svg
                  rainy: /local/hero/rain.svg
                  pouring: /local/hero/rain.svg
                  lightning: /local/hero/storm.svg
                  lightning-rainy: /local/hero/storm.svg
                  exceptional: /local/hero/storm.svg
                  snowy: /local/hero/snow.svg
                  snowy-rainy: /local/hero/snow.svg
                  hail: /local/hero/snow.svg
                style:
                  top: 50%
                  left: 50%
                  width: 100%
                  transform: translate(-50%, -50%)
              - type: state-label
                entity: sensor.outdoor_temperature
                style:
                  top: 24%
                  left: 6%
                  transform: none
                  font-size: 56px
                  font-weight: "300"
                  line-height: "1"
                  color: "#f2f5ff"
              - type: state-label
                entity: sensor.weather_condition
                style:
                  top: 52%
                  left: 6.5%
                  transform: none
                  font-size: 16px
                  font-weight: "500"
                  color: "#ffb357"
              - type: state-label
                entity: sensor.forecast_high_today
                prefix: "H "
                style:
                  top: 66%
                  left: 6.5%
                  transform: none
                  font-size: 14px
                  color: "#c9d2e8"
              - type: state-label
                entity: sensor.forecast_low_today
                prefix: "L "
                style:
                  top: 66%
                  left: 24%
                  transform: none
                  font-size: 14px
                  color: "#8f9ab5"
              - type: icon
                icon: mdi:weather-sunset-up
                style:
                  top: 84%
                  left: 6.5%
                  transform: none
                  color: "#ffb357"
                  "--mdc-icon-size": 17px
              - type: state-label
                entity: sensor.next_sunrise
                style:
                  top: 84%
                  left: 12%
                  transform: none
                  font-size: 13px
                  color: "#c9d2e8"
              - type: icon
                icon: mdi:weather-sunset-down
                style:
                  top: 84%
                  left: 32%
                  transform: none
                  color: "#8d96f2"
                  "--mdc-icon-size": 17px
              - type: state-label
                entity: sensor.next_sunset
                style:
                  top: 84%
                  left: 37.5%
                  transform: none
                  font-size: 13px
                  color: "#c9d2e8"

          # today by hour, 5am-10pm — real hourly forecast, shrinking through
          # the day as hours pass; hides itself when today is spent
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.forecast_hourly_today
                above: 0
            card:
              type: markdown
              # literal block, one source line per table row: a markdown table
              # needs its rows on CONSECUTIVE lines, and a folded scalar (>-)
              # can only separate lines with blank lines, which broke the
              # header/separator pairing on every batch after the first.
              content: |-
                {%- set hs = state_attr('sensor.forecast_hourly_today', 'hours') or [] -%}
                {%- for chunk in hs | batch(6) %}
                |{% for h in chunk %} {{ h.t }} |{% endfor %}
                |{% for h in chunk %}:---:|{% endfor %}
                |{% for h in chunk %} <ha-icon icon="{{ h.icon }}"></ha-icon> |{% endfor %}
                |{% for h in chunk %} **{{ h.temp }}°** |{% endfor %}
                |{% for h in chunk %} {{ '💧' ~ h.precip ~ '%' if h.precip > 0 else '—' }} |{% endfor %}
                {% endfor %}

          # the forecast panel: three REAL days from weather.get_forecasts,
          # plus the 2x2 live stat grid, all overlaid on glossy panel art
          - type: picture-elements
            image: /local/hero/panel.svg
            elements:
              # ---- row: tomorrow ----
              - type: state-icon
                entity: sensor.forecast_day_1
                style:
                  top: 10.5%
                  left: 6%
                  transform: none
                  "--mdc-icon-size": 26px
                  color: "#7cb5f5"
              - type: state-label
                entity: sensor.forecast_day_1
                attribute: day
                style:
                  top: 11%
                  left: 15%
                  transform: none
                  font-size: 15px
                  font-weight: "500"
                  color: "#e9edf5"
              - type: state-label
                entity: sensor.forecast_day_1
                style:
                  top: 11%
                  left: 70%
                  transform: none
                  font-size: 15px
                  color: "#c9d2e8"
              # ---- row: day 2 ----
              - type: state-icon
                entity: sensor.forecast_day_2
                style:
                  top: 24.5%
                  left: 6%
                  transform: none
                  "--mdc-icon-size": 26px
                  color: "#7cb5f5"
              - type: state-label
                entity: sensor.forecast_day_2
                attribute: day
                style:
                  top: 25%
                  left: 15%
                  transform: none
                  font-size: 15px
                  font-weight: "500"
                  color: "#e9edf5"
              - type: state-label
                entity: sensor.forecast_day_2
                style:
                  top: 25%
                  left: 70%
                  transform: none
                  font-size: 15px
                  color: "#c9d2e8"
              # ---- row: day 3 ----
              - type: state-icon
                entity: sensor.forecast_day_3
                style:
                  top: 38.5%
                  left: 6%
                  transform: none
                  "--mdc-icon-size": 26px
                  color: "#7cb5f5"
              - type: state-label
                entity: sensor.forecast_day_3
                attribute: day
                style:
                  top: 39%
                  left: 15%
                  transform: none
                  font-size: 15px
                  font-weight: "500"
                  color: "#e9edf5"
              - type: state-label
                entity: sensor.forecast_day_3
                style:
                  top: 39%
                  left: 70%
                  transform: none
                  font-size: 15px
                  color: "#c9d2e8"
              # ---- 2x2 live stats under the divider ----
              - type: icon
                icon: mdi:thermometer
                style: {top: 57%, left: 6%, transform: none, color: "#ff9f43", "--mdc-icon-size": 18px}
              - type: state-label
                entity: sensor.outdoor_temperature
                prefix: "Outdoor  "
                style: {top: 57%, left: 12%, transform: none, font-size: 14px, color: "#c9d2e8"}
              - type: icon
                icon: mdi:water-percent
                style: {top: 57%, left: 53%, transform: none, color: "#40beaf", "--mdc-icon-size": 18px}
              - type: state-label
                entity: sensor.outdoor_humidity
                prefix: "Humidity  "
                style: {top: 57%, left: 59%, transform: none, font-size: 14px, color: "#c9d2e8"}
              - type: icon
                icon: mdi:weather-windy
                style: {top: 73%, left: 6%, transform: none, color: "#7cb5f5", "--mdc-icon-size": 18px}
              - type: state-label
                entity: sensor.wind_speed
                prefix: "Wind  "
                style: {top: 73%, left: 12%, transform: none, font-size: 14px, color: "#c9d2e8"}
              - type: icon
                icon: mdi:weather-rainy
                style: {top: 73%, left: 53%, transform: none, color: "#8d96f2", "--mdc-icon-size": 18px}
              - type: state-label
                entity: sensor.forecast_precipitation_chance
                prefix: "Rain  "
                style: {top: 73%, left: 59%, transform: none, font-size: 14px, color: "#c9d2e8"}

          - type: history-graph
            entities:
              - entity: sensor.outdoor_temperature
                name: Outside
            hours_to_show: 12

      # ===============================================================
      # RIGHT — the dial, comfort, energy.
      # ===============================================================
      - type: grid
        cards:
          - type: heading
            heading: Temperature
            heading_style: title
            icon: mdi:thermostat

          # The gradient dial. The ring is chrome; the number is live and taps
          # through to the slider. The +/- feature below actually changes it.
          - type: picture-elements
            image: /local/hero/dial.svg
            elements:
              - type: state-label
                entity: input_number.comfort_target
                style:
                  top: 44%
                  left: 50%
                  font-size: 58px
                  font-weight: "300"
                  color: "#f2f5ff"
              - type: state-label
                entity: input_select.house_mode
                prefix: "Target · "
                style:
                  top: 62%
                  left: 50%
                  font-size: 14px
                  color: "#8f9ab5"
                  text-transform: capitalize

          - type: tile
            entity: input_number.comfort_target
            name: Adjust
            icon: mdi:target
            color: amber
            features:
              - type: numeric-input
                style: buttons

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.house_comfort_index
                state_not: unavailable
              - condition: state
                entity: sensor.house_comfort_index
                state_not: unknown
            card:
              type: gauge
              entity: sensor.house_comfort_index
              name: Feels like
              unit: "°F"
              min: 60
              max: 82
              needle: true
              segments:
                - from: 60
                  color: "#6f9bff"
                - from: 67
                  color: "#4fd1a5"
                - from: 76
                  color: "#ffa94d"
                - from: 80
                  color: "#ff6b6b"

          - type: tile
            entity: sensor.house_average_temperature
            name: Inside
            icon: mdi:thermometer
            color: orange

          - type: tile
            entity: sensor.house_max_humidity
            name: Humidity
            icon: mdi:water-percent
            color: teal

          - type: heading
            heading: Energy
            heading_style: title
            icon: mdi:lightning-bolt

          - type: tile
            entity: sensor.house_power_draw
            name: Drawing now
            icon: mdi:flash
            color: yellow

          - type: tile
            entity: sensor.current_energy_cost_rate
            name: Costing
            icon: mdi:cash-clock
            color: green

          - type: tile
            entity: sensor.current_energy_rate
            name: Rate
            icon: mdi:cash-multiple
            color: grey

          - type: tile
            entity: sensor.vampire_load_report
            name: Standby
            icon: mdi:sleep
            color: purple

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.house_power_draw
                state_not: unavailable
              - condition: state
                entity: sensor.house_power_draw
                state_not: unknown
            card:
              type: statistics-graph
              title: Draw by hour
              entities:
                - entity: sensor.house_power_draw
                  name: Power
              chart_type: bar
              period: hour
              stat_types:
                - mean
              days_to_show: 1

      # ---------------------------------------------------------------
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Go to
            heading_style: subtitle
            icon: mdi:arrow-right-circle

          - type: button
            name: Rooms
            icon: mdi:floor-plan
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /dash-rooms/home

          - type: button
            name: Devices
            icon: mdi:devices
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /dash-devices/devices

          - type: button
            name: System
            icon: mdi:heart-pulse
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /dash-admin/system

          - type: button
            name: History
            icon: mdi:chart-line
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /history

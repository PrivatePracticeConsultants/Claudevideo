# home.yaml — mobile-first. What is wrong, what is on, what needs attention.
#
# Every entity referenced here is one this repo itself declares, so this
# dashboard is correct on a fresh instance. The per-area view is generated from
# the area registry by the built-in `areas` strategy, so a new device appears
# without anyone editing this file.
title: Home
views:
  # =========================================================================
  - title: Status
    path: status
    icon: mdi:home
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          # The one-line answer. If everything is fine, this is all there is
          # to read — that is the whole design goal of this view.
          - type: markdown
            content: >-
              {% set s = states('sensor.house_status_summary') %}
              {% if s == 'All clear' %}
              # ✅ All clear
              {{ states('sensor.house_secure_summary') }} ·
              {{ states('input_select.house_mode') | title }} mode
              {% else %}
              # ⚠️ {{ s }}
              {{ states('sensor.house_secure_summary') }}
              {% endif %}

      # ---- problems, each shown only when it IS a problem ----
      - type: grid
        cards:
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.perimeter_open_count
                above: 0
            card:
              type: markdown
              content: >-
                **Open:** {{ state_attr('sensor.perimeter_open_count', 'open_names')
                | join(', ') }}

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.internet_up
                state: "off"
            card:
              type: markdown
              content: |
                **Internet is down.** DNS: {{ states('sensor.dns_resolution') }}.
                See the runbook, "internet down".

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.mold_risk
                state: "on"
            card:
              type: markdown
              content: >-
                **Humidity high** in {{ state_attr('binary_sensor.mold_risk', 'zone') }}
                — {{ states('sensor.house_max_humidity') }}%

          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.unavailable_entities
                above: 0
            card:
              type: markdown
              content: >-
                **{{ states('sensor.unavailable_entities') }} entities unavailable.**
                {{ state_attr('sensor.unavailable_entities', 'entities')[:5] | join(', ') }}

          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.automations_paused
                state: "on"
            card:
              type: markdown
              content: |
                **Automations are PAUSED.** Nothing is running automatically.

      # ---- controls ----
      - type: grid
        cards:
          - type: entities
            title: House
            state_color: true
            entities:
              - entity: input_select.house_mode
                name: Mode
              - entity: alarm_control_panel.house
                name: Alarm
              - entity: input_boolean.guest_mode
                name: Guests
              - entity: input_boolean.pet_at_home
                name: Dog is home
              - entity: input_boolean.automations_paused
                name: Pause automations

          - type: entities
            title: Now
            entities:
              - entity: sensor.house_comfort_index
                name: Feels like
              - entity: sensor.house_average_temperature
                name: Temperature
              - entity: sensor.house_max_humidity
                name: Humidity (worst room)
              - entity: sensor.house_power_draw
                name: Power
              - entity: sensor.current_energy_cost_rate
                name: Costing now

  # =========================================================================
  # Generated from the area registry. Nothing to maintain by hand: a device
  # assigned to an area shows up here on its own.
  - title: Rooms
    path: rooms
    icon: mdi:floor-plan
    strategy:
      type: areas

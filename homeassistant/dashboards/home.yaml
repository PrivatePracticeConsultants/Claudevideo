# home.yaml — the control panel.
#
# Sections layout, core cards only, every type verified against the shipped
# frontend by scripts/check-dashboards.py. Every entity referenced is one this
# repo declares, so this renders correctly on a fresh instance.
#
# The hero's background artwork CHANGES WITH THE WEATHER: an image element
# keyed on sensor.weather_condition_raw maps every HA condition token to one of
# eight generated variants (scripts/generate-hero-art.py -> www/hero/). The
# card's base image is the fallback for unknown/unavailable.
title: Home
views:
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 3
    dense_section_placement: true

    badges:
      - type: entity
        entity: input_select.house_mode
        name: Mode
        color: blue
      - type: entity
        entity: alarm_control_panel.house
        name: Alarm
        color: red
        state_content: state
      - type: entity
        entity: binary_sensor.anyone_home
        name: Home
        color: green
      - type: entity
        entity: sensor.outdoor_temperature
        name: Outside
        color: cyan
      - type: entity
        entity: sensor.house_secure_summary
        name: Security
        color: amber

    sections:
      # ---------------------------------------------------------------
      # STATUS — one line. If all is well this is all there is to read.
      # ---------------------------------------------------------------
      - type: grid
        column_span: 3
        cards:
          - type: markdown
            text_only: true
            content: >-
              {% set s = states('sensor.house_status_summary') %}
              {% if s == 'All clear' %}

              ## ✅ All clear

              {{ states('sensor.house_secure_summary') }} ·
              {{ states('input_select.house_mode') | title }} mode ·
              {{ states('sensor.weather_summary') }}

              {% else %}

              ## ⚠️ {{ s }}

              {{ states('sensor.house_secure_summary') }} ·
              {{ states('input_select.house_mode') | title }} mode

              {% endif %}

      # ---------------------------------------------------------------
      # NEEDS ATTENTION — every card conditional; invisible when fine.
      # ---------------------------------------------------------------
      - type: grid
        column_span: 3
        cards:
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.perimeter_open_count
                above: 0
            card:
              type: markdown
              content: >-
                ### 🚪 Open

                {{ state_attr('sensor.perimeter_open_count', 'open_names')
                   | join(', ') }}

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.internet_up
                state: "off"
            card:
              type: markdown
              content: >-
                ### 🌐 Internet is down

                DNS reports `{{ states('sensor.dns_resolution') }}`.
                Runbook → "internet down".

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.mold_risk
                state: "on"
            card:
              type: markdown
              content: >-
                ### 💧 Humidity high

                {{ state_attr('binary_sensor.mold_risk', 'zone') }} at
                {{ states('sensor.house_max_humidity') }}% RH.

          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.automations_paused
                state: "on"
            card:
              type: markdown
              content: >-
                ### ⏸ Automations are paused

                Nothing is running automatically.

          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.low_battery_devices
                above: 0
            card:
              type: markdown
              content: >-
                ### 🔋 {{ states('sensor.low_battery_devices') }} low batteries

                {{ (state_attr('sensor.low_battery_devices', 'devices') or [])
                   | map('replace', 'sensor.', '') | join(', ') }}

      # ---------------------------------------------------------------
      # HOUSE — daily controls, one tap each.
      # ---------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: House
            heading_style: title
            icon: mdi:home-heart

          - type: tile
            entity: input_select.house_mode
            name: Mode
            icon: mdi:home-heart
            color: blue
            features:
              - type: select-options

          - type: tile
            entity: alarm_control_panel.house
            name: Alarm
            color: red
            features:
              - type: alarm-modes
                modes:
                  - armed_home
                  - armed_away
                  - armed_night
                  - disarmed

          - type: tile
            entity: input_boolean.guest_mode
            name: Guests
            icon: mdi:account-supervisor
            color: purple
            vertical: true
            features:
              - type: toggle

          - type: tile
            entity: input_boolean.pet_at_home
            name: Dog home
            icon: mdi:dog
            color: amber
            vertical: true
            features:
              - type: toggle

          - type: tile
            entity: input_boolean.automations_paused
            name: Pause all
            icon: mdi:pause-octagon
            color: red
            features:
              - type: toggle

      # ---------------------------------------------------------------
      # OUTSIDE — the reactive hero.
      # ---------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Outside
            heading_style: title
            icon: mdi:weather-partly-cloudy

          - type: picture-elements
            # Fallback art for unknown/unavailable condition.
            image: /local/hero/partly.svg
            elements:
              # Full-bleed background that tracks the CURRENT weather. Listed
              # first so every label below renders above it.
              - type: image
                entity: sensor.weather_condition_raw
                image: /local/hero/partly.svg
                state_image:
                  sunny: /local/hero/sunny.svg
                  clear-night: /local/hero/clear-night.svg
                  partlycloudy: /local/hero/partly.svg
                  windy: /local/hero/partly.svg
                  windy-variant: /local/hero/partly.svg
                  cloudy: /local/hero/cloudy.svg
                  fog: /local/hero/fog.svg
                  rainy: /local/hero/rain.svg
                  pouring: /local/hero/rain.svg
                  lightning: /local/hero/storm.svg
                  lightning-rainy: /local/hero/storm.svg
                  exceptional: /local/hero/storm.svg
                  snowy: /local/hero/snow.svg
                  snowy-rainy: /local/hero/snow.svg
                  hail: /local/hero/snow.svg
                style:
                  top: 50%
                  left: 50%
                  width: 100%
                  transform: translate(-50%, -50%)
              - type: state-label
                entity: sensor.outdoor_temperature
                style:
                  top: 24%
                  left: 6%
                  transform: none
                  font-size: 56px
                  font-weight: "300"
                  line-height: "1"
                  color: "#f2f5ff"
              - type: state-label
                entity: sensor.weather_condition
                style:
                  top: 52%
                  left: 6.5%
                  transform: none
                  font-size: 16px
                  font-weight: "500"
                  color: "#ffb357"
              - type: state-label
                entity: sensor.forecast_high_today
                prefix: "H "
                style:
                  top: 66%
                  left: 6.5%
                  transform: none
                  font-size: 14px
                  color: "#c9d2e8"
              - type: state-label
                entity: sensor.forecast_low_today
                prefix: "L "
                style:
                  top: 66%
                  left: 24%
                  transform: none
                  font-size: 14px
                  color: "#8f9ab5"
              - type: icon
                icon: mdi:weather-sunset-up
                style:
                  top: 84%
                  left: 6.5%
                  transform: none
                  color: "#ffb357"
                  "--mdc-icon-size": 17px
              - type: state-label
                entity: sensor.next_sunrise
                style:
                  top: 84%
                  left: 12%
                  transform: none
                  font-size: 13px
                  color: "#c9d2e8"
              - type: icon
                icon: mdi:weather-sunset-down
                style:
                  top: 84%
                  left: 32%
                  transform: none
                  color: "#8d96f2"
                  "--mdc-icon-size": 17px
              - type: state-label
                entity: sensor.next_sunset
                style:
                  top: 84%
                  left: 37.5%
                  transform: none
                  font-size: 13px
                  color: "#c9d2e8"
              - type: state-label
                entity: sensor.forecast_precipitation_chance
                prefix: "Rain "
                style:
                  top: 84%
                  left: 57%
                  transform: none
                  font-size: 13px
                  color: "#7cb5f5"
              - type: state-label
                entity: sensor.wind_speed
                prefix: "Wind "
                style:
                  top: 84%
                  left: 73%
                  transform: none
                  font-size: 13px
                  color: "#c9d2e8"

          - type: history-graph
            entities:
              - entity: sensor.outdoor_temperature
                name: Outside
            hours_to_show: 12

      # ---------------------------------------------------------------
      # COMFORT + ENERGY share the third column so no column runs short.
      # ---------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Comfort
            heading_style: title
            icon: mdi:thermostat

          # Needle gauge over colour segments spanning the target slider's
          # real 60-82 range. Conditional: with no indoor sensors yet the raw
          # gauge renders an "unavailable" warning box — hide it instead.
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.house_comfort_index
                state_not: unavailable
              - condition: state
                entity: sensor.house_comfort_index
                state_not: unknown
            card:
              type: gauge
              entity: sensor.house_comfort_index
              name: Feels like
              unit: "°F"
              min: 60
              max: 82
              needle: true
              segments:
                - from: 60
                  color: "#6f9bff"
                - from: 67
                  color: "#4fd1a5"
                - from: 76
                  color: "#ffa94d"
                - from: 80
                  color: "#ff6b6b"

          - type: tile
            entity: input_number.comfort_target
            name: Target
            icon: mdi:target
            color: amber
            features:
              - type: numeric-input
                style: buttons

          - type: tile
            entity: sensor.house_average_temperature
            name: Inside
            icon: mdi:thermometer
            color: orange

          - type: tile
            entity: sensor.house_max_humidity
            name: Humidity
            icon: mdi:water-percent
            color: teal

          - type: heading
            heading: Energy
            heading_style: title
            icon: mdi:lightning-bolt

          - type: tile
            entity: sensor.house_power_draw
            name: Drawing now
            icon: mdi:flash
            color: yellow

          - type: tile
            entity: sensor.current_energy_cost_rate
            name: Costing
            icon: mdi:cash-clock
            color: green

          - type: tile
            entity: sensor.current_energy_rate
            name: Rate
            icon: mdi:cash-multiple
            color: grey

          - type: tile
            entity: sensor.vampire_load_report
            name: Standby
            icon: mdi:sleep
            color: purple

          # Hourly bars; fills in as statistics accrue. Conditional: until a
          # circuit is labelled it renders "No statistics found" — hide it.
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.house_power_draw
                state_not: unavailable
              - condition: state
                entity: sensor.house_power_draw
                state_not: unknown
            card:
              type: statistics-graph
              title: Draw by hour
              entities:
                - entity: sensor.house_power_draw
                  name: Power
              chart_type: bar
              period: hour
              stat_types:
                - mean
              days_to_show: 1

      # ---------------------------------------------------------------
      # SHORTCUTS
      # ---------------------------------------------------------------
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Go to
            heading_style: subtitle
            icon: mdi:arrow-right-circle

          - type: button
            name: Rooms
            icon: mdi:floor-plan
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /dash-rooms/home

          - type: button
            name: Devices
            icon: mdi:devices
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /dash-devices/devices

          - type: button
            name: System
            icon: mdi:heart-pulse
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /dash-admin/system

          - type: button
            name: History
            icon: mdi:chart-line
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /history

# guest.yaml — for someone who does not know or care how any of this works.
# Big targets, nothing that can break anything, no diagnostics.
title: Guest
views:
  - title: Home
    path: home
    icon: mdi:home-heart
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: markdown
            content: >-
              {% if states('sensor.house_status_summary') == 'All clear' %}
              ## Everything's fine
              {% else %}
              ## Someone should look at this
              {{ states('sensor.house_status_summary') }}
              {% endif %}

          - type: entities
            title: Comfort
            entities:
              - entity: sensor.house_average_temperature
                name: Temperature
              - entity: input_number.comfort_target
                name: Set temperature to

  # Rooms live in their own dashboard (dash-rooms): `areas` is only a
  # dashboard-level strategy, so it cannot be a view here.

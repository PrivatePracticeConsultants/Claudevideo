# mosquitto.conf — committed so the broker's security posture is reviewable.
#
# This broker carries alarm state. It is authenticated and bound to localhost.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
# `information` INCLUDES connection/disconnection lines — they are on, not off.
# Kept on deliberately: on a broker that carries alarm state, a record of which
# clients connected and when is worth the noise. Drop this line if the log
# volume becomes a problem; the bridge's own health is measured separately, by
# binary_sensor.alarm_system_degraded reading the MQTT availability topic.
log_type information

listener 1883 0.0.0.0

# NEVER anonymous. An anonymous broker means anyone who reaches port 1883 can
# publish a forged disarm to the discovery topics.
allow_anonymous false
password_file /mosquitto/config/passwd

# Caps the keepalive interval a client may negotiate, so a client cannot ask
# for a very long one and then sit undetected for hours after dropping off the
# network. This is a liveness bound, NOT an access control: it does nothing
# about client-ID reuse or session takeover. What actually stops a rogue
# client is `allow_anonymous false` plus the localhost-only port binding in
# docker-compose.yml.
max_keepalive 120

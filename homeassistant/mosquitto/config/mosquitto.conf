# mosquitto.conf — committed so the broker's security posture is reviewable.
#
# This broker carries alarm state. It is authenticated and bound to localhost.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
# Connection logging off: it is noisy and the useful signal (is the bridge
# connected?) is the MQTT availability topic, watched from Home Assistant.
log_type information

listener 1883 0.0.0.0

# NEVER anonymous. An anonymous broker means anyone who reaches port 1883 can
# publish a forged disarm to the discovery topics.
allow_anonymous false
password_file /mosquitto/config/passwd

# Clients must identify themselves; keeps a rogue client from silently
# hijacking a session by reusing an ID.
max_keepalive 120

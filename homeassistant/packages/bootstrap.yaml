# bootstrap.yaml — sane values on a brand-new instance, once and only once.
#
# WHY THIS EXISTS, because it looks redundant and is not:
#
# `initial:` on an input_number/input_select seems like the obvious way to set a
# default. It is a trap. HA's own async_added_to_hass returns EARLY when a
# seeded value exists, which means `initial:` DEFEATS STATE RESTORE on every
# single restart: house_mode snaps back to `home` while the household is away,
# and every slider the user tuned reverts after an HA update.
#
# But with no `initial:`, a first boot leaves every input_number sitting at its
# `min` — verified on a live instance: comfort_target 60°F, every tariff rate
# $0.000, low_battery_threshold 5%. Everything downstream is then confidently
# wrong rather than obviously broken, which is worse.
#
# So: no `initial:` anywhere, and this runs exactly once on a fresh instance,
# guarded by a boolean that itself restores. First boot gets real defaults;
# every later restart restores whatever the user actually set.
#
# Changing a value here does NOT change a running system — it has already
# bootstrapped. Change it in the UI, or turn helpers_initialised off and restart.

input_boolean:
  helpers_initialised:
    name: Helpers initialised
    icon: mdi:check-decagram

input_number:
  # MIGRATION LADDER. A single "have we bootstrapped?" boolean is a one-way
  # door: it is set on first boot, and every helper added to this file
  # AFTERWARDS is then never seeded on any instance that already ran — which
  # is every existing install, i.e. exactly the ones being upgraded.
  #
  # Found the hard way: the Ring helpers were appended to the first-run block
  # and, on an instance bootstrapped in an earlier session, silently never ran.
  # ring_nightly_arm_time stayed at 00:00 and ring_health_alerts stayed off,
  # so every alarm health notification was gated off on precisely the installs
  # that had been running longest.
  #
  # So: a version number, and one block per step. Each block runs if the stored
  # version is below it, then the version is written. ADDING NEW DEFAULTS MEANS
  # ADDING A NEW BLOCK AND BUMPING BOOTSTRAP_TARGET — never editing an existing
  # block, which has already run everywhere.
  bootstrap_version:
    name: Bootstrap version
    icon: mdi:database-arrow-up
    min: 0
    max: 999
    step: 1
    mode: box

script:
  apply_default_settings:
    alias: Apply default settings
    icon: mdi:cog-refresh
    description: >-
      Write the documented defaults into every tunable helper. Safe to run by
      hand at any time to reset the system to its shipped configuration.
    mode: single
    sequence:
      - repeat:
          for_each: >-
            {{ {"low_battery_threshold": "20", "adaptive_min_kelvin": "2200", "adaptive_max_kelvin": "5000", "adaptive_min_brightness": "25", "adaptive_max_brightness": "100", "night_mode_brightness": "5", "manual_override_minutes": "60", "comfort_target": "72", "comfort_deadband": "2", "hvac_min_runtime": "10", "hvac_min_offtime": "5", "window_open_grace": "5", "rh_target_low": "40", "rh_target_high": "55", "mold_risk_rh": "60", "fan_first_delta": "2", "presence_away_delay": "5", "occupancy_clear_fast": "3", "occupancy_clear_slow": "20", "auto_lock_delay": "10", "rate_flat": "0.150", "rate_tier1": "0.120", "rate_tier2": "0.220", "tier1_limit_kwh": "500", "rate_peak": "0.320", "rate_offpeak": "0.110", "peak_start_hour": "16", "peak_end_hour": "21", "daily_supply_charge": "0.35", "anomaly_multiplier": "2.0", "anomaly_floor_watts": "300"} | dictsort }}
          sequence:
            - action: input_number.set_value
              continue_on_error: true
              target:
                entity_id: "input_number.{{ repeat.item[0] }}"
              data:
                value: "{{ repeat.item[1] }}"
      - repeat:
          for_each: >-
            {{ {"house_mode": "home", "hvac_system_type": "ductless_minisplit", "tariff_type": "flat"} | dictsort }}
          sequence:
            - action: input_select.select_option
              continue_on_error: true
              target:
                entity_id: "input_select.{{ repeat.item[0] }}"
              data:
                option: "{{ repeat.item[1] }}"

automation:
  - id: bootstrap_first_run
    alias: "[bootstrap] Apply defaults on a fresh instance"
    description: >-
      Runs once, on the first start where helpers_initialised is off. The flag
      restores across restarts, so this never fires again and never overwrites a
      value the user has changed.
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.helpers_initialised
        state: "off"
    actions:
      # Helpers restore asynchronously; give them a moment to settle so this
      # does not race the restore and get overwritten by it.
      - delay:
          seconds: 15
      - action: script.apply_default_settings
      # The daily security check triggers at input_datetime.security_check_time
      # — an input_datetime with no value is `unknown` and a time trigger on it
      # NEVER fires, so on a fresh install the check silently did not exist.
      - action: input_datetime.set_datetime
        continue_on_error: true
        target:
          entity_id: input_datetime.security_check_time
        data:
          time: "21:30:00"
      # Presence simulation ships ON: picking vacation mode should visibly do
      # what the feature promises, not depend on a switch surfaced nowhere.
      - action: input_boolean.turn_on
        continue_on_error: true
        target:
          entity_id: input_boolean.vacation_simulation
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.helpers_initialised
      - action: persistent_notification.create
        data:
          title: Default settings applied
          notification_id: bootstrap_first_run
          message: >-
            This looked like a fresh instance, so the documented defaults were
            written to every tunable helper (comfort target, tariff rates,
            thresholds). Adjust them in the UI — they will persist from now on.
            See packages/bootstrap.yaml.

  # -----------------------------------------------------------------------
  # THE MIGRATION LADDER. Runs on every start, applies only the steps this
  # instance has not seen, and is idempotent.
  #
  # This is what makes a default added today reach an instance that first
  # booted months ago. The first-run automation above still handles a genuinely
  # fresh install; this handles everybody else, and the two are safe to both
  # fire because every step here only writes values the step below has not
  # already recorded.
  # -----------------------------------------------------------------------
  - id: bootstrap_migrations
    alias: "[bootstrap] Apply pending default migrations"
    description: >-
      Seeds defaults added to this file AFTER an instance was first
      bootstrapped. Keyed on input_number.bootstrap_version, which restores
      across restarts. Step 1 is the original first-run set; step 2 is the Ring
      helpers. To add defaults: append a new step block, do not edit an old one.
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      # Helpers restore asynchronously; do not race the restore.
      - delay:
          seconds: 20
      # An instance that ran the old boolean-guarded bootstrap is at step 1
      # already, even though it has never seen this version number.
      - if:
          - condition: state
            entity_id: input_boolean.helpers_initialised
            state: "on"
          - condition: numeric_state
            entity_id: input_number.bootstrap_version
            below: 1
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.bootstrap_version
            data:
              value: 1

      # ---- step 2: Ring helpers ----
      # continue_on_error because optional/ring.yaml is not promoted on every
      # install; these are no-ops until it is. Without the arm time, the
      # nightly arm sits at 00:00:00, which the arming automation now REFUSES
      # to act on. Without ring_health_alerts, every alarm health notification
      # is gated off and the health sensor is decorative.
      - if:
          - condition: numeric_state
            entity_id: input_number.bootstrap_version
            below: 2
        then:
          - action: input_datetime.set_datetime
            continue_on_error: true
            target:
              entity_id: input_datetime.ring_nightly_arm_time
            data:
              time: "22:30:00"
          - action: input_boolean.turn_on
            continue_on_error: true
            target:
              entity_id: input_boolean.ring_health_alerts
          - action: input_number.set_value
            continue_on_error: true
            target:
              entity_id: input_number.ring_battery_threshold
            data:
              value: 20
          - action: input_number.set_value
            target:
              entity_id: input_number.bootstrap_version
            data:
              value: 2

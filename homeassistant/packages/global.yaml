# global.yaml — shared infrastructure every other package depends on.
#
# Contents:
#   1. script.notify_person   the ONLY way anything in this system notifies
#   2. mode helpers           house_mode + the global kill switch
#   3. health package         uptime, DB size, batteries, unavailable, errors
#   4. recorder tuning        what we keep and what we deliberately throw away

# ---------------------------------------------------------------------------
# 1. NOTIFICATION ROUTER
# ---------------------------------------------------------------------------
# Every automation in this system notifies through script.notify_person and
# never calls notify.* directly. That gives one place to change quiet hours,
# one place to add a person, and one place to see everything the house says.

script:
  notify_person:
    alias: Notify person
    icon: mdi:bell-ring
    description: >-
      Route a notification to a person by priority. info -> persistent
      notification only. warning -> phone push. critical -> push that bypasses
      do-not-disturb, plus TTS on announce-labelled speakers.
    mode: parallel
    max: 25
    fields:
      target:
        description: Person key, as defined in the `routes` table below. Use "all" to reach everyone.
        example: alex
        required: true
        selector:
          text:
      priority:
        description: info | warning | critical
        example: warning
        required: true
        default: info
        selector:
          select:
            options: [info, warning, critical]
      title:
        description: Short headline.
        example: Garage left open
        required: true
        selector:
          text:
      message:
        description: Body text.
        example: The garage has been open for 20 minutes.
        required: true
        selector:
          text:
      actions:
        description: Optional actionable-notification buttons.
        required: false
        selector:
          object:
    variables:
      # ---------------------------------------------------------------
      # THE ONE PLACE A PERSON IS ADDED. Prompt 19 appends here.
      # Ships empty on purpose: this repo has never seen your phones, and
      # a guessed notify service silently swallows every alert it is given.
      # Add an entry once the companion app is paired and you have read the
      # real service name out of Developer Tools -> Actions.
      #
      #   alex:
      #     push: notify.mobile_app_alex_pixel
      #     quiet_start: "22:00"
      #     quiet_end: "07:00"
      #     critical_bypasses_dnd: true
      # ---------------------------------------------------------------
      routes: {}
      # Speakers that may be spoken through. Resolved from the registry at
      # runtime, so labelling a new speaker `announce` is all it takes.
      announce_targets: "{{ label_entities('announce') }}"
      # Fill once a TTS engine exists (prompt 11). Empty = TTS silently skipped.
      tts_service: ""
      # ---- resolution ----
      selected: >-
        {% if target == 'all' %}{{ routes.keys() | list }}
        {% else %}{{ [target] }}{% endif %}
      # NOTE: no map('extract') here — 'extract' is an Ansible filter, not a
      # Jinja/HA one. It compiles (dynamic dispatch) and then throws
      # "No filter named 'extract'" on the first real notification.
      push_services: >-
        {% set ns = namespace(svcs=[]) %}
        {% for t in selected %}
          {% set svc = (routes.get(t) or {}).get('push', '') %}
          {% if svc %}{% set ns.svcs = ns.svcs + [svc] %}{% endif %}
        {% endfor %}
        {{ ns.svcs }}
      in_quiet_hours: >-
        {% set r = routes.get(target, {}) %}
        {% set qs = r.get('quiet_start') %}
        {% set qe = r.get('quiet_end') %}
        {% if qs and qe %}
          {% set now_hm = now().strftime('%H:%M') %}
          {% if qs < qe %}{{ qs <= now_hm < qe }}
          {% else %}{{ now_hm >= qs or now_hm < qe }}{% endif %}
        {% else %}false{% endif %}
    sequence:
      # A notification nobody can receive is a bug, not a no-op. Surface it.
      - if:
          - condition: template
            value_template: "{{ push_services | count == 0 and priority != 'info' }}"
        then:
          - action: persistent_notification.create
            data:
              title: "Undeliverable {{ priority }}: {{ title }}"
              message: >-
                No push route is configured for target "{{ target }}", so this
                {{ priority }} alert could not reach a phone. Original message:
                {{ message }}. Fix by adding an entry to the `routes` table in
                packages/global.yaml.
              notification_id: "notify_route_missing_{{ target }}"

      - choose:
          # ---- info: never interrupts anyone ----
          - conditions:
              - condition: template
                value_template: "{{ priority == 'info' }}"
            sequence:
              - action: persistent_notification.create
                data:
                  title: "{{ title }}"
                  message: "{{ message }}"

          # ---- warning: phone push, suppressed during that person's quiet hours ----
          - conditions:
              - condition: template
                value_template: "{{ priority == 'warning' }}"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ in_quiet_hours }}"
                then:
                  # Held, not dropped — it is waiting when they wake up.
                  - action: persistent_notification.create
                    data:
                      title: "{{ title }}"
                      message: "{{ message }} (held: quiet hours)"
                else:
                  - repeat:
                      for_each: "{{ push_services }}"
                      sequence:
                        # continue_on_error: a phone that has been factory reset
                        # must not abort the alert to everyone else.
                        - action: "{{ repeat.item }}"
                          continue_on_error: true
                          data:
                            title: "{{ title }}"
                            message: "{{ message }}"
                            data: >-
                              {{ {'actions': actions} if actions is defined and actions else {} }}

          # ---- critical: bypasses DND, and says it out loud ----
          - conditions:
              - condition: template
                value_template: "{{ priority == 'critical' }}"
            sequence:
              - repeat:
                  for_each: "{{ push_services }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      continue_on_error: true
                      data:
                        title: "{{ title }}"
                        message: "{{ message }}"
                        data:
                          # Android
                          channel: critical
                          importance: high
                          ttl: 0
                          priority: high
                          # iOS
                          push:
                            sound:
                              name: default
                              critical: 1
                              volume: 1.0
                          actions: "{{ actions if actions is defined and actions else [] }}"
              - if:
                  - condition: template
                    value_template: "{{ tts_service != '' and announce_targets | count > 0 }}"
                then:
                  - action: "{{ tts_service }}"
                    continue_on_error: true
                    data:
                      entity_id: "{{ announce_targets }}"
                      message: "{{ title }}. {{ message }}"
        default:
          - action: persistent_notification.create
            data:
              title: "Bad priority: {{ priority }}"
              message: >-
                script.notify_person was called with priority "{{ priority }}",
                which is not one of info/warning/critical. Original: {{ title }}
                — {{ message }}

# ---------------------------------------------------------------------------
# 2. MODE HELPERS
# ---------------------------------------------------------------------------
input_select:
  house_mode:
    name: House mode
    icon: mdi:home-heart
    options:
      - home
      - away
      - guest
      - night
      - vacation

input_boolean:
  automations_paused:
    name: Automations paused
    icon: mdi:pause-octagon
    # The global kill switch. EVERY automation in this system checks it.
    # Exists so a houseguest, a party, or a debugging session does not require
    # disabling automations one by one and forgetting to re-enable them.

input_number:
  low_battery_threshold:
    name: Low battery threshold
    icon: mdi:battery-alert
    min: 5
    max: 50
    step: 5
    unit_of_measurement: "%"
    mode: slider

input_datetime:
  ha_last_start:
    name: HA last start
    icon: mdi:restart
    has_date: true
    has_time: true

# ---------------------------------------------------------------------------
# 3. HEALTH PACKAGE
# ---------------------------------------------------------------------------
command_line:
  - sensor:
      name: Database size
      unique_id: sys_database_size
      # Capture then default. `du ... | cut -f1 || echo 0` does NOT work: the
      # `||` binds to `cut`, which exits 0 with empty output when du fails, so
      # the fallback never fires and the sensor dies on ValueError (observed on
      # a live instance). ${s:-0} is the guard that actually holds.
      command: >-
        s=$(du -m /config/home-assistant_v2.db 2>/dev/null | cut -f1); echo "${s:-0}"
      unit_of_measurement: "MB"
      scan_interval: 3600
      state_class: measurement

template:
  - sensor:
      - name: HA uptime
        unique_id: sys_ha_uptime
        icon: mdi:timer-outline
        unit_of_measurement: "h"
        state_class: measurement
        state: >-
          {% set s = states('input_datetime.ha_last_start') %}
          {% if s not in ['unknown', 'unavailable', ''] %}
            {{ ((as_timestamp(now()) - as_timestamp(s)) / 3600) | round(1) }}
          {% else %}0{% endif %}

      - name: Low battery devices
        unique_id: sys_low_battery_devices
        icon: mdi:battery-alert
        state_class: measurement
        # Registry-driven: label a device `battery_powered` and it appears here.
        # No entity_id is hardcoded, so this is correct on a house it has never seen.
        # States are STRINGS: 'lt' on them is lexicographic ('9' > '20'), so the
        # comparison must go through float. A 9% battery missed by a string
        # compare is precisely the battery that dies unnoticed.
        state: >-
          {% set thr = states('input_number.low_battery_threshold') | float(20) %}
          {{ states.sensor
             | selectattr('attributes.device_class', 'defined')
             | selectattr('attributes.device_class', 'eq', 'battery')
             | selectattr('state', 'is_number')
             | map(attribute='state') | map('float')
             | select('lt', thr) | list | count }}
        attributes:
          devices: >-
            {% set thr = states('input_number.low_battery_threshold') | float(20) %}
            {% set ns = namespace(ids=[]) %}
            {% for s in states.sensor
               if s.attributes.get('device_class') == 'battery'
               and s.state is is_number and s.state | float < thr %}
              {% set ns.ids = ns.ids + [s.entity_id] %}
            {% endfor %}
            {{ ns.ids }}

      - name: Unavailable entities
        unique_id: sys_unavailable_entities
        icon: mdi:help-network-outline
        state_class: measurement
        state: >-
          {{ states | selectattr('state', 'in', ['unavailable', 'unknown'])
             | rejectattr('domain', 'in', ['button', 'scene', 'input_button'])
             | list | count }}
        attributes:
          entities: >-
            {{ states | selectattr('state', 'in', ['unavailable', 'unknown'])
               | rejectattr('domain', 'in', ['button', 'scene', 'input_button'])
               | map(attribute='entity_id') | list }}

      - name: House status summary
        unique_id: sys_house_status_summary
        icon: mdi:clipboard-check-outline
        # One line for the mobile dashboard: if this says "All clear", stop reading.
        state: >-
          {% set problems = [] %}
          {% set unavail = states('sensor.unavailable_entities') | int(0) %}
          {% set batt = states('sensor.low_battery_devices') | int(0) %}
          {% if unavail > 0 %}{% set problems = problems + [unavail ~ ' unavailable'] %}{% endif %}
          {% if batt > 0 %}{% set problems = problems + [batt ~ ' low battery'] %}{% endif %}
          {% if is_state('input_boolean.automations_paused', 'on') %}
            {% set problems = problems + ['automations PAUSED'] %}
          {% endif %}
          {{ 'All clear' if problems | count == 0 else problems | join(', ') }}

automation:
  - id: global_record_ha_start
    alias: "[global] Record HA start time"
    description: >-
      Stamps input_datetime.ha_last_start so sensor.ha_uptime has an origin.
      Done in YAML rather than with the uptime integration because that one is
      config-flow only and would live in .storage, invisible to this repo.
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.ha_last_start
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  - id: global_apply_theme
    alias: "[global] Apply the house theme"
    description: >-
      Sets the designed theme (themes/house.yaml) as the backend default for
      both light and dark slots on every start, so every user on
      "Backend-selected" — including wall tablets — gets it without touching
      their profile. Idempotent; cosmetic; no kill-switch needed because it
      does not act on the house.
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - action: frontend.set_theme
        continue_on_error: true
        data:
          name: house
          mode: dark
      - action: frontend.set_theme
        continue_on_error: true
        data:
          name: house
          mode: light

  - id: global_low_battery_alert
    alias: "[global] Low battery alert"
    description: >-
      Daily digest rather than per-device alerts, because eleven separate
      "battery low" pushes get muted and then the door sensor dies unnoticed.
    mode: single
    triggers:
      - trigger: time
        at: "09:00:00"
    conditions:
      - condition: state
        entity_id: input_boolean.automations_paused
        state: "off"
      - condition: numeric_state
        entity_id: sensor.low_battery_devices
        above: 0
    actions:
      - action: script.notify_person
        data:
          target: all
          priority: info
          title: "Low batteries: {{ states('sensor.low_battery_devices') }}"
          message: >-
            {{ state_attr('sensor.low_battery_devices', 'devices') | join(', ') }}

  - id: global_entity_unavailable_alert
    alias: "[global] Entity unavailable > 30 min"
    description: >-
      Fires only after the count has been non-zero for 30 minutes, so a restart
      or a routine Zigbee re-poll does not page anyone.
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.unavailable_entities
        above: 0
        for:
          minutes: 30
    conditions:
      - condition: state
        entity_id: input_boolean.automations_paused
        state: "off"
    actions:
      - action: script.notify_person
        data:
          target: all
          priority: warning
          title: "{{ states('sensor.unavailable_entities') }} entities unavailable"
          message: >-
            Unavailable for 30+ minutes:
            {{ state_attr('sensor.unavailable_entities', 'entities') | join(', ') }}

  - id: global_automation_error_alert
    alias: "[global] Automation or script errored"
    description: >-
      Catches errors that would otherwise only ever appear in a log nobody reads.
      mode: queued because a broken template can error in bursts.
    mode: queued
    max: 10
    triggers:
      - trigger: event
        event_type: system_log_event
        event_data:
          level: ERROR
    conditions:
      - condition: template
        value_template: >-
          {{ 'automation' in trigger.event.data.name
             or 'script' in trigger.event.data.name
             or 'template' in trigger.event.data.name }}
    actions:
      - action: script.notify_person
        data:
          target: all
          priority: info
          title: "Automation error"
          message: "{{ trigger.event.data.message | join(' ') | truncate(240) }}"

# ---------------------------------------------------------------------------
# 4. RECORDER
# ---------------------------------------------------------------------------
# See docs/decisions.md for the full rationale on each exclusion — every one of
# these is history you are choosing not to have.
recorder:
  purge_keep_days: 14
  commit_interval: 5
  exclude:
    domains:
      - automation      # fires are in the logbook and in traces; state is just on/off
      - update          # one row per integration per poll, forever
      - device_tracker  # GPS churn; presence decisions are kept via person + template sensors
    entity_globs:
      - sensor.*_uptime
      - sensor.*_wifi_signal
      - sensor.*_rssi
      - sensor.*_linkquality      # Zigbee LQI moves constantly and is a diagnostic, not history
      - sensor.*_last_seen
      - sensor.clock_*
      - sensor.date_*
      - sensor.time_*
    event_types:
      - call_service    # the single largest table in most HA databases

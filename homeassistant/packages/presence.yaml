# presence.yaml — person fusion, room occupancy, arrival/departure, guest mode.
#
# THE DOG. A dog sets off PIR and mmWave sensors exactly like a person does.
# Three defences, applied throughout this package:
#   1. Label every sensor the dog can physically reach `pet_exposed`.
#   2. A `pet_exposed` sensor alone never establishes occupancy — it needs a
#      corroborating signal (a second sensor, a door, or device activity).
#   3. Away-mode intrusion logic ignores pet_exposed-only motion entirely.
# Placement and tuning guidance is in docs/decisions.md under "pet immunity".

input_number:
  presence_away_delay:
    name: Away-mode confirmation delay
    icon: mdi:timer-sand
    # Hysteresis. A phone that drops Wi-Fi in a dead spot, or hands off between
    # APs, looks exactly like leaving for about 90 seconds. Anything under ~3
    # minutes here produces phantom away-mode and a house that turns itself off
    # while someone is in the shower.
    min: 2
    max: 30
    step: 1
    unit_of_measurement: min
    mode: slider
  occupancy_clear_fast:
    name: Occupancy clear-out — transit rooms
    icon: mdi:walk
    # Halls, entryways, bathrooms: people pass through, so clear quickly.
    min: 1
    max: 15
    step: 1
    unit_of_measurement: min
    mode: slider
  occupancy_clear_slow:
    name: Occupancy clear-out — sitting rooms
    icon: mdi:sofa
    # Living rooms, offices, bedrooms: people sit still and stop triggering PIR.
    # Too short here is the classic "lights turn off while I'm reading" failure.
    min: 5
    max: 60
    step: 5
    unit_of_measurement: min
    mode: slider

input_boolean:
  guest_mode:
    name: Guest mode
    icon: mdi:account-supervisor
    # Relaxes away-mode automations without disabling anything, so nothing has
    # to be remembered and re-enabled after the guest leaves.
  pet_at_home:
    name: Pet at home
    icon: mdi:dog
    # Set false when the dog is boarded/travelling — corroboration requirements
    # relax and motion becomes trustworthy again.

template:
  - binary_sensor:
      # -----------------------------------------------------------------
      # PERSON FUSION
      # Registry-driven across every person entity, so onboarding a person
      # (prompt 19) needs no edit here.
      # -----------------------------------------------------------------
      - name: Anyone home
        unique_id: presence_anyone_home
        device_class: presence
        icon: mdi:home-account
        state: >-
          {{ states.person | selectattr('state', 'eq', 'home') | list | count > 0 }}
        # delay_off is the hysteresis: going home is instant, going away must
        # persist. Asymmetric on purpose — a false "home" is harmless, a false
        # "away" locks someone out and disarms nothing.
        delay_off:
          minutes: 5
        # Same refuse-to-guess rule as everyone_away below: a person whose
        # state is unknown (fresh instance, dead phone) is not evidence of
        # anything. Without this the home badge read "Away" while nobody had
        # actually left — observed live.
        availability: >-
          {{ states.person | rejectattr('state', 'in', ['unknown', 'unavailable'])
             | list | count > 0 }}
        attributes:
          home_now: >-
            {{ states.person | selectattr('state', 'eq', 'home')
               | map(attribute='name') | list }}
          away_now: >-
            {{ states.person | rejectattr('state', 'eq', 'home')
               | map(attribute='name') | list }}

      - name: Everyone away
        unique_id: presence_everyone_away
        device_class: presence
        icon: mdi:home-export-outline
        state: >-
          {{ states.person | list | count > 0
             and states.person | selectattr('state', 'eq', 'home') | list | count == 0 }}
        delay_on:
          minutes: 5
        # availability: two refuse-to-guess cases, both found live.
        # 1. No person entities at all — an empty registry must not read as
        #    "everyone away" and arm the alarm on a fresh install.
        # 2. Every person UNKNOWN/unavailable (fresh instance, or every phone
        #    dead) — 'unknown' is not evidence anyone LEFT, but the plain
        #    template counted it as away and armed the house. Require at least
        #    one person whose state is actually known.
        availability: >-
          {{ states.person | rejectattr('state', 'in', ['unknown', 'unavailable'])
             | list | count > 0 }}

      # -----------------------------------------------------------------
      # HOUSE-WIDE MOTION, split by whether the dog could be the cause.
      # -----------------------------------------------------------------
      - name: Human motion detected
        unique_id: presence_human_motion
        device_class: motion
        icon: mdi:account-alert
        # Motion from sensors the dog CANNOT reach. This is the signal that is
        # safe to treat as a person — used by the alarm, not by the lights.
        # SELF-REFERENCE GUARD: this sensor and its siblings carry motion-family
        # device_classes themselves, so an unguarded scan includes its own
        # output — one motion event then latches it on FOREVER (observed live:
        # `reason` cited the fusion sensors as their own evidence, and the
        # armed house saw a permanent intrusion signal).
        state: >-
          {% set pet = label_entities('pet_exposed') %}
          {% set motion = states.binary_sensor
             | rejectattr('entity_id', 'match', 'binary_sensor\.(human_motion|corroborated_)')
             | selectattr('attributes.device_class', 'defined')
             | selectattr('attributes.device_class', 'in', ['motion', 'occupancy', 'presence'])
             | selectattr('state', 'eq', 'on')
             | map(attribute='entity_id') | list %}
          {{ motion | reject('in', pet) | list | count > 0 }}
        attributes:
          triggered_by: >-
            {% set pet = label_entities('pet_exposed') %}
            {{ states.binary_sensor
               | rejectattr('entity_id', 'match', 'binary_sensor\.(human_motion|corroborated_)')
               | selectattr('attributes.device_class', 'defined')
               | selectattr('attributes.device_class', 'in', ['motion', 'occupancy', 'presence'])
               | selectattr('state', 'eq', 'on')
               | map(attribute='entity_id') | reject('in', pet) | list }}

      - name: Corroborated motion
        unique_id: presence_corroborated_motion
        device_class: motion
        icon: mdi:account-check
        # Two or more independent sensors active at once. A dog triggers one
        # sensor as it moves; two simultaneous hits in different areas is a
        # person, or two dogs, and the second case is rarer than a false alarm.
        # Same self-reference guard as human_motion_detected above.
        state: >-
          {% set active = states.binary_sensor
             | rejectattr('entity_id', 'match', 'binary_sensor\.(human_motion|corroborated_)')
             | selectattr('attributes.device_class', 'defined')
             | selectattr('attributes.device_class', 'in', ['motion', 'occupancy', 'presence'])
             | selectattr('state', 'eq', 'on')
             | map(attribute='entity_id') | list %}
          {% set areas = active | map('area_id') | reject('none') | unique | list %}
          {{ active | count >= 2 or areas | count >= 2 }}

      - name: Trustworthy intrusion signal
        unique_id: presence_intrusion_signal
        device_class: safety
        icon: mdi:shield-alert
        # THE sensor the alarm uses while away. Deliberately conservative:
        # a perimeter opening is always trusted (a dog does not open a door);
        # interior motion is trusted only if it is NOT pet-exposed, or if the
        # dog is known to be away.
        state: >-
          {% set perimeter_open = label_entities('security_perimeter')
             | select('match', 'binary_sensor\.')
             | select('is_state', 'on') | list | count > 0 %}
          {% set pet_home = is_state('input_boolean.pet_at_home', 'on') %}
          {% set human = is_state('binary_sensor.human_motion_detected', 'on') %}
          {% set any_motion = is_state('binary_sensor.corroborated_motion', 'on') %}
          {{ perimeter_open or human or (any_motion and not pet_home) }}
        attributes:
          reason: >-
            {% set perimeter = label_entities('security_perimeter')
               | select('match', 'binary_sensor\.')
               | select('is_state', 'on') | list %}
            {% if perimeter | count > 0 %}perimeter: {{ perimeter | join(', ') }}
            {% elif is_state('binary_sensor.human_motion_detected', 'on') %}
              pet-immune motion: {{ state_attr('binary_sensor.human_motion_detected', 'triggered_by') | join(', ') }}
            {% elif is_state('binary_sensor.corroborated_motion', 'on')
                    and is_state('input_boolean.pet_at_home', 'off') %}
              corroborated motion, pet is away
            {% else %}none{% endif %}

      # -----------------------------------------------------------------
      # PER-ROOM OCCUPANCY — copy this block per room.
      #
      # The ONLY per-room values are: name, the area slug, the clear-out
      # helper, and whether the room needs pet corroboration. Everything else
      # is registry-driven — adding a sensor to the room means assigning it to
      # the area in HA, which is zero edits to this file.
      #
      # Commented out because this repo has not seen your areas, and CLAUDE.md
      # forbids inventing area slugs.
      #
      # - name: Living room occupancy
      #   unique_id: presence_occupancy_living_room
      #   device_class: occupancy
      #   delay_off:
      #     minutes: 20            # occupancy_clear_slow: a sitting room
      #   state: >-
      #     {% set area = 'living_room' %}
      #     {% set pet = label_entities('pet_exposed') %}
      #     {% set sensors = area_entities(area)
      #        | select('match', 'binary_sensor\.') | list %}
      #     {% set active = sensors | select('is_state', 'on') | list %}
      #     {% set human_active = active | reject('in', pet) | list %}
      #     {% if human_active | count > 0 %}true
      #     {% elif is_state('input_boolean.pet_at_home', 'off') %}
      #       {{ active | count > 0 }}
      #     {% else %}
      #       {{ active | count >= 2 }}
      #     {% endif %}
      # -----------------------------------------------------------------

  # =====================================================================
  # TRACKER RELIABILITY SOAK (Ring phase 3)
  #
  # Registry-driven across EVERY device_tracker, so it needs no entity id and
  # starts working the moment the Companion app registers one.
  #
  # WHY THIS EXISTS: auto-arm-away stays disabled until this proves the tracker
  # is trustworthy. Under alarm topology (a) — Ring's panel is the real,
  # monitored panel — a bad arm event is a siren, a call from a dispatcher and
  # a city false-alarm fee, not a logbook entry. An earlier version of this
  # repo armed the house off an `unknown` person state; that must never be
  # possible against a monitored panel.
  #
  # A "flap" is home -> not_home -> home (or the reverse) inside 15 minutes:
  # the signature of a phone dropping Wi-Fi or a GPS fix wobbling, not of
  # someone actually leaving.
  # =====================================================================
  - triggers:
      - trigger: event
        event_type: state_changed
    actions:
      # Only real device_tracker transitions; attribute-only updates (battery,
      # GPS accuracy) fire state_changed constantly and are not movements.
      - condition: template
        value_template: >-
          {{ trigger.event.data.entity_id.startswith('device_tracker.')
             and trigger.event.data.old_state is not none
             and trigger.event.data.new_state is not none
             and trigger.event.data.old_state.state != trigger.event.data.new_state.state }}
      - variables:
          # Keep a rolling window of recent transitions in the attribute. Same
          # accumulate-in-attributes pattern as the energy baseline, and it
          # survives a restart because trigger-based template entities restore.
          recent: >-
            {# state_attr(), NOT this.attributes: `this` is undefined inside a
               trigger-based template entity's actions block (verified live —
               it raised UndefinedError on every event). `this` IS valid in the
               state/attribute templates below, where it is used as the
               render-time fallback. #}
            {% set prior = state_attr('sensor.tracker_flaps_15m', 'transitions')
               or [] %}
            {% set cutoff = as_timestamp(now()) - 900 %}
            {% set kept = prior | selectattr('t', 'gt', cutoff) | list %}
            {{ kept + [{
                 't': as_timestamp(now()),
                 'entity': trigger.event.data.entity_id,
                 'from': trigger.event.data.old_state.state,
                 'to': trigger.event.data.new_state.state,
                 'at': now().strftime('%Y-%m-%d %H:%M:%S')}] }}
    sensor:
      - name: Tracker flaps 15m
        unique_id: presence_tracker_flaps_15m
        icon: mdi:swap-horizontal-bold
        state_class: measurement
        # CRITICAL: every template below falls back to the PRIOR attribute when
        # `recent` is undefined. The trigger is a state_changed firehose and the
        # condition above aborts the action sequence for the ~99% of events that
        # are not device_tracker moves — but the entity still RENDERS on those
        # events, with `recent` undefined. Without this guard the accumulated
        # window was wiped hundreds of times a minute and the counter sat
        # permanently at 0 (observed live: `transitions` rendered as "").
        # Same defined-guard class as the weather forecast sensors.
        #
        # A flap is any transition BEYOND THE FIRST for a given tracker inside
        # the window: leaving once, or arriving once, is normal movement and
        # scores 0; going and coming back within 15 minutes scores 1. Summed
        # across trackers so one bad phone cannot hide behind a good one.
        state: >-
          {% set eff = recent if recent is defined
             else (this.attributes.get('transitions') or []) %}
          {% set ns = namespace(flaps=0) %}
          {% for ent in eff | map(attribute='entity') | unique | list %}
            {% set n = eff | selectattr('entity', 'eq', ent) | list | count %}
            {% set ns.flaps = ns.flaps + ([n - 1, 0] | max) %}
          {% endfor %}
          {{ ns.flaps }}
        attributes:
          transitions: >-
            {{ recent if recent is defined
               else (this.attributes.get('transitions') or []) }}
          window_count: >-
            {{ (recent if recent is defined
                else (this.attributes.get('transitions') or [])) | count }}
          trackers_seen: >-
            {{ (recent if recent is defined
                else (this.attributes.get('transitions') or []))
               | map(attribute='entity') | unique | list }}

automation:
  # -------------------------------------------------------------------------
  # HOUSE MODE transitions
  # -------------------------------------------------------------------------
  # =====================================================================
  # SOAK INSTRUMENTATION (Ring phase 3)
  # =====================================================================
  - id: presence_log_tracker_transitions
    alias: "[presence] Log every device_tracker transition"
    description: >-
      Writes every tracker movement to the logbook so the soak period has a
      record to review, independent of the recorder's device_tracker exclusion
      (that exclusion drops raw GPS churn; these are the decisions).
    mode: queued
    max: 25
    triggers:
      - trigger: event
        event_type: state_changed
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.event.data.entity_id.startswith('device_tracker.')
             and trigger.event.data.old_state is not none
             and trigger.event.data.new_state is not none
             and trigger.event.data.old_state.state != trigger.event.data.new_state.state }}
    actions:
      - action: logbook.log
        data:
          name: Tracker
          entity_id: "{{ trigger.event.data.entity_id }}"
          message: >-
            {{ trigger.event.data.old_state.state }} →
            {{ trigger.event.data.new_state.state }}
            (flaps in last 15m: {{ states('sensor.tracker_flaps_15m') }})

  - id: presence_tracker_soak_weekly
    alias: "[presence] Weekly tracker reliability summary"
    description: >-
      The soak report. Four consecutive clean weeks is the bar before
      auto-arm-away is even considered — see the disabled automation below.
    mode: single
    triggers:
      - trigger: time
        at: "09:30:00"
    conditions:
      - condition: time
        weekday:
          - mon
      - condition: state
        entity_id: input_boolean.automations_paused
        state: "off"
    actions:
      - action: script.notify_person
        data:
          target: all
          priority: info
          title: "Tracker soak: week report"
          message: >-
            Flaps in the current 15-minute window:
            {{ states('sensor.tracker_flaps_15m') }}.
            Trackers seen: {{ (state_attr('sensor.tracker_flaps_15m', 'trackers_seen') or []) | join(', ') or 'none yet' }}.
            Review the logbook for the week's transitions before deciding on
            auto-arm. Four clean weeks required.

  # =====================================================================
  # AUTO-ARM-AWAY — WRITTEN, DELIBERATELY DISABLED.
  #
  # DO NOT ENABLE THIS WITHOUT AN EXPLICIT DECISION AFTER THE SOAK.
  #
  # Under alarm topology (a), Ring's panel is the real, monitored panel. That
  # changes what a mistake costs. Before, arming wrongly meant a wrong state in
  # a logbook. Now it means a siren, a call from a monitoring dispatcher, a
  # possible police dispatch, and a City & County of Honolulu false-alarm fee.
  #
  # This repo has already made exactly this mistake once: an earlier version
  # treated a person whose state was `unknown` as "away" and armed the house
  # with nobody having left. The fusion sensors now refuse to have an opinion
  # unless at least one person's state is actually KNOWN — that guard stays
  # exactly as it is, and is NOT to be weakened now that a tracker exists.
  #
  # To enable, after four clean soak weeks: remove the `false` condition below,
  # and only then.
  # =====================================================================
  - id: presence_auto_arm_away_DISABLED
    alias: "[presence] Auto-arm away (DISABLED pending soak)"
    description: >-
      Arms the Ring panel Away when everyone leaves. DISABLED: the first
      condition is a hard `false`, so this can never run. It exists in this
      form so the logic is reviewed, versioned and ready — not so it can fire.
      Enabling is a deliberate act after four clean tracker-soak weeks.
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.everyone_away
        to: "on"
        for:
          minutes: 10
    conditions:
      # THE DISABLE. Remove this line only after the soak, deliberately.
      - condition: template
        value_template: "{{ false }}"
      - condition: state
        entity_id: input_boolean.automations_paused
        state: "off"
      - condition: state
        entity_id: input_boolean.guest_mode
        state: "off"
      # Never arm off a guess: the fusion sensor must be genuinely available,
      # not merely not-home.
      - condition: template
        value_template: "{{ states('binary_sensor.everyone_away') == 'on' }}"
      - condition: numeric_state
        entity_id: sensor.tracker_flaps_15m
        below: 1
    actions:
      - action: script.notify_person
        data:
          target: all
          priority: warning
          title: Auto-arm away
          message: >-
            Everyone has been away for 10 minutes; arming the alarm Away.

  - id: presence_set_away
    alias: "[presence] Everyone left — go to away"
    description: >-
      Driven by binary_sensor.everyone_away, which already carries the 5-minute
      hysteresis, so this does not need its own `for:`. Never overrides vacation
      mode — that is set deliberately and a day trip should not clear it.
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.everyone_away
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.automations_paused
        state: "off"
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.house_mode
            state: vacation
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.house_mode
        data:
          option: away
      - action: script.notify_person
        data:
          target: all
          priority: info
          title: House set to away
          message: Everyone has left. Away-mode automations are active.

  - id: presence_arrival
    alias: "[presence] Someone arrived"
    description: >-
      Arrival sequence. Guest mode is preserved rather than overwritten, so a
      guest arriving home does not silently re-arm away-mode behaviour.
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.anyone_home
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.automations_paused
        state: "off"
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.house_mode
        data:
          option: >-
            {{ 'guest' if is_state('input_boolean.guest_mode', 'on') else 'home' }}
      # Entry lighting only if it is actually dark — arriving at noon does not
      # need the hall lit.
      - if:
          - condition: sun
            after: sunset
            before: sunrise
          - condition: template
            value_template: "{{ label_entities('entry_light') | count > 0 }}"
        then:
          - action: light.turn_on
            continue_on_error: true
            target:
              label_id: entry_light

  - id: presence_night_mode
    alias: "[presence] Enter night mode"
    description: >-
      Time-based rather than "last person stopped moving", because mmWave in a
      bedroom sees a sleeping person and would never trigger. Skipped entirely
      when nobody is home so an empty house does not shuffle modes overnight.
    mode: single
    triggers:
      - trigger: time
        at: "23:00:00"
    conditions:
      - condition: state
        entity_id: input_boolean.automations_paused
        state: "off"
      - condition: state
        entity_id: binary_sensor.anyone_home
        state: "on"
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.house_mode
            state: vacation
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.house_mode
        data:
          option: night

  - id: presence_morning_mode
    alias: "[presence] Leave night mode"
    description: Return to home/guest at sunrise, so adaptive lighting stops red-shifting.
    mode: single
    triggers:
      - trigger: sun
        event: sunrise
        offset: "-00:30:00"
    conditions:
      - condition: state
        entity_id: input_select.house_mode
        state: night
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.house_mode
        data:
          option: >-
            {{ 'guest' if is_state('input_boolean.guest_mode', 'on') else 'home' }}

  - id: presence_guest_mode_sync
    alias: "[presence] Guest mode toggled"
    description: >-
      Keeps house_mode consistent when guest mode is switched, so the two cannot
      disagree and leave away-automations half-applied with a guest in the house.
    mode: single
    triggers:
      - trigger: state
        entity_id: input_boolean.guest_mode
    conditions:
      - condition: state
        entity_id: binary_sensor.anyone_home
        state: "on"
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.house_mode
        data:
          option: "{{ 'guest' if trigger.to_state.state == 'on' else 'home' }}"

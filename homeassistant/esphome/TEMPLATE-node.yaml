# TEMPLATE-node.yaml — copy this to esphome/<node-name>.yaml for a new node.
#
# Everything shared lives in common/base.yaml. What follows is the whole of
# what a new node needs: its identity, its board, and its actual sensors.
#
# Flash process is in docs/runbook.md, "flashing an ESPHome node".

substitutions:
  node_name: template-node
  node_friendly: Template Node

packages:
  base: !include common/base.yaml

esp32:
  board: esp32dev
  framework:
    type: esp-idf


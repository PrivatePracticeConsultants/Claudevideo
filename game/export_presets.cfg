; Export presets for LAST LINE.
;
; Web notes, since this is the preset most likely to be misconfigured:
;
;   variant/thread_support=false selects Godot's "nothreads" web template. With
;   threads enabled the build needs SharedArrayBuffer, which browsers only grant
;   to pages served with COOP/COEP cross-origin-isolation headers. That rules out
;   itch.io, GitHub Pages and plain static hosting. Single-threaded costs some
;   performance and buys the ability to put the build anywhere - the right trade
;   for a playtest link.
;
;   The renderer must be gl_compatibility (set in project.godot); the Forward+
;   and Mobile renderers do not target WebGL.
;
;   canvas_resize_policy=2 makes the canvas track the window, which is why the
;   camera refits itself on the viewport's size_changed signal.
;
;   html/export_icon is true now that the project defines config/icon. It was
;   false for a long time with an apology attached, because Godot fails the whole
;   export with a bare "configuration errors" if it is true and no icon is set.
;
;   exclude_filter keeps the test suite, the dev tools and the AUTHORING SHEETS
;   out of the shipped build. The first two are obvious. The third is not: the
;   _source_*.png sheets live next to the sprites they were cut from so a sheet
;   can be re-sliced without hunting for it, nothing in the game ever loads
;   them, and Godot was importing and shipping all four to every player. They
;   were 12.6 MB of the download for art nobody sees.

[preset.0]

name="Web"
platform="Web"
runnable=true
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*, assets/art/_source_*.png"
export_path="../build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

; Desktop, and the reason it exists: Forward+.
;
; SSAO, high-quality shadow filtering and a real HDR bloom only exist on the
; Forward+ renderer, and Forward+ does not target WebGL - so the web build is
; Compatibility and always will be. That is a browser limit rather than a Godot
; one, and the same project exported here gets all three with no code change.
; project.godot sets rendering_method=forward_plus with a ".web" override back
; to gl_compatibility, so one project serves both.
;
; Exclusions match the Web preset: the suite and the dev tools are
; development-only and would otherwise ride along in the pck.

[preset.1]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*, assets/art/_source_*.png"
export_path="../build/linux/lastline.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false

[preset.2]

name="Windows"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*, assets/art/_source_*.png"
export_path="../build/windows/lastline.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.2.options]


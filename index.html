/* ---------------- camera ---------------- */

const CAM = { pitch: 0.93, yaw: 0, dist: 26, tx: 16, ty: 0, tz: 8, shake: 0 };

function buildCamera(aspect, orbit) {
  const yaw = CAM.yaw + (orbit || 0);
  const cp = Math.cos(CAM.pitch), sp = Math.sin(CAM.pitch);
  const ex = CAM.tx + Math.sin(yaw) * CAM.dist * cp;
  const ey = CAM.ty + CAM.dist * sp;
  const ez = CAM.tz + Math.cos(yaw) * CAM.dist * cp;
  let sx = 0, sy = 0;
  if (CAM.shake > 0) {
    sx = (Math.random() - 0.5) * CAM.shake * 0.02;
    sy = (Math.random() - 0.5) * CAM.shake * 0.02;
  }
  GL.camEye[0] = ex; GL.camEye[1] = ey; GL.camEye[2] = ez;
  m4LookAt(GL.view, ex, ey, ez, CAM.tx + sx, CAM.ty + sy, CAM.tz, 0, 1, 0);
  m4Perspective(GL.proj, 0.62, aspect, 0.5, 90);
  m4Mul(GL.viewProj, GL.proj, GL.view);
}

/** Pull the camera back until the whole ward is inside the frame. */
/** Frame the ward's CONTENT, not the 32x16 grid. The dense layouts carry solid
    bands of wall top and bottom, and fitting the whole grid spent a third of
    the screen on them — everything the player cares about ended up small and
    pushed off-centre. */
function wardBounds(world) {
  let x0 = COLS, x1 = 0, y0 = ROWS, y1 = 0, any = false;
  if (world) {
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const c = world.grid[y][x];
      if (c.solid && !c.station) continue;         // plain wall: not content
      any = true;
      if (x < x0) x0 = x; if (x + 1 > x1) x1 = x + 1;
      if (y < y0) y0 = y; if (y + 1 > y1) y1 = y + 1;
    }
  }
  if (!any) return { x0: 0, x1: COLS, y0: 0, y1: ROWS };
  // one tile of breathing room, clipped to the grid
  return { x0: Math.max(0, x0 - 1), x1: Math.min(COLS, x1 + 1),
           y0: Math.max(0, y0 - 1), y1: Math.min(ROWS, y1 + 1) };
}

function fitCamera(aspect, world) {
  const bb = wardBounds(world || Game.world);
  CAM.tx = (bb.x0 + bb.x1) / 2;
  CAM.tz = (bb.y0 + bb.y1) / 2;
  const corners = [];
  for (const x of [bb.x0, bb.x1]) for (const z of [bb.y0, bb.y1])
    for (const y of [0, WALL_Y + 0.6]) corners.push([x, y, z]);
  let lo = 12, hi = 70;
  for (let it = 0; it < 26; it++) {
    const mid = (lo + hi) / 2;
    CAM.dist = mid;
    buildCamera(aspect, 0);
    let fits = true;
    for (const c of corners) {
      const m = GL.viewProj;
      const cw = m[3]*c[0] + m[7]*c[1] + m[11]*c[2] + m[15];
      if (cw <= 0.01) { fits = false; break; }
      const nx = (m[0]*c[0] + m[4]*c[1] + m[8]*c[2] + m[12]) / cw;
      const ny = (m[1]*c[0] + m[5]*c[1] + m[9]*c[2] + m[13]) / cw;
      if (Math.abs(nx) > 0.995 || Math.abs(ny) > 0.985) { fits = false; break; }
    }
    if (fits) hi = mid; else lo = mid;
  }
  CAM.dist = hi;
  buildCamera(aspect, 0);
}

function projectToScreen(wx, wy, wz) {
  const m = GL.viewProj;
  const cw = m[3]*wx + m[7]*wy + m[11]*wz + m[15];
  if (cw <= 0.001) return null;
  const nx = (m[0]*wx + m[4]*wy + m[8]*wz + m[12]) / cw;
  const ny = (m[1]*wx + m[5]*wy + m[9]*wz + m[13]) / cw;
  return {
    x: PLAY_X + (nx * 0.5 + 0.5) * PLAY_W,
    y: PLAY_Y + (1 - (ny * 0.5 + 0.5)) * PLAY_H
  };
}

/* ---------------- scene assembly ---------------- */

function bedTopY() { return 0.34; }

/** Everything dynamic in the ward, for whichever pass is active. */
function drawSceneEntities() {
  const world = Game.world;

  // bed blankets (colour tracks occupancy)
  for (const st of world.stations) {
    if (st.type !== "basket") continue;
    const cx = st.x + 0.5, cz = st.y + 0.5;
    if (_pass !== "shadow") {
      const sheet = st.dirty ? "#b39a86" : (st.occupant ? "#ff9fb6" : "#a8d4f5");
      drawMesh(MESH.boxSoft, cx, 0.40, cz + 0.10, 0, 0.395, 0.085, 0.34, rgb(sheet));
      drawMesh(MESH.boxSoft, cx, 0.45, cz - 0.20, 0, 0.395, 0.055, 0.09,
               rgb(st.dirty ? "#c8b6a4" : "#ffffff"));
      if (st.dirty) {
        // rumpled linen piled at the foot: unmistakable at a glance
        drawMesh(MESH.sphereLo, cx - 0.12, 0.52, cz + 0.24, 0.7,
                 0.20, 0.09, 0.16, rgb("#cbb9a6"));
        drawMesh(MESH.sphereLo, cx + 0.14, 0.50, cz + 0.16, 2.1,
                 0.16, 0.08, 0.13, rgb("#bda995"));
      }
    }
  }

  // loose items
  for (const it of Game.floorItems) {
    const flying = !!(it.vx || it.vy);
    const t = performance.now() / 600 + it.id;
    const y = flying ? 0.52 : 0.16 + Math.sin(t) * 0.02;
    drawItem3D(it.type, it.x * T2W, y, it.y * T2W, flying ? (it.spin || 0) : t * 0.4);
  }

  // shutters: fire doors that drop across a corridor on a cycle
  const shl = world.shutters || [];
  for (const sh of shl) {
    if (sh.cordon) {
      // an event cordon is tape and cones, not a fire door — it has to read as
      // temporary at a glance so nobody thinks the ward broke
      for (const c of sh.cells) {
        const cx = c.x + 0.5, cz = c.y + 0.5;
        drawMesh(MESH.cone, cx, 0.22, cz, 0, 0.19, 0.22, 0.19, rgb("#ff7a2f"));
        drawMesh(MESH.boxSoft, cx, 0.05, cz, 0, 0.24, 0.05, 0.24, rgb("#2a2f38"));
        drawMesh(MESH.boxSoft, cx, 0.62, cz, 0, 0.48, 0.05, 0.05, rgb("#ffd54a"));
        drawMesh(MESH.boxSoft, cx, 0.62, cz, Math.PI / 2, 0.48, 0.05, 0.05, rgb("#ffd54a"));
      }
      continue;
    }
    const left = shutterCountdown(sh);
    const warning = !sh.closed && left < SHUTTER_WARN;
    if (sh.swing) {
      // a hinged panel that swings through 90 degrees rather than dropping,
      // so a reconfiguring ward never reads as a fire alarm
      const f = sh.closed ? 1 - clamp(left / 0.6, 0, 1) : clamp(left / 0.6, 0, 1);
      const ang = (Math.PI / 2) * (sh.closed ? f : f);
      for (const c of sh.cells) {
        const cx = c.x + 0.5, cz = c.y + 0.5;
        drawMesh(MESH.boxSoft, cx, 0.34, cz, ang, 0.46, 0.34, 0.07,
                 rgb(sh.closed ? "#7fb2c8" : "#a9cfdd"));
        drawMesh(MESH.boxSoft, cx, 0.66, cz, ang, 0.40, 0.02, 0.075, rgb("#e8f4fa"));
      }
      continue;
    }
    for (const c of sh.cells) {
      const cx = c.x + 0.5, cz = c.y + 0.5;
      // the rail is always there so the hazard is legible before it drops
      drawMesh(MESH.boxSoft, cx, WALL_Y - 0.06, cz, 0, 0.48, 0.07, 0.16,
               rgb("#6c7784"));
      let h;                                  // how far the door has come down
      if (sh.closed) h = 1;
      else if (warning) h = 0.16 * (1 - left / SHUTTER_WARN);
      else h = 0;
      if (h <= 0.001) continue;
      const full = WALL_Y - 0.12;
      const drop = full * h;
      drawMesh(MESH.boxSoft, cx, WALL_Y - 0.12 - drop / 2, cz, 0,
               0.46, drop / 2, 0.10,
               rgb(sh.closed ? "#d8a54a" : "#f0c46b"));
      if (sh.closed) {
        for (let i = 0; i < 3; i++)                 // hazard stripes
          drawMesh(MESH.boxSoft, cx, 0.30 + i * 0.42, cz + 0.055, 0,
                   0.44, 0.055, 0.02, rgb("#3a2a10"));
      }
    }
  }

  /* porter lanes: a low tread plate with chevrons that crawl along it, so the
     direction reads without a legend and you can see it is running */
  if (world.hasBelts) {
    const th = world.def.theme || {};
    const plate = rgb(th.locker || "#8fa4b5");
    const chev = rgb("#6fd3ff");     // fixed: some ward accents are red
    const flow = (performance.now() / 1000) % 1;
    for (let ty = 0; ty < ROWS; ty++) {
      for (let tx = 0; tx < COLS; tx++) {
        const c = world.grid[ty][tx];
        if (!c.belt) continue;
        const cx = tx + 0.5, cz = ty + 0.5;
        drawMesh(MESH.boxSoft, cx, 0.018, cz, 0, 0.5, 0.018, 0.5, plate);
        for (let k = 0; k < 3; k++) {
          const f = ((k / 3) + flow) % 1;                 // 0..1 along the tile
          const ox = c.belt[0] * (f - 0.5), oz = c.belt[1] * (f - 0.5);
          const along = c.belt[0] !== 0;
          drawMesh(MESH.boxSoft, cx + ox, 0.040, cz + oz, 0,
                   along ? 0.055 : 0.16, 0.012, along ? 0.16 : 0.055, chev);
        }
      }
    }
  }

  /* brownout bays: the floor goes dark and an amber hazard glow creeps in, so
     "this corner of the clinic needs a hand" is legible from across the room */
  for (const z of (world.zones || [])) {
    if (z.powered && !z.warn) continue;
    const cx = z.x + z.w / 2, cz = z.y + z.h / 2;
    const pulse = z.powered
      ? 0.10 + 0.10 * Math.sin(performance.now() / 90)     // warning flicker
      : 0.30 + 0.05 * Math.sin(performance.now() / 420);
    drawMesh(MESH.boxSoft, cx, 0.012, cz, 0, z.w / 2, 0.012, z.h / 2,
             [0.02, 0.02, 0.05], pulse);
    // a hazard border so the edge of the dark bay is unambiguous
    const edge = z.powered ? rgb("#ffd54a") : rgb("#f0b03c");
    for (const [ex, ez, sx, sz] of [
      [cx, z.y, z.w / 2, 0.045], [cx, z.y + z.h, z.w / 2, 0.045],
      [z.x, cz, 0.045, z.h / 2], [z.x + z.w, cz, 0.045, z.h / 2]])
      drawMesh(MESH.boxSoft, ex, 0.05, ez, 0, sx, 0.05, sz, edge);
  }

  // spills: a dark glossy puddle with a mop-progress ring
  for (const sp of Game.spills) {
    const wx = sp.tx + 0.5, wz = sp.ty + 0.5;
    const wob = 1 + 0.04 * Math.sin(performance.now() / 700 + sp.seed);
    // dark enough to read as a hazard against every ward palette, with a
    // wet highlight so it does not just look like a shadow
    drawMesh(MESH.sphereLo, wx, 0.012, wz, sp.seed,
             0.46 * wob, 0.012, 0.42 * wob, rgb("#33525e"));
    drawMesh(MESH.sphereLo, wx, 0.018, wz, sp.seed,
             0.34 * wob, 0.011, 0.30 * wob, rgb("#4a7280"));
    drawMesh(MESH.sphereLo, wx - 0.13, 0.024, wz + 0.10, sp.seed,
             0.13, 0.010, 0.11, rgb("#9fc4cf"), 0.35);
  }

  // pickups sitting on the floor
  for (const pu of Game.pickups) {
    const t = performance.now() / 500 + pu.x;
    const y = 0.30 + Math.sin(t) * 0.05;
    const wx = pu.x * T2W, wz = pu.y * T2W;
    if (pu.kind.key === "coffee") {
      drawMesh(MESH.cyl, wx, y, wz, 0, 0.115, 0.16, 0.115, rgb("#f6f1e6"));
      drawMesh(MESH.cyl, wx, y + 0.10, wz, 0, 0.10, 0.02, 0.10, rgb("#6b4a34"));
      drawMesh(MESH.torus, wx + 0.14, y, wz, 0, 0.065, 0.065, 0.065, rgb("#f6f1e6"));
    } else {
      drawMesh(MESH.cyl, wx, y, wz, 0, 0.055, 0.24, 0.055, rgb("#ffe1ee"));
      drawMesh(MESH.cyl, wx, y - 0.02, wz, 0, 0.050, 0.13, 0.050, rgb("#ff7ab8"));
      drawMesh(MESH.cyl, wx, y + 0.20, wz, 0, 0.014, 0.14, 0.014, rgb("#dfe7ee"));
    }
    // a soft ring so it reads as "come and get me"
    drawMesh(MESH.torus, wx, 0.03, wz, performance.now() / 700,
             0.30, 0.30, 0.30, rgb(pu.kind.color), 0.6);
  }

  // animals not being carried
  for (const pt of Game.patients) {
    if (pt.state === "carried") continue;
    drawPatient3D(pt);
  }

  // medics and hired staff
  for (const p of Game.players) drawPlayer3D(p);
  if (Game.nurse) drawNurse3D(Game.nurse);
  for (const st of Game.staff) drawStaff3D(st);
}

/* Every patient is a different person. The look is derived from a PRIVATE rng
   seeded off the patient id, deliberately NOT Game.rng — drawing cosmetics from
   the gameplay stream would shift ailment and slot choices and silently
   invalidate the balance tuning. Same id always yields the same face. */
const SKINS = ["#ffe0c2", "#fbd4a8", "#f0bd8e", "#dda172", "#c8865a",
               "#a86b43", "#8a5a3b", "#6b4630"];
const HAIRS = ["#2b2724", "#3f3833", "#5b4635", "#6b5140", "#8a5a33",
               "#b5622e", "#d9a441", "#e8e2d6", "#9aa6b0", "#7d5aa0"];
const P_STYLES = ["fringe", "short", "long", "bun", "curls", "puffs", "bald"];
// readable at gameplay distance — the first palette was so desaturated that
// every patient read as the same grey blob
const GOWNS = ["#9fc8ea", "#8fd6c0", "#f0b3c4", "#b9aee2", "#f2cf94",
               "#9fd3ee", "#c8dd97", "#eaa9a0"];
const TRIMS = ["#ffffff", "#f3f8ff", "#fff6e8"];

/* ---------------------------------------------------------------------
   The animals.

   Everyone who comes through the door is an animal, and they are the single
   biggest reason this reads as a vet clinic rather than a reskin — so they get
   their own model rather than a hat on the human one. Same plush language as
   the nurses (oversized head, stubby limbs, fabric shading, big glossy toy
   eyes) applied to a sitting animal silhouette, which is what makes a hamster
   legible at the size it actually appears on screen.

   Ten species, each recognisable from its outline alone at a glance: ears and
   tail carry almost all of it, so those are what vary most.
   --------------------------------------------------------------------- */
const SPECIES = {
  cat:       { name: "cat",         ears: "point",  tail: "curl",   scale: 0.90,
               furs: ["#f0a45c", "#8e8b86", "#3e3a38", "#f2ece2"], belly: "#fff3e2" , whiskers: true },
  dog:       { name: "dog",         ears: "flop",   tail: "stub",   scale: 0.98,
               furs: ["#c88a4e", "#6b5341", "#f3e4cd", "#3c3a3a"], belly: "#fff6e8",
               muzzle: 1.18 },
  rabbit:    { name: "rabbit",      ears: "long",   tail: "puff",   scale: 0.80,
               furs: ["#f4ece1", "#b9a48d", "#7d6a5a", "#3a3330"], belly: "#fffaf2" },
  hamster:   { name: "hamster",     ears: "round",  tail: "none",   scale: 0.66,
               furs: ["#e8b878", "#f5e3c8", "#c98f5c"], belly: "#fff6e4", cheeks: true },
  budgie:    { name: "budgie",      ears: "none",   tail: "feather", scale: 0.62,
               furs: ["#7fd06a", "#6fb6f0", "#f2d64f"], belly: "#fdf6df", beak: true },
  hedgehog:  { name: "hedgehog",    ears: "round",  tail: "none",   scale: 0.66,
               furs: ["#a08a72", "#8a7561"], belly: "#f6e9d8", spikes: true, muzzle: 1.12 },
  fox:       { name: "fox",         ears: "bigpoint", tail: "bush", scale: 0.88,
               furs: ["#e8813c", "#d9692c"], belly: "#fff2e0" , whiskers: true },
  guineapig: { name: "guinea pig",  ears: "petal",  tail: "none",   scale: 0.70,
               furs: ["#d8b48a", "#f2ece2", "#6f5a48", "#e0a05a"], belly: "#fff4e6" },
  ferret:    { name: "ferret",      ears: "round",  tail: "long",   scale: 0.74,
               furs: ["#e6d6b8", "#c2a887"], belly: "#fdf6e6", mask: true , whiskers: true },
  tortoise:  { name: "tortoise",    ears: "none",   tail: "stub",   scale: 0.72,
               furs: ["#9fbf72", "#88a961"], belly: "#e7f0d2", shell: true }
};
const SPECIES_KEYS = Object.keys(SPECIES);
const COLLARS = ["#ff8fa8", "#6fd3b4", "#7fb2ff", "#f0b03c", "#c39bf5", "#ff9a8a"];

/** Stable per-patient look. Seeded off the id so a given arrival is always the
    same animal — a patient that changed species between frames would be a very
    strange clinic. */
function patientLook(pt) {
  if (!pt._look) {
    const r = makeRng(((pt.id + 7) * 2654435761) >>> 0);
    const pick = (arr) => arr[Math.floor(r() * arr.length)];
    const key = pick(SPECIES_KEYS);
    const sp = SPECIES[key];
    // a few very small ones and a few chunky ones in every waiting room
    const size = r() < 0.22 ? 0.86 : (r() > 0.84 ? 1.12 : 1);
    pt._look = {
      species: key, sp,
      fur: pick(sp.furs),
      collar: pick(COLLARS),
      scale: sp.scale * size,
      floppy: r() < 0.5 ? -1 : 1,          // which ear sits at a jauntier angle
      patch: r() < 0.34                    // a contrast patch over one eye
    };
  }
  return pt._look;
}

function drawAnimal3D(o) {
  const look = o.look || patientLook({ id: 1 });
  const sp = look.sp || SPECIES.cat;
  const S = (o.scale || 1) * (look.scale || 1) * CHAR_SCALE;
  const ox = o.wx, oz = o.wz, ry = o.ry || 0;
  const y0 = o.y || 0;
  const bob = Math.sin(o.bob || 0) * 0.014 * S;
  const hop = o.moving ? Math.abs(Math.sin(o.step || 0)) * 0.045 * S : 0;
  const P = (lx, ly, lz) => [_lx(ox, ry, lx * S, lz * S), y0 + ly * S + bob + hop,
                             _lz(oz, ry, lx * S, lz * S)];
  const shadowPass = _pass === "shadow";
  if (!shadowPass) setFuzz(1);

  const fur = rgb(look.fur || "#e8b878");
  const belly = rgb(sp.belly || "#fff6e4");
  const dark = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
  const SPH = shadowPass ? MESH.sphereLo : MESH.sphere;

  // --- body: a sitting egg, wider at the base ----------------------------
  const BY = 0.30;
  let p = P(0, BY, 0);
  drawMesh(SPH, p[0], p[1], p[2], ry, 0.330*S, 0.300*S, 0.300*S, fur);

  if (sp.shell) {                                    // tortoise: a domed shell
    p = P(0, BY + 0.10, -0.02);
    drawMesh(MESH.dome, p[0], p[1], p[2], ry, 0.375*S, 0.300*S, 0.360*S, rgb("#8a6b3f"));
    if (!shadowPass && _charDetail)
      for (const [dx, dz] of [[0, -0.10], [-0.16, 0.02], [0.16, 0.02], [0, 0.16]]) {
        p = P(dx, BY + 0.28, dz);
        drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry, 0.070*S, 0.030*S, 0.070*S,
                 rgb("#a98a53"));
      }
  }
  if (sp.spikes && !shadowPass) {                    // hedgehog: a spiky back
    for (let i = 0; i < 9; i++) {
      const ang = (i / 9) * 6.283;
      p = P(Math.cos(ang) * 0.19, BY + 0.20, Math.sin(ang) * 0.17 - 0.05);
      drawMesh(MESH.cone, p[0], p[1], p[2], ry, 0.075*S, 0.135*S, 0.075*S,
               rgb("#6f5c49"));
    }
  }

  if (!shadowPass) {
    // pale belly panel and two front paws resting on the floor
    p = P(0, BY - 0.055, 0.240);
    drawMesh(MESH.sphere, p[0], p[1], p[2], ry, 0.125*S, 0.115*S, 0.075*S, belly);
    for (const sx of [-1, 1]) {
      p = P(sx * 0.165, 0.055, 0.215);
      drawMesh(MESH.sphere, p[0], p[1], p[2], ry, 0.105*S, 0.080*S, 0.135*S,
               dark(fur, 1.06));
      if (_charDetail) {
        p = P(sx * 0.165, 0.075, 0.300);
        drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry, 0.062*S, 0.040*S, 0.038*S, belly);
      }
    }
    // haunches, so a sitting animal does not read as a ball
    for (const sx of [-1, 1]) {
      p = P(sx * 0.265, 0.115, -0.045);
      drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry, 0.115*S, 0.115*S, 0.155*S,
               dark(fur, 0.96));
    }
  }

  // --- tail ---------------------------------------------------------------
  if (!shadowPass) {
    const tailCol = dark(fur, 0.97);
    if (sp.tail === "curl") {
      for (let i = 0; i < 4; i++) {
        p = P(0.02, BY - 0.10 + i * 0.11, -0.30 - i * 0.035 + i * i * 0.012);
        drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry,
                 (0.070 - i * 0.008)*S, (0.070 - i * 0.008)*S, (0.070 - i * 0.008)*S, tailCol);
      }
    } else if (sp.tail === "bush") {
      for (let i = 0; i < 4; i++) {
        p = P(0, BY - 0.06 - i * 0.02, -0.32 - i * 0.13);
        const k = 0.115 + i * 0.012;
        drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry, k*S, k*S, (k + 0.03)*S,
                 i === 3 ? rgb("#fff3e4") : tailCol);
      }
    } else if (sp.tail === "long") {
      for (let i = 0; i < 4; i++) {
        p = P(0, BY - 0.12 - i * 0.03, -0.30 - i * 0.11);
        drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry,
                 0.058*S, 0.058*S, 0.075*S, tailCol);
      }
    } else if (sp.tail === "puff") {
      p = P(0, BY - 0.12, -0.30);
      drawMesh(MESH.sphere, p[0], p[1], p[2], ry, 0.115*S, 0.115*S, 0.100*S,
               rgb("#fffaf2"));
    } else if (sp.tail === "stub") {
      p = P(0, BY + 0.02, -0.31);
      drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry, 0.078*S, 0.078*S, 0.090*S, tailCol);
    } else if (sp.tail === "feather") {
      p = P(0, BY - 0.14, -0.30);
      drawMesh(MESH.boxSoft, p[0], p[1], p[2], ry, 0.070*S, 0.022*S, 0.185*S,
               dark(fur, 0.88));
    }
  }

  // --- head: oversized, sat forward on the body ---------------------------
  const HY = 0.735;
  p = P(0, HY, 0.055);
  drawMesh(SPH, p[0], p[1], p[2], ry, 0.325*S, 0.310*S, 0.305*S, fur);
  if (shadowPass) { setFuzz(0); return; }

  // --- ears: the strongest silhouette cue, so every species differs -------
  const earIn = rgb("#ffc0cb");
  for (const sx of [-1, 1]) {
    const jaunty = sx === look.floppy ? 0.18 : 0;
    if (sp.ears === "point" || sp.ears === "bigpoint") {
      const big = sp.ears === "bigpoint" ? 1.35 : 1;
      p = P(sx * 0.200, HY + 0.315, -0.01);
      drawMesh(MESH.cone, p[0], p[1], p[2], ry + sx * 0.25 + jaunty,
               0.125*S, (0.190 * big)*S, 0.095*S, fur);
      p = P(sx * 0.200, HY + 0.290, 0.030);
      drawMesh(MESH.cone, p[0], p[1], p[2], ry + sx * 0.25 + jaunty,
               0.072*S, (0.120 * big)*S, 0.050*S, earIn);
    } else if (sp.ears === "flop") {
      p = P(sx * 0.318, HY - 0.010 - jaunty * 0.25, 0.015);
      drawMesh(MESH.sphere, p[0], p[1], p[2], ry + sx * 0.20,
               0.115*S, 0.215*S, 0.095*S, dark(fur, 0.76));
    } else if (sp.ears === "long") {
      p = P(sx * 0.125, HY + 0.400 - jaunty * 0.10, -0.01);
      drawMesh(MESH.sphere, p[0], p[1], p[2], ry + sx * (0.12 + jaunty),
               0.085*S, 0.280*S, 0.070*S, fur);
      p = P(sx * 0.125, HY + 0.400 - jaunty * 0.10, 0.035);
      drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry + sx * (0.12 + jaunty),
               0.048*S, 0.205*S, 0.030*S, earIn);
    } else if (sp.ears === "round") {
      p = P(sx * 0.245, HY + 0.245, -0.02);
      drawMesh(MESH.sphere, p[0], p[1], p[2], ry, 0.115*S, 0.115*S, 0.055*S,
               dark(fur, 0.94));
      p = P(sx * 0.245, HY + 0.245, 0.012);
      drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry, 0.062*S, 0.062*S, 0.028*S, earIn);
    } else if (sp.ears === "petal") {
      p = P(sx * 0.290, HY + 0.130, -0.01);
      drawMesh(MESH.sphere, p[0], p[1], p[2], ry + sx * 0.5,
               0.135*S, 0.075*S, 0.060*S, dark(fur, 0.92));
    }
  }

  // --- face ---------------------------------------------------------------
  const FZ = 0.300;                                   // face plane, proud of the head
  if (look.patch) {                                   // a contrast patch over one eye
    p = P(look.floppy * 0.135, HY + 0.045, FZ - 0.02);
    drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry, 0.125*S, 0.120*S, 0.055*S,
             dark(fur, 0.72));
  }
  if (sp.mask) {                                      // ferret: a dark band
    p = P(0, HY + 0.030, FZ - 0.03);
    drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry, 0.255*S, 0.085*S, 0.070*S,
             dark(fur, 0.66));
  }
  for (const sx of [-1, 1]) {
    p = P(sx * 0.125, HY + 0.045, FZ);
    drawMesh(MESH.sphere, p[0], p[1], p[2], ry, 0.078*S, 0.090*S, 0.062*S, rgb("#2b2225"));
    p = P(sx * 0.148, HY + 0.092, FZ + 0.022);        // the big toy catchlight
    drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry, 0.032*S, 0.032*S, 0.030*S,
             rgb("#ffffff"), 0.95);
    if (_charDetail) {
      p = P(sx * 0.100, HY + 0.012, FZ + 0.022);
      drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry, 0.015*S, 0.015*S, 0.014*S,
               rgb("#ffffff"), 0.8);
    }
  }

  // muzzle, nose and mouth — or a beak
  const mz = sp.muzzle || 1;
  if (sp.beak) {
    p = P(0, HY - 0.055, FZ + 0.045);
    drawMesh(MESH.cone, p[0], p[1], p[2], ry + Math.PI, 0.075*S, 0.105*S, 0.075*S,
             rgb("#f0a83c"));
  } else {
    p = P(0, HY - 0.070, FZ + 0.015);
    drawMesh(MESH.sphere, p[0], p[1], p[2], ry, (0.108 * mz)*S, (0.082 * mz)*S,
             (0.072 * mz)*S, belly);
    p = P(0, HY - 0.042, FZ + 0.055 * mz);
    drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry, 0.034*S, 0.026*S, 0.026*S,
             rgb("#c07a86"));
    if (_charDetail)
      for (const [dx, dy] of [[-0.052, -0.115], [0.052, -0.115]]) {
        p = P(dx, HY + dy, FZ + 0.045);
        drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry, 0.020*S, 0.014*S, 0.014*S,
                 rgb("#b0716f"));
      }
  }
  if (sp.cheeks) {                                    // hamster: full pouches
    for (const sx of [-1, 1]) {
      p = P(sx * 0.245, HY - 0.075, FZ - 0.045);
      drawMesh(MESH.sphere, p[0], p[1], p[2], ry, 0.115*S, 0.100*S, 0.100*S,
               dark(fur, 1.03));
    }
  }
  // whiskers, only where they belong: on everything they read as slack wire
  if (_charDetail && sp.whiskers) {
    for (const sx of [-1, 1])
      for (const dy of [0.012, -0.020]) {
        p = P(sx * 0.170, HY - 0.062 + dy, FZ + 0.030);
        drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry + sx * 0.34,
                 0.058*S, 0.005*S, 0.005*S, rgb("#fdf6ea"), 0.7);
      }
  }
  // blush: big, soft, unmissable — the same rule the nurses follow
  for (const sx of [-1, 1]) {
    p = P(sx * 0.208, HY - 0.105, FZ - 0.010);
    drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry, 0.068*S, 0.044*S, 0.030*S,
             rgb("#ff9aab"), 0.72);
  }

  /* The collar is the state light. Treated animals turn green and get a tag,
     which reads instantly across a busy room without recolouring the fur —
     recolouring a cat green was the version that looked broken rather than
     finished. */
  /* On the chest, not the neck. The head sits low enough on the body that a
     ring at the join is buried in both — the first attempt poked out through
     the FRONT of the face as a coloured band straight across the eyes on every
     species. Here it reads as a bandana under the chin and never fouls the
     face at any camera angle. */
  p = P(0, HY - 0.375, 0.205);
  drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry,
           0.205*S, 0.072*S, 0.120*S, rgb(o.done ? "#57c785" : look.collar));
  if (_charDetail) {                                  // the name tag hanging off it
    p = P(0, HY - 0.450, 0.250);
    drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry, 0.052*S, 0.062*S, 0.020*S,
             rgb(o.done ? "#bff5d4" : "#ffe9a8"));
  }
  setFuzz(0);
}

function drawPatient3D(pt) {
  const inBed = pt.station && pt.station.type === "basket";
  const wx = pt.x * T2W, wz = pt.y * T2W;
  const look = patientLook(pt);
  // Waiting animals turn to face the camera — they were rendered back-to, which
  // hid every face in the ward. Walkers face the way they are heading.
  let ry = 0;
  if (pt.state === "walking" && pt.path && pt.path.length) {
    // findPath waypoints are already pixels; scaling them again pointed every
    // walk-in at a near-constant garbage direction
    const n = pt.path[0];
    ry = Math.atan2(n.x - pt.x, n.y - pt.y);
  }
  drawAnimal3D({
    wx, wz,
    ry,
    y: inBed ? bedTopY() + 0.04 : 0,
    bob: pt.bob, step: pt.bob * 1.6, moving: pt.state === "walking",
    look,
    done: pt.done
  });
  if (inBed && _pass !== "shadow") {
    // a folded blanket in the basket, tucked round the back of them
    drawMesh(MESH.boxSoft, wx, bedTopY() + 0.11, wz - 0.16, 0,
             0.360, 0.085, 0.190, rgb(pt.done ? "#93e5b0" : "#ffd9e2"));
  }
  if (pt.vip && _pass !== "shadow") {
    const t = performance.now() / 700;
    drawMesh(MESH.torus, wx, (inBed ? bedTopY() + 0.04 : 0) + 1.28, wz, t,
             0.13, 0.13, 0.13, rgb("#ffd54a"), 0.75);
  }
}

function drawPlayer3D(p) {
  const ry = Math.atan2(p.dx || 0, p.dy || 1);
  const wx = p.x * T2W, wz = p.y * T2W;
  const squash = p.squash > 0 ? Math.sin((p.squash / 0.18) * Math.PI) * 0.10 : 0;
  drawCharacter3D({
    wx, wz, ry,
    bob: p.bob, step: p.step || 0, moving: !!p.moving,
    body: p.index === 0 ? "#4fb8e8" : "#ff8f70",
    cap: p.index === 0 ? "#4fb8e8" : "#ff8f70",
    look: p.look || CHARACTERS[p.index % CHARACTERS.length],
    scale: 1 + squash * 0.5
  });
  if (_pass === "shadow") return;

  // carried patient rides on the shoulders; items float in front
  if (p.patient) {
    drawAnimal3D({
      wx: _lx(wx, ry, 0, -0.12), wz: _lz(wz, ry, 0, -0.12), ry,
      y: 1.10, bob: p.bob * 0.5, step: 0, moving: false,
      look: patientLook(p.patient), scale: 0.72, done: p.patient.done
    });
  } else if (p.item) {
    const bobY = Math.sin(p.bob * 0.6) * 0.02;
    drawItem3D(p.item.type, _lx(wx, ry, 0, 0.34), 0.62 + bobY, _lz(wz, ry, 0, 0.34), ry);
  }
}

/** Hired staff share the plush model; the scrub colour is their department. */
function drawStaff3D(st) {
  const L = STAFF_LOOK[st.role] || STAFF_LOOK.nurse;
  const ry = Math.atan2(st.dx || 0, st.dy || 1);
  drawCharacter3D({
    wx: st.x * T2W, wz: st.y * T2W, ry,
    bob: st.bob, step: st.step || 0, moving: !!st.moving,
    body: L.body, cap: L.cap, look: L.look, scale: 0.95
  });
  if (_pass !== "shadow" && st.item) {
    drawItem3D(st.item.type, st.x * T2W, 1.30, st.y * T2W, performance.now() / 700);
  }
  if (_pass !== "shadow" && st.carrying) {
    drawAnimal3D({
      wx: st.x * T2W, wz: st.y * T2W, ry,
      y: 1.22, bob: st.bob * 0.6, step: 0, moving: false,
      look: patientLook(st.carrying), scale: 0.62, done: st.carrying.done
    });
  }
}

function drawNurse3D(nu) {
  const ry = Math.atan2(nu.dx || 0, nu.dy || 1);
  drawCharacter3D({
    wx: nu.x * T2W, wz: nu.y * T2W, ry,
    bob: nu.bob, step: nu.step || 0, moving: !!nu.moving,
    body: "#ffffff", cap: "#ffd7e0",
    look: { skin: "#f6cfa6", hair: "#8a5a33", style: "fringe", acc: "none" },
    scale: 0.95
  });
}

/* ---------------- passes ---------------- */

function renderWorld3D(orbit) {
  setCharDetail(false);
  const gl = GL.gl;
  const world = Game.world;
  if (!world.mesh) world.mesh = buildLevelMesh(world);

  // the ward camera owns its own framing; menus must not leak theirs in
  CAM.ty = 0; CAM.pitch = 0.93;
  if (!world.camDist) {
    fitCamera(PLAY_W / PLAY_H, world);
    world.camDist = CAM.dist * 0.97;
    world.camTx = CAM.tx; world.camTz = CAM.tz;
  }
  CAM.tx = world.camTx; CAM.tz = world.camTz;
  CAM.dist = world.camDist;

  // ---- shadow pass ----
  const cx = COLS / 2, cz = ROWS / 2;
  const L = LIGHT_DIR;
  const ll = Math.hypot(L[0], L[1], L[2]);
  const lx = -L[0]/ll, ly = -L[1]/ll, lz = -L[2]/ll;      // surface -> light
  const D = 24;
  const lightView = m4();
  m4LookAt(lightView, cx + lx*D, ly*D, cz + lz*D, cx, 0, cz, 0, 1, 0);
  const lightProj = m4();
  m4Ortho(lightProj, -19, 19, -13, 13, 1, 52);
  m4Mul(GL.lightVP, lightProj, lightView);

  gl.bindFramebuffer(gl.FRAMEBUFFER, GL.shadowFB);
  gl.viewport(0, 0, GL.SHADOW_RES, GL.SHADOW_RES);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.useProgram(GL.shadowProg);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.FRONT);                                   // peter-panning guard
  _pass = "shadow";
  drawMesh(world.mesh, 0, 0, 0, 0, 1, 1, 1);
  drawSceneEntities();
  gl.cullFace(gl.BACK);

  // ---- main pass ----
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(PLAY_X, H - (PLAY_Y + PLAY_H), PLAY_W, PLAY_H);
  gl.scissor(PLAY_X, H - (PLAY_Y + PLAY_H), PLAY_W, PLAY_H);
  gl.enable(gl.SCISSOR_TEST);
  gl.clearColor(0.055, 0.075, 0.105, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  buildCamera(PLAY_W / PLAY_H, orbit);
  gl.useProgram(GL.prog);
  const u = GL.prog.u;
  gl.uniform3fv(u.uCam, GL.camEye);
  gl.uniform3f(u.uLightDir, lx, ly, lz);
  gl.uniformMatrix4fv(u.uLightVP, false, GL.lightVP);
  gl.uniform1f(u.uShadowTexel, 1 / GL.SHADOW_RES);
  gl.uniform1f(u.uAmb, 0.46); gl.uniform1f(u.uKey, 0.78);
  gl.uniform1f(u.uShadowOn, 1);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, GL.shadowTex);
  gl.uniform1i(u.uShadow, 0);
  _pass = "main";
  drawMesh(world.mesh, 0, 0, 0, 0, 1, 1, 1);
  drawSceneEntities();
  gl.disable(gl.SCISSOR_TEST);
}

/**
 * Pick a few long open corridor runs for the title medics to pace along.
 * Straight runs of free tiles only, so nobody ever walks through a wall.
 */
function showcaseLanes(world) {
  const runs = [];
  for (let y = 1; y < ROWS - 1; y++) {
    let x = 1;
    while (x < COLS - 1) {
      if (world.grid[y][x].solid) { x++; continue; }
      let e = x;
      while (e < COLS - 1 && !world.grid[y][e].solid) e++;
      if (e - x >= 7) runs.push({ y, x0: x + 0.5, x1: e - 1.5 });
      x = e + 1;
    }
  }
  runs.sort((a, b) => (b.x1 - b.x0) - (a.x1 - a.x0));
  const picked = [];
  for (const r of runs) {
    if (picked.every(p => Math.abs(p.y - r.y) >= 3)) picked.push(r);
    if (picked.length === 3) break;
  }
  return picked;
}

/** Title backdrop: the ward, slowly orbiting, with a shift on the floor. */
let _showcase = null;
function renderShowcase() {
  setCharDetail(true);
  const gl = GL.gl;
  if (!_showcase) {
    const keep = Game.perksActive;
    Game.perksActive = [];
    _showcase = makeWorld(LEVELS[0]);
    Game.perksActive = keep;
  }
  if (!_showcase.mesh) _showcase.mesh = buildLevelMesh(_showcase);

  const t = performance.now() / 9000;
  const keep = { d: CAM.dist, p: CAM.pitch, tx: CAM.tx, ty: CAM.ty, tz: CAM.tz };
  // framed as a hero shot in the upper-middle band, clear of the control panels
  CAM.ty = -2.6;
  CAM.pitch = 0.80;
  fitCamera(W / H, _showcase);
  CAM.dist *= 1.16;
  buildCamera(W / H, Math.sin(t) * 0.42);
  Object.assign(CAM, { pitch: keep.p });

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.disable(gl.SCISSOR_TEST);
  gl.clearColor(0.043, 0.058, 0.086, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.useProgram(GL.prog);
  const u = GL.prog.u;
  const L = LIGHT_DIR, ll = Math.hypot(L[0], L[1], L[2]);
  m4Identity(GL.lightVP);
  gl.uniform3fv(u.uCam, GL.camEye);
  gl.uniform3f(u.uLightDir, -L[0]/ll, -L[1]/ll, -L[2]/ll);
  gl.uniformMatrix4fv(u.uLightVP, false, GL.lightVP);
  gl.uniform1f(u.uShadowTexel, 1 / GL.SHADOW_RES);
  // dimmer than gameplay: the menu type has to stay readable on top of it
  gl.uniform1f(u.uAmb, 0.38); gl.uniform1f(u.uKey, 0.62);
  gl.uniform1f(u.uShadowOn, 0);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, GL.shadowTex);
  gl.uniform1i(u.uShadow, 0);
  _pass = "main";
  drawMesh(_showcase.mesh, 0, 0, 0, 0, 1, 1, 1);

  // a shift on duty: medics pacing the corridors so the ward is not a dead set
  if (!_showcase.lanes) _showcase.lanes = showcaseLanes(_showcase);
  const now = performance.now() / 1000;
  const tints = ["#4fb8e8", "#ff8f70", "#8be9c0"];
  _showcase.lanes.forEach((ln, i) => {
    const span = ln.x1 - ln.x0;
    const phase = now * 0.30 + i * 0.7;
    const u01 = (Math.sin(phase) + 1) / 2;          // ping-pong along the run
    const tx = ln.x0 + span * u01;
    const dir = Math.cos(phase) >= 0 ? 1 : -1;
    drawCharacter3D({
      wx: tx, wz: ln.y + 0.5,
      ry: dir > 0 ? Math.PI / 2 : -Math.PI / 2,
      bob: now * 9, step: now * 9, moving: true,
      body: tints[i], cap: tints[i],
      look: CHARACTERS[(i * 2 + 1) % CHARACTERS.length]
    });
  });

  CAM.dist = keep.d; CAM.pitch = keep.p;
  CAM.tx = keep.tx; CAM.ty = keep.ty; CAM.tz = keep.tz;
}

/* Where the picker's portraits sit, in screen space. The 2D pass needs the same
   numbers to put nameplates and grounding shadows in the right place, so they
   live here rather than being guessed twice. */
const PORTRAIT = {
  heroTop: 0.105, heroBot: 0.600,   // hero band, as fractions of canvas height
  rowTop:  0.700, rowBot:  0.960,   // roster band
  /* Filled in by renderPortraits each frame: where the feet of the hero and of
     each roster medic actually landed on the canvas. The 2D layer draws contact
     shadows and nameplates from these rather than re-deriving them from world
     spacing and camera distance — that guess is what put the pips across the
     full width while the models sat clustered in the middle. */
  heroFoot: { x: 640, y: 460 },
  heroFeet: [],
  rowFeet: []
};

/** Project a world point through the current camera into canvas pixels, for a
    render band occupying [top, bot] of the canvas height. */
function bandProject(wx, wy, wz, top, bot) {
  const m = GL.viewProj;
  const cw = m[3]*wx + m[7]*wy + m[11]*wz + m[15];
  if (cw <= 0.001) return null;
  const nx = (m[0]*wx + m[4]*wy + m[8]*wz + m[12]) / cw;
  const ny = (m[1]*wx + m[5]*wy + m[9]*wz + m[13]) / cw;
  return { x: (nx * 0.5 + 0.5) * W,
           y: (top + (1 - (ny * 0.5 + 0.5)) * (bot - top)) * H };
}

/** The picker: one big hero medic for whoever is highlighted, and a small row
    of all six underneath.
    Six medics side by side at dist 15 rendered every plush detail at about
    forty pixels tall — the seams, ears, blush and eye highlights that make them
    worth looking at were all sub-pixel, and a flat 0.78 ambient on top left
    them hazy enough to read as translucent. One hero at close range shows the
    toy; the row still shows the roster. */
function renderPortraits() {
  setCharDetail(true);
  const gl = GL.gl;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.disable(gl.SCISSOR_TEST);
  gl.clearColor(0.043, 0.058, 0.086, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  const n = CHARACTERS.length;
  const keep = { d: CAM.dist, p: CAM.pitch, tx: CAM.tx, ty: CAM.ty, tz: CAM.tz };
  gl.useProgram(GL.prog);
  const u = GL.prog.u;
  // Key light beside the camera so faces are lit rather than silhouetted, and a
  // much lower fill than before: at 0.78 ambient there was no light-to-dark
  // falloff anywhere on the model, and a plush toy with no shading on it looks
  // like frosted glass.
  const kl = Math.hypot(0.40, 0.66, 0.70);
  m4Identity(GL.lightVP);
  gl.uniform3f(u.uLightDir, -0.40/kl, 0.66/kl, 0.70/kl);
  gl.uniformMatrix4fv(u.uLightVP, false, GL.lightVP);
  gl.uniform1f(u.uShadowTexel, 1 / GL.SHADOW_RES);
  gl.uniform1f(u.uAmb, 0.44); gl.uniform1f(u.uKey, 1.10);
  gl.uniform1f(u.uShadowOn, 0);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, GL.shadowTex);
  gl.uniform1i(u.uShadow, 0);
  _pass = "main";

  const t = performance.now() / 1000;
  const hero = clamp(Game.charCursor[0] | 0, 0, n - 1);

  /* Two viewport bands rather than one camera for both. Trying to place the
     hero and the roster in the same frustum meant guessing a CAM.ty that put
     each at the right screen height, and the 2D nameplates and contact shadows
     then had to guess the same number again. A band per group makes both
     positions exact. GL's y runs from the bottom, hence the flip. */
  const band = (top, bot) => {
    const h = Math.round((bot - top) * H);
    gl.viewport(0, Math.round((1 - bot) * H), W, h);
    return W / h;
  };

  /* The hero band shows whoever is highlighted, close enough to see the
     stitching. In two-player it shows BOTH picks side by side — this is a co-op
     game and P2 was previously choosing blind, with only a 60px roster portrait
     to go on. When both players are on the same medic there is only one to show. */
  const hero2 = Game.playerCount === 2 ? clamp(Game.charCursor[1] | 0, 0, n - 1) : hero;
  const twoHeroes = Game.playerCount === 2 && hero2 !== hero;
  let aspect = band(PORTRAIT.heroTop, PORTRAIT.heroBot);
  CAM.tx = 0; CAM.ty = 0.86; CAM.tz = 0; CAM.pitch = 0.08;
  CAM.dist = twoHeroes ? 8.2 : 5.6;
  buildCamera(aspect, 0);
  gl.uniform3fv(u.uCam, GL.camEye);
  const heroSlots = twoHeroes ? [[hero, -1.35], [hero2, 1.35]] : [[hero, 0]];
  PORTRAIT.heroFeet = [];
  for (const [idx, hx] of heroSlots) {
    const c = CHARACTERS[idx];
    drawCharacter3D({
      wx: hx, wz: 0, ry: Math.sin(t * 0.5 + idx) * 0.42,
      bob: t * 1.6 + idx, step: 0, moving: false,
      body: c.scrub, cap: c.cap, look: c, scale: 1.0
    });
    PORTRAIT.heroFeet.push({
      idx,
      pt: bandProject(hx, 0.02, 0, PORTRAIT.heroTop, PORTRAIT.heroBot)
          || { x: W / 2, y: H * 0.6 }
    });
  }
  PORTRAIT.heroFoot = PORTRAIT.heroFeet[0].pt;

  // --- the roster, small, all six, so you can see who else there is --------
  aspect = band(PORTRAIT.rowTop, PORTRAIT.rowBot);
  CAM.tx = 0; CAM.ty = 0.60; CAM.tz = 0; CAM.pitch = 0.10; CAM.dist = 10.4;
  buildCamera(aspect, 0);
  gl.uniform3fv(u.uCam, GL.camEye);
  PORTRAIT.rowFeet = [];
  for (let i = 0; i < n; i++) {
    const c = CHARACTERS[i];
    const p1Here = Game.charCursor[0] === i;
    const p2Here = Game.playerCount === 2 && Game.charCursor[1] === i;
    const wx = (i - (n - 1) / 2) * 2.10;
    drawCharacter3D({
      wx, wz: 0,
      ry: Math.sin(t * 0.6 + i) * 0.30,
      bob: t * 2 + i, step: 0, moving: false,
      body: c.scrub, cap: c.cap, look: c,
      scale: (p1Here || p2Here) ? 0.92 : 0.74
    });
    PORTRAIT.rowFeet[i] = bandProject(wx, 0.02, 0, PORTRAIT.rowTop, PORTRAIT.rowBot)
                          || { x: W / 2, y: H * 0.92 };
  }

  gl.viewport(0, 0, W, H);
  CAM.dist = keep.d; CAM.pitch = keep.p;
  CAM.tx = keep.tx; CAM.ty = keep.ty; CAM.tz = keep.tz;
}

function clearGL(r, g2, b) {
  const gl = GL.gl;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.disable(gl.SCISSOR_TEST);
  gl.clearColor(r, g2, b, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
}

/* ---------------------------------------------------------------------
   11. RENDERING

   The static parts of a level (floor, walls, painted decals) are baked once
   into an offscreen canvas; only entities and lighting are redrawn per frame.
   --------------------------------------------------------------------- */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const canvas3d = document.getElementById("gl");
const stack = document.getElementById("stack");

function fitCanvas() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  const w = Math.floor(W * s), h = Math.floor(H * s);
  for (const c of [canvas, canvas3d]) {
    c.style.width = w + "px";
    c.style.height = h + "px";
  }
  stack.style.width = w + "px";
  stack.style.height = h + "px";
}
window.addEventListener("resize", fitCanvas);
fitCanvas();
initGL(canvas3d);

/* On real GPUs the driver can revoke the context at any moment (memory
   pressure, driver reset, laptop GPU switch). Unhandled, every GL call fails
   from then on and the game appears to crash. Handled: we pause rendering,
   rebuild everything when the context comes back, and carry on. */
canvas3d.addEventListener("webglcontextlost", (e) => {
  e.preventDefault();                    // signal that we intend to restore
  GL.ok = false;
  GL.lost = true;
});
canvas3d.addEventListener("webglcontextrestored", () => {
  initGL(canvas3d);                      // rebuilds programs, shadow map, primitives
  // every cached VAO died with the old context — force rebakes everywhere
  if (Game.world) Game.world.mesh = null;
  if (Game.builderWorld) Game.builderWorld.mesh = null;
  if (typeof _showcase !== "undefined" && _showcase) _showcase.mesh = null;
  GL.lost = false;
});

/* --- cached paints ------------------------------------------------------ */

const Paint = {};
function initPaints() {
  const v = ctx.createRadialGradient(PLAY_W / 2, PLAY_H / 2, PLAY_H * 0.30,
                                     PLAY_W / 2, PLAY_H / 2, PLAY_H * 0.95);
  v.addColorStop(0, "rgba(0,0,0,0)");
  v.addColorStop(1, "rgba(95,70,45,0.20)");
  Paint.vignette = v;

  const hud = ctx.createLinearGradient(0, 0, 0, HUD_H);
  hud.addColorStop(0, "#1b2636");
  hud.addColorStop(1, "#111925");
  Paint.hud = hud;

  const t = ctx.createLinearGradient(0, 0, 0, H);
  t.addColorStop(0, "#0b1220");
  t.addColorStop(0.55, "#101b2c");
  t.addColorStop(1, "#0a1018");
  Paint.title = t;
}
initPaints();

/* --- static background bake --------------------------------------------- */

/* --- icons -------------------------------------------------------------- */

function drawAilmentIcon(g, key, x, y, r) {
  const a = AILMENTS[key];
  if (!a) return;
  g.save();
  g.translate(x, y);
  g.fillStyle = a.color;
  g.lineJoin = "round"; g.lineCap = "round";
  switch (key) {
    case "muddypaws": {                               // a little muddy pawprint
      g.fillStyle = a.color;
      g.beginPath(); g.ellipse(0, r * .28, r * .52, r * .44, 0, 0, 6.283); g.fill();
      for (const [ox, oy, rr] of [[-.62, -.42, .21], [-.22, -.66, .22],
                                  [.22, -.66, .22], [.62, -.42, .21]]) {
        g.beginPath(); g.ellipse(ox * r, oy * r, rr * r, rr * r * 1.15, 0, 0, 6.283); g.fill();
      }
      g.fillStyle = "rgba(255,255,255,.35)";
      g.beginPath(); g.ellipse(-r * .14, r * .18, r * .16, r * .12, -.4, 0, 6.283); g.fill();
      break;
    }
    case "itchyears": {                               // one flopped ear, mid-scratch
      g.fillStyle = a.color;
      g.beginPath();
      g.moveTo(0, r * .9);
      g.bezierCurveTo(-r * .95, r * .4, -r * .8, -r * .95, -r * .05, -r * .75);
      g.bezierCurveTo(r * .7, -r * .95, r * .8, r * .2, 0, r * .9);
      g.fill();
      g.fillStyle = "rgba(255,255,255,.4)";
      g.beginPath();
      g.moveTo(0, r * .52);
      g.bezierCurveTo(-r * .45, r * .2, -r * .4, -r * .5, 0, -r * .38);
      g.bezierCurveTo(r * .36, -r * .5, r * .4, r * .2, 0, r * .52);
      g.fill();
      g.strokeStyle = "#2f7a4c"; g.lineWidth = Math.max(1.3, r * .16);
      for (let i = 0; i < 3; i++) {                   // itch squiggles
        g.beginPath();
        g.moveTo(r * (.72 + i * .12), -r * (.5 - i * .34));
        g.lineTo(r * (1.02 + i * .12), -r * (.62 - i * .34));
        g.stroke();
      }
      break;
    }
    case "sprainedhop": {                             // a bunny leg in a bootie
      g.strokeStyle = "#f3ecd9"; g.lineWidth = Math.max(2.6, r * .36);
      g.beginPath(); g.moveTo(-r * .5, -r * .8); g.lineTo(-r * .1, r * .1); g.stroke();
      g.fillStyle = a.color;
      fillRound(g, -r * .62, r * .06, r * 1.22, r * .74, r * .28, a.color);
      g.strokeStyle = "rgba(90,70,40,.45)"; g.lineWidth = 1.2;
      roundRect(g, -r * .62, r * .06, r * 1.22, r * .74, r * .28); g.stroke();
      g.strokeStyle = "#fff"; g.lineWidth = Math.max(1.4, r * .16);
      g.beginPath(); g.moveTo(-r * .34, r * .3); g.lineTo(r * .42, r * .3); g.stroke();
      g.beginPath(); g.moveTo(-r * .34, r * .56); g.lineTo(r * .42, r * .56); g.stroke();
      break;
    }
    case "staticcling": {                             // a fluff-ball throwing sparks
      g.fillStyle = "#f4e3c8";
      g.beginPath();
      for (let i = 0; i < 14; i++) {                  // frizzed-out silhouette
        const ang = (i / 14) * 6.283;
        const rad = r * (i % 2 ? .58 : .84);
        const px = Math.cos(ang) * rad, py = Math.sin(ang) * rad;
        i ? g.lineTo(px, py) : g.moveTo(px, py);
      }
      g.closePath(); g.fill();
      g.fillStyle = a.color;
      for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1]]) {
        g.beginPath();
        g.moveTo(sx * r * .72, sy * r * .58);
        g.lineTo(sx * r * 1.16, sy * r * .70);
        g.lineTo(sx * r * .86, sy * r * .92);
        g.closePath(); g.fill();
      }
      g.fillStyle = "#4a3200";
      g.beginPath(); g.arc(-r * .22, -r * .06, r * .10, 0, 6.283); g.fill();
      g.beginPath(); g.arc(r * .22, -r * .06, r * .10, 0, 6.283); g.fill();
      break;
    }
    case "mysterymunch": {                            // the question mark, kept
      g.beginPath(); g.arc(0, 0, r * .8, 0, 6.283); g.fill();
      g.strokeStyle = "rgba(255,255,255,.30)"; g.lineWidth = 1.2;
      g.beginPath(); g.arc(0, 0, r * .8, 0, 6.283); g.stroke();
      text(g, "?", 0, r * .46, r * 1.4, "#fff", "center");
      break;
    }
    case "stickypaws": {                              // a paw stuck in a honey drip
      g.fillStyle = a.color;
      g.beginPath();
      g.moveTo(-r * .86, -r * .5);
      g.bezierCurveTo(-r * .5, r * .1, -r * .62, r * .86, 0, r * .92);
      g.bezierCurveTo(r * .62, r * .86, r * .5, r * .1, r * .86, -r * .5);
      g.closePath(); g.fill();
      g.fillStyle = "#7a4a1c";
      g.beginPath(); g.ellipse(0, r * .18, r * .34, r * .28, 0, 0, 6.283); g.fill();
      for (const [ox, oy] of [[-.4, -.2], [-.14, -.4], [.14, -.4], [.4, -.2]]) {
        g.beginPath(); g.ellipse(ox * r, oy * r, r * .13, r * .15, 0, 0, 6.283); g.fill();
      }
      g.fillStyle = "rgba(255,255,255,.45)";
      g.beginPath(); g.ellipse(-r * .42, r * .5, r * .14, r * .09, -.5, 0, 6.283); g.fill();
      break;
    }
    case "zoomies": {                                 // motion lines and a blur
      g.fillStyle = a.color;
      g.beginPath(); g.ellipse(r * .28, 0, r * .5, r * .42, 0, 0, 6.283); g.fill();
      g.beginPath(); g.ellipse(r * .62, -r * .28, r * .24, r * .2, 0, 0, 6.283); g.fill();
      g.fillStyle = "#4a3200";
      g.beginPath(); g.arc(r * .70, -r * .32, r * .07, 0, 6.283); g.fill();
      g.strokeStyle = a.color; g.lineWidth = Math.max(1.6, r * .2);
      for (let i = 0; i < 3; i++) {
        const yy = -r * .42 + i * r * .42;
        g.beginPath();
        g.moveTo(-r * 1.05, yy); g.lineTo(-r * (.35 - i * .1), yy);
        g.stroke();
      }
      break;
    }
    case "socksituation": {                           // a stripey sock
      g.save(); g.rotate(-0.5);
      g.fillStyle = a.color;
      g.beginPath();
      g.moveTo(-r * .3, -r * .95);
      g.lineTo(r * .3, -r * .95);
      g.lineTo(r * .3, r * .2);
      g.bezierCurveTo(r * .3, r * .78, -r * .95, r * .78, -r * .95, r * .3);
      g.bezierCurveTo(-r * .95, r * .0, -r * .3, r * .1, -r * .3, r * .0);
      g.closePath(); g.fill();
      g.fillStyle = "rgba(255,255,255,.75)";
      g.fillRect(-r * .3, -r * .95, r * .6, r * .26);
      g.fillRect(-r * .3, -r * .40, r * .6, r * .18);
      g.restore();
      break;
    }
    case "crickintail": {                             // a kinked tail
      g.strokeStyle = a.color;
      g.lineWidth = Math.max(2.6, r * .34);
      g.beginPath();
      g.moveTo(-r * .82, r * .70);
      g.quadraticCurveTo(-r * .1, r * .55, r * .05, -r * .1);
      g.quadraticCurveTo(r * .18, -r * .72, r * .78, -r * .58);
      g.stroke();
      g.fillStyle = "#fff";
      g.beginPath(); g.arc(r * .78, -r * .58, r * .2, 0, 6.283); g.fill();
      g.strokeStyle = "#e4573d"; g.lineWidth = Math.max(1.3, r * .15);
      for (const [ox, oy] of [[-.28, -.62], [.34, .18]]) {
        g.beginPath();
        g.moveTo(ox * r - r * .18, oy * r - r * .18);
        g.lineTo(ox * r + r * .18, oy * r + r * .18);
        g.stroke();
      }
      break;
    }
    case "toomanytreats": {                           // a round tum and one crumb
      g.fillStyle = a.color;
      g.beginPath(); g.arc(0, r * .12, r * .82, 0, 6.283); g.fill();
      g.fillStyle = "rgba(255,255,255,.4)";
      g.beginPath(); g.ellipse(-r * .26, -r * .18, r * .26, r * .18, -.5, 0, 6.283); g.fill();
      g.fillStyle = "#7a4a1c";
      g.beginPath();                                  // a bone-shaped biscuit
      g.ellipse(r * .52, -r * .66, r * .18, r * .14, .5, 0, 6.283); g.fill();
      g.beginPath();
      g.ellipse(r * .86, -r * .9, r * .18, r * .14, .5, 0, 6.283); g.fill();
      g.lineWidth = Math.max(2, r * .16); g.strokeStyle = "#7a4a1c";
      g.beginPath(); g.moveTo(r * .56, -r * .70); g.lineTo(r * .82, -r * .86); g.stroke();
      break;
    }
  }
  g.restore();
}
function drawItemIcon(g, type, x, y, r) {
  g.save();
  g.translate(x, y);
  g.lineJoin = "round";
  switch (type) {
    case "towel":
      g.save(); g.rotate(-0.5);
      fillRound(g, -r, -r * .44, r * 2, r * .88, r * .32, "#f8f2e0");
      g.strokeStyle = "#cfc3a2"; g.lineWidth = 1.2;
      roundRect(g, -r, -r * .44, r * 2, r * .88, r * .32); g.stroke();
      g.fillStyle = "#e7dcc0";
      g.beginPath(); g.arc(0, 0, r * .34, 0, 6.283); g.fill();
      g.fillStyle = "#cdbf9c";
      for (let i = -1; i <= 1; i++)
        for (let j = -1; j <= 1; j++)
          if (i || j) { g.beginPath(); g.arc(i * r * .16, j * r * .16, r * .05, 0, 6.283); g.fill(); }
      g.restore(); break;
    case "drops":
      g.save(); g.rotate(-0.62);
      fillRound(g, -r * .95, -r * .3, r * 1.5, r * .6, r * .18, "#eef8ff");
      g.fillStyle = "#3fa9e8"; fillRound(g, -r * .9, -r * .22, r * .85, r * .44, r * .1, "#3fa9e8");
      g.strokeStyle = "#b9c8d6"; g.lineWidth = 1.1;
      roundRect(g, -r * .95, -r * .3, r * 1.5, r * .6, r * .18); g.stroke();
      g.strokeStyle = "#dfe7ee"; g.lineWidth = Math.max(1.6, r * .17); g.lineCap = "round";
      g.beginPath(); g.moveTo(r * .55, 0); g.lineTo(r * 1.1, 0); g.stroke();
      g.restore(); break;
    case "plate":
      fillRound(g, -r * .82, -r * .98, r * 1.64, r * 1.96, r * .2, "#333a48");
      g.fillStyle = "#4d576a"; g.fillRect(-r * .58, -r * .74, r * 1.16, r * 1.48);
      g.strokeStyle = "#232a36"; g.lineWidth = 1.4;
      roundRect(g, -r * .82, -r * .98, r * 1.64, r * 1.96, r * .2); g.stroke();
      break;
    case "scan": {
      fillRound(g, -r * .82, -r * .98, r * 1.64, r * 1.96, r * .2, "#16324a");
      const gl = g.createLinearGradient(0, -r, 0, r);
      gl.addColorStop(0, "rgba(150,215,255,.55)");
      gl.addColorStop(1, "rgba(150,215,255,.10)");
      g.fillStyle = gl;
      g.fillRect(-r * .6, -r * .76, r * 1.2, r * 1.52);
      g.strokeStyle = "#a8dcff"; g.lineWidth = Math.max(1.3, r * .17); g.lineCap = "round";
      g.beginPath(); g.moveTo(-r * .28, -r * .56); g.lineTo(r * .1, r * .06); g.lineTo(-r * .2, r * .6); g.stroke();
      break;
    }
    case "bootie":
      fillRound(g, -r * .88, -r * .62, r * 1.76, r * 1.24, r * .5, "#f5efdd");
      g.strokeStyle = "#c8bb99"; g.lineWidth = 1.3;
      roundRect(g, -r * .88, -r * .62, r * 1.76, r * 1.24, r * .5); g.stroke();
      g.strokeStyle = "rgba(190,178,146,.85)"; g.lineWidth = 1.6;
      for (let i = -1; i <= 1; i++) {
        g.beginPath(); g.moveTo(i * r * .48, -r * .6); g.lineTo(i * r * .48 - r * .22, r * .6); g.stroke();
      }
      break;
    case "swab":
      fillRound(g, -r * .44, -r * .98, r * .88, r * 1.96, r * .3, "#e6eef5");
      fillRound(g, -r * .32, -r * .12, r * .64, r * .98, r * .2, "#c0392b");
      g.fillStyle = "rgba(255,255,255,.45)";
      g.fillRect(-r * .26, -r * .8, r * .16, r * .6);
      g.fillStyle = "#8d99a8"; fillRound(g, -r * .52, -r * 1.06, r * 1.04, r * .34, r * .1, "#8d99a8");
      break;
    case "crate":
      fillRound(g, -r * .98, -r * .82, r * 1.96, r * 1.64, r * .18, "#c8974f");
      g.fillStyle = "rgba(255,255,255,.16)";
      g.fillRect(-r * .98, -r * .82, r * 1.96, r * .34);
      g.strokeStyle = "#87642f"; g.lineWidth = Math.max(1.5, r * .17);
      g.beginPath(); g.moveTo(-r * .98, 0); g.lineTo(r * .98, 0); g.stroke();
      g.beginPath(); g.moveTo(0, -r * .82); g.lineTo(0, r * .82); g.stroke();
      roundRect(g, -r * .98, -r * .82, r * 1.96, r * 1.64, r * .18); g.stroke();
      break;
    case "wand":
    case "wand_charged": {
      const hot = type === "wand_charged";
      fillRound(g, -r * 1.02, -r * .82, r * 2.04, r * 1.64, r * .26, hot ? "#ffd84d" : "#d99f2c");
      g.strokeStyle = hot ? "#b98800" : "#8e6613"; g.lineWidth = 1.4;
      roundRect(g, -r * 1.02, -r * .82, r * 2.04, r * 1.64, r * .26); g.stroke();
      g.fillStyle = "#2e333b";
      fillRound(g, -r * .78, -r * .52, r * .58, r * 1.04, r * .14, "#2e333b");
      fillRound(g, r * .2, -r * .52, r * .58, r * 1.04, r * .14, "#2e333b");
      if (hot) {
        g.strokeStyle = "#ff5c5c"; g.lineWidth = Math.max(1.5, r * .21); g.lineJoin = "round";
        g.beginPath();
        g.moveTo(-r * .06, -r * .62); g.lineTo(-r * .3, r * .02); g.lineTo(r * .06, r * .02); g.lineTo(-r * .12, r * .66);
        g.stroke();
      }
      break;
    }
  }
  g.restore();
}

function drawMeter(g, x, y, w, h, frac, done) {
  g.fillStyle = "rgba(14,22,34,.78)";
  roundRect(g, x - 1.5, y - 1.5, w + 3, h + 3, 3.5); g.fill();
  let col = PALETTE.good;
  if (done) col = "#4ec97a";
  else if (frac < 0.25) {
    const pulse = 0.55 + 0.45 * Math.sin(performance.now() / 90);
    col = "rgb(" + Math.round(206 + 49 * pulse) + ",52,52)";
  } else if (frac < 0.55) col = PALETTE.warn;
  g.fillStyle = col;
  roundRect(g, x, y, Math.max(0, w * frac), h, 2.5); g.fill();
  g.fillStyle = "rgba(255,255,255,.28)";
  roundRect(g, x, y, Math.max(0, w * frac), h * 0.45, 2); g.fill();
}

/** The helper nurse: white scrubs, pink cross cap, hearts while comforting. */
/** A keycap + caption pill for contextual controls. */
function promptPill(g, key, label, cx, top, keyColor) {
  g.font = 'bold 10px "Trebuchet MS", "Segoe UI", sans-serif';
  const lw = g.measureText(label).width;
  const w = 16 + 5 + lw + 12;
  cx = clamp(cx, w / 2 + 3, PLAY_W - w / 2 - 3);

  g.globalAlpha = 0.92;
  g.fillStyle = "rgba(14,22,34,.85)";
  roundRect(g, cx - w / 2, top, w, 15, 5); g.fill();
  g.fillStyle = keyColor;

  text(g, key, cx - w / 2 + 9.5, top + 10.6, 8.5, "#1a2432", "center");
  text(g, label, cx - w / 2 + 21, top + 11, 10, "#dde9f5", "left");
  g.restore();
}

/** A centred caption on its own dark pill, so it stays readable over beds.
    Clamped so it never clips at the arena edge. */
function labelPill(g, str, cx, top, color) {
  g.font = 'bold 11px "Trebuchet MS", "Segoe UI", sans-serif';
  const w = g.measureText(str).width + 12;
  cx = clamp(cx, w / 2 + 3, PLAY_W - w / 2 - 3);
  g.fillStyle = "rgba(14,22,34,.85)";
  roundRect(g, cx - w / 2, top, w, 15, 5); g.fill();
  text(g, str, cx, top + 11, 11, color, "center");

/* --- HUD ---------------------------------------------------------------- */

function hudCard(g, x, y, w, h, label) {
  g.fillStyle = "rgba(255,255,255,.045)";
  roundRect(g, x, y, w, h, 9); g.fill();
  g.strokeStyle = "rgba(255,255,255,.07)"; g.lineWidth = 1;
  roundRect(g, x, y, w, h, 9); g.stroke();
  if (label) text(g, label, x + 12, y + 16, 10, PALETTE.dim);
}

/** Baskets out of action. Turns amber then red as the ward silts up, because a
    player needs to feel the turnover debt before it strands them. */
/** The one running-totals line, drawn as a unit.
    "Sent home 5   Trotted off 0" is a good deal wider than the "Treated / Lost"
    it replaced, and it ran straight into the basket indicator that used to sit
    at a hard-coded +150. Both live here now, measured, on the single row the
    card has space for. */
function hudCounters(g, bx) {
  const n = dirtyBedCount();
  const left = "Sent home " + Game.treated + "   Trotted off " + Game.lost;
  g.font = 'bold 11.5px "Trebuchet MS", "Segoe UI", sans-serif';
  text(g, left, bx + 12, 72, 11.5, PALETTE.dim);
  if (!n) return;
  const total = Game.world ? Game.world.beds.length : 1;
  const frac = n / Math.max(1, total);
  const col = frac > 0.55 ? PALETTE.bad : (frac > 0.28 ? PALETTE.warn : PALETTE.dim);
  g.save();
  if (frac > 0.55) g.globalAlpha = 0.6 + 0.4 * Math.sin(performance.now() / 160);
  text(g, "↻ " + n, bx + 20 + g.measureText(left).width, 72, 11.5, col);
  g.restore();
}

function drawHUD(g) {
  g.fillStyle = Paint.hud;
  g.fillRect(0, 0, W, HUD_H);
  if (Game.builderMode && Game.builder) {
    // credits are the whole point of a wave, so they sit in the HUD
    fillRound(g, W / 2 + 150, 14, 150, 44, 10, "rgba(111,211,180,.14)");
    text(g, String(Game.builder.credits), W / 2 + 225, 40, 22, "#6fd3b4", "center");
    text(g, "CREDITS", W / 2 + 225, 54, 9, PALETTE.dim, "center");
  }
  g.fillStyle = "rgba(63,182,232,.35)";
  g.fillRect(0, HUD_H - 3, W, 3);

  const lvl = Game.level;

  // --- clock / level ---
  hudCard(g, 14, 10, 236, HUD_H - 22);
  const isTut = !!(lvl && lvl.tutorial);
  text(g, Game.builderMode ? ("CLINIC  " + lvl.name)
        : isTut ? lvl.name
        : ((Game.endless ? "∞" : (Game.levelIndex + 1)) + "  " + lvl.name),
       26, 30, 15, PALETTE.text);
  Game.perksActive.forEach((k, i) => {
    g.save(); g.translate(224 - i * 24, 26); g.scale(0.55, 0.55); g.translate(-224 + i * 24, -26);
    drawPerkIcon(g, k, 224 - i * 24, 26, true);
    g.restore();
  });
  if (isTut) {
    // no clock and no targets: an Infinity duration would render as garbage, and
    // more to the point there is nothing here to race or to score
    text(g, "LEARNING", 26, 70, 22, "#6fd3b4");
  } else if (Game.endless) {
    text(g, fmtTime(Game.time), 26, 70, 32, "#8be9ff");
    text(g, "SURVIVED", 128, 70, 11, PALETTE.dim);
    text(g, "WAVE " + Game.wave, 128, 52, 12, PALETTE.warn);
    if (Game.waveTimer < 12)
      text(g, "VAN " + Math.ceil(Game.waveTimer) + "s", 190, 52, 12, "#ff9a6a");
  } else {
    const remain = Math.max(0, lvl.duration - Game.time);
    const urgent = remain < 30;
    let col = urgent ? PALETTE.bad : PALETTE.text;
    if (urgent && Math.sin(performance.now() / 160) > 0) col = "#ff8f7a";
    text(g, fmtTime(remain), 26, 70, 32, col);
    text(g, "TIME", 122, 70, 11, PALETTE.dim);
    if (Game.wave > 0) text(g, "WAVE " + Game.wave, 122, 52, 12, PALETTE.warn);
    if (Game.waveTimer < 12 && remain > Game.waveTimer)
      text(g, "VAN " + Math.ceil(Game.waveTimer) + "s", 178, 52, 12, "#ff9a6a");
  }

  // --- lives: as many hearts as this run actually has ---
  const nHearts = Math.min(6, Game.livesMax || 3);
  const heartGap = nHearts > 4 ? 16 : 22;      // squeeze so 5-6 still fit the card
  for (let i = 0; i < nHearts; i++) {
    const hx = 184 + i * heartGap, hy = 62;
    const alive = i < Game.lives;
    g.save();
    g.translate(hx, hy);
    const beat = alive && Game.critical < CRIT_AT ? 1 + 0.14 * Math.sin(performance.now() / 130) : 1;
    g.scale(beat, beat);
    g.fillStyle = alive ? "#ff4d6d" : "rgba(255,255,255,.12)";
    g.beginPath();
    g.moveTo(0, 7);
    g.bezierCurveTo(-11, -1, -5, -10, 0, -3.5);
    g.bezierCurveTo(5, -10, 11, -1, 0, 7);
    g.fill();
    g.restore();
  }

  // --- score + combo ---
  const shown = Math.round(Game.scoreShown);
  text(g, String(shown), W / 2, 52, 42, PALETTE.text, "center");
  text(g, "SCORE", W / 2, 70, 11, PALETTE.dim, "center");

  if (Game.combo > 1) {
    const mult = Math.min(COMBO_MAX, 1 + 0.25 * (Game.combo - 1));
    const a = clamp(Game.comboTimer / Game.comboWindow, 0, 1);
    const cx = W / 2 + 138, cy = 46;
    g.save();
    g.globalAlpha = 0.45 + 0.55 * a;
    g.strokeStyle = "rgba(255,255,255,.14)"; g.lineWidth = 4;
    g.beginPath(); g.arc(cx, cy, 20, 0, 6.283); g.stroke();
    g.strokeStyle = PALETTE.warn; g.lineWidth = 4; g.lineCap = "round";
    g.beginPath(); g.arc(cx, cy, 20, -Math.PI / 2, -Math.PI / 2 + 6.283 * a); g.stroke();
    text(g, "x" + fmtMult(mult), cx, cy + 5, 15, PALETTE.warn, "center");
    text(g, "CHAIN " + Game.combo, cx, cy + 34, 11, PALETTE.dim, "center");
    g.restore();
  }

  // --- targets / best ---
  const bx = W - 330;
  if (Game.builderMode || (lvl && lvl.builder)) {
    hudCard(g, bx, 10, 250, HUD_H - 22, "WAVE " + (Game.builder ? Game.builder.wave : 1));
    text(g, "Best wave  " + (Game.builderBest || "—"), bx + 12, 52, 16, "#6fd3b4");
    hudCounters(g, bx);
  } else if (isTut) {
    hudCard(g, bx, 10, 250, HUD_H - 22, "ORIENTATION");
    text(g, "Nothing here can be failed.", bx + 12, 52, 13, "#6fd3b4", "left", "normal");
    text(g, "Esc to pause  ·  L to leave", bx + 12, 74, 12, PALETTE.dim, "left", "normal");
  } else if (Game.endless) {
    hudCard(g, bx, 10, 250, HUD_H - 22, "PERSONAL BEST");
    text(g, String(Game.endlessBest), bx + 12, 52, 26, "#ffd54a");
    hudCounters(g, bx);
  } else {
    hudCard(g, bx, 10, 250, HUD_H - 22, "TARGETS");
    const tgts = starTargets(Game.levelIndex);
    for (let i = 0; i < tgts.length; i++) {
      const th = tgts[i];
      const hit = Game.score >= th;
      const sx = bx + 14 + i * 78;
      drawStar(g, sx + 9, 46, 10, hit ? "#ffd54a" : "rgba(255,255,255,.15)");
      text(g, String(th), sx + 23, 51, 13, hit ? PALETTE.text : PALETTE.dim);
    }
    hudCounters(g, bx);
  }

  text(g, (Sound.muted ? "M  muted" : "M  sound") + (Music.on ? "  ·  N  music" : "  ·  N  off"), W - 20, 26, 11, PALETTE.dim, "right");
  text(g, "Esc  pause", W - 20, 74, 11, PALETTE.dim, "right");
}

function drawStar(g, x, y, r, color) {
  g.save(); g.translate(x, y); g.fillStyle = color;
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const rad = i % 2 ? r * .45 : r;
    const a = -Math.PI / 2 + i * Math.PI / 5;
    if (i === 0) g.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
    else g.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
  }
  g.closePath(); g.fill(); g.restore();
}

/* Keyed by STATION id. These are bare object keys, which is exactly why the
   recast missed them at first — the chain chips silently fell back to grey
   because every lookup missed. Worth a note: any future station rename has to
   come through here too, and nothing will throw to tell you. */
const CHAIN_COLORS = {
  grooming: "#4bb695", remedy: "#5a93d8", scanner: "#75849f", bootiebench: "#c9a468",
  groundpad: "#dfae3d", lab: "#a678e0", wanddock: "#e87765", basket: "#8fb8dd",
  hatch: "#c98a5a", fusebox: "#dfae3d", "?": "#6b7b90"
};

function drawLegend(g) {
  g.fillStyle = "#0c1420";
  g.fillRect(0, LEGEND_Y, W, LEGEND_H);
  g.fillStyle = "rgba(63,182,232,.22)";
  g.fillRect(0, LEGEND_Y, W, 2);

  /* This strip was laid out for five conditions across the full width. At ten
     each column was half as wide as a four-step chain needs and the chips ran
     straight over the neighbour — Cardiac's chain was being drawn on top of
     Fracture's. Past five it now wraps to two rows, which keeps every chain
     legible instead of trading them for a step count; the chain is the whole
     reason the strip exists. Each cell is also clipped to its own slot, so no
     future count can make one bleed into the next.

     One row stacks (icon, name over score, chain below). Two rows put it all
     on one line, because 32px of height cannot stack anything. */
  const list = (Game.level && Game.level.ailments) || [];
  if (!list.length) return;
  const nRows = list.length > 5 ? 2 : 1;
  const perRow = Math.ceil(list.length / nRows);
  const colW = W / perRow;
  const rowH = LEGEND_H / nRows;

  for (let i = 0; i < list.length; i++) {
    const key = list[i], a = AILMENTS[key];
    if (!a) continue;
    const col = i % perRow, row = Math.floor(i / perRow);
    const cellX = col * colW, cellY = LEGEND_Y + row * rowH;

    g.save();
    g.beginPath();
    g.rect(cellX, cellY, colW - 3, rowH);
    g.clip();

    if (col > 0) {
      g.fillStyle = "rgba(255,255,255,.06)";
      g.fillRect(cellX - 2, cellY + 5, 1, rowH - 10);
    }
    if (row > 0) {
      g.fillStyle = "rgba(255,255,255,.05)";
      g.fillRect(cellX, cellY, colW - 3, 1);
    }

    let textX, chainX, chainY, iconR;
    if (nRows === 1) {
      iconR = 11;
      textX = cellX + 41;
      g.font = "bold 13px \"Trebuchet MS\", \"Segoe UI\", sans-serif";
      drawAilmentIcon(g, key, cellX + 25, cellY + 23, iconR);
      text(g, a.name, textX, cellY + 21, 13, a.color);
      text(g, "+" + a.score, textX, cellY + 35, 10, PALETTE.dim);
      chainX = textX; chainY = cellY + 45;
    } else {
      iconR = 8;
      textX = cellX + 24;
      g.font = "bold 11.5px \"Trebuchet MS\", \"Segoe UI\", sans-serif";
      drawAilmentIcon(g, key, cellX + 13, cellY + rowH / 2, iconR);
      const nameW = g.measureText(a.name).width;
      text(g, a.name, textX, cellY + rowH / 2 - 3, 11.5, a.color);
      text(g, "+" + a.score, textX, cellY + rowH / 2 + 9, 9.5, PALETTE.dim);
      chainX = textX + Math.max(nameW, 34) + 8;
      chainY = cellY + rowH / 2 - 8;
    }

    g.font = "bold 10px \"Trebuchet MS\", \"Segoe UI\", sans-serif";
    const boxes = a.chain.map(st => Math.max(nRows === 1 ? 32 : 26,
                                             g.measureText(st.t).width) + 9);
    const natural = boxes.reduce((s2, w2) => s2 + w2, 0) + 11 * (a.chain.length - 1);
    const avail = colW - (chainX - cellX) - 7;
    const squeeze = Math.max(0.58, Math.min(1, avail / Math.max(1, natural)));

    g.save();
    g.translate(chainX, chainY);
    g.scale(squeeze, 1);
    let cx = 0;
    for (let j = 0; j < a.chain.length; j++) {
      const stp = a.chain[j], wBox = boxes[j];
      g.fillStyle = CHAIN_COLORS[stp.s] || "#555";
      roundRect(g, cx, 0, wBox, 16, 5); g.fill();
      g.fillStyle = "rgba(255,255,255,.18)";
      roundRect(g, cx, 0, wBox, 6, 4); g.fill();
      text(g, stp.t, cx + wBox / 2, 11, 10, "#ffffff", "center");
      cx += wBox;
      if (j < a.chain.length - 1) {
        text(g, "\u203a", cx + 5, 12, 13, PALETTE.dim, "center");
        cx += 11;
      }
    }
    g.restore();
    g.restore();
  }
}

function drawTutorial(g) {
  const tut = Game.tutorial;
  if (!tut || tut.stage >= TUTORIAL_STEPS.length) return;
  if (Game.banner) return;                        // never fight the level banner
  const step = TUTORIAL_STEPS[tut.stage];
  const msg = step.text;
  const a = clamp(tut.t * 2.5, 0, 1);
  g.save();
  g.globalAlpha = a;
  g.font = 'bold 16px "Trebuchet MS", "Segoe UI", sans-serif';
  const w = Math.min(W - 80, g.measureText(msg).width + 96);
  const bx = W / 2 - w / 2, by = PLAY_Y + 12;
  g.fillStyle = "rgba(10,18,28,.90)";
  roundRect(g, bx, by, w, 56, 12); g.fill();
  g.strokeStyle = "rgba(63,182,232,.65)"; g.lineWidth = 1.5;
  roundRect(g, bx, by, w, 56, 12); g.stroke();
  const pulse = 0.7 + 0.3 * Math.sin(performance.now() / 240);
  g.fillStyle = "rgba(63,182,232," + pulse + ")";
  g.beginPath(); g.arc(bx + 22, by + 22, 6, 0, 6.283); g.fill();
  text(g, msg, bx + 40, by + 27, 16, "#dff0ff", "left");
  // the ask, restated in three words, because the sentence above is the WHY
  if (step.hint) text(g, "\u2192  " + step.hint, bx + 40, by + 47, 12.5, "#8be9ff", "left", "normal");
  text(g, (tut.stage + 1) + " / " + TUTORIAL_STEPS.length,
       bx + w - 16, by + 27, 12, PALETTE.dim, "right");
  g.restore();

  // a step counter as pips, so progress through the lesson is visible at a glance
  const px = W / 2 - (TUTORIAL_STEPS.length - 1) * 7;
  for (let i = 0; i < TUTORIAL_STEPS.length; i++) {
    g.fillStyle = i < tut.stage ? "#6fd3b4" : (i === tut.stage ? "#ffd54a" : "rgba(255,255,255,.16)");
    g.beginPath(); g.arc(px + i * 14, by + 70, 4, 0, 6.283); g.fill();
  }
}


/** Achievement pop-ins, stacked down the right edge. */
function drawToasts(g) {
  for (let i = Game.toasts.length - 1; i >= 0; i--) {
    const t = Game.toasts[i];
    const a = t.t < 0.3 ? t.t / 0.3 : clamp((t.life - t.t) / 0.5, 0, 1);
    const y = PLAY_Y + 24 + i * 54;
    g.save();
    g.globalAlpha = a;
    const w = 300, x = W - w - 24;
    fillRound(g, x, y, w, 46, 12, "rgba(12,20,30,.94)");
    g.strokeStyle = "#ffd54a"; g.lineWidth = 2;
    roundRect(g, x, y, w, 46, 12); g.stroke();
    drawStar(g, x + 26, y + 23, 12, "#ffd54a");
    text(g, "ACHIEVEMENT", x + 48, y + 19, 10, "#ffd54a");
    text(g, t.text, x + 48, y + 36, 15, PALETTE.text);
    g.restore();
  }
}

/** A small chip naming the event currently running, with its time left. */
function drawEventChip(g) {
  if (!Game.event) return;
  const e = Game.event.def;
  const left = clamp(1 - Game.event.t / e.dur, 0, 1);
  const w = 216, x = W / 2 - w / 2, y = PLAY_Y + 8;
  fillRound(g, x, y, w, 30, 9, "rgba(12,20,30,.88)");
  g.strokeStyle = e.color; g.lineWidth = 1.5;
  roundRect(g, x, y, w, 30, 9); g.stroke();
  g.fillStyle = e.color;
  roundRect(g, x + 6, y + 23, (w - 12) * left, 3, 1.5); g.fill();
  text(g, e.name + "   x" + EVENT_PAY.toFixed(1), x + w / 2, y + 18, 13, e.color, "center");
}

/** Three medals per ward, filled in as the shift challenges are met. */
function drawMedals(g, list, done, x, y, r, count) {
  const n = count || 3;
  for (let i = 0; i < n; i++) {
    const cx = x + i * (r * 2 + 6);
    const on = done && done[i];
    g.fillStyle = on ? "#ffd54a" : "rgba(255,255,255,.10)";
    g.beginPath(); g.arc(cx, y, r, 0, 6.283); g.fill();
    g.strokeStyle = on ? "#fff0b8" : "rgba(255,255,255,.16)";
    g.lineWidth = 1.5;
    g.beginPath(); g.arc(cx, y, r, 0, 6.283); g.stroke();
    if (on) {
      g.strokeStyle = "#8a6b00"; g.lineWidth = 2; g.lineCap = "round";
      g.beginPath();
      g.moveTo(cx - r * 0.42, y); g.lineTo(cx - r * 0.1, y + r * 0.36);
      g.lineTo(cx + r * 0.46, y - r * 0.38);
      g.stroke();
    }
  }
}

function drawBanner(g) {
  if (!Game.banner) return;
  const b = Game.banner, t = b.t;
  let alpha = 1;
  if (t < 0.3) alpha = t / 0.3;
  else if (t > 2.6) alpha = clamp((3.2 - t) / 0.6, 0, 1);
  const urgent = !!b.urgent;
  g.save();
  g.globalAlpha = alpha;
  const bw = 620, bx = W / 2 - bw / 2, by = PLAY_Y + 180;
  g.fillStyle = "rgba(10,16,24,.90)";
  roundRect(g, bx, by, bw, 112, 16); g.fill();
  g.strokeStyle = urgent ? "#e4573d" : (b.color || "rgba(63,182,232,.55)");
  g.lineWidth = 3;
  roundRect(g, bx, by, bw, 112, 16); g.stroke();
  if (urgent) {
    g.globalAlpha = alpha * (0.35 + 0.35 * Math.sin(performance.now() / 90));
    g.fillStyle = "#e4573d";
    roundRect(g, bx, by, bw, 112, 16); g.fill();
    g.globalAlpha = alpha;
  }
  text(g, b.text, W / 2, by + 54, 38, urgent ? "#ffd9d1" : (b.color || PALETTE.text), "center");
  text(g, b.sub, W / 2, by + 86, 15, PALETTE.dim, "center", "normal");
  g.restore();
}

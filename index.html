/* ---------------- placing things into a live ward ---------------- */

/** Every open tile reachable from the entrance, and every station adjacent to
    one. Used to prove a placement has not sealed anything off. */
function wardConnected(world) {
  const seen = new Set([world.entrance.x + "," + world.entrance.y]);
  const q = [world.entrance];
  while (q.length) {
    const c = q.shift();
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = c.x + dx, ny = c.y + dy, k = nx + "," + ny;
      if (seen.has(k) || !isWalkable(world, nx, ny)) continue;
      seen.add(k); q.push({ x: nx, y: ny });
    }
  }
  let open = 0;
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++) if (isWalkable(world, x, y)) open++;
  if (seen.size !== open) return false;                 // an island got cut off
  if (!seen.has(world.exit.x + "," + world.exit.y)) return false;
  for (const st of world.stations) {                    // every machine usable
    let ok = false;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]])
      if (seen.has((st.x + dx) + "," + (st.y + dy))) ok = true;
    if (!ok) return false;
  }
  return true;
}

/** Why can this tile not take a machine? Returns null when it can. */
function placementProblem(world, x, y) {
  if (x < 1 || y < 1 || x >= COLS - 1 || y >= ROWS - 1) return "Outside the ward";
  const cell = cellAt(world, x, y);
  if (!cell) return "Outside the ward";
  if (cell.entrance || cell.exit) return "That is a doorway";
  if (cell.station) return "Something is already here";
  if (cell.solid) return "That is a wall";
  if (Game.patients.some(q => q.state !== "gone" &&
      Math.floor(q.x / TILE) === x && Math.floor(q.y / TILE) === y))
    return "Someone is standing there";
  return null;
}

/** Drop a station onto the floor, refusing anything that would seal the ward. */
function placeStation(world, type, x, y) {
  const problem = placementProblem(world, x, y);
  if (problem) return problem;
  const cell = world.grid[y][x];
  const st = {
    type, x, y,
    cx: x * TILE + TILE / 2, cy: y * TILE + TILE / 2,
    occupant: null,
    stock: STATIONS[type].stockMax !== undefined
      ? (Game.level && Game.level.restock ? STATIONS[type].stockMax : Infinity)
      : Infinity,
    jammed: false, flash: 0.6,
    hasDefib: type === "defibrack"
  };
  cell.solid = true; cell.station = st;
  world.stations.push(st);
  if (type === "bed") world.beds.push(st);

  if (!wardConnected(world)) {                          // undo, cleanly
    cell.solid = false; cell.station = null;
    world.stations.pop();
    if (type === "bed") world.beds.pop();
    return "That would block the way through";
  }
  world.waitSlots = computeWaitSlots(world, world.slotTarget || 8);
  world.mesh = null;                                    // force a rebake
  return null;
}

/* ---------------- staff ---------------- */

function makeStaff(role, tx, ty) {
  return {
    role, x: tx * TILE + TILE / 2, y: ty * TILE + TILE / 2,
    home: { x: tx, y: ty },
    dx: 0, dy: 1, bob: 0, step: 0, moving: false,
    path: [], target: null, carrying: null, item: null,
    workT: 0, phase: "idle", cooldown: 0, comfort: 0
  };
}

const STAFF_SPEED = 132;

/** Walk toward a tile. Returns "arrived" | "moving" | "blocked". */
function staffWalk(st, tx, ty, dt, adjacent) {
  const here = tileOf(st.x, st.y);
  const done = adjacent
    ? Math.abs(here.x - tx) + Math.abs(here.y - ty) === 1
    : (here.x === tx && here.y === ty);
  if (done) {
    const cx = tx * TILE + TILE / 2, cy = ty * TILE + TILE / 2;
    const d = Math.hypot(cx - st.x, cy - st.y);
    if (d > 1) { st.dx = (cx - st.x) / d; st.dy = (cy - st.y) / d; }
    st.moving = false;
    return "arrived";
  }
  if (!st.path.length || st.repathT === undefined || (st.repathT -= dt) <= 0) {
    st.repathT = 0.6;
    let goal = { x: tx, y: ty };
    if (adjacent || !isWalkable(Game.world, tx, ty)) {
      let best = null;
      for (const [dx, dy] of [[0,1],[1,0],[-1,0],[0,-1]]) {
        if (isWalkable(Game.world, tx + dx, ty + dy)) { best = { x: tx + dx, y: ty + dy }; break; }
      }
      if (!best) return "blocked";
      goal = best;
    }
    st.path = findPath(Game.world, here, goal) || [];
    if (!st.path.length && !(here.x === goal.x && here.y === goal.y)) return "blocked";
  }
  const next = st.path[0];
  if (!next) return "blocked";
  // findPath waypoints are already in PIXELS (see findPath), not tile indices
  const vx = next.x - st.x, vy = next.y - st.y, d = Math.hypot(vx, vy);
  if (d < 4) { st.path.shift(); return "moving"; }
  const sp = STAFF_SPEED * dt;
  st.x += (vx / d) * sp; st.y += (vy / d) * sp;
  st.dx = vx / d; st.dy = vy / d;
  st.moving = true; st.step += dt * 9;
  return "moving";
}

/** Hold a job for `dur` seconds. Returns true on the frame it completes. */
function staffWork(st, dur, dt) {
  st.workT += dt;
  if (st.workT < dur * Game.workMul) return false;
  st.workT = 0;
  return true;
}

function updateStaff(dt) {
  for (const st of Game.staff) {
    st.bob += dt * (st.moving ? 11 : 2);
    if (st.cooldown > 0) st.cooldown -= dt;
    switch (st.role) {
      case "porter":   staffPorter(st, dt); break;
      case "xraytech": staffXrayTech(st, dt); break;
      case "labtech":  staffLabTech(st, dt); break;
      case "clerk":    staffClerk(st, dt); break;
      case "nurse":    staffNurse(st, dt); break;
    }
    if (st.carrying) { st.carrying.x = st.x; st.carrying.y = st.y - 4; }
  }
}

function freeBedFor(world) {
  return world.beds.find(b => !b.occupant) || null;
}

function staffPorter(st, dt) {
  if (st.carrying) {
    const pt = st.carrying;
    if (pt.state !== "carried") { st.carrying = null; st.path = []; return; }
    const bed = st.target && !st.target.occupant ? st.target : freeBedFor(Game.world);
    if (!bed) { st.moving = false; return; }             // nowhere to put them
    st.target = bed;
    if (staffWalk(st, bed.x, bed.y, dt, true) === "arrived") {
      pt.state = "station"; pt.station = bed;
      pt.x = bed.cx; pt.y = bed.cy - 6;
      bed.occupant = pt; bed.flash = 0.3;
      st.carrying = null; st.target = null; st.path = [];
      Sound.play("place");
    }
    return;
  }
  // pick the most distressed arrival, but only if there is a bed to take them to
  if (!freeBedFor(Game.world)) { st.moving = false; st.target = null; return; }
  let best = null, bestFrac = 2;
  for (const pt of Game.patients) {
    if (pt.state !== "waiting" && pt.state !== "walking") continue;
    if (Game.staff.some(o => o !== st && o.target === pt)) continue;
    const f = pt.patience / pt.patienceMax;
    if (f < bestFrac) { bestFrac = f; best = pt; }
  }
  if (!best) { st.moving = false; st.target = null; return; }
  st.target = best;
  const t = tileOf(best.x, best.y);
  if (staffWalk(st, t.x, t.y, dt, false) === "arrived") {
    if (best.state === "waiting" || best.state === "walking") {
      best.state = "carried"; best.path = []; best.slot = null;
      st.carrying = best; st.target = null; st.path = [];
      Sound.play("pickup");
    } else { st.target = null; }
  }
}

function staffXrayTech(st, dt) {
  const world = Game.world;
  // 1. a patient sitting on an X-ray waiting for the machine to be run
  const waiting = Game.patients.find(q => q.state === "station" && q.station &&
    q.station.type === "xray" && q.steps[q.step] &&
    q.steps[q.step].k === "atStation" && q.steps[q.step].station === "xray");
  if (waiting) {
    const m = waiting.station;
    if (m.jammed) { st.workT = 0; }
    if (staffWalk(st, m.x, m.y, dt, true) === "arrived") {
      if (m.jammed) {
        if (staffWork(st, 2.2, dt)) { m.jammed = false; m.flash = 0.4; Sound.play("done"); }
      } else if (staffWork(st, waiting.steps[waiting.step].dur, dt)) {
        advancePatient(waiting);
        st.item = makeItem("film");                       // holds the exposed film
        Sound.play("done");
      }
    }
    return;
  }
  // 2. develop a film they are holding, then leave the image by the machine
  if (st.item && st.item.type === "film") {
    const m = nearestStationOfType(st, "xray");
    if (!m) { st.item = null; return; }
    if (staffWalk(st, m.x, m.y, dt, true) === "arrived" && staffWork(st, 1.5, dt)) {
      const img = makeItem("xrayimg");
      const spot = tileOf(st.x, st.y);
      img.x = spot.x * TILE + TILE / 2; img.y = spot.y * TILE + TILE / 2;
      Game.floorItems.push(img);
      st.item = null;
      popup(img.x, img.y - 26, "X-ray ready", "#a8dcff");
      Sound.play("lab");
    }
    return;
  }
  staffIdle(st, dt);
}

function staffLabTech(st, dt) {
  const sample = Game.floorItems.find(i => i.type === "sample");
  if (st.item && st.item.type === "sample") {
    const lab = nearestStationOfType(st, "lab");
    if (!lab) { st.item = null; return; }
    if (staffWalk(st, lab.x, lab.y, dt, true) === "arrived" && staffWork(st, 2.6, dt)) {
      runLabSample(st.item);
      st.item = null;
      Sound.play("lab");
    }
    return;
  }
  if (sample) {
    const t = tileOf(sample.x, sample.y);
    if (staffWalk(st, t.x, t.y, dt, false) === "arrived") {
      const i = Game.floorItems.indexOf(sample);
      if (i >= 0) {
        Game.floorItems.splice(i, 1);
        delete sample.x; delete sample.y;
        st.item = sample;
        Sound.play("pickup");
      }
    }
    return;
  }
  staffIdle(st, dt);
}

function staffClerk(st, dt) {
  const empty = Game.world.stations.find(q =>
    (q.type === "supply" || q.type === "medicine") && q.stock === 0);
  if (!empty) { st.item = null; staffIdle(st, dt); return; }
  if (st.item && st.item.type === "crate") {
    if (staffWalk(st, empty.x, empty.y, dt, true) === "arrived" && staffWork(st, 1.5, dt)) {
      empty.stock = STATIONS[empty.type].stockMax;
      empty.flash = 0.5;
      st.item = null;
      popup(empty.cx, empty.cy - 26, "Restocked", PALETTE.good);
      Sound.play("done");
    }
    return;
  }
  const door = nearestStationOfType(st, "delivery");
  if (!door) { staffIdle(st, dt); return; }
  if (staffWalk(st, door.x, door.y, dt, true) === "arrived" && staffWork(st, 1.4, dt)) {
    st.item = makeItem("crate");
    Sound.play("pickup");
  }
}

function staffNurse(st, dt) {
  if (st.target && (st.target.state !== "station" || st.target.done ||
      st.target.patience / st.target.patienceMax > 0.92)) {
    st.target = null; st.path = []; st.comfort = 0;
  }
  if (!st.target && st.cooldown <= 0) {
    let best = null, bestFrac = 0.85;
    for (const pt of Game.patients) {
      if (pt.state !== "station" || pt.done) continue;
      const f = pt.patience / pt.patienceMax;
      if (f < bestFrac) { bestFrac = f; best = pt; }
    }
    st.target = best;
  }
  if (!st.target) { staffIdle(st, dt); return; }
  const bed = st.target.station;
  if (!bed) { st.target = null; return; }
  if (staffWalk(st, bed.x, bed.y, dt, true) === "arrived") {
    st.comfort += dt;
    if (st.comfort >= 1.3) {
      const pt = st.target;
      pt.patience = Math.min(pt.patienceMax, pt.patience + pt.patienceMax * 0.18);
      popup(pt.x, pt.y - 30, "+ ♥", "#ff8fa8", false);
      Sound.play("place");
      st.comfort = 0; st.cooldown = 5.0; st.target = null;
    }
  }
}

/** Drift back to where they were posted, so the floor does not fill with
    staff standing in doorways. */
function staffIdle(st, dt) {
  st.workT = 0;
  const here = tileOf(st.x, st.y);
  if (here.x === st.home.x && here.y === st.home.y) { st.moving = false; return; }
  staffWalk(st, st.home.x, st.home.y, dt, false);
}

/** Resolve a blood sample the way the player's lab job does. */
function runLabSample(item) {
  const pt = Game.patients.find(q => q.id === item.pid && q.state !== "gone");
  if (!pt) return false;
  revealMystery(pt);
  return true;
}

function nearestStationOfType(st, type) {
  let best = null, bestD = Infinity;
  for (const q of Game.world.stations) {
    if (q.type !== type) continue;
    const d = Math.hypot(q.cx - st.x, q.cy - st.y);
    if (d < bestD) { bestD = d; best = q; }
  }
  return best;
}


/* ---------------- run lifecycle ---------------- */

function startBuilderRun() {
  Game.builder = {
    wave: 1, credits: 0, offers: [], cursor: 0,
    placing: null, message: null, messageT: 0,
    bought: [], shoes: 0, charm: false, extraLives: 0,
    totalCredits: 0, bestWave: Game.builder ? Game.builder.bestWave || 0 : 0
  };
  Game.staff = [];
  Game.builderWorld = null;
  beginWave(1, true);
}

function beginWave(n, fresh) {
  const def = builderWaveDef(n);
  Game.builder.wave = n;
  Game.levelIndex = -2;                    // neither campaign nor endless
  Game.level = def;
  Game.builderMode = true;
  Game.endless = false;

  const D = DIFFS[Game.difficulty] || DIFFS[1];
  Game.diff = D;
  const shoes = Game.builder.shoes;
  Game.speedMul = 1 + 0.08 * shoes;
  Game.staminaMax = STAMINA_MAX * (1 + 0.4 * Math.min(1, shoes));
  Game.comboWindow = Game.builder.charm ? COMBO_WINDOW + 2.5 : COMBO_WINDOW;
  Game.perfectAt = Game.builder.charm ? 0.60 : PERFECT_AT;

  if (fresh || !Game.builderWorld) {
    Game.builderWorld = makeWorld(def);
    Game.builderWorld.slotTarget = 8;
    Game.livesMax = D.lives + Game.builder.extraLives;
    Game.lives = Game.livesMax;
  } else {
    Game.builderWorld.def = def;           // new wave rules, same room
    Game.builderWorld.mesh = null;
    Game.livesMax = D.lives + Game.builder.extraLives;
    Game.lives = Math.min(Game.lives + 0, Game.livesMax);
  }
  Game.world = Game.builderWorld;

  // The wave that turns restocking on must come with a crate source: a ward
  // with dry shelves and no delivery door is a guaranteed slow loss, which is
  // a design bug rather than a challenge. The door arrives with the rule.
  if (def.restock && !Game.world.stations.some(q => q.type === "delivery")) {
    const e = Game.world.entrance;
    outer:
    for (let r = 2; r < COLS; r++) {
      for (let y = Math.max(1, e.y - r); y <= Math.min(ROWS - 2, e.y + r); y++) {
        for (let x = Math.max(1, e.x - r); x <= Math.min(COLS - 2, e.x + r); x++) {
          if (Math.max(Math.abs(x - e.x), Math.abs(y - e.y)) !== r) continue;
          if (placeStation(Game.world, "delivery", x, y) === null) break outer;
        }
      }
    }
    Game.banner = { text: "SUPPLY DOCK INSTALLED", sub: "shelves now run dry — collect crates here",
                    t: 0, color: "#c8dd97" };
  }

  // shelves start each wave full; whether they can run dry is a wave rule
  for (const st of Game.world.stations) {
    st.occupant = null; st.jammed = false; st.flash = 0;
    if (STATIONS[st.type].stockMax !== undefined) {
      st.stock = def.restock ? STATIONS[st.type].stockMax : Infinity;
    }
    if (st.type === "defibrack") st.hasDefib = true;
  }

  Game.rng = makeRng(def.seed);
  Game.patients = [];
  Game.floorItems = [];
  Game.popups = [];
  Game.particles = [];
  Game.pickups = [];
  Game.time = 0;
  Game.spawnTimer = 3.0;
  Game.scoreShown = Game.score;
  if (fresh) { Game.score = 0; Game.scoreShown = 0; Game.treated = 0; Game.lost = 0; }
  Game.critical = 1;
  Game.byAilment = {};
  Game.combo = 0; Game.comboTimer = 0;
  Game.wave = n;
  Game.waveTimer = WAVE_FIRST;
  Game.burst = 0;
  Game.event = null; Game.eventTimer = EVENT_FIRST;
  Game.eventsSeen = []; Game.spawnMul = 1; Game.workMul = 1; Game.dim = 0;
  Game.forceAilment = 0; Game.forceVip = false;
  Game.pickupTimer = PICKUP_FIRST;
  Game.highFiveCool = 0;
  Game.shake = 0; Game.flashRed = 0; Game.flashGood = 0;
  Game.result = null;
  Game.tutorial = null;
  Game.banner = { text: def.name, sub: def.blurb, t: 0, color: "#6fd3b4" };

  // medics start on the entrance mat
  const e = Game.world.entrance;
  Game.players = [];
  for (let i = 0; i < Game.playerCount; i++) {
    Game.players.push(makePlayer(i, e.x * TILE + TILE / 2 + (i ? 26 : -6),
                                    e.y * TILE + TILE / 2 + 30));
  }
  Game.nurse = null;                        // builder mode uses Game.staff
  Game.screen = "play";
  Sound.play("levelend");
  Music.start();
}

/** Wave over: bank credits and open the shop. */
function endWave() {
  const B = Game.builder;
  // shift change: whoever is still in the ward is handed over off-screen, so
  // the build phase shows your room, not a frozen crowd with stale prompts
  for (const pt of Game.patients) {
    if (pt.station) { pt.station.occupant = null; }
    pt.state = "gone";
  }
  Game.patients = [];
  Game.floorItems = [];
  Game.pickups = [];
  for (const pl of Game.players) { pl.patient = null; pl.item = null; pl.work = null; }
  for (const st of Game.staff) { st.carrying = null; st.item = null; st.target = null; st.path = []; }
  const bonus = 60 + B.wave * 18 + Game.treated * 4;
  B.credits += bonus;
  B.totalCredits += bonus;
  B.bestWave = Math.max(B.bestWave || 0, B.wave);
  B.lastBonus = bonus;
  B.offers = rollOffers();
  for (const o of B.offers) o.bought = false;
  B.cursor = 0;
  B.placing = null;
  B.message = "Wave " + B.wave + " cleared  ·  +" + bonus + " credits";
  B.messageT = 0;
  Game.screen = "build";
  Sound.play("newbest");
}

/** The shop hand: the Treatment Bay is ALWAYS offered — beds are the
    department's fundamental capacity, and a hand without one can strand a
    run — plus three rotating offers biased toward gaps. */
function rollOffers() {
  const B = Game.builder, world = Game.world;
  const have = (t) => world.stations.some(q => q.type === t);
  const staffCount = (r) => Game.staff.filter(q => q.role === r).length;
  const bed = SHOP.find(q => q.key === "bed");
  const pool = [];
  for (const item of SHOP) {
    if (item === bed) continue;                                // staple slot
    if (item.from && B.wave + 1 < item.from) continue;         // not relevant yet
    let weight = 10;
    if (item.kind === "station" && !have(item.station)) weight = 40;
    if (item.kind === "staff") weight = staffCount(item.role) ? 6 : 24;
    if (item.key === "life" && Game.lives >= Game.livesMax) weight = 4;
    if (item.key === "shoes") weight = B.shoes >= 3 ? 0 : 12;
    if (item.key === "charm") weight = B.charm ? 0 : 12;
    for (let i = 0; i < weight; i++) pool.push(item);
  }
  const out = [bed];
  let guard = 0;
  while (out.length < 4 && pool.length && guard++ < 400) {
    const pick = pool[Math.floor(Game.rng() * pool.length)];
    if (!out.includes(pick)) out.push(pick);
  }
  return out;
}

function builderSay(msg) {
  Game.builder.message = msg;
  Game.builder.messageT = 0;
}

/** Spend on an offer. Placeables go into placement mode; passives apply now. */
function buyOffer(idx) {
  const B = Game.builder;
  const item = B.offers[idx];
  if (!item) return;
  if (item.bought) { builderSay("Already bought this one"); Sound.play("error"); return; }
  if (B.credits < item.cost) { builderSay("Not enough credits"); Sound.play("error"); return; }

  if (item.kind === "passive") {
    B.credits -= item.cost;
    item.bought = true;
    if (item.key === "shoes") B.shoes++;
    if (item.key === "charm") B.charm = true;
    if (item.key === "life") { B.extraLives++; Game.livesMax++; Game.lives++; }
    B.bought.push(item.key);
    builderSay(item.name + " added");
    Sound.play("done");
    return;
  }
  if (item.kind === "waitslot") {
    B.credits -= item.cost;
    item.bought = true;
    Game.world.slotTarget = (Game.world.slotTarget || 8) + 2;
    Game.world.waitSlots = computeWaitSlots(Game.world, Game.world.slotTarget);
    B.bought.push(item.key);
    builderSay("Waiting room widened");
    Sound.play("done");
    return;
  }
  // station or staff: pick a tile
  const e = Game.world.entrance;
  B.placing = { item, idx, x: e.x + 3, y: e.y + 3 };
  builderSay("Move with WASD, E to place, Q to cancel");
  Sound.play("menu");
}

function confirmPlacement() {
  const B = Game.builder, pl = B.placing;
  if (!pl) return;
  if (pl.item.kind === "staff") {
    if (!isWalkable(Game.world, pl.x, pl.y)) { builderSay("Staff need open floor"); Sound.play("error"); return; }
    Game.staff.push(makeStaff(pl.item.role, pl.x, pl.y));
  } else {
    const problem = placeStation(Game.world, pl.item.station, pl.x, pl.y);
    if (problem) { builderSay(problem); Sound.play("error"); return; }
  }
  B.credits -= pl.item.cost;
  pl.item.bought = true;
  B.bought.push(pl.item.key);
  builderSay(pl.item.name + " installed");
  Sound.play("done");
  B.placing = null;
}

/* =====================================================================
   10.5  3D ENGINE  (WebGL2, written from scratch — no libraries)

   The simulation is untouched: it still runs on the 32x16 pixel grid.
   Sim (x, y) maps to world (X, Z) at one tile per unit; +Y is up.
   ===================================================================== */

const T2W = 1 / TILE;                 // sim pixels -> world units
const WALL_Y = 1.15;                  // wall height in world units
const LIGHT_DIR = [-0.42, -1.0, -0.38];

/* ---------------- minimal mat4 / vec3 ---------------- */

function m4() { return new Float32Array(16); }
function m4Identity(o) {
  o[0]=1;o[1]=0;o[2]=0;o[3]=0; o[4]=0;o[5]=1;o[6]=0;o[7]=0;
  o[8]=0;o[9]=0;o[10]=1;o[11]=0; o[12]=0;o[13]=0;o[14]=0;o[15]=1; return o;
}
/** out = a * b  (column-major, so `b` is applied first) */
function m4Mul(o, a, b) {
  for (let c = 0; c < 4; c++) {
    const b0 = b[c*4], b1 = b[c*4+1], b2 = b[c*4+2], b3 = b[c*4+3];
    o[c*4]   = a[0]*b0 + a[4]*b1 + a[8]*b2  + a[12]*b3;
    o[c*4+1] = a[1]*b0 + a[5]*b1 + a[9]*b2  + a[13]*b3;
    o[c*4+2] = a[2]*b0 + a[6]*b1 + a[10]*b2 + a[14]*b3;
    o[c*4+3] = a[3]*b0 + a[7]*b1 + a[11]*b2 + a[15]*b3;
  }
  return o;
}
function m4Perspective(o, fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
  o.fill(0);
  o[0] = f / aspect; o[5] = f; o[10] = (far + near) * nf;
  o[11] = -1; o[14] = 2 * far * near * nf;
  return o;
}
function m4Ortho(o, l, r, b, t, n, f) {
  o.fill(0);
  o[0] = 2/(r-l); o[5] = 2/(t-b); o[10] = -2/(f-n); o[15] = 1;
  o[12] = -(r+l)/(r-l); o[13] = -(t+b)/(t-b); o[14] = -(f+n)/(f-n);
  return o;
}
function m4LookAt(o, ex, ey, ez, cx, cy, cz, ux, uy, uz) {
  let zx = ex-cx, zy = ey-cy, zz = ez-cz;
  let l = Math.hypot(zx, zy, zz) || 1; zx/=l; zy/=l; zz/=l;
  let xx = uy*zz - uz*zy, xy = uz*zx - ux*zz, xz = ux*zy - uy*zx;
  l = Math.hypot(xx, xy, xz) || 1; xx/=l; xy/=l; xz/=l;
  const yx = zy*xz - zz*xy, yy = zz*xx - zx*xz, yz = zx*xy - zy*xx;
  o[0]=xx; o[1]=yx; o[2]=zx; o[3]=0;
  o[4]=xy; o[5]=yy; o[6]=zy; o[7]=0;
  o[8]=xz; o[9]=yz; o[10]=zz; o[11]=0;
  o[12]=-(xx*ex+xy*ey+xz*ez);
  o[13]=-(yx*ex+yy*ey+yz*ez);
  o[14]=-(zx*ex+zy*ey+zz*ez);
  o[15]=1;
  return o;
}
/** Translate * RotateY * Scale — all our objects need only this. */
function m4TRS(o, px, py, pz, ry, sx, sy, sz) {
  const c = Math.cos(ry), s = Math.sin(ry);
  o[0]=c*sx;  o[1]=0;    o[2]=-s*sx; o[3]=0;
  o[4]=0;     o[5]=sy;   o[6]=0;     o[7]=0;
  o[8]=s*sz;  o[9]=0;    o[10]=c*sz; o[11]=0;
  o[12]=px;   o[13]=py;  o[14]=pz;   o[15]=1;
  return o;
}
/** Normal matrix for a TRS with only Y rotation + scale: inverse-transpose. */
function m3NormalFromTRS(o, ry, sx, sy, sz) {
  const c = Math.cos(ry), s = Math.sin(ry);
  const ix = 1/(sx||1), iy = 1/(sy||1), iz = 1/(sz||1);
  o[0]=c*ix; o[1]=0;  o[2]=-s*ix;
  o[3]=0;    o[4]=iy; o[5]=0;
  o[6]=s*iz; o[7]=0;  o[8]=c*iz;
  return o;
}

/* ---------------- colour helper ---------------- */

const _colCache = Object.create(null);
function rgb(hex) {
  let v = _colCache[hex];
  if (v) return v;
  const n = parseInt(hex.slice(1), 16);
  v = [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
  _colCache[hex] = v;
  return v;
}

/* ---------------- mesh builder ---------------- */

function MB() { this.p = []; this.n = []; this.c = []; this.i = []; }

MB.prototype.vert = function (x, y, z, nx, ny, nz, col) {
  this.p.push(x, y, z);
  this.n.push(nx, ny, nz);
  this.c.push(col[0], col[1], col[2]);
  return this.p.length / 3 - 1;
};
MB.prototype.tri = function (a, b, c) { this.i.push(a, b, c); };
/** Emit a quad with the winding that makes its normal face `nrm`. */
MB.prototype.quad = function (a, b, c, d, nx, ny, nz) {
  const p = this.p;
  const ux = p[b*3]-p[a*3], uy = p[b*3+1]-p[a*3+1], uz = p[b*3+2]-p[a*3+2];
  const vx = p[d*3]-p[a*3], vy = p[d*3+1]-p[a*3+1], vz = p[d*3+2]-p[a*3+2];
  const cx2 = uy*vz - uz*vy, cy2 = uz*vx - ux*vz, cz2 = ux*vy - uy*vx;
  if (cx2*nx + cy2*ny + cz2*nz >= 0) { this.tri(a,b,c); this.tri(a,c,d); }
  else { this.tri(a,d,c); this.tri(a,c,b); }
};

/** Ellipsoid. segU around Y, segV pole to pole. */
function mbSphere(mb, cx, cy, cz, rx, ry, rz, col, segU, segV) {
  segU = segU || 14; segV = segV || 10;
  const base = mb.p.length / 3;
  for (let j = 0; j <= segV; j++) {
    const v = j / segV * Math.PI, sv = Math.sin(v), cv = Math.cos(v);
    for (let i = 0; i <= segU; i++) {
      const u = i / segU * Math.PI * 2, su = Math.sin(u), cu = Math.cos(u);
      const nx = sv * cu, ny = cv, nz = sv * su;
      // normal of an ellipsoid is the gradient, not the position direction
      let gx = nx / rx, gy = ny / ry, gz = nz / rz;
      const gl2 = Math.hypot(gx, gy, gz) || 1;
      mb.vert(cx + nx*rx, cy + ny*ry, cz + nz*rz, gx/gl2, gy/gl2, gz/gl2, col);
    }
  }
  for (let j = 0; j < segV; j++) {
    for (let i = 0; i < segU; i++) {
      const a = base + j*(segU+1) + i, b = a + 1, c = a + segU + 1, d = c + 1;
      mb.tri(a, c, b); mb.tri(b, c, d);
    }
  }
}

/** Hemisphere (upper half), used for scrub caps. */
function mbDome(mb, cx, cy, cz, rx, ry, rz, col, segU, segV) {
  segU = segU || 14; segV = segV || 6;
  const base = mb.p.length / 3;
  for (let j = 0; j <= segV; j++) {
    const v = j / segV * (Math.PI / 2), sv = Math.cos(v), cv = Math.sin(v);
    for (let i = 0; i <= segU; i++) {
      const u = i / segU * Math.PI * 2, su = Math.sin(u), cu = Math.cos(u);
      const nx = sv * cu, ny = cv, nz = sv * su;
      let gx = nx / rx, gy = ny / ry, gz = nz / rz;
      const gl2 = Math.hypot(gx, gy, gz) || 1;
      mb.vert(cx + nx*rx, cy + ny*ry, cz + nz*rz, gx/gl2, gy/gl2, gz/gl2, col);
    }
  }
  for (let j = 0; j < segV; j++) {
    for (let i = 0; i < segU; i++) {
      const a = base + j*(segU+1) + i, b = a + 1, c = a + segU + 1, d = c + 1;
      mb.tri(a, c, b); mb.tri(b, c, d);
    }
  }
}

/** Cylinder along Y with optional caps. */
function mbCylinder(mb, cx, cy, cz, rTop, rBot, h, col, seg, caps) {
  seg = seg || 16;
  const y0 = cy - h / 2, y1 = cy + h / 2;
  const base = mb.p.length / 3;
  const slope = (rBot - rTop) / h;
  for (let i = 0; i <= seg; i++) {
    const u = i / seg * Math.PI * 2, su = Math.sin(u), cu = Math.cos(u);
    let nx = cu, ny = slope, nz = su;
    const l = Math.hypot(nx, ny, nz) || 1;
    mb.vert(cx + cu*rBot, y0, cz + su*rBot, nx/l, ny/l, nz/l, col);
    mb.vert(cx + cu*rTop, y1, cz + su*rTop, nx/l, ny/l, nz/l, col);
  }
  for (let i = 0; i < seg; i++) {
    const a = base + i*2, b = a + 1, c = a + 2, d = a + 3;
    mb.tri(a, c, b); mb.tri(b, c, d);
  }
  if (caps !== false) {
    const tc = mb.vert(cx, y1, cz, 0, 1, 0, col);
    for (let i = 0; i < seg; i++) {
      const u0 = i/seg*Math.PI*2, u1 = (i+1)/seg*Math.PI*2;
      const p0 = mb.vert(cx + Math.cos(u0)*rTop, y1, cz + Math.sin(u0)*rTop, 0,1,0, col);
      const p1 = mb.vert(cx + Math.cos(u1)*rTop, y1, cz + Math.sin(u1)*rTop, 0,1,0, col);
      mb.tri(tc, p0, p1);
    }
    const bc = mb.vert(cx, y0, cz, 0, -1, 0, col);
    for (let i = 0; i < seg; i++) {
      const u0 = i/seg*Math.PI*2, u1 = (i+1)/seg*Math.PI*2;
      const p0 = mb.vert(cx + Math.cos(u0)*rBot, y0, cz + Math.sin(u0)*rBot, 0,-1,0, col);
      const p1 = mb.vert(cx + Math.cos(u1)*rBot, y0, cz + Math.sin(u1)*rBot, 0,-1,0, col);
      mb.tri(bc, p1, p0);
    }
  }
}

/**
 * Rounded box, assembled from 6 flat faces, 12 quarter-cylinder edges and
 * 8 sphere octants. Seams weld exactly because every part shares the same
 * angular parameterisation.
 */
function mbRoundedBox(mb, cx, cy, cz, hx, hy, hz, r, col, seg) {
  seg = seg || 3;
  r = Math.min(r, hx * 0.999, hy * 0.999, hz * 0.999);
  const ax = hx - r, ay = hy - r, az = hz - r;

  // --- 6 flat faces ---
  const F = [
    [[1,0,0],[0,1,0],[0,0,1], hx, ay, az],
    [[-1,0,0],[0,0,1],[0,1,0], hx, az, ay],
    [[0,1,0],[0,0,1],[1,0,0], hy, az, ax],
    [[0,-1,0],[1,0,0],[0,0,1], hy, ax, az],
    [[0,0,1],[1,0,0],[0,1,0], hz, ax, ay],
    [[0,0,-1],[0,1,0],[1,0,0], hz, ay, ax]
  ];
  for (const [n, u, v, off, hu, hv] of F) {
    const ox = cx + n[0]*off, oy = cy + n[1]*off, oz = cz + n[2]*off;
    const idx = [];
    for (const [su, sv] of [[-1,-1],[1,-1],[1,1],[-1,1]]) {
      idx.push(mb.vert(
        ox + u[0]*hu*su + v[0]*hv*sv,
        oy + u[1]*hu*su + v[1]*hv*sv,
        oz + u[2]*hu*su + v[2]*hv*sv,
        n[0], n[1], n[2], col));
    }
    mb.quad(idx[0], idx[1], idx[2], idx[3], n[0], n[1], n[2]);
  }

  // --- 12 edges (quarter cylinders) ---
  // axis 0=X (arc in YZ), 1=Y (arc in ZX), 2=Z (arc in XY)
  const edges = [
    [0, 'y', 'z'], [1, 'z', 'x'], [2, 'x', 'y']
  ];
  for (const [axis, p1, p2] of edges) {
    const half = axis === 0 ? ax : axis === 1 ? ay : az;
    for (const s1 of [-1, 1]) for (const s2 of [-1, 1]) {
      const ring = [];
      for (let k = 0; k <= seg; k++) {
        const a = k / seg * Math.PI / 2, ca = Math.cos(a), sa = Math.sin(a);
        const n = { x: 0, y: 0, z: 0 };
        n[p1] = s1 * ca; n[p2] = s2 * sa;
        const cOff = { x: 0, y: 0, z: 0 };
        cOff[p1] = s1 * (axis === 0 ? (p1 === 'y' ? ay : az) : axis === 1 ? (p1 === 'z' ? az : ax) : (p1 === 'x' ? ax : ay));
        cOff[p2] = s2 * (axis === 0 ? (p2 === 'z' ? az : ay) : axis === 1 ? (p2 === 'x' ? ax : az) : (p2 === 'y' ? ay : ax));
        const lo = { x: cx, y: cy, z: cz }, hi = { x: cx, y: cy, z: cz };
        const axKey = axis === 0 ? 'x' : axis === 1 ? 'y' : 'z';
        lo[axKey] -= half; hi[axKey] += half;
        const a0 = mb.vert(lo.x + cOff.x + n.x*r, lo.y + cOff.y + n.y*r, lo.z + cOff.z + n.z*r, n.x, n.y, n.z, col);
        const a1 = mb.vert(hi.x + cOff.x + n.x*r, hi.y + cOff.y + n.y*r, hi.z + cOff.z + n.z*r, n.x, n.y, n.z, col);
        ring.push([a0, a1, n]);
      }
      for (let k = 0; k < seg; k++) {
        const [q0, q1, n] = ring[k], [w0, w1] = ring[k + 1];
        mb.quad(q0, q1, w1, w0, n.x, n.y, n.z);
      }
    }
  }

  // --- 8 corners (sphere octants) ---
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1]) {
    const ox = cx + sx*ax, oy = cy + sy*ay, oz = cz + sz*az;
    const grid = [];
    for (let j = 0; j <= seg; j++) {
      const el = j / seg * Math.PI / 2, ce = Math.cos(el), se = Math.sin(el);
      const row = [];
      for (let i = 0; i <= seg; i++) {
        const az2 = i / seg * Math.PI / 2;
        const nx = sx * ce * Math.cos(az2), ny = sy * se, nz = sz * ce * Math.sin(az2);
        row.push(mb.vert(ox + nx*r, oy + ny*r, oz + nz*r, nx, ny, nz, col));
      }
      grid.push(row);
    }
    for (let j = 0; j < seg; j++) {
      for (let i = 0; i < seg; i++) {
        const p = mb.p;
        const a = grid[j][i], b = grid[j][i+1], c = grid[j+1][i], d = grid[j+1][i+1];
        // outward normal at the patch centre decides winding
        const nx = p[a*3] - ox, ny = p[a*3+1] - oy, nz = p[a*3+2] - oz;
        mb.quad(a, b, d, c, nx, ny, nz);
      }
    }
  }
}

/** Flat quad from four explicit corners. */
function mbQuad(mb, pts, col, nx, ny, nz) {
  const idx = pts.map(p => mb.vert(p[0], p[1], p[2], nx, ny, nz, col));
  mb.quad(idx[0], idx[1], idx[2], idx[3], nx, ny, nz);
}

/** Torus in the XY plane (used for spectacles). */
function mbTorus(mb, cx, cy, cz, R, r, col, segU, segV) {
  segU = segU || 16; segV = segV || 8;
  const base = mb.p.length / 3;
  for (let i = 0; i <= segU; i++) {
    const u = i / segU * Math.PI * 2, cu = Math.cos(u), su = Math.sin(u);
    for (let j = 0; j <= segV; j++) {
      const v = j / segV * Math.PI * 2, cv = Math.cos(v), sv = Math.sin(v);
      const nx = cu * cv, ny = su * cv, nz = sv;
      mb.vert(cx + (R + r*cv)*cu, cy + (R + r*cv)*su, cz + r*sv, nx, ny, nz, col);
    }
  }
  for (let i = 0; i < segU; i++) {
    for (let j = 0; j < segV; j++) {
      const a = base + i*(segV+1) + j, b = a + segV + 1, c = a + 1, d = b + 1;
      mb.tri(a, b, c); mb.tri(c, b, d);
    }
  }
}

/* ---------------- GL core ---------------- */

const GL = {
  gl: null, ok: false,
  prog: null, shadowProg: null,
  shadowFB: null, shadowTex: null, SHADOW_RES: 2048,
  view: m4(), proj: m4(), viewProj: m4(), lightVP: m4(),
  _model: m4(), _mvp: m4(), _nrm: new Float32Array(9),
  camEye: [16, 18, 26]
};

function glCompile(gl, type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    throw new Error("shader: " + gl.getShaderInfoLog(sh));
  }
  return sh;
}
function glProgram(gl, vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, glCompile(gl, gl.VERTEX_SHADER, vs));
  gl.attachShader(p, glCompile(gl, gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, "aPos");
  gl.bindAttribLocation(p, 1, "aNrm");
  gl.bindAttribLocation(p, 2, "aCol");
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    throw new Error("link: " + gl.getProgramInfoLog(p));
  }
  // cache uniform locations
  p.u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    p.u[info.name.replace("[0]", "")] = gl.getUniformLocation(p, info.name);
  }
  return p;
}

/** Upload a MB into GPU buffers. */
function glMesh(mb) {
  const gl = GL.gl;
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const mk = (data, loc, size) => {
    const b = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
    return b;
  };
  mk(mb.p, 0, 3); mk(mb.n, 1, 3); mk(mb.c, 2, 3);
  const ib = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
  const big = mb.p.length / 3 > 65535;
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,
    big ? new Uint32Array(mb.i) : new Uint16Array(mb.i), gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  return { vao, count: mb.i.length, type: big ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT };
}

/* ---------------- shaders ---------------- */

const VS_MAIN = `#version 300 es
in vec3 aPos; in vec3 aNrm; in vec3 aCol;
uniform mat4 uMVP, uModel, uLightVP;
uniform mat3 uNrmMat;
out vec3 vNrm; out vec3 vCol; out vec3 vWorld; out vec4 vLight;
void main() {
  vec4 wp = uModel * vec4(aPos, 1.0);
  vWorld = wp.xyz;
  vNrm = normalize(uNrmMat * aNrm);
  vCol = aCol;
  vLight = uLightVP * wp;
  gl_Position = uMVP * vec4(aPos, 1.0);
}`;

const FS_MAIN = `#version 300 es
precision highp float;
precision highp sampler2DShadow;
in vec3 vNrm; in vec3 vCol; in vec3 vWorld; in vec4 vLight;
uniform vec3 uCam;
uniform vec3 uLightDir;      // surface -> light, normalised
uniform vec3 uTint;
uniform float uEmissive;
uniform float uShadowTexel;
uniform float uAmb;          // hemisphere fill strength
uniform float uKey;          // sun strength
uniform float uShadowOn;     // 0 on menu passes: no shadow map is valid there
uniform float uFuzz;         // 1 = brushed fabric (the characters), 0 = hard surface
uniform sampler2DShadow uShadow;
out vec4 frag;

float shadowFactor() {
  if (uShadowOn < 0.5) return 1.0;
  vec3 pc = vLight.xyz / vLight.w;
  pc = pc * 0.5 + 0.5;
  if (pc.z >= 1.0 || pc.x < 0.0 || pc.x > 1.0 || pc.y < 0.0 || pc.y > 1.0) return 1.0;
  float bias = 0.0022;
  float s = 0.0;
  for (int y = -1; y <= 1; y++) {
    for (int x = -1; x <= 1; x++) {
      vec2 off = vec2(float(x), float(y)) * uShadowTexel * 1.25;
      s += texture(uShadow, vec3(pc.xy + off, pc.z - bias));
    }
  }
  return s / 9.0;
}

void main() {
  vec3 albedo = vCol * uTint;
  vec3 N = normalize(vNrm);
  vec3 V = normalize(uCam - vWorld);
  vec3 L = uLightDir;

  float ndl = dot(N, L);
  // Fabric scatters light through its fibres, so the terminator is much softer
  // than on a hard surface. Widening the wrap is most of what separates a
  // plush toy from a painted plastic figurine.
  float wrapAmt = mix(0.32, 0.78, uFuzz);
  float wrapped = clamp((ndl + wrapAmt) / (1.0 + wrapAmt), 0.0, 1.0);
  float sh = shadowFactor();

  vec3 sky = vec3(0.74, 0.82, 0.94);
  vec3 grd = vec3(0.46, 0.40, 0.33);
  vec3 amb = mix(grd, sky, N.y * 0.5 + 0.5) * uAmb;
  vec3 sun = vec3(1.00, 0.96, 0.89) * (wrapped * uKey) * (0.38 + 0.62 * sh);

  vec3 H = normalize(L + V);
  // fleece has no highlight to speak of; a broad sheen stands in for one
  float specPow = mix(46.0, 9.0, uFuzz);
  float specAmt = mix(0.32, 0.045, uFuzz);
  float spec = pow(max(dot(N, H), 0.0), specPow) * specAmt * sh * step(0.02, ndl);

  // Peach fuzz: brushed fibres catch light at grazing angles, so the silhouette
  // lifts in the material's OWN hue instead of the cool environment rim a hard
  // surface gets. This is the velvet look, and it is what sells "soft toy".
  float grazing = pow(1.0 - max(dot(N, V), 0.0), 2.6);
  float rim = grazing * mix(0.20, 0.0, uFuzz);
  vec3 fuzz = albedo * grazing * 0.62 * uFuzz * (0.45 + 0.55 * wrapped);

  vec3 c = albedo * (amb + sun) + vec3(spec) + vec3(0.52, 0.70, 0.95) * rim + fuzz;
  c = mix(c, albedo * 1.15, uEmissive);
  // gentle filmic-ish shoulder so highlights do not clip harshly
  c = c / (c + vec3(0.92)) * 1.62;
  frag = vec4(c, 1.0);
}`;

const VS_SHADOW = `#version 300 es
in vec3 aPos;
uniform mat4 uMVP;
void main() { gl_Position = uMVP * vec4(aPos, 1.0); }`;

const FS_SHADOW = `#version 300 es
precision highp float;
void main() {}`;

/* ---------------- engine bootstrap ---------------- */

const MESH = {};

function initGL(canvas3d) {
  const gl = canvas3d.getContext("webgl2", {
    antialias: true, alpha: false, depth: true, powerPreference: "high-performance"
  });
  if (!gl) return false;
  GL.gl = gl;
  GL.prog = glProgram(gl, VS_MAIN, FS_MAIN);
  GL.shadowProg = glProgram(gl, VS_SHADOW, FS_SHADOW);

  // shadow map: a depth texture sampled with hardware comparison
  GL.shadowTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, GL.shadowTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.DEPTH_COMPONENT24, GL.SHADOW_RES, GL.SHADOW_RES,
                0, gl.DEPTH_COMPONENT, gl.UNSIGNED_INT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_MODE, gl.COMPARE_REF_TO_TEXTURE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_FUNC, gl.LEQUAL);
  GL.shadowFB = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, GL.shadowFB);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, GL.shadowTex, 0);
  gl.drawBuffers([gl.NONE]);
  gl.readBuffer(gl.NONE);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  // unit primitives, all white so uTint can colour them
  const W = [1, 1, 1];
  let mb = new MB(); mbSphere(mb, 0, 0, 0, 1, 1, 1, W, 18, 12); MESH.sphere = glMesh(mb);
  mb = new MB(); mbSphere(mb, 0, 0, 0, 1, 1, 1, W, 10, 7);      MESH.sphereLo = glMesh(mb);
  mb = new MB(); mbDome(mb, 0, 0, 0, 1, 1, 1, W, 18, 8);        MESH.dome = glMesh(mb);
  mb = new MB(); mbRoundedBox(mb, 0, 0, 0, 1, 1, 1, 0.16, W, 3); MESH.box = glMesh(mb);
  mb = new MB(); mbRoundedBox(mb, 0, 0, 0, 1, 1, 1, 0.45, W, 4); MESH.boxSoft = glMesh(mb);
  mb = new MB(); mbCylinder(mb, 0, 0, 0, 1, 1, 1, W, 18, true);  MESH.cyl = glMesh(mb);
  mb = new MB(); mbCylinder(mb, 0, 0, 0, 0.01, 1, 1, W, 16, true); MESH.cone = glMesh(mb);
  mb = new MB(); mbTorus(mb, 0, 0, 0, 1, 0.16, W, 20, 8);        MESH.torus = glMesh(mb);

  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);
  GL.ok = true;
  return true;
}

/* ---------------- draw helpers ---------------- */

let _pass = "main";

/* Material mode for subsequent draws: 1 = brushed fabric, 0 = hard surface.
   Set around character draws so the ward keeps its clean painted look. */
let _fuzz = 0;
function setFuzz(v) { _fuzz = v; }

/* Fine stitching, tags, seams and the embroidered mouth are what sell these as
   sewn toys close up, and are sub-pixel from the ward camera. Drawing them for
   thirteen characters every frame cost 613 draw calls against ~145 before the
   plush rebuild, so they are gated: on for portraits and the title showcase,
   off in gameplay where nobody can see them. */
let _charDetail = false;
function setCharDetail(v) { _charDetail = v; }

function drawMesh(mesh, px, py, pz, ry, sx, sy, sz, color, emissive) {
  const gl = GL.gl;
  m4TRS(GL._model, px, py, pz, ry || 0, sx, sy, sz);
  if (_pass === "shadow") {
    m4Mul(GL._mvp, GL.lightVP, GL._model);
    gl.uniformMatrix4fv(GL.shadowProg.u.uMVP, false, GL._mvp);
  } else {
    m4Mul(GL._mvp, GL.viewProj, GL._model);
    m3NormalFromTRS(GL._nrm, ry || 0, sx, sy, sz);
    const p = GL.prog;
    gl.uniformMatrix4fv(p.u.uMVP, false, GL._mvp);
    gl.uniformMatrix4fv(p.u.uModel, false, GL._model);
    gl.uniformMatrix3fv(p.u.uNrmMat, false, GL._nrm);
    gl.uniform3fv(p.u.uTint, color || [1, 1, 1]);
    gl.uniform1f(p.u.uEmissive, emissive || 0);
    gl.uniform1f(p.u.uFuzz, _fuzz);
  }
  gl.bindVertexArray(mesh.vao);
  gl.drawElements(gl.TRIANGLES, mesh.count, mesh.type, 0);
}

/* ---------------- level geometry ---------------- */

/** Merge the wall grid into maximal rectangles so the ward is a handful of
    solid blocks instead of hundreds of tiles. */
function greedyRects(test) {
  const used = new Uint8Array(COLS * ROWS);
  const out = [];
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (used[y * COLS + x] || !test(x, y)) continue;
      let w = 1;
      while (x + w < COLS && test(x + w, y) && !used[y * COLS + x + w]) w++;
      let h = 1;
      grow: while (y + h < ROWS) {
        for (let i = 0; i < w; i++) {
          if (!test(x + i, y + h) || used[(y + h) * COLS + x + i]) break grow;
        }
        h++;
      }
      for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) used[(y + j) * COLS + x + i] = 1;
      out.push({ x, y, w, h });
    }
  }
  return out;
}

const MAT = {
  floor:    "#f5ecdb",
  floorAlt: "#efe4cf",
  wall:     "#a9e0d4",
  wallTop:  "#c2ebe1",
  base:     "#7cc4b4",
  bedFrame: "#fbfdff",
  bedSheet: "#eef5fc",
  metal:    "#c9d4de",
  accent:   "#ef5d6b"
};

/* Every ward used one shared palette, so all ten looked like the same room.
   A level's `theme` overrides these and picks which props furnish it. TH is
   the resolved palette for the ward currently being baked. */
let TH = MAT;

/** Build the whole static level: floor, walls, decor, station bodies. */
function buildLevelMesh(world) {
  const mb = new MB();
  const rng = makeRng((world.def.seed ^ 0x51ed) >>> 0);
  TH = Object.assign({}, MAT, world.def.theme || {});
  const isWall = (x, y) => { const c = cellAt(world, x, y); return !c || (c.solid && !c.station); };

  /* ---- floor: subdivided so baked light pools have somewhere to live ---- */
  const SUB = 2, gw = COLS * SUB, gh = ROWS * SUB, step = 1 / SUB;
  const lights = [];
  for (let ly = 2; ly < ROWS; ly += 5) {
    for (let lx = 3; lx < COLS; lx += 6) {
      if (isWalkable(world, lx, ly)) lights.push([lx + 0.5, ly + 0.5]);
    }
  }
  const fc = rgb(TH.floor), fa = rgb(TH.floorAlt);
  const shadeAt = (wx, wz) => {
    let lit = 0;
    for (const [lx, lz] of lights) {
      const d = Math.hypot(wx - lx, wz - lz);
      lit += Math.max(0, 1 - d / 3.6);
    }
    lit = Math.min(0.13, lit * 0.11);
    const t = ((Math.floor(wx) + Math.floor(wz)) & 1) ? 0 : 1;
    const b = t ? fa : fc;
    const n = (rng() - 0.5) * 0.03;
    return [
      clamp(b[0] * (1 + lit) + n, 0, 1),
      clamp(b[1] * (1 + lit) + n, 0, 1),
      clamp(b[2] * (1 + lit * 0.92) + n, 0, 1)
    ];
  };
  for (let j = 0; j < gh; j++) {
    for (let i = 0; i < gw; i++) {
      const x0 = i * step, z0 = j * step, x1 = x0 + step, z1 = z0 + step;
      const c = shadeAt(x0 + step / 2, z0 + step / 2);
      mbQuad(mb, [[x0,0,z0],[x1,0,z0],[x1,0,z1],[x0,0,z1]], c, 0, 1, 0);
    }
  }

  /* ---- wayfinding stripe, painted just above the floor ---- */
  const way = findPath(world, world.entrance, world.exit);
  if (way.length) {
    const stripe = rgb("#ffb3c4");
    let px = world.entrance.x + 0.5, pz = world.entrance.y + 0.5;
    for (const w of way) {
      const nx = w.x * T2W, nz = w.y * T2W;
      const dx = nx - px, dz = nz - pz, len = Math.hypot(dx, dz) || 1;
      const ox = -dz / len * 0.07, oz = dx / len * 0.07;
      mbQuad(mb, [[px+ox,0.012,pz+oz],[nx+ox,0.012,nz+oz],[nx-ox,0.012,nz-oz],[px-ox,0.012,pz-oz]],
             stripe, 0, 1, 0);
      px = nx; pz = nz;
    }
  }

  /* ---- entrance / exit mats ---- */
  const mat = (tile, col) => {
    mbRoundedBox(mb, tile.x + 0.5, 0.018, tile.y + 0.5, 0.44, 0.018, 0.44, 0.14, rgb(col), 2);
  };
  mat(world.entrance, "#63bde8");
  mat(world.exit, "#6ad39a");

  /* ---- walls as merged blocks ---- */
  const wallCol = rgb(TH.wall), topCol = rgb(TH.wallTop), baseCol = rgb(TH.base);
  const rects = greedyRects(isWall);
  for (const r of rects) {
    const cx = r.x + r.w / 2, cz = r.y + r.h / 2;
    const hx = r.w / 2, hz = r.h / 2;
    mbRoundedBox(mb, cx, WALL_Y / 2, cz, hx, WALL_Y / 2, hz, 0.14, wallCol, 3);
    // a lighter cap inlay so the tops read as a finished surface
    mbRoundedBox(mb, cx, WALL_Y + 0.005, cz, hx - 0.10, 0.02, hz - 0.10, 0.06, topCol, 2);
    // skirting board around the base
    mbRoundedBox(mb, cx, 0.055, cz, hx + 0.015, 0.055, hz + 0.015, 0.03, baseCol, 2);
  }
  world.wallRects = rects;

  /* ---- wall decor + floor furniture ---- */
  buildDecor(mb, world, rng, isWall);
  buildProps(mb, world, rng, isWall);

  /* ---- station bodies (dynamic bits are drawn per frame) ---- */
  for (const st of world.stations) {
    const cx = st.x + 0.5, cz = st.y + 0.5;
    if (st.type === "bed") {
      mbRoundedBox(mb, cx, 0.10, cz, 0.30, 0.10, 0.42, 0.05, rgb(TH.metal), 2);   // chassis
      mbRoundedBox(mb, cx, 0.24, cz, 0.40, 0.09, 0.46, 0.07, rgb(TH.bedFrame), 3); // mattress
      mbRoundedBox(mb, cx, 0.38, cz - 0.28, 0.30, 0.06, 0.13, 0.05, rgb("#ffffff"), 3); // pillow
      mbRoundedBox(mb, cx, 0.30, cz + 0.47, 0.34, 0.16, 0.03, 0.03, rgb(TH.metal), 2); // footboard
    } else {
      const info = STATIONS[st.type];
      const body = rgb(info.color), edge = rgb(info.edge);
      const h = st.type === "delivery" ? 0.92 : 0.72;
      mbRoundedBox(mb, cx, h / 2, cz, 0.42, h / 2, 0.42, 0.10, body, 3);
      mbRoundedBox(mb, cx, h + 0.02, cz, 0.36, 0.03, 0.36, 0.03, edge, 2);   // top trim
      buildStationDetail(mb, st, cx, cz, h);
    }
  }
  return glMesh(mb);
}

/** Per-machine silhouette details so each station is identifiable in 3D. */
function buildStationDetail(mb, st, cx, cz, h) {
  const white = rgb("#ffffff"), dark = rgb("#3c4657");
  switch (st.type) {
    case "supply":
      for (let i = 0; i < 3; i++) {
        mbRoundedBox(mb, cx, 0.20 + i * 0.20, cz + 0.40, 0.30, 0.045, 0.05, 0.02, white, 2);
      }
      break;
    case "medicine":
      mbRoundedBox(mb, cx, h * 0.62, cz + 0.42, 0.07, 0.20, 0.03, 0.02, white, 2);
      mbRoundedBox(mb, cx, h * 0.62, cz + 0.42, 0.20, 0.07, 0.03, 0.02, white, 2);
      break;
    case "xray":
      mbCylinder(mb, cx, h + 0.30, cz, 0.05, 0.05, 0.55, rgb(TH.metal), 10, true);
      mbRoundedBox(mb, cx, h + 0.58, cz, 0.26, 0.10, 0.20, 0.06, dark, 3);
      mbSphere(mb, cx, h + 0.50, cz + 0.10, 0.09, 0.09, 0.09, rgb("#cfeeff"), 12, 8);
      break;
    case "cast":
      mbCylinder(mb, cx, h + 0.10, cz, 0.22, 0.26, 0.20, rgb("#fdf6e6"), 16, true);
      break;
    case "charger":
      mbRoundedBox(mb, cx, h + 0.16, cz, 0.10, 0.16, 0.05, 0.03, rgb("#fff3c4"), 2);
      break;
    case "lab":
      mbCylinder(mb, cx - 0.12, h + 0.14, cz, 0.06, 0.11, 0.28, rgb("#efe6ff"), 14, true);
      mbCylinder(mb, cx + 0.12, h + 0.10, cz + 0.06, 0.05, 0.09, 0.20, rgb("#dcc6ff"), 14, true);
      break;
    case "delivery":
      mbRoundedBox(mb, cx, h * 0.55, cz + 0.42, 0.34, 0.30, 0.03, 0.03, rgb("#f7e7d2"), 2);
      break;
    case "defibrack":
      mbRoundedBox(mb, cx, h + 0.10, cz, 0.30, 0.10, 0.30, 0.05, rgb("#ffd9d1"), 2);
      break;
  }
}

/** Plants, posters, windows and a clock, placed deterministically. */
function buildDecor(mb, world, rng, isWall) {
  const spots = [];
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++)
      if (isWall(x, y)) spots.push({ x, y, boundary: y === 0 || y === ROWS - 1 || x === 0 || x === COLS - 1 });

  let gap = 0;
  for (const sp of spots) {
    gap++;
    const cx = sp.x + 0.5, cz = sp.y + 0.5;
    const roll = rng();
    const southOpen = isWalkable(world, sp.x, sp.y + 1);

    if (sp.boundary && southOpen && sp.x % 5 === 2) {
      // window punched into the wall face
      mbQuad(mb, [[cx-0.30, 0.34, cz+0.501],[cx+0.30, 0.34, cz+0.501],
                  [cx+0.30, 0.94, cz+0.501],[cx-0.30, 0.94, cz+0.501]],
             rgb("#bfe6f7"), 0, 0, 1);
      mbRoundedBox(mb, cx, 0.64, cz + 0.505, 0.34, 0.34, 0.015, 0.05, rgb("#eaf6fb"), 2);
      mbQuad(mb, [[cx-0.27, 0.37, cz+0.515],[cx+0.27, 0.37, cz+0.515],
                  [cx+0.27, 0.91, cz+0.515],[cx-0.27, 0.91, cz+0.515]],
             rgb("#a9dcf2"), 0, 0, 1);
      continue;
    }
    if (gap < 3) continue;
    if (roll < 0.14) {                       // potted plant on top of the wall
      mbCylinder(mb, cx, WALL_Y + 0.10, cz, 0.15, 0.11, 0.20, rgb("#e08a5f"), 12, true);
      mbSphere(mb, cx, WALL_Y + 0.30, cz, 0.20, 0.17, 0.20, rgb("#79c98a"), 12, 8);
      mbSphere(mb, cx - 0.10, WALL_Y + 0.24, cz + 0.06, 0.12, 0.10, 0.12, rgb("#93d99f"), 10, 7);
      gap = 0;
    } else if (roll < 0.24 && southOpen) {   // poster on the wall face
      mbQuad(mb, [[cx-0.22, 0.42, cz+0.502],[cx+0.22, 0.42, cz+0.502],
                  [cx+0.22, 0.92, cz+0.502],[cx-0.22, 0.92, cz+0.502]],
             rgb("#fffdf6"), 0, 0, 1);
      mbQuad(mb, [[cx-0.15, 0.54, cz+0.508],[cx+0.15, 0.54, cz+0.508],
                  [cx+0.15, 0.80, cz+0.508],[cx-0.15, 0.80, cz+0.508]],
             rgb(roll < 0.19 ? "#ef5d6b" : "#7db2f2"), 0, 0, 1);
      gap = 0;
    } else if (roll < 0.28 && southOpen) {   // wall clock
      mbCylinder(mb, cx, 0.80, cz + 0.50, 0.16, 0.16, 0.05, rgb("#ffffff"), 16, true);
      gap = 0;
    }
  }

  // red cross sign over the entrance
  const e = world.entrance;
  if (isWall(e.x, e.y - 1)) {
    const cx = e.x + 0.5, cz = e.y - 0.5;
    mbRoundedBox(mb, cx, WALL_Y + 0.22, cz, 0.26, 0.26, 0.06, 0.05, rgb("#ffffff"), 2);
    mbRoundedBox(mb, cx, WALL_Y + 0.22, cz - 0.07, 0.07, 0.19, 0.03, 0.02, rgb("#ef5d6b"), 2);
    mbRoundedBox(mb, cx, WALL_Y + 0.22, cz - 0.07, 0.19, 0.07, 0.03, 0.02, rgb("#ef5d6b"), 2);
  }
}


/* ---------------------------------------------------------------------
   Floor props.

   The wards were mostly bare floor. These furnish them. Every prop is
   VISUAL ONLY — nothing here touches world.grid, so pathfinding, collision
   and reachability are provably unchanged by decoration. Placement still
   avoids station approaches, wait slots and the entrance->exit route so
   furniture never appears to grow out of a machine you are using.
   --------------------------------------------------------------------- */

/** Which way should a wall-hugging prop face? Away from the wall behind it. */
function propFacing(world, isWall, x, y) {
  if (isWall(x, y - 1)) return 0;               // wall to the north -> face south
  if (isWall(x, y + 1)) return Math.PI;
  if (isWall(x - 1, y)) return Math.PI / 2;
  if (isWall(x + 1, y)) return -Math.PI / 2;
  return null;
}

/** Rotate a local offset into world space around a prop's centre. */
function _po(cx, cz, ry, lx, lz) {
  const c = Math.cos(ry), sn = Math.sin(ry);
  return [cx + lx * c + lz * sn, cz - lx * sn + lz * c];
}

const PROPS = {
  bench(mb, cx, cz, ry, col) {
    const seat = rgb(col.wood || "#c99a63"), leg = rgb(TH.metal);
    let q = _po(cx, cz, ry, 0, -0.06);
    mbRoundedBox(mb, q[0], 0.30, q[1], 0.42, 0.045, 0.16, 0.04, seat, 2);
    q = _po(cx, cz, ry, 0, -0.22);
    mbRoundedBox(mb, q[0], 0.47, q[1], 0.42, 0.17, 0.045, 0.04, seat, 2);
    for (const lx of [-0.33, 0.33]) {
      q = _po(cx, cz, ry, lx, -0.06);
      mbRoundedBox(mb, q[0], 0.14, q[1], 0.035, 0.14, 0.035, 0.02, leg, 2);
    }
  },
  chair(mb, cx, cz, ry, col) {
    const seat = rgb(col.accent || "#7db2f2"), leg = rgb(TH.metal);
    let q = _po(cx, cz, ry, 0, 0);
    mbRoundedBox(mb, q[0], 0.28, q[1], 0.17, 0.04, 0.17, 0.04, seat, 2);
    q = _po(cx, cz, ry, 0, -0.15);
    mbRoundedBox(mb, q[0], 0.45, q[1], 0.17, 0.15, 0.04, 0.04, seat, 2);
    for (const [lx, lz] of [[-0.12,-0.12],[0.12,-0.12],[-0.12,0.12],[0.12,0.12]]) {
      q = _po(cx, cz, ry, lx, lz);
      mbRoundedBox(mb, q[0], 0.13, q[1], 0.025, 0.13, 0.025, 0.015, leg, 2);
    }
  },
  plant(mb, cx, cz, ry, col) {
    mbCylinder(mb, cx, 0.13, cz, 0.16, 0.20, 0.26, rgb(col.pot || "#d98a5f"), 12, true);
    mbSphere(mb, cx, 0.42, cz, 0.24, 0.22, 0.24, rgb(col.leaf || "#5fb872"), 12, 8);
    mbSphere(mb, cx - 0.13, 0.34, cz + 0.09, 0.15, 0.13, 0.15, rgb(col.leaf2 || "#7fcf8c"), 10, 7);
    mbSphere(mb, cx + 0.12, 0.36, cz - 0.08, 0.13, 0.12, 0.13, rgb(col.leaf2 || "#7fcf8c"), 10, 7);
  },
  ivpole(mb, cx, cz) {
    mbCylinder(mb, cx, 0.03, cz, 0.16, 0.16, 0.05, rgb(TH.metal), 10, true);
    mbCylinder(mb, cx, 0.55, cz, 0.022, 0.022, 1.05, rgb("#dbe4ec"), 8, true);
    mbRoundedBox(mb, cx + 0.10, 0.92, cz, 0.075, 0.11, 0.045, 0.035, rgb("#cfe9f7"), 2);
    mbCylinder(mb, cx, 1.06, cz, 0.05, 0.05, 0.03, rgb(TH.metal), 8, true);
  },
  trolley(mb, cx, cz, ry, col) {
    const body = rgb(col.accent || "#8fd0f0"), m = rgb(TH.metal);
    mbRoundedBox(mb, cx, 0.52, cz, 0.30, 0.035, 0.22, 0.03, body, 2);
    mbRoundedBox(mb, cx, 0.30, cz, 0.28, 0.030, 0.20, 0.03, rgb("#e8eef4"), 2);
    for (const [lx, lz] of [[-0.24,-0.16],[0.24,-0.16],[-0.24,0.16],[0.24,0.16]]) {
      const q = _po(cx, cz, ry, lx, lz);
      mbCylinder(mb, q[0], 0.06, q[1], 0.05, 0.05, 0.05, rgb("#5d6b7a"), 8, true);
      mbRoundedBox(mb, q[0], 0.28, q[1], 0.022, 0.22, 0.022, 0.015, m, 2);
    }
    mbRoundedBox(mb, cx, 0.62, cz - 0.16, 0.13, 0.075, 0.09, 0.03, rgb("#f7fbff"), 2);
  },
  cooler(mb, cx, cz, ry, col) {
    mbRoundedBox(mb, cx, 0.30, cz, 0.17, 0.30, 0.17, 0.05, rgb("#eef4f9"), 3);
    mbCylinder(mb, cx, 0.78, cz, 0.15, 0.17, 0.40, rgb("#a9dcf2"), 12, true);
    mbRoundedBox(mb, cx, 0.42, cz + 0.17, 0.05, 0.04, 0.05, 0.02, rgb(col.accent || "#5cb8e6"), 2);

  locker(mb, cx, cz, ry, col) {

    mbRoundedBox(mb, cx, 0.62, cz, 0.36, 0.62, 0.24, 0.05, body, 3);
    for (const lx of [-0.17, 0.17]) {
      const q = _po(cx, cz, ry, lx, 0.245);
      mbRoundedBox(mb, q[0], 0.62, q[1], 0.15, 0.56, 0.015, 0.03, rgb("#e6eef5"), 2);
      const h = _po(cx, cz, ry, lx + 0.10, 0.27);

  },
  vending(mb, cx, cz, ry, col) {
    mbRoundedBox(mb, cx, 0.66, cz, 0.34, 0.66, 0.24, 0.06, rgb(col.accent || "#e2645f"), 3);
    let q = _po(cx, cz, ry, -0.04, 0.245);
    mbRoundedBox(mb, q[0], 0.78, q[1], 0.22, 0.42, 0.015, 0.03, rgb("#2d3a48"), 2);
    for (let r2 = 0; r2 < 3; r2++)
      for (let c2 = 0; c2 < 3; c2++) {
        const g2 = _po(cx, cz, ry, -0.16 + c2 * 0.12, 0.262);
        mbRoundedBox(mb, g2[0], 0.60 + r2 * 0.14, g2[1], 0.038, 0.045, 0.008, 0.01,
                     rgb(["#ffd54a", "#8be9ff", "#ff9ec2"][(r2 + c2) % 3]), 1);
      }
    q = _po(cx, cz, ry, 0.22, 0.25);
    mbRoundedBox(mb, q[0], 0.42, q[1], 0.07, 0.16, 0.012, 0.02, rgb("#1e2833"), 2);
  },
  crates(mb, cx, cz, ry, col) {
    const c1 = rgb(col.crate || "#d9b483"), c2 = rgb(col.crate2 || "#c79f6c");
    mbRoundedBox(mb, cx - 0.10, 0.17, cz, 0.20, 0.17, 0.20, 0.03, c1, 2);
    mbRoundedBox(mb, cx + 0.16, 0.13, cz + 0.08, 0.16, 0.13, 0.16, 0.03, c2, 2);

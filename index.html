  const q = [{ x: origin.x, y: origin.y }];
  seen.add(origin.x + "," + origin.y);
  while (q.length && out.length < count + 2) {
    const cur = q.shift();
    if (isWalkable(world, cur.x, cur.y)) out.push(cur);
    for (const [dx, dy] of [[1, 0], [0, 1], [-1, 0], [0, -1]]) {
      const nx = cur.x + dx, ny = cur.y + dy, k = nx + "," + ny;
      if (!seen.has(k) && isWalkable(world, nx, ny)) { seen.add(k); q.push({ x: nx, y: ny }); }
    }
  }
  return out;
}

/* ---------------------------------------------------------------------
   9. INTERACTION
   --------------------------------------------------------------------- */

/** Find the station the player is facing (searching the 8 neighbouring tiles). */
function facingStation(world, p, filter) {
  const tp = tileOf(p.x, p.y);
  let best = null, bestScore = -1;
  for (let oy = -1; oy <= 1; oy++) {
    for (let ox = -1; ox <= 1; ox++) {
      const c = cellAt(world, tp.x + ox, tp.y + oy);
      if (!c || !c.station) continue;
      const st = c.station;
      if (filter && !filter(st)) continue;
      const vx = st.cx - p.x, vy = st.cy - p.y;
      const d = Math.hypot(vx, vy);
      if (d > REACH) continue;
      const dot = (vx / d) * p.dx + (vy / d) * p.dy;
      if (dot < FACE_DOT) continue;
      const score = dot * 2 - d / REACH;
      if (score > bestScore) { bestScore = score; best = st; }
    }
  }
  return best;
}

/** Find a loose patient (waiting or walking) the player is facing. */
function facingPatient(p) {
  let best = null, bestScore = -1;
  for (const pt of Game.patients) {
    if (pt.state !== "waiting" && pt.state !== "walking") continue;
    const vx = pt.x - p.x, vy = pt.y - p.y;
    const d = Math.hypot(vx, vy);
    if (d > 46) continue;
    // Inside your own body radius, "which way am I facing" is meaningless: a
    // sub-pixel offset flips the dot product and the patient becomes
    // impossible to pick up while you stand on top of them. The old guard was
    // d < 1, which is so tight it almost never fired — a medic standing 1px
    // from a patient facing the wrong way could be stuck indefinitely.
    const dot = d < PLAYER_R ? 1 : (vx / d) * p.dx + (vy / d) * p.dy;
    if (dot < 0) continue;
    const score = dot * 2 - d / 46;
    if (score > bestScore) { bestScore = score; best = pt; }
  }
  return best;
}

/** Find a loose item on the floor the player is facing. */
function facingFloorItem(p) {
  let best = null, bestD = 44;
  for (const it of Game.floorItems) {
    const d = Math.hypot(it.x - p.x, it.y - p.y);
    if (d < bestD) { bestD = d; best = it; }
  }
  return best;
}

let SILENT_HINTS = false;
function hint(p, msg) { if (SILENT_HINTS) return; p.hint = msg; p.hintT = 1.6; }


/* ---------------------------------------------------------------------
   Two-person lifts.

   Nothing in this game previously REQUIRED two players — both nurses could
   run the whole loop independently, which is why co-op felt like two people
   playing solo next to each other. Overcooked and Moving Out both lean on
   things one player physically cannot do. A critical patient is a stretcher
   case: one medic can get a hand under them, but they will not move until the
   second medic takes the other end. Solo play still works because criticals
   only appear from the third ward on and can be stabilised in the bed they
   arrive next to — but in co-op it forces a genuine "come here, now" moment.
   --------------------------------------------------------------------- */

/** Does this patient need two pairs of hands? Only flagged two-nurse cases —
    gating every critical would make forced coordination a constant tax rather
    than the "get over here NOW" moment it is supposed to be. */
function needsTwoLift(pt) {
  return !!(pt && pt.stretcher && !pt.done && Game.playerCount > 1);
}

/** The other medic, if they are close enough and free to help lift. */
function liftPartnerFor(p, pt) {
  for (const q of Game.players) {
    if (q === p || q.patient || q.item) continue;
    if (Math.hypot(q.x - pt.x, q.y - pt.y) <= 62) return q;
  }
  return null;
}

/** E / "/" — pick up, put down, place animals. */
function doInteract(p) {
  const world = Game.world;
  p.squash = 0.18;

  // Carrying a patient: place them on a bed / X-ray, or set them down.
  if (p.patient) {
    const target = facingStation(world, p, st => STATIONS[st.type].holdsPatient &&
                                                !st.occupant && !st.dirty);
    if (target) {
      if (target.type === "basket") p.patient.lastBed = target;
      p.patient.state = "station";
      p.patient.station = target;
      p.patient.x = target.cx; p.patient.y = target.cy - 6;
      target.occupant = p.patient;
      target.flash = 0.3;
      p.patient = null;
      Sound.play("place");
      return;
    }
    // Otherwise set them down on the floor in front (or under) the player.
    const spot = freeSpotInFront(world, p);
    if (spot) {
      const pt = p.patient;
      pt.state = "waiting"; pt.x = spot.x; pt.y = spot.y; pt.path = [];
      pt.slot = null; pt.station = null;
      p.patient = null;
      Sound.play("drop");
    } else {
      hint(p, "No room to set them down");
    }
    return;
  }

  // Carrying an item: drop it (or hand it to a shelf-free floor tile).
  if (p.item) {
    const spot = freeSpotInFront(world, p);
    if (spot) {
      const it = p.item;
      it.x = spot.x; it.y = spot.y;
      Game.floorItems.push(it);
      p.item = null;
      Sound.play("drop");
    } else {
      hint(p, "Nowhere to put that");
    }
    return;
  }

  // Empty-handed: pick something up. Priority: patient in front, patient on a
  // bed/X-ray we face, the defib rack, then a floor item.
  const loose = facingPatient(p);
  if (loose) {
    if (needsTwoLift(loose) && !liftPartnerFor(p, loose)) {
      hint(p, "Too heavy — needs both nurses");
      loose.flash = 0.4;
      Sound.play("error");
      return;
    }
    loose.state = "carried"; loose.path = []; loose.slot = null;
    p.patient = loose;
    if (needsTwoLift(loose)) {
      Game.score += 30;
      popup(loose.x, loose.y - 60, "TEAM LIFT  +30", "#ffd54a", true);
      Sound.play("teamlift");
      Game.teamLifts = (Game.teamLifts || 0) + 1;
      Sound.play("clutch");
      checkLiveAchievements();
    } else Sound.play("pickup");
    return;
  }

  // lifting a critical patient back off a bed or machine takes two as well
  const occupied2 = facingStation(world, p, st => st.occupant);
  if (occupied2 && needsTwoLift(occupied2.occupant) &&
      !liftPartnerFor(p, occupied2.occupant)) {
    hint(p, "Too heavy — needs both nurses");
    Sound.play("error");
    return;
  }

  const occupied = facingStation(world, p, st => st.occupant);
  if (occupied) {
    const pt = occupied.occupant;
    occupied.occupant = null;
    pt.state = "carried"; pt.station = null;
    p.patient = pt;
    Sound.play("pickup");
    return;
  }

  const rack = facingStation(world, p, st => st.type === "wanddock" && st.hasDefib);
  if (rack) {
    rack.hasDefib = false;
    p.item = makeItem("wand");
    Sound.play("pickup");
    return;
  }

  const fitem = facingFloorItem(p);
  if (fitem) {
    Game.floorItems.splice(Game.floorItems.indexOf(fitem), 1);
    delete fitem.x; delete fitem.y;
    p.item = fitem;
    Sound.play("pickup");
    return;
  }

  hint(p, "Nothing here");
}

function freeSpotInFront(world, p) {
  const candidates = [
    { x: p.x + p.dx * 34, y: p.y + p.dy * 34 },
    { x: p.x, y: p.y }
  ];
  for (const c of candidates) {
    const t = tileOf(c.x, c.y);
    if (isWalkable(world, t.x, t.y)) return { x: t.x * TILE + TILE / 2, y: t.y * TILE + TILE / 2 };
  }
  return null;
}

/** What would E do right now? Side-effect-free mirror of doInteract, used
    only for the on-screen button prompt. */
function previewInteract(p) {
  const world = Game.world;
  {
    const lp = facingPatient(p);
    if (lp && !p.patient && !p.item && needsTwoLift(lp) && !liftPartnerFor(p, lp))
      return "Needs both nurses";
  }
  if (p.patient) {
    if (facingStation(world, p, st => STATIONS[st.type].holdsPatient && !st.occupant && !st.dirty))
      return p.patient.done ? null : "Put them down";
    return p.patient.done ? null : "Set down";
  }
  if (p.item) {
    const bedded = facingStation(world, p, st => st.occupant && st.type === "basket");
    if (bedded) return null;                      // Q is the star here, keep E quiet
    return "Drop " + ITEMS[p.item.type].name.toLowerCase();
  }
  if (facingPatient(p)) return "Pick up animal";
  if (facingStation(world, p, st => st.occupant)) return "Pick up animal";
  if (facingStation(world, p, st => st.type === "wanddock" && st.hasDefib)) return "Take the wand";
  const fi = facingFloorItem(p);
  if (fi) return "Pick up " + ITEMS[fi.type].name.toLowerCase();
  return null;
}

/* --- The "use" key: start or continue a hold-to-work action -------------- */

/** What (if anything) can this player work on right now? Returns a job
    descriptor: {key, dur, run} where run() applies the effect. */
/** findJob, plus the brownout penalty of whichever station the job belongs to.
    This wraps rather than tagging each return site: the station branch has half
    a dozen exits and a missed one would silently ignore the brownout. */
function findJob(p) {
  const job = findJobRaw(p);
  if (!job) return null;
  const st = facingStation(Game.world, p, () => true);
  if (st) job.zoneMul = zonePenalty(st);
  return job;
}

function findJobRaw(p) {
  const world = Game.world;
  if (p.patient) return null;   // hands full of patient

  // 1. Basketside work on the patient we are facing.
  const bedStation = facingStation(world, p, st => st.occupant && st.type === "basket");
  if (bedStation) {
    const pt = bedStation.occupant;
    const step = pt.steps[pt.step];
    if (step && step.k === "bedside") {
      const holdsRight = step.need ? (p.item && p.item.type === step.need) : !p.item;
      if (holdsRight) {
        return {
          key: "basket" + bedStation.x + "," + bedStation.y + ":" + pt.id + ":" + pt.step,
          dur: step.dur,
          label: step.label,
          ptId: pt.id,
          run: () => {
            if (step.need) {
              if (step.need === "wand_charged") {
                p.item = makeItem("wand");         // discharged, still in hand
                Sound.play("shock");
                Game.shake = Math.max(Game.shake, 7);
                burst(pt.x, pt.y, "#ffe066", 16);
              } else {
                p.item = null;
              }
            }
            if (step.produce) p.item = makeItem(step.produce, { pid: pt.id });
            advancePatient(pt);
          }
        };
      }
      if (step.need) hint(p, "Needs " + ITEMS[step.need].name);
    } else if (step && step.k === "lab") {
      hint(p, "Lab is still working");
    } else if (step && step.k === "atStation") {
      hint(p, "Take them to the " + STATIONS[step.station].name);
    }
  }

  // 2. The breaker panel, which has no recipe — it just buys the lights back.
  const brk = facingStation(world, p, s => s.type === "fusebox");
  if (brk) {
    const dark = (world.zones || []).some(z => !z.powered);
    if (!dark) hint(p, "Power is fine");
    else if (p.item) hint(p, "Free your hands to reset the breaker");
    else return {
      key: "fusebox" + brk.x + "," + brk.y,
      dur: 1.6,
      label: "Flip the fuse box",
      run: () => {
        if (restorePower()) {
          brk.flash = 0.5;
          popup(brk.cx, brk.cy - 24, "Power back  +" + BREAKER_BONUS, "#ffd54a");
        }
      }
    };
  }

  // 3. Station work.
  const st = facingStation(world, p, s => RECIPES[s.type] && RECIPES[s.type].length);
  if (!st) return null;

  if (st.jammed) {
    if (p.item) { hint(p, "Free your hands to fix it"); return null; }
    return {
      key: "fix" + st.x + "," + st.y,
      dur: 2.2,
      label: "Repair " + STATIONS[st.type].name,
      run: () => {
        st.jammed = false; st.flash = 0.4;
        popup(st.cx, st.cy - 24, "Fixed!", PALETTE.good);
        Sound.play("done");
      }
    };
  }

  for (const r of RECIPES[st.type]) {
    const holds = r.need ? (p.item && p.item.type === r.need) : !p.item;
    if (!holds) continue;

    if (r.patientStep) {
      const pt = st.occupant;
      if (!pt) { hint(p, "Put an animal on the " + STATIONS[st.type].name); continue; }
      const step = pt.steps[pt.step];
      if (!step || step.k !== "atStation" || step.station !== st.type) { hint(p, "They don't need that"); continue; }
      return {
        key: "st" + st.x + "," + st.y + ":" + pt.id + ":" + pt.step,
        dur: r.dur, label: r.label, ptId: pt.id,
        run: () => {
          if (r.out) p.item = makeItem(r.out);
          advancePatient(pt);
          maybeJam(st);
        }
      };
    }

    if (r.stock && st.stock <= 0) { hint(p, "Empty — restock from the delivery door"); continue; }

    if (r.restock) {
      if (st.stock >= (STATIONS[st.type].stockMax || 0)) { hint(p, "Already full"); continue; }
      return {
        key: "re" + st.x + "," + st.y, dur: r.dur, label: r.label,
        run: () => {
          st.stock = STATIONS[st.type].stockMax;
          Sound.play("restock");
          p.item = null; st.flash = 0.4;
          popup(st.cx, st.cy - 24, "Restocked", PALETTE.good);
          Sound.play("done");
        }
      };
    }

    if (r.labWork) {
      const pid = p.item.pid;
      return {
        key: "lab" + st.x + "," + st.y + ":" + (pid || 0), dur: r.dur, label: r.label,
        isLab: true,                     // read by the Chart Reader trait
        run: () => {
          p.item = null;
          const pt = Game.patients.find(q => q.id === pid && q.state !== "gone");
          if (!pt) { popup(st.cx, st.cy - 24, "Already went home", PALETTE.dim); return; }
          /* A lab step that names a condition the patient already has just
             advances the chain. Only a mystery gets its whole condition
             rewritten — running that path for an overdose would have swapped
             the patient for a different ailment mid-treatment. */
          const step = pt.steps[pt.step];
          if (step && step.k === "lab" && step.reveal === false) {
            popup(pt.x, pt.y - 30, "Bloods back", AILMENTS[pt.ailment].color, true);
            Sound.play("lab");
            advancePatient(pt);
          } else revealMunch(pt);
        }
      };
    }

    // Plain transform / production recipe.
    return {
      key: "st" + st.x + "," + st.y + ":" + r.label, dur: r.dur, label: r.label,
      run: () => {
        if (r.stock && st.stock !== Infinity) st.stock--;
        p.item = r.out ? makeItem(r.out) : null;
        st.flash = 0.3;
        if (r.out === "wand_charged") Sound.play("charge"); else Sound.play("done");
        maybeJam(st);
      }
    };
  }
  return null;
}

function maybeJam(st) {
  if (!Game.level.jams) return;
  if (st.type !== "scanner") return;
  if (Game.rng() < 0.28) {
    st.jammed = true;
    popup(st.cx, st.cy - 26, "JAMMED", PALETTE.warn);
    Sound.play("jam");
  }
}

function revealMunch(pt) {
  // Same filter as arrivals: a lab result that names a condition this ward
  // cannot treat is a guaranteed loss the player already paid lab work for.
  // Normal builder ward: lab unlocks at wave 5, an X-ray is optional, so
  // revealing "sprainedhop" with no X-ray was an easy and unfair death.
  /* Overdose is excluded alongside mystery: it opens with its own blood draw
     and lab run, so revealing it here would send the patient straight back to
     the lab you just used and read as the result not having landed. */
  let pool = Game.level.ailments.filter(a => a !== "mysterymunch" && a !== "toomanytreats");
  const ok = treatableAilments(pool);
  if (ok.length) pool = ok;
  const key = pool[Math.floor(Game.rng() * pool.length)] || "muddypaws";
  const a = AILMENTS[key];
  pt.wasMunch = true;          // credit the case as the mystery it arrived as
  pt.ailment = key;
  pt.revealed = true;
  // rebuild the chain, keeping what the patient still legitimately has:
  // a second condition they arrived with, and their critical escalation.
  // Assigning the bare ailment steps here silently dropped both, so a badge
  // could advertise a comorbidity that never had to be treated.
  let steps = a.steps.map(s => Object.assign({}, s));
  if (pt.second && AILMENTS[pt.second])
    steps = steps.concat(AILMENTS[pt.second].steps.map(s => Object.assign({}, s)));
  if (pt.sev && pt.sev.key === "grumpy") steps = escalateSteps(steps, key);
  pt.steps = steps;
  pt.step = 0;
  pt.done = false;
  pt.patienceMax = Math.max(pt.patienceMax, Game.level.patience * a.patienceMul);
  pt.patience = Math.min(pt.patienceMax, pt.patience + pt.patienceMax * LAB_REVEAL_BONUS);
  popup(pt.x, pt.y - 30, "It's " + a.name + "!", a.color, true);
  Sound.play("lab");
}

function advancePatient(pt) {
  pt.step++;
  pt.flash = 0.35;
  Sound.play("step");
  if (pt.step >= pt.steps.length) {
    pt.done = true;
    popup(pt.x, pt.y - 30, "Treated!", PALETTE.good);
    Sound.play("done");
    burst(pt.x, pt.y, PALETTE.good, 12);
  }
}

/* ---------------------------------------------------------------------
   10. SIMULATION
   --------------------------------------------------------------------- */

function updatePlayer(p, dt) {
  const world = Game.world;
  const c = p.ctrl;
  let mx = 0, my = 0;
  if (Keys[c.left]) mx -= 1;
  if (Keys[c.right]) mx += 1;
  if (Keys[c.up]) my -= 1;
  if (Keys[c.down]) my += 1;

  const moving = mx !== 0 || my !== 0;
  p.moving = moving;
  const wantSprint = !!Keys[c.sprint] && moving && p.stamina > 0;
  p.sprinting = wantSprint;
  if (wantSprint) {
    if (p.boost !== "adrenaline") p.stamina = Math.max(0, p.stamina - dt);
  } else {
    p.stamina = Math.min(p.staminaMax || Game.staminaMax, p.stamina + dt * STAMINA_REGEN);
  }

  if (moving) {
    const len = Math.hypot(mx, my);
    mx /= len; my /= len;
    p.dx = mx; p.dy = my;
    let speed = (p.patient ? SPEED_PATIENT : (p.item ? SPEED_ITEM : SPEED_FREE))
                * Game.speedMul * (p.speedMul || 1);
    if (wantSprint) speed *= p.patient ? SPRINT_MUL_PATIENT : SPRINT_MUL;
    if (p.boost === "coffee") speed *= 1.30;
    if (spillAt(p.x, p.y)) speed *= SPILL_SLOW;
    moveWithCollision(world, p, mx * speed * dt, my * speed * dt);
    p.bob += dt * (wantSprint ? 15 : 11);
    p.step += dt * (wantSprint ? 13 : 9);
  } else {
    p.bob += dt * 2;
  }

  // Interact (edge-triggered)
  if (wasPressed(c.interact)) { p.workLatch = false; doInteract(p); }

  /* Use. Normally held; with "Tap to work" a tap latches it on, because
     holding a key for several seconds at a time is a real barrier for some
     hands. The latch drops the moment there is nothing to work on, so it can
     never leave a medic silently stuck in a work state. */
  if (Options.stickyWork && wasPressed(c.use)) p.workLatch = !p.workLatch;
  if (!Options.stickyWork) p.workLatch = false;
  const useHeld = Keys[c.use] || (Options.stickyWork && p.workLatch);
  if (useHeld) {
    const job = findJob(p);
    const bedToClean = !job ? cleanableBed(world, p) : null;
    const sp = (!job && !bedToClean && !p.item && !p.patient) ? spillAt(p.x, p.y) : null;
    if (bedToClean) {
      p.work = null;
      bedToClean.clean += dt;
      if (bedToClean.clean >= BED_CLEAN_TIME) {
        bedToClean.dirty = false;
        bedToClean.clean = 0;
        bedToClean.flash = 0.5;
        Game.score += TURNOVER_BONUS;
        Game.turnovers = (Game.turnovers || 0) + 1;
        popup(bedToClean.cx, bedToClean.cy - 26, "Bay ready  +" + TURNOVER_BONUS, "#8be9ff");
        Sound.play("turnover");
        Sound.play("done");
        checkLiveAchievements();
      }
    } else if (sp) {
      p.work = null;
      sp.mop += dt * 2;                    // net +1/s against the 0.6/s decay
      if (p.hintT <= 0) hint(p, "Cleaning up");
    } else if (!job) {
      p.work = null;
      // nothing to work on: drop the latch so a tap can never strand the medic
      p.workLatch = false;
      // nothing to work and something in hand: throw it (edge-triggered so a
      // held key does not fire a stream of throws)
      if (p.item && wasPressed(c.use)) throwItem(p);
    } else if (!p.work || p.work.key !== job.key) {
      // the lab step carries an explicit flag: its key is composed from the
      // station coords and the patient id, so matching on the string never fired
      const wm = (p.workMul || 1) * (job.isLab ? (p.labMul || 1) : 1)
                 * (job.zoneMul || 1);
      p.work = { key: job.key, t: 0, dur: job.dur * Game.workMul * wm, label: job.label,
                 run: job.run, ptId: job.ptId, tick: 0 };
    } else {
      p.work.run = job.run;                  // keep the closure fresh
      p.work.t += dt;
      p.work.tick += dt;
      if (p.work.tick > 0.22) { p.work.tick = 0; Sound.play("tick"); }
      if (p.work.t >= p.work.dur) {
        const run = p.work.run;
        p.work = null;
        run();
      }
    }
  } else {
    p.work = null;
  }

  // Auto-discharge: walk a treated patient onto the exit tile.
  if (p.patient && p.patient.done) {
    const t = tileOf(p.x, p.y);
    const cell = cellAt(world, t.x, t.y);
    if (cell && cell.exit) dischargePatient(p);
  }

  if (p.hintT > 0) p.hintT -= dt;
  if (p.squash > 0) p.squash -= dt;

  // contextual button prompts (drawn by the renderer)
  if (!p.work) {
    SILENT_HINTS = true;
    p.promptE = previewInteract(p);
    const job = findJob(p);
    p.promptQ = job ? job.label
              : (cleanableBed(world, p) ? "Change the basket"
              : (p.item ? "Throw"
              : (!p.patient && spillAt(p.x, p.y) ? "Mop up" : null)));
    SILENT_HINTS = false;
  } else {
    p.promptE = null; p.promptQ = null;
  }
}


/* ---------------------------------------------------------------------
   Throwing.

   The game had no skill ceiling: two players could only ever walk items to
   each other. Throwing is the technique a good pair discovers and drills —
   the medic at the shelf lobs a bandage across the ward to the medic at the
   bed, and the treatment loop stops being a walk. It reuses the Use key: with
   an item and no station work available, Use throws.
   --------------------------------------------------------------------- */

const THROW_SPEED = 470;          // px/sec at release
const THROW_DRAG  = 620;          // px/sec^2 slowdown
const CATCH_R     = 30;

function throwItem(p) {
  Sound.play("throw");
  const it = p.item;
  if (!it) return false;
  p.item = null;
  // Release from the thrower's own tile, never 16px ahead: the player's radius
  // is 13, so hugging a wall and throwing into it used to release the item
  // INSIDE the solid tile, where the bounce test (which only checks the
  // destination) could never free it — it came to rest at the centre of the
  // wall, completely invisible. A wall-swallowed defib stalls every cardiac
  // case on the level.
  const ahead = { x: p.x + p.dx * 16, y: p.y + p.dy * 16 };
  const at = tileOf(ahead.x, ahead.y);
  if (isWalkable(Game.world, at.x, at.y)) { it.x = ahead.x; it.y = ahead.y; }
  else { it.x = p.x; it.y = p.y; }
  it.vx = p.dx * THROW_SPEED;
  it.vy = p.dy * THROW_SPEED;
  it.spin = 0;
  it.thrownBy = p.index;
  it.airT = 0;
  Game.floorItems.push(it);
  p.squash = 0.26;
  Sound.play("sprint");
  popup(p.x, p.y - 46, "THROW", "#8be9ff");
  return true;
}

/** Move items in flight: slide, bounce off walls, and let a free hand catch. */
function updateThrownItems(dt) {
  for (const it of Game.floorItems) {
    if (!it.vx && !it.vy) continue;
    it.airT = (it.airT || 0) + dt;
    it.spin = (it.spin || 0) + dt * 9;

    // a teammate with free hands plucks it out of the air
    let caught = false;
    for (const p of Game.players) {
      if (p.item || p.patient) continue;
      if (p.index === it.thrownBy && it.airT < 0.22) continue;   // no self-catch on release
      if (Math.hypot(p.x - it.x, p.y - it.y) > CATCH_R) continue;
      const i = Game.floorItems.indexOf(it);
      if (i >= 0) Game.floorItems.splice(i, 1);
      delete it.x; delete it.y; it.vx = 0; it.vy = 0;
      p.item = it;
      p.squash = 0.22;
      const fromPartner = it.thrownBy !== undefined && it.thrownBy !== p.index;
      it.thrownBy = undefined;
      if (fromPartner) {
        Game.score += 25;
        Game.catches = (Game.catches || 0) + 1;
        Sound.play("catch");
        popup(p.x, p.y - 52, "NICE CATCH  +25", "#ffd54a", true);
        burst(p.x, p.y - 10, "#ffe066", 12);
        Sound.play("clutch");
        checkLiveAchievements();
      } else {
        Sound.play("pickup");
      }
      caught = true;
      break;
    }
    if (caught) return;                 // list mutated; the rest can wait a frame

    // slide with drag, bouncing off anything solid
    const step = (ax, ay) => {
      const nx = it.x + ax, ny = it.y + ay;
      const t = tileOf(nx, ny);
      if (isWalkable(Game.world, t.x, t.y)) { it.x = nx; it.y = ny; return true; }
      return false;
    };
    if (!step(it.vx * dt, 0)) { it.vx *= -0.34; Sound.play("tick"); }
    if (!step(0, it.vy * dt)) { it.vy *= -0.34; Sound.play("tick"); }

    const sp = Math.hypot(it.vx, it.vy);
    const ns = Math.max(0, sp - THROW_DRAG * dt);
    if (sp > 0.001) { it.vx *= ns / sp; it.vy *= ns / sp; }
    if (ns < 6) {                                  // come to rest on a tile centre
      it.vx = 0; it.vy = 0;
      let t = tileOf(it.x, it.y);
      if (!isWalkable(Game.world, t.x, t.y)) {
        // never leave an item resting inside geometry: walk out to the nearest
        // open tile so it is always visible and always reachable
        let best = null, bestD = Infinity;
        for (let r = 1; r <= 4 && !best; r++) {
          for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
            if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
            const nx = t.x + dx, ny = t.y + dy;
            if (!isWalkable(Game.world, nx, ny)) continue;
            const d = dx * dx + dy * dy;
            if (d < bestD) { bestD = d; best = { x: nx, y: ny }; }
          }
          if (best) break;
        }
        if (best) t = best;
      }
      it.x = t.x * TILE + TILE / 2;
      it.y = t.y * TILE + TILE / 2;
      it.thrownBy = undefined;
    }
  }
}

/** The porter lane under a world position, or null. */
function beltAt(world, px, py) {
  const c = cellAt(world, Math.floor(px / TILE), Math.floor(py / TILE));
  return (c && c.belt) ? c.belt : null;
}

/* Belts carry the MEDICS and any loose item on the floor, and deliberately not
   animals or staff: both of those follow cached A* paths, and shoving them off
   a path every frame would have them jittering against a route they keep
   recomputing. Medics are player-steered and items are physics-y, so both take
   the drift naturally. */
function applyBelts(dt) {
  const world = Game.world;
  if (!world || !world.hasBelts) return;
  for (const p of Game.players) {
    const b = beltAt(world, p.x, p.y);
    if (!b) continue;
    // carrying a patient makes you harder to shove around
    const grip = p.patient ? 0.62 : 1;
    moveWithCollision(world, p, b[0] * BELT_SPEED * grip * dt,
                                b[1] * BELT_SPEED * grip * dt);
  }
  for (const it of Game.floorItems) {
    if (it.vx || it.vy) continue;                 // still in flight; let it land
    const b = beltAt(world, it.x, it.y);
    if (!b) continue;
    const nx = it.x + b[0] * BELT_SPEED * 0.8 * dt;
    const ny = it.y + b[1] * BELT_SPEED * 0.8 * dt;
    if (isWalkable(world, Math.floor(nx / TILE), Math.floor(ny / TILE))) { it.x = nx; it.y = ny; }
  }
}

function moveWithCollision(world, p, dx, dy) {
  // Axis-separated sweep so sliding along walls feels good.
  let nx = p.x + dx;
  if (!collides(world, nx, p.y)) p.x = nx;
  let ny = p.y + dy;
  if (!collides(world, p.x, ny)) p.y = ny;
  p.x = clamp(p.x, PLAYER_R, PLAY_W - PLAYER_R);
  p.y = clamp(p.y, PLAYER_R, PLAY_H - PLAYER_R);
}

function collides(world, px, py) {
  const r = PLAYER_R;
  const x0 = Math.floor((px - r) / TILE), x1 = Math.floor((px + r) / TILE);
  const y0 = Math.floor((py - r) / TILE), y1 = Math.floor((py + r) / TILE);
  for (let ty = y0; ty <= y1; ty++)
    for (let tx = x0; tx <= x1; tx++)
      if (!isWalkable(world, tx, ty)) return true;
  return false;
}


/* ---------------------------------------------------------------------
   Dirty beds — the dishes loop.

   The clearest structural gap against Overcooked was that there was only ever
   ONE thing worth doing: move the current patient along. Overcooked's dishes
   work because they are a second, always-growing pressure competing for the
   same hands, and because ignoring them eventually stops the main loop dead.
   A bed a patient has just left must be turned over before the next one can
   use it — so a good pair splits duties instead of both chasing the same
   patient, and a bad pair drowns in beds they cannot use.
   --------------------------------------------------------------------- */

const BED_CLEAN_TIME = 1.4;       // seconds of holding Use to turn a bed over
const TURNOVER_BONUS = 12;        // small, but it adds up over a shift

/** Mark a bed as needing turnover. Called when a patient leaves it. */
function soilBed(bed) {
  if (!bed || bed.type !== "basket") return;
  if (Game.levelIndex === 0 && !Game.builderMode) return;   // tutorial ward stays simple
  bed.dirty = true;
  bed.clean = 0;
}

function cleanableBed(world, p) {
  if (p.item || p.patient) return null;
  return facingStation(world, p, st => st.type === "basket" && st.dirty && !st.occupant);
}

/** How much of the ward is currently out of action. Drives the HUD warning. */
function dirtyBedCount() {
  const w = Game.world;
  if (!w) return 0;
  return w.beds.filter(b => b.dirty).length;
}

function dischargePatient(p) {
  const pt = p.patient;
  p.patient = null;
  pt.state = "gone";
  if (pt.lastBed) { soilBed(pt.lastBed); pt.lastBed = null; }

  const a = AILMENTS[pt.ailment];
  const frac = pt.patience / pt.patienceMax;
  Game.combo = Game.comboTimer > 0 ? Game.combo + 1 : 1;
  Game.bestCombo = Math.max(Game.bestCombo, Game.combo);
  Game.comboTimer = Game.comboWindow;
  const mult = Math.min(COMBO_MAX, 1 + 0.25 * (Game.combo - 1));

  let base = a.score + Math.round(frac * 100);
  if (pt.second) base += Math.round(AILMENTS[pt.second].score * 0.85);
  base = Math.round(base * (pt.sev ? pt.sev.score : 1));
  if (pt.vip) base *= 2;
  let callout = null, calloutColor = PALETTE.good;

  /* Specialist: three of the same condition in a row. A second scoring axis
     that rewards BATCHING rather than raw speed, so the optimal line is no
     longer always "grab whoever is closest to dying" — sometimes you clear a
     matching pair first. */
  if (Game.lastAilment === pt.ailment) Game.sameRun++;
  else { Game.sameRun = 1; Game.lastAilment = pt.ailment; }
  Game.bestSpecialist = Math.max(Game.bestSpecialist || 0, Game.sameRun);
  if (Game.sameRun >= 3) {
    const spec = 40 + (Game.sameRun - 3) * 25;
    base += spec;
    popup(pt.x, pt.y - 130, "SPECIALIST x" + Game.sameRun + "  +" + spec, "#c9a0ff", true);
    Sound.play("star");
  }
  if (frac >= Game.perfectAt) {
    base += Math.round(a.score * 0.5);
    callout = "PERFECT!"; calloutColor = "#ffd54a";
    Game.perfects++;
  } else if (frac <= CLUTCH_AT) {
    base += CLUTCH_BONUS;
    callout = "CLUTCH SAVE!"; calloutColor = "#ff7ab8";
    Game.clutches++;
  }

  const surge = Game.event ? EVENT_PAY : 1;
  const gained = Math.round(base * mult * surge * (Game.diff ? Game.diff.scoreMul : 1));
  Game.score += gained;
  Game.treated++;
  // A revealed mystery is reassigned to its true condition, so pt.ailment is
  // never "mysterymunch" at discharge. Crediting only that made the level-4
  // challenge ("treat 3 mystery cases") and the Diagnostician achievement
  // literally unachievable. Score both the mystery and what it turned out to be.
  const credit = pt.wasMunch ? "mysterymunch" : pt.ailment;
  Game.byAilment[credit] = (Game.byAilment[credit] || 0) + 1;
  if (pt.wasMunch) Game.byAilment[pt.ailment] = (Game.byAilment[pt.ailment] || 0) + 1;
  if (Game.builderMode && Game.builder) {
    const cr = Math.max(6, Math.round(gained / 7));
    Game.builder.credits += cr;
    Game.builder.totalCredits += cr;
    popup(pt.x, pt.y - 108, "+" + cr + "c", "#6fd3b4");
  }
  Game.career.treated++;
  if (pt.ailment === "staticcling") Game.career.staticked++;
  if (pt.wasMunch || pt.ailment === "mysterymunch") Game.career.munches++;
  checkLiveAchievements();
  if (Game.endless && Game.treated % 10 === 0 && Game.lives < Game.livesMax) {
    Game.lives++;
    popup(pt.x, pt.y - 92, "LIFE RESTORED", "#ff4d6d", true);
    Sound.play("newbest");
  }

  popup(pt.x, pt.y - 26, "+" + gained + (mult > 1 ? "  x" + fmtMult(mult) : ""), pt.vip ? "#ffd54a" : PALETTE.good, true);
  if (surge > 1) popup(pt.x, pt.y - 92, "SURGE PAY", Game.event.def.color);
  if (pt.vip) popup(pt.x, pt.y - 70, "VIP x2", "#ffd54a", true);
  if (pt.sev && pt.sev.key === "grumpy")
    popup(pt.x, pt.y - 112, "WON THEM ROUND", "#ff4d6d", true);
  if (pt.second)
    popup(pt.x, pt.y - 150, "DOUBLE CASE", "#8be9ff", true);
  if (callout) popup(pt.x, pt.y - 52, callout, calloutColor, true);
  if (Game.combo >= 3) popup(pt.x, pt.y - 74, "CHAIN x" + Game.combo, "#8be9ff");
  burst(pt.x, pt.y, "#ffe066", 18 + Math.min(20, Game.combo * 3));
  Game.flashGood = 0.35;
  Sound.discharge(Game.combo);
  if (callout === "CLUTCH SAVE!") Sound.play("clutch");
}


/* ---------------------------------------------------------------------
   Spills and deterioration.

   Two problems these solve. The ward was spatially static — you learned one
   route and ran it forever — and ignoring the waiting room had exactly one
   consequence (a patient leaves, eventually). Spills change the floor under
   you mid-shift; deterioration means a queue you neglect gets LOUDER and
   worse instead of just slowly ticking down.
   --------------------------------------------------------------------- */

const SPILL_SLOW = 0.55;          // movement multiplier while standing in one
const SPILL_MOP  = 1.1;           // seconds to clean

function addSpill(tx, ty) {
  if (!isWalkable(Game.world, tx, ty)) return;
  if (Game.spills.some(s2 => s2.tx === tx && s2.ty === ty)) return;
  if (Game.spills.length > 10) return;
  Game.spills.push({ tx, ty, x: tx * TILE + TILE / 2, y: ty * TILE + TILE / 2,
                     t: 0, mop: 0, seed: Math.floor(Game.rng() * 1000) });
  Sound.play("splash");
}

function spillAt(px, py) {
  const tx = Math.floor(px / TILE), ty = Math.floor(py / TILE);
  return Game.spills.find(s2 => s2.tx === tx && s2.ty === ty) || null;
}

function updateBaskets(dt) {
  const w = Game.world;
  if (!w) return;
  for (const b of w.beds) {
    if (!b.dirty) { b.clean = 0; continue; }
    b.clean = Math.max(0, (b.clean || 0) - dt * 0.55);   // walking off loses progress
  }
}

function updateSpills(dt) {
  for (let i = Game.spills.length - 1; i >= 0; i--) {
    const sp = Game.spills[i];
    sp.t += dt;
    if (sp.mop >= SPILL_MOP) {
      Game.spills.splice(i, 1);
      Sound.play("mop");
      Game.score += 15;
      popup(sp.x, sp.y - 20, "Cleaned  +15", "#8be9ff");
      Sound.play("done");
      continue;
    }
    sp.mop = Math.max(0, sp.mop - dt * 0.6);        // progress decays if you walk off
  }
}

/* A patient nobody has reached gets worse: their case escalates to critical,
   an alarm sounds, and they start draining fast. Neglect now bites back on a
   clock you can hear rather than one you have to watch. */
function updateDeterioration(dt) {
  if (Game.levelIndex === 0 && !Game.builderMode) return;   // not on the tutorial ward
  for (const pt of Game.patients) {
    if (pt.done || pt.state === "gone" || pt.state === "carried") continue;
    if (!pt.sev || pt.sev.key === "grumpy") continue;
    const frac = pt.patience / pt.patienceMax;
    if (frac > 0.34) { pt.deterT = 0; continue; }   // recovering resets the grace period
    pt.deterT = (pt.deterT || 0) + dt;
    if (pt.deterT < 1.6) continue;
    // escalate: harder, but worth much more, and they keep the patience they have
    pt.sev = SEVERITY.grumpy;
    pt.escalated = true;
    pt.steps = escalateSteps(pt.steps, pt.ailment);
    pt.patienceMax = pt.patienceMax * 1.25;        // the extra work needs a little slack
    pt.patience = Math.max(pt.patience, pt.patienceMax * 0.30);
    Game.banner = { text: "SOMEBODY IS GETTING GRUMPY", sub: AILMENTS[pt.ailment].name + " — and now they want a fuss made",
                    t: 0, urgent: true };
    Game.shake = Math.max(Game.shake, 8);
    Sound.play("siren");
    popup(pt.x, pt.y - 90, "GRUMPY!", "#ff4d6d", true);
  }
}

function losePatient(pt) {
  pt.state = "gone";
  Game.lost++;
  Game.lives = Math.max(0, Game.lives - 1);
  Game.combo = 0; Game.comboTimer = 0;
  const penalty = 60;
  Game.score = Math.max(0, Game.score - penalty);

  if (Game.level.bigExit) {
    popup(pt.x, pt.y - 26, "TROTTED OFF  -" + penalty, PALETTE.bad, true);
    Game.shake = 16;
    Game.flashRed = 0.5;
    Sound.play("trotoff");
    burst(pt.x, pt.y, PALETTE.bad, 20);
  } else {
    popup(pt.x, pt.y - 26, "Went home  -" + penalty, PALETTE.bad, true);
    Game.shake = 6;
    Sound.play("leave");
  }

  // and they leave a mess behind them
  addSpill(Math.floor(pt.x / TILE), Math.floor(pt.y / TILE));
  if (pt.station && pt.station.type === "basket") soilBed(pt.station);
  else if (pt.lastBed) soilBed(pt.lastBed);

  // free whatever they occupied
  if (pt.station) { pt.station.occupant = null; pt.station = null; }
  for (const p of Game.players) if (p.patient === pt) p.patient = null;
  for (const st of Game.staff) if (st.carrying === pt) st.carrying = null;
}

function updatePatients(dt) {
  for (const pt of Game.patients) {
    if (pt.state === "gone") continue;
    pt.bob += dt * 3;
    if (pt.flash > 0) pt.flash -= dt;

    // Patience: slower once they are settled in a bed.
    if (!pt.done) {
      const inBed = pt.station && pt.station.type === "basket";
      let rate = inBed ? 0.62 : (pt.state === "station" ? 0.8 : 1.0);
      if (Game.tendedIds && Game.tendedIds.has(pt.id)) rate *= 0.25;
      rate *= calmFactor(pt);
      pt.patience -= dt * rate;
      if (pt.patience <= 0) { losePatient(pt); continue; }
    }

    // Movement for animals that walk themselves in.
    if (pt.state === "walking") {
      if (pt.path.length) {
        const tgt = pt.path[0];
        const vx = tgt.x - pt.x, vy = tgt.y - pt.y;
        const d = Math.hypot(vx, vy);
        if (d < 4) pt.path.shift();
        else { const s = 78 * dt; pt.x += (vx / d) * s; pt.y += (vy / d) * s; }
      } else {
        pt.state = "waiting";
      }
    } else if (pt.state === "carried") {
      const carrier = Game.players.find(p => p.patient === pt);
      if (carrier) { pt.x = carrier.x; pt.y = carrier.y - 26; }
    }
  }
  Game.patients = Game.patients.filter(p => p.state !== "gone");
}

const EASE_IN_SECS = 25;                 // opening window with no brutal cases

/* Which chains can this department physically run? In builder mode a case you
   have no equipment for is not a challenge, it is a guaranteed loss — so those
   animals are diverted to another hospital and never arrive. Building the
   machine is what opens the (higher-scoring) case type. */
function treatableAilments(pool) {
  if (!Game.world) return pool;
  const have = (t) => Game.world.stations.some(q => q.type === t);
  return pool.filter(a => {
    if (a === "muddypaws") return have("grooming");
    if (a === "itchyears") return have("remedy");
    if (a === "sprainedhop") return have("scanner") && have("bootiebench");
    if (a === "staticcling") return have("wanddock") && have("groundpad");
    if (a === "mysterymunch") return have("lab");
    if (a === "stickypaws") return have("grooming") && have("remedy");
    if (a === "zoomies") return have("remedy");
    if (a === "socksituation") return have("scanner");
    if (a === "crickintail") return have("scanner");
    if (a === "toomanytreats") return have("lab") && have("remedy");
    return true;
  });
}

function chooseAilment() {
  /* Filter to what this ward can actually treat on EVERY path, not just in the
     builder. A campaign ward whose ailment list names a condition it has no
     station for hands out guaranteed deaths, and a daily modifier or a
     hand-edited level is one typo away from doing exactly that. The authoring
     is checked separately; this is the net under it. */
  let pool = treatableAilments(Game.level.ailments);
  if (!pool.length) pool = Game.builderMode ? ["muddypaws"] : Game.level.ailments;
  if (Game.forceAilment > 0 && pool.includes("itchyears")) {
    Game.forceAilment--;
    return "itchyears";
  }
  // Ease into the shift: the first arrivals are never one of the long or
  // frantic chains, so no seed can deal the hardest hand as an opener.
  if (Game.time < EASE_IN_SECS) {
    const gentle = pool.filter(a => a !== "staticcling" && a !== "mysterymunch" &&
                                    a !== "toomanytreats" && a !== "zoomies");
    if (gentle.length) pool = gentle;
  }
  const r = Game.rng();
  const idx = Math.floor(r * pool.length);
  return pool[clamp(idx, 0, pool.length - 1)];
}

/** Interval between arrivals right now: ramps down across a timed level, and
    keeps tightening forever in endless mode. */
function currentSpawnInterval() {
  const lvl = Game.level;
  if (Game.endless) {
    // asymptotic squeeze: 8.5s at the start, closing on spawnEnd after ~4 min
    return Math.max(lvl.spawnEnd, lvl.spawnStart - Game.time / 26)
           * (Game.diff ? Game.diff.spawn : 1) * Game.spawnMul * SOLO.spawn();
  }
  const t = clamp(Game.time / lvl.duration, 0, 1);
  return lerp(lvl.spawnStart, lvl.spawnEnd, t)
         * (Game.diff ? Game.diff.spawn : 1) * Game.spawnMul * SOLO.spawn();
}

/** Ambulances arrive on a rhythm, dumping several animals at once. Gives the
    shift a pulse of calm and panic instead of a flat grind. */
function updateWaves(dt) {
  Game.waveTimer -= dt;
  if (Game.waveTimer > 0) return;
  Game.wave++;
  Game.waveTimer = WAVE_EVERY;
  Game.burst = 2 + Math.min(3, Math.floor(Game.wave / 2));
  Game.banner = { text: "VAN OF PUPPIES", sub: Game.burst + " animals arriving at once", t: 0, urgent: true };
  Sound.play("siren");
}

function updateSpawning(dt) {
  const lvl = Game.level;
  // The tutorial spawns exactly what the current step needs and nothing else.
  // startLevel seeds spawnTimer at 2.0s, so without this an unplanned second
  // patient walked in two seconds into the lesson.
  if (lvl && lvl.tutorial) return;
  const waiting = Game.patients.filter(p => p.state === "waiting" || p.state === "walking").length;
  Game.spawnTimer -= dt;
  if (Game.spawnTimer > 0) return;

  if (waiting >= SOLO.maxWaiting(lvl.maxWaiting)) { Game.spawnTimer = 1.0; return; }

  const free = Game.world.waitSlots.filter(s =>
    !Game.patients.some(p => p.slot && p.slot.x === s.x && p.slot.y === s.y));
  if (!free.length) { Game.spawnTimer = 1.0; return; }

  const pt = makePatient(Game.world, chooseAilment(), lvl);
  const slot = free[Math.floor(Game.rng() * free.length)];
  pt.slot = slot;
  pt.path = findPath(Game.world, Game.world.entrance, slot);
  Game.patients.push(pt);
  Sound.play("spawn");

  // Mid-burst arrivals come almost back to back; otherwise use the ramp.
  if (Game.burst > 0) {
    Game.burst--;
    Game.spawnTimer = 0.55;
  } else {
    Game.spawnTimer = currentSpawnInterval() * (0.82 + Game.rng() * 0.36);
  }
}

function updateItems(dt) {
  // Charged defibs lose their charge; loose defibs are never truly lost.
  const decay = (it) => {
    if (it.type !== "wand_charged") return;
    it.charge -= dt;
    if (it.charge <= 0) {
      it.type = "wand";
      delete it.charge;
      Sound.play("error");
    }
  };
  for (const p of Game.players) if (p.item) decay(p.item);
  for (const it of Game.floorItems) decay(it);
}

function updateEffects(dt) {
  for (const p of Game.popups) { p.t += dt; p.y -= dt * 26; }
  Game.popups = Game.popups.filter(p => p.t < p.life);
  for (const q of Game.particles) {
    q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 240 * dt;
  }
  Game.particles = Game.particles.filter(q => q.t < q.life);
  Game.scoreShown += (Game.score - Game.scoreShown) * Math.min(1, dt * 9);
  if (Math.abs(Game.score - Game.scoreShown) < 0.6) Game.scoreShown = Game.score;
  if (Game.shake > 0) Game.shake = Math.max(0, Game.shake - dt * 26);
  if (Game.flashRed > 0) Game.flashRed = Math.max(0, Game.flashRed - dt * 1.4);
  if (Game.flashGood > 0) Game.flashGood = Math.max(0, Game.flashGood - dt * 2.2);
  for (const st of Game.world.stations) if (st.flash > 0) st.flash -= dt;
  if (Game.banner) { Game.banner.t += dt; if (Game.banner.t > 3.2) Game.banner = null; }
  for (let i = Game.toasts.length - 1; i >= 0; i--) {
    Game.toasts[i].t += dt;
    if (Game.toasts[i].t >= Game.toasts[i].life) Game.toasts.splice(i, 1);
  }
  if (Game.comboTimer > 0) {
    Game.comboTimer -= dt;
    if (Game.comboTimer <= 0) {
      if (Game.combo >= 2) Sound.tone(340, 0.18, "triangle", 0.05, 190);
      Game.combo = 0;
    }
  }
}

/** A heartbeat that quickens while anyone is close to running out. */
function updateHeartMonitor(dt) {
  let worst = 1;
  for (const pt of Game.patients) {
    if (pt.done || pt.state === "gone") continue;
    worst = Math.min(worst, pt.patience / pt.patienceMax);
  }
  Game.critical = worst;
  if (worst >= CRIT_AT) { Game.heartTimer = 0; return; }
  Game.heartTimer -= dt;
  if (Game.heartTimer <= 0) {
    Game.heartTimer = lerp(0.30, 0.78, clamp(worst / CRIT_AT, 0, 1));
    Sound.play("heart");
  }
}

/* First-shift tutorial: six short tips that each wait for the player to
   actually do the thing before moving on. Level 1 only. */
/* The teaching script. Each step names one action, waits for that action to
   actually happen, and cannot be failed or timed out. `spawn` runs once on
   entering the step, so the ward only ever contains what the current step needs
   — no arrivals piling up behind a player who is still reading. */
const TUTORIAL_STEPS = [
  { text: "Walk around. P1 uses W A S D; P2 uses the arrow keys. On a pad, the stick.",
    hint: "move in any direction",
    done: (t) => t.moved > 90 },
  { text: "Hold Shift to sprint. It drains, then refills when you stop.",
    hint: "sprint for a moment",
    done: (t) => t.sprinted > 30 },
  { text: "Someone has arrived at the blue IN door. Walk into them and press E to pick them up.",
    spawn: "muddypaws",
    hint: "lift the animal",
    grace: 75,
    done: () => Game.players.some(p => p.patient) },
  { text: "Carry them to a basket. Stand beside it, facing it, and press E to settle them in.",
    hint: "settle them in a basket",
    grace: 75,
    done: () => Game.patients.some(pt => pt.state === "station") },
  { text: "Their badge asks for a towel. Walk to a grooming shelf and HOLD Q to take one.",
    hint: "collect a towel",
    grace: 75,
    done: () => Game.players.some(p => p.item) },
  { text: "Carry it back to the basket and HOLD Q to wipe those muddy paws.",
    hint: "treat them",
    grace: 75,
    done: () => Game.patients.some(pt => pt.done) || Game.treated > 0 },
  { text: "Badge is green. Pick them up again and walk onto the green OUT tile.",
    hint: "send them home",
    grace: 75,
    done: () => Game.treated > 0 },
  { text: "Every send-off leaves the basket mucky. Empty hands, HOLD Q at the basket to change it.",
    hint: "turn the bay over",
    grace: 75,
    done: () => !Game.world || !Game.world.beds.some(b => b.dirty) },
  { text: "That is the whole job. Every condition is the same loop with a longer chain.",
    hint: "press E to finish",
    grace: false,                        // this one waits for the player, always
    done: () => wasPressed("KeyE") || wasPressed("Enter") || wasPressed("Slash") }
];

function updateTutorial(dt) {
  const tut = Game.tutorial;
  if (!tut) return;
  const step = TUTORIAL_STEPS[tut.stage];
  if (!step) return;
  tut.t += dt;

  // progress counters for the movement steps, which have nothing else to watch
  for (const p of Game.players) {
    if (p.moving) tut.moved++;
    if (p.moving && Keys[p.ctrl.sprint] && p.stamina > 0) tut.sprinted++;
  }

  // spawn this step's patient once, and only in the standalone tutorial ward
  if (step.spawn && !tut.spawned && Game.level && Game.level.tutorial) {
    tut.spawned = true;
    const slot = Game.world.waitSlots[0];
    const pt = makePatient(Game.world, step.spawn, Game.level);
    if (slot) {
      pt.slot = slot;
      pt.path = findPath(Game.world, Game.world.entrance, slot);   // or they stand in the door
    }
    Game.patients.push(pt);
    Sound.play("spawn");
  }

  /* A short floor on every step so an instruction cannot flash past — but only
     where the player has something to read. The last step waits on a keypress,
     so it must not consume one that arrived during the delay. */
  /* A step must never be a dead end. The two input steps are the risk: a player
     who does not realise they are being asked to sprint would sit there forever.
     After a generous grace period the step passes itself — the lesson is worth
     showing, it is not worth trapping anyone over. */
  const patient = step.grace !== false && tut.t > (step.grace || 22);
  if (tut.t > (step.spawn ? 0.6 : 1.1) && (step.done(tut) || patient)) {
    tut.stage++;
    tut.t = 0;
    tut.spawned = false;
    Sound.play(tut.stage >= TUTORIAL_STEPS.length ? "levelend" : "done");
    if (tut.stage >= TUTORIAL_STEPS.length && Game.level && Game.level.tutorial)
      finishTutorial();
  }
}

/** Leaving the tutorial: remember it was done, and drop the player where they
    can immediately act on what they just learned. */
function finishTutorial() {
  Game.tutorialDone = true;
  Save.touch();
  Game.tutorial = null;
  /* Deliberately NOT clearing Game.world here. updateTutorial runs in the middle
     of updatePlay, and nulling the world mid-frame crashed updateEffects on the
     very same tick — the same shape of bug that once killed ward two. The next
     startLevel disposes the mesh; leaving it alive for one more frame is free. */
  Game.patients = [];
  Game.floorItems = [];
  Game.screen = "select";
  Game.selectIndex = 0;
  Sound.play("newbest");
}

/* Nurse Bramble: wanders to the most-stressed settled patient and comforts
   them, restoring a chunk of patience. She never treats — that's your job. */
function updateNurse(dt) {
  const nu = Game.nurse;
  if (!nu) return;
  nu.bob += dt * (nu.moving ? 11 : 2);
  if (nu.cooldown > 0) nu.cooldown -= dt;

  // validate current target
  if (nu.target && (nu.target.state !== "station" || nu.target.done ||
      nu.target.patience / nu.target.patienceMax > 0.92)) {
    nu.target = null; nu.path = []; nu.comfort = 0;
  }

  // pick the most urgent settled patient
  if (!nu.target && nu.cooldown <= 0) {
    let best = null, bestFrac = 0.85;
    for (const pt of Game.patients) {
      if (pt.state !== "station" || pt.done) continue;
      const frac = pt.patience / pt.patienceMax;
      if (frac < bestFrac) { bestFrac = frac; best = pt; }
    }
    if (best) {
      nu.target = best;
      const here = tileOf(nu.x, nu.y);
      const st = best.station;
      let goal = null;
      for (const [dx, dy] of [[0, 1], [1, 0], [-1, 0], [0, -1]]) {
        if (isWalkable(Game.world, st.x + dx, st.y + dy)) { goal = { x: st.x + dx, y: st.y + dy }; break; }
      }
      nu.path = goal ? findPath(Game.world, here, goal) : [];
      if (goal && !nu.path.length && (here.x !== goal.x || here.y !== goal.y)) {
        nu.target = null;                       // unreachable from here
      }
    }
  }

  // walk the path
  nu.moving = false;
  if (nu.path.length) {
    const tgt = nu.path[0];
    const vx = tgt.x - nu.x, vy = tgt.y - nu.y;
    const d = Math.hypot(vx, vy);
    if (d < 4) nu.path.shift();
    else {
      const sp = 118 * dt;
      nu.x += (vx / d) * sp; nu.y += (vy / d) * sp;
      nu.dx = vx / d; nu.dy = vy / d;
      nu.moving = true; nu.step = (nu.step || 0) + dt * 9;
    }
    return;
  }

  // beside the bed: comfort
  if (nu.target) {
    const st = nu.target.station;
    if (!st || Math.hypot(st.cx - nu.x, st.cy - nu.y) > 70) { nu.target = null; return; }
    nu.comfort += dt;
    if (nu.comfort >= 1.3) {
      const pt = nu.target;
      // 0.28 every 3.5s out-healed the 0.62/s drain about threefold, which made
      // patience stop mattering entirely; 0.18 every 5s buys back roughly one
      // patient's worth of time, so she helps without playing the game for you
      pt.patience = Math.min(pt.patienceMax, pt.patience + pt.patienceMax * 0.18);
      popup(pt.x, pt.y - 30, "+ \u2665", "#ff8fa8", false);
      Sound.play("place");
      nu.comfort = 0; nu.cooldown = 5.0; nu.target = null;
    }
  }
}


/* ---------------------------------------------------------------------
   Shift events, pickups, and the co-op high five.
   --------------------------------------------------------------------- */

const EVENT_FIRST = 45;         // sec before the first event can fire
const EVENT_GAP   = 42;         // and roughly how long between them after
const EVENT_PAY   = 1.40;       // discharges are worth more while a surge runs
const PICKUP_FIRST = 26;
const PICKUP_GAP   = 30;

/** Pick a random open tile with nothing important on it.
    Doorway tiles are excluded even when the door is currently open: anything
    dropped in one is about to be standing in a closed fire door, and while
    closeBlockingCells will now shove it clear, not putting it there in the
    first place is better than relocating it a second after it appears. */
function randomFreeTile(world) {
  const doorCells = new Set();
  for (const sh of (world.shutters || []))
    for (const c of sh.cells) doorCells.add(c.x + "," + c.y);
  const cands = [];
  for (let y = 1; y < ROWS - 1; y++)
    for (let x = 1; x < COLS - 1; x++) {
      if (!isWalkable(world, x, y)) continue;
      if (doorCells.has(x + "," + y)) continue;
      if (x === world.entrance.x && y === world.entrance.y) continue;
      if (x === world.exit.x && y === world.exit.y) continue;
      cands.push({ x, y });
    }
  if (!cands.length) return null;
  return cands[Math.floor(Game.rng() * cands.length)];
}

function updateEvents(dt) {
  // no events on the two tutorial wards — learn the job before it gets weird.
  // In builder mode they start at wave 3, once the department has some shape
  // (levelIndex is -2 there, so the campaign guard must not swallow it).
  if (Game.builderMode) {
    if (!Game.builder || Game.builder.wave < 3) return;
  } else if (Game.levelIndex < 2 && !Game.endless) return;

  if (Game.event) {
    Game.event.t += dt;
    if (Game.event.t >= Game.event.def.dur) {
      // wind the effects back down
      Game.spawnMul = 1; Game.workMul = 1; Game.dim = 0;
      if (Game.event.def.key === "cordon") clearCordons();
      Game.event = null;
      Game.eventTimer = EVENT_GAP * (0.75 + Game.rng() * 0.6);
    } else if (Game.event.def.key === "flicker") {
      // lights stutter for the duration
      Game.dim = 0.35 + 0.25 * Math.sin(Game.event.t * 11);
    } else if (Game.event.def.key === "leak") {
      // the burst keeps producing puddles for as long as it runs
      Game.leakTimer = (Game.leakTimer || 0) - dt;
      if (Game.leakTimer <= 0) {
        Game.leakTimer = 1.5;
        splashSpill();
      }
    }
    return;
  }

  Game.eventTimer -= dt;
  if (Game.eventTimer > 0) return;
  // never fire one in the last stretch — a surprise you cannot answer is
  // just a punishment
  if (!Game.endless && Game.time > Game.level.duration - 30) return;

  // prefer an event this shift has not shown yet
  let pool = EVENTS.filter(e => !Game.eventsSeen.includes(e.key));
  if (!pool.length) { Game.eventsSeen = []; pool = EVENTS.slice(); }
  if (!Game.level.ailments.includes("itchyears"))
    pool = pool.filter(e => e.key !== "outbreak") ;
  if (!pool.length) pool = EVENTS.slice();
  const def = pool[Math.floor(Game.rng() * pool.length)];
  Game.eventsSeen.push(def.key);
  Game.event = { def, t: 0 };
  Game.banner = { text: def.name, sub: def.sub, t: 0, color: def.color };
  Sound.play("siren");
  Game.shake = Math.max(Game.shake, 6);

  switch (def.key) {
    case "puppyvan": Game.burst = 2; Game.spawnTimer = Math.min(Game.spawnTimer, 0.6); break;
    case "outbreak":  Game.forceAilment = 3; Game.spawnTimer = Math.min(Game.spawnTimer, 1.2); break;
    case "flicker":   Game.workMul = 1.30; break;
    case "rush":      Game.spawnMul = 0.70; break;
    case "vip":       Game.forceVip = true; Game.spawnTimer = Math.min(Game.spawnTimer, 1.0); break;
    case "cordon":
      // if the ward has nowhere safe to rope off, drop the event rather than
      // stand there announcing something that never happens
      if (!openCordon()) { Game.event = null; Game.banner = null;
                           Game.eventTimer = EVENT_GAP * 0.5; }
      break;
    case "leak":
      Game.leakTimer = 0;
      for (let i = 0; i < 3; i++) splashSpill();
      break;
  }
}

/** Drop a puddle on a random walkable tile that is not already wet. */
function splashSpill() {
  const world = Game.world;
  if (!world) return;
  for (let tries = 0; tries < 40; tries++) {
    const tx = 1 + Math.floor(Game.rng() * (COLS - 2));
    const ty = 1 + Math.floor(Game.rng() * (ROWS - 2));
    if (!isWalkable(world, tx, ty)) continue;
    if (Game.spills.some(s2 => s2.tx === tx && s2.ty === ty)) continue;
    addSpill(tx, ty);
    return;
  }
}

/* Pickups: a small active-play reward for noticing something on the floor. */
const PICKUP_KINDS = [
  { key: "coffee",     name: "COFFEE!",     color: "#c98a5f", dur: 11 },
  { key: "adrenaline", name: "ADRENALINE!", color: "#ff7ab8", dur: 9 }
];

function updatePickups(dt) {
  Game.pickupTimer -= dt;
  if (Game.pickupTimer <= 0 && Game.pickups.length < 2) {
    const t = randomFreeTile(Game.world);
    if (t) {
      const kind = PICKUP_KINDS[Math.floor(Game.rng() * PICKUP_KINDS.length)];
      Game.pickups.push({ kind, x: t.x * TILE + TILE / 2, y: t.y * TILE + TILE / 2, t: 0 });
    }
    Game.pickupTimer = PICKUP_GAP * (0.7 + Game.rng() * 0.7);
  }
  for (let i = Game.pickups.length - 1; i >= 0; i--) {
    const pu = Game.pickups[i];
    pu.t += dt;
    if (pu.t > 26) { Game.pickups.splice(i, 1); continue; }   // stale, fades away
    for (const p of Game.players) {
      if (Math.hypot(p.x - pu.x, p.y - pu.y) > 30) continue;
      applyBoost(p, pu.kind);
      Game.pickups.splice(i, 1);
      break;
    }
  }
  // tick boosts down
  for (const p of Game.players) {
    if (p.boostT > 0) {
      p.boostT -= dt;
      if (p.boost === "adrenaline") p.stamina = p.staminaMax || Game.staminaMax;
      if (p.boostT <= 0) { p.boostT = 0; p.boost = null; }
    }
  }
}

function applyBoost(p, kind) {
  p.boost = kind.key;
  p.boostT = kind.dur;
  popup(p.x, p.y - 40, kind.name, kind.color, true);
  burst(p.x, p.y, kind.color, 16);
  Sound.play("newbest");
  if (kind.key === "adrenaline") p.stamina = p.staminaMax || Game.staminaMax;
}

/** Both nurses side by side, both hitting Use: refill and re-light the chain. */
function updateHighFive(dt) {
  if (Game.highFiveCool > 0) Game.highFiveCool -= dt;
  if (Game.players.length < 2 || Game.highFiveCool > 0) return;
  const [a, b] = Game.players;
  if (Math.hypot(a.x - b.x, a.y - b.y) > 62) return;
  if (!wasPressed(a.ctrl.use) || !wasPressed(b.ctrl.use)) return;

  Game.highFiveCool = 5;
  Game.highFives++;
  for (const p of Game.players) { p.stamina = p.staminaMax || Game.staminaMax; p.squash = 0.3; }
  if (Game.combo > 0) Game.comboTimer = Game.comboWindow;   // keeps the chain alive
  Game.score += 120;
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  popup(mx, my - 52, "HIGH FIVE!  +120", "#ffd54a", true);
  burst(mx, my - 20, "#ffe066", 22);
  Sound.play("clutch");
  checkLiveAchievements();
}

function updatePlay(dt) {
  Game.time += dt;
  for (const p of Game.players) updatePlayer(p, dt);
  Game.tendedIds = new Set();
  for (const p of Game.players) if (p.work && p.work.ptId) Game.tendedIds.add(p.work.ptId);
  applyBelts(dt);
  updatePatients(dt);
  updateWaves(dt);
  updateEvents(dt);
  updatePickups(dt);
  updateHighFive(dt);
  updateSpawning(dt);
  updateItems(dt);
  updateNurse(dt);
  updateShutters(dt);
  updateZones(dt);
  updateThrownItems(dt);
  updateBaskets(dt);
  updateSpills(dt);
  updateDeterioration(dt);
  updateStaff(dt);
  updateHeartMonitor(dt);
  updateTutorial(dt);
  if (Game.screen !== "play") return;      // the tutorial may have just ended
  updateEffects(dt);

  if (Game.builderMode) {
    if (Game.lives <= 0) endBuilderRun();
    else if (Game.time >= Game.level.duration) endWave();
    return;
  }
  if (Game.time >= Game.level.duration || Game.lives <= 0) endLevel();
}

function endBuilderRun() {
  const B = Game.builder;
  const prevBest = Game.builderBest || 0;      // capture BEFORE maxing, or a tie reads as a record
  B.bestWave = Math.max(B.bestWave || 0, B.wave);
  Game.builderBest = Math.max(prevBest, B.wave);
  Game.career.shifts++;
  const xpGain = Math.round(Game.score / 10) + Game.treated * 5;
  Game.xp += xpGain;
  checkLiveAchievements();
  Game.result = {
    failed: true, stars: 0, newBest: B.wave > prevBest,
    builder: true, wave: B.wave, xpGain, challenges: null,
    name: "Clinic Builder — wave " + B.wave, targets: null,
    score: Game.score, treated: Game.treated, lost: Game.lost,
    bestCombo: Game.bestCombo, perfects: Game.perfects, clutches: Game.clutches,
    spent: B.totalCredits, built: B.bought.length, staff: Game.staff.length,
    t: 0
  };
  Save.touch();
  Game.screen = "results";
  Game.builderMode = false;
  Sound.play("error");
}

/* Two medics do not score twice as much as one, but they do score a lot more:
   measured over the ten wards, a solo run lands around 0.38-0.54 of the co-op
   score on the same ward. Thresholds are authored for co-op, so a solo player
   held to them could not earn the single star that unlocks the next ward —
   the campaign was shut to them at ward one. Scale the ladder instead. */
const SOLO_STAR_SCALE = 0.62;

function starTargets(index) {
  if (index < 0 || !LEVELS[index] || !LEVELS[index].stars) return [];
  const th = LEVELS[index].stars;
  if (Game.playerCount >= 2) return th;
  return th.map(t => Math.round(t * SOLO_STAR_SCALE / 50) * 50);
}

function starsFor(index, score) {
  if (index < 0) return 0;
  let s = 0;
  for (const t of starTargets(index)) if (score >= t) s++;
  return s;
}

function endLevel() {
  const failed = Game.lives <= 0;
  Game.career.shifts++;
  // XP accrues from every shift, cleared or not, so a losing run still moves
  // something forward
  const xpGain = Math.round(Game.score / 10) + Game.treated * 5;
  Game.xp += xpGain;
  if (Game.treated > 0 && !failed) unlockAch("first");
  if (Game.lost === 0 && Game.treated > 0 && !failed) unlockAch("flawless");
  checkLiveAchievements();

  if (Game.daily) {
    // The Daily keeps its own best and awards nothing else: no stars, no
    // unlocks, no challenge medals. It must never be a shortcut through the
    // campaign, only a reason to come back tomorrow.
    const key = String(Game.dailyPlan ? Game.dailyPlan.day : dailyIndex());
    const prev = Game.dailyBest[key] || 0;
    const newBest = Game.score > prev;
    if (newBest) Game.dailyBest[key] = Game.score;
    Save.touch();
    Game.result = {
      failed, stars: 0, newBest, daily: true, xpGain, challenges: null, newChallenges: 0,
      name: "Daily — " + (Game.level ? Game.level.name : ""), targets: null,
      difficulty: DIFFS[Game.difficulty].name,
      score: Game.score, treated: Game.treated, lost: Game.lost,
      bestCombo: Game.bestCombo, perfects: Game.perfects, clutches: Game.clutches, t: 0
    };
    Save.touch();
    Game.screen = "results";
    Sound.play("levelend");
    return;
  }

  if (Game.endless) {
    const newBest = Game.score > Game.endlessBest;
    if (newBest) Game.endlessBest = Game.score;
    Game.result = {
      failed, stars: 0, newBest, endless: true, xpGain, challenges: null, newChallenges: 0,
      name: ENDLESS.name, targets: null,
      score: Game.score, treated: Game.treated, lost: Game.lost,
      survived: Game.time, wave: Game.wave,
      bestCombo: Game.bestCombo, perfects: Game.perfects, clutches: Game.clutches,
      t: 0
    };
    Save.touch();
  Game.screen = "results";
    Sound.play(newBest ? "newbest" : "error");
    return;
  }

  const stars = failed ? 0 : starsFor(Game.levelIndex, Game.score);
  const prog = Game.progress[Game.levelIndex];
  const newBest = Game.score > prog.best;
  if (newBest) prog.best = Game.score;
  const gainedStars = Math.max(0, stars - prog.stars);
  prog.stars = Math.max(prog.stars, stars);
  if (stars >= 1 && Game.levelIndex + 1 < LEVELS.length) Game.progress[Game.levelIndex + 1].unlocked = true;

  // shift challenges: evaluated once, then remembered on the level card
  const list = CHALLENGES[Game.levelIndex] || [];
  const met = list.map(c => challengeMet(c));
  let newChallenges = 0;
  met.forEach((ok, i) => {
    if (ok && !prog.challenges[i]) { prog.challenges[i] = true; newChallenges++; }
  });
  if (stars >= 3 && DIFFS[Game.difficulty].key === "overtime") unlockAch("overtime");
  if (totalStars() >= 15) unlockAch("stars15");
  if (totalStars() >= 30) unlockAch("stars30");
  if (totalStars() >= LEVELS.length * 3) unlockAch("stars45");

  Game.result = {
    failed, stars, newBest, gainedStars, xpGain,
    challenges: list.map((c, i) => ({ text: challengeText(c), met: met[i] })),
    newChallenges,
    difficulty: DIFFS[Game.difficulty].name,
    name: LEVELS[Game.levelIndex].name, targets: starTargets(Game.levelIndex),
    score: Game.score, treated: Game.treated, lost: Game.lost,
    bestCombo: Game.bestCombo, perfects: Game.perfects, clutches: Game.clutches,
    t: 0
  };
  Save.touch();
  Game.screen = "results";
  Sound.play(failed ? "error" : (newBest ? "newbest" : "levelend"));
}


/* =====================================================================
   ER BUILDER — wave mode.

   You design the department. Each wave is a three-minute shift; treating
   animals earns credits, and between waves you spend them on beds,
   machines and staff and place them wherever you like on the floor. The
   ward PERSISTS across waves, so the run is the story of the ER you built.
   ===================================================================== */

const BUILDER_MAP = [
  "################################",
  "#..............................#",
  "#.E............................#",
  "#..............................#",
  "#....b.b.......................#",
  "#..............................#",
  "#..............................#",
  "#.........s...................##",
  "#.........m...................##",
  "#..............................#",
  "#..............................#",
  "#.O............................#",
  "#..............................#",
  "#..............................#",
  "#..............................#",
  "################################"
];

const BUILDER_THEME = {
  floor: "#f4efe3", floorAlt: "#ebe4d4", wall: "#9fc9bd", wallTop: "#bde0d6",
  base: "#6fa79a", accent: "#48c3f0", wood: "#c99a63", leaf: "#5fb872",
  leaf2: "#83d290", pot: "#d98a5f", locker: "#a7bccb", crate: "#dcb98c",
  crate2: "#c9a173", curtain: "#bfdcee", rug: "#d6e6f2"
};

/* Escalation is deliberately gentle on arrivals and steep on variety: new
   ailments are what actually make a wave harder, because each one adds a
   whole procedure chain to juggle. Rates bottom out at values a built-up
   department can genuinely service. */
function builderWaveDef(n) {
  /* The department grows every wave, so the case mix has to keep pace or the
     later waves are just the early ones with more beds. treatableAilments
     filters this again at spawn time against what has actually been built —
     naming a condition here is an intention, not a promise. */
  const ail = ["muddypaws", "itchyears"];
  if (n >= 2) ail.push("sprainedhop");
  if (n >= 3) ail.push("staticcling", "zoomies");
  if (n >= 4) ail.push("stickypaws");
  if (n >= 5) ail.push("mysterymunch");
  if (n >= 6) ail.push("socksituation");
  if (n >= 7) ail.push("crickintail");
  if (n >= 8) ail.push("toomanytreats");
  const notes = [];
  if (n === 2) notes.push("fractures arriving");
  if (n === 3) notes.push("cardiac arrests and allergic reactions arriving");
  if (n === 4) notes.push("burns arriving · shelves now run dry");
  if (n === 5) notes.push("mystery cases arriving");
  if (n === 6) notes.push("head injuries arriving · equipment starts to jam");
  if (n === 7) notes.push("dislocations arriving");
  if (n === 8) notes.push("overdoses arriving");
  return {
    name: "Wave " + n,
    blurb: notes.length ? notes.join(" · ") : "Keep the department moving.",
    seed: (0xB0A5 + n * 7919) >>> 0,
    // 95s, not 180: three minutes of the same loop was the single most
    // repetitive thing in the game, and short waves put the build phase — the
    // part that is actually interesting — in front of the player three times
    // as often.
    duration: 95,
    // Re-derived for 95-second waves. The old curve was pitched at 3-minute
    // waves: on a short clock it barely got started before the wave ended, and
    // two bots ran 11 waves without losing anybody. It also has to outpace the
    // department itself, which gains a bed or a hire every single wave, so the
    // squeeze is deliberately steeper than it looks.
    patience: Math.max(32, 88 - n * 5.2),
    spawnStart: Math.max(3.4, 10.6 - n * 0.98),
    spawnEnd: Math.max(2.4, 7.0 - n * 0.74),
    maxWaiting: Math.min(11, 3 + Math.floor(n / 1.5)),
    ailments: ail,
    stars: null,
    restock: n >= 4,
    jams: n >= 6,
    bigExit: n >= 3,
    theme: BUILDER_THEME,
    props: ["bench", "plant", "chair", "cooler", "sign", "locker"],
    map: BUILDER_MAP,
    builder: true
  };
}

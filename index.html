function keyCap(g, label, x, y) {
  g.font = 'bold 14px "Trebuchet MS", "Segoe UI", sans-serif';
  const w = Math.max(34, g.measureText(label).width + 20);
  g.fillStyle = "rgba(255,255,255,.10)";
  roundRect(g, x, y, w, 24, 6); g.fill();
  g.strokeStyle = "rgba(255,255,255,.18)"; g.lineWidth = 1;
  roundRect(g, x, y, w, 24, 6); g.stroke();
  text(g, label, x + w / 2, y + 17, 14, PALETTE.text, "center");
}

function drawCharSelect(g) {
  /* The 3D pass has already drawn a big hero medic and a small row of six. All
     this layer does is ground them (a soft ellipse under each, so they sit on
     something instead of floating in space), label them, and show the lock-in
     state. Deliberately no panels over the models — they are the screen. */
  const top = g.createLinearGradient(0, 0, 0, 170);
  top.addColorStop(0, "rgba(8,13,22,.92)"); top.addColorStop(1, "rgba(8,13,22,0)");
  g.fillStyle = top; g.fillRect(0, 0, W, 170);
  const bot = g.createLinearGradient(0, H - 130, 0, H);
  bot.addColorStop(0, "rgba(8,13,22,0)"); bot.addColorStop(1, "rgba(8,13,22,.90)");
  g.fillStyle = bot; g.fillRect(0, H - 130, W, 130);

  text(g, "CHOOSE YOUR NURSE", W / 2, 68, 38, PALETTE.text, "center");
  text(g, Game.playerCount === 2 ? "P1: A/D + E to lock in      P2: arrows + / to lock in"
                                 : "A / D to browse      E to lock in",
       W / 2, 98, 15, PALETTE.dim, "center", "normal");

  const n = CHARACTERS.length;
  const hero = clamp(Game.charCursor[0] | 0, 0, n - 1);
  const hc = CHARACTERS[hero];

  /** Soft contact shadow. Without one, a lit model on a dark field reads as a
      cut-out sticker rather than an object. */
  const groundShade = (cx, cy, rx, alpha) => {
    const gr = g.createRadialGradient(cx, cy, 1, cx, cy, rx);
    gr.addColorStop(0, "rgba(0,0,0," + alpha + ")");
    gr.addColorStop(0.55, "rgba(0,0,0," + alpha * 0.45 + ")");
    gr.addColorStop(1, "rgba(0,0,0,0)");
    g.save(); g.translate(cx, cy); g.scale(1, 0.30); g.translate(-cx, -cy);
    g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, rx, 0, 6.283); g.fill();
    g.restore();
  };

  // --- heroes: a tinted pool in each medic's own scrub colour, then a shadow -
  const feet = PORTRAIT.heroFeet && PORTRAIT.heroFeet.length
             ? PORTRAIT.heroFeet : [{ idx: hero, pt: PORTRAIT.heroFoot }];
  const solo = feet.length === 1;
  for (const f of feet) {
    const c = CHARACTERS[f.idx], hx = f.pt.x, hFloor = f.pt.y;
    const rad = solo ? 230 : 155;
    const pool = g.createRadialGradient(hx, hFloor, 6, hx, hFloor, rad);
    pool.addColorStop(0, hexA(c.scrub, 0.24));
    pool.addColorStop(1, hexA(c.scrub, 0));
    g.save(); g.translate(hx, hFloor); g.scale(1, 0.30); g.translate(-hx, -hFloor);
    g.fillStyle = pool; g.beginPath(); g.arc(hx, hFloor, rad, 0, 6.283); g.fill();
    g.restore();
    groundShade(hx, hFloor, solo ? 96 : 66, 0.6);
  }

  // --- hero names ----------------------------------------------------------
  const nameY = H * PORTRAIT.heroBot + 6, blurbY = H * PORTRAIT.heroBot + 30;
  for (const f of feet) {
    const c = CHARACTERS[f.idx];
    const who = feet.length > 1 ? (f.idx === Game.charCursor[0] ? "P1" : "P2") : null;
    text(g, c.name.toUpperCase(), f.pt.x, nameY, solo ? 40 : 30, PALETTE.text, "center");
    text(g, c.blurb, f.pt.x, blurbY, solo ? 16 : 14, c.scrub, "center", "normal");
    if (who) text(g, who, f.pt.x, nameY - 32, 13,
                  who === "P1" ? PALETTE.p1 : PALETTE.p2, "center");
    // the trait, spelled out: a pick you cannot read is not a choice
    const tr = TRAITS[c.trait];
    if (tr) {
      const ty = blurbY + (solo ? 30 : 26);
      const w = solo ? 420 : 300;
      fillRound(g, f.pt.x - w / 2, ty - 17, w, solo ? 46 : 42, 10, hexA(c.scrub, 0.14));
      text(g, tr.name.toUpperCase(), f.pt.x, ty, solo ? 14 : 12.5, "#ffd54a", "center");
      text(g, tr.blurb, f.pt.x, ty + (solo ? 20 : 18), solo ? 13 : 11.5,
           PALETTE.dim, "center", "normal");
    }
  }

  // --- the roster row, keyed to where the models actually landed -----------
  for (let i = 0; i < n; i++) {
    const foot = PORTRAIT.rowFeet[i];
    if (!foot) continue;
    const c = CHARACTERS[i];
    const cx = foot.x, rowFloor = foot.y;
    const p1Here = Game.charCursor[0] === i;
    const p2Here = Game.playerCount === 2 && Game.charCursor[1] === i;
    const on = p1Here || p2Here;
    groundShade(cx, rowFloor, on ? 34 : 27, 0.55);
    if (on) {
      g.strokeStyle = p1Here && p2Here ? "#ffd54a" : (p1Here ? PALETTE.p1 : PALETTE.p2);
      g.lineWidth = 3;
      roundRect(g, cx - 30, rowFloor - 76, 60, 90, 12); g.stroke();
    } else {
      // a scrub-coloured pip so the roster reads as six people, not six poses
      g.fillStyle = hexA(c.scrub, 0.85);
      g.beginPath(); g.arc(cx, rowFloor + 14, 3.5, 0, 6.283); g.fill();
    }
    if (p1Here && Game.charLocked[0]) lockTag(g, "P1", PALETTE.p1, cx, rowFloor - 90);
    if (p2Here && Game.charLocked[1])
      lockTag(g, "P2", PALETTE.p2, cx, rowFloor - (p1Here && Game.charLocked[0] ? 114 : 90));
  }

  const blink = 0.55 + 0.45 * Math.sin(performance.now() / 300);
  g.save(); g.globalAlpha = blink;
  text(g, Game.playerCount === 2 ? "both nurses lock in to continue" : "lock in to continue",
       W / 2, H - 46, 17, "#ffd54a", "center");
  g.restore();
  text(g, "Esc  back to title", W / 2, H - 22, 13, PALETTE.dim, "center", "normal");
}

/** A little READY! flag under a roster portrait. */
function lockTag(g, who, color, cx, cy) {
  g.fillStyle = color;
  roundRect(g, cx - 40, cy - 12, 80, 22, 8); g.fill();
  text(g, who + "  READY!", cx, cy + 4, 12, "#10202e", "center");
}

/** "#rrggbb" plus an alpha, as an rgba() string. */
function hexA(hex, a) {
  const h = hex.replace("#", "");
  return "rgba(" + parseInt(h.slice(0, 2), 16) + "," + parseInt(h.slice(2, 4), 16)
       + "," + parseInt(h.slice(4, 6), 16) + "," + a + ")";
}

function drawOptions(g) {
  g.fillStyle = Paint.title;
  g.fillRect(0, 0, W, H);
  text(g, "OPTIONS", W / 2, 88, 42, PALETTE.text, "center");
  text(g, "W / S choose      A / D adjust      Esc back",
       W / 2, 120, 15, PALETTE.dim, "center", "normal");

  /* Row height is derived, not fixed: the list grew from six entries to ten
     when rebinding, auto-pause, the frame meter and fullscreen arrived, and a
     hard-coded 74 ran the last three rows off the bottom of the screen. */
  const x0 = W / 2 - 380, w = 760, y0 = 158;
  const avail = H - y0 - 64;
  const step = Math.min(82, Math.floor(avail / OPTION_ROWS.length));
  const rowH = step - 6;
  OPTION_ROWS.forEach((row, i) => {
    const y = y0 + i * step;
    const sel = Game.optionCursor === i;
    fillRound(g, x0, y, w, rowH, 13, sel ? "rgba(255,213,74,.10)" : "rgba(255,255,255,.045)");
    g.strokeStyle = sel ? "#ffd54a" : "rgba(255,255,255,.09)";
    g.lineWidth = sel ? 3 : 1.5;
    roundRect(g, x0, y, w, rowH, 13); g.stroke();
    text(g, row.name, x0 + 26, y + (row.blurb ? rowH * 0.42 : rowH / 2 + 7), 19, PALETTE.text);
    if (row.blurb) text(g, row.blurb, x0 + 26, y + rowH * 0.78, 13, PALETTE.dim, "left", "normal");

    const v = Options[row.key];
    if (row.kind === "action") {
      const cap = row.state ? row.state() : "GO";
      const bw = Math.max(78, 24 + cap.length * 11), bx = x0 + w - bw - 26;
      fillRound(g, bx, y + rowH / 2 - 16, bw, 32, 9,
                sel ? "rgba(255,213,74,.22)" : "rgba(255,255,255,.07)");
      g.strokeStyle = sel ? "#ffd54a" : "rgba(255,255,255,.16)"; g.lineWidth = 1.4;
      roundRect(g, bx, y + rowH / 2 - 16, bw, 32, 9); g.stroke();
      text(g, cap, bx + bw / 2, y + rowH / 2 + 6, 15,
           sel ? "#ffd54a" : PALETTE.text, "center");
    } else if (row.kind === "level") {
      const bx = x0 + w - 250, by = y + rowH / 2 - 7;
      g.fillStyle = "rgba(255,255,255,.10)";
      roundRect(g, bx, by, 168, 14, 7); g.fill();
      g.fillStyle = sel ? "#ffd54a" : "#6fd3b4";
      roundRect(g, bx, by, Math.max(6, 168 * v), 14, 7); g.fill();
      text(g, Math.round(v * 100) + "%", x0 + w - 34, y + rowH / 2 + 6, 16,
           PALETTE.text, "right");
    } else {
      const on = !!v;
      const bx = x0 + w - 132;
      fillRound(g, bx, y + rowH / 2 - 15, 100, 30, 15,
                on ? "rgba(111,211,180,.22)" : "rgba(255,255,255,.06)");
      g.fillStyle = on ? "#6fd3b4" : "#66707d";
      g.beginPath(); g.arc(on ? bx + 78 : bx + 22, y + rowH / 2, 11, 0, 6.283); g.fill();
      text(g, on ? "ON" : "OFF", on ? bx + 30 : bx + 62, y + rowH / 2 + 5, 13,
           on ? "#6fd3b4" : PALETTE.dim, "center");
    }
  });

  text(g, Save.available ? "Saved automatically" : "Not saved — this browser blocks local storage",
       W / 2, H - 44, 13, Save.available ? PALETTE.dim : "#ff8f70", "center", "normal");
}

/* The rebinding screen. Two columns, one per medic, seven actions each; the
   cursor runs down player one and then down player two so W/S alone reaches
   every row without a second axis to learn. */
function drawControls(g) {
  g.fillStyle = Paint.title;
  g.fillRect(0, 0, W, H);
  text(g, "CONTROLS", W / 2, 76, 40, PALETTE.text, "center");
  text(g, Game.rebind ? "Press any key…   Esc cancels"
                      : "W / S choose      E rebind      R restore defaults      Esc back",
       W / 2, 108, 15, Game.rebind ? "#ffd54a" : PALETTE.dim, "center", "normal");
  if (Game.rebindMsg)
    text(g, Game.rebindMsg, W / 2, 130, 14, "#ff8f70", "center", "normal");

  const n = CONTROL_ACTIONS.length;
  const colW = 430, gap = 40, rowH = 52;
  const left = W / 2 - colW - gap / 2, y0 = 170;
  for (let slot = 0; slot < 2; slot++) {
    const cx = slot === 0 ? left : left + colW + gap;
    const label = "NURSE " + (slot + 1) + (slot === 0 ? "  (left side)" : "  (right side)");
    text(g, label, cx + 18, y0 - 16, 17, slot === 0 ? "#7fb2ff" : "#ff9a8a");
    CONTROL_ACTIONS.forEach((act, i) => {
      const idx = slot * n + i;
      const y = y0 + i * (rowH + 6);
      const sel = Game.controlCursor === idx;
      const capturing = sel && !!Game.rebind;
      fillRound(g, cx, y, colW, rowH, 11,
                capturing ? "rgba(255,213,74,.18)"
                          : sel ? "rgba(255,213,74,.09)" : "rgba(255,255,255,.045)");
      g.strokeStyle = capturing ? "#ffd54a" : sel ? "rgba(255,213,74,.8)" : "rgba(255,255,255,.09)";
      g.lineWidth = sel ? 3 : 1.5;
      roundRect(g, cx, y, colW, rowH, 11); g.stroke();
      text(g, act.name, cx + 18, y + rowH / 2 + 6, 17, PALETTE.text);

      const code = CONTROLS[slot][act.key];
      const cap = capturing ? "…" : keyLabel(code);
      const bw = Math.max(64, 22 + cap.length * 11);
      fillRound(g, cx + colW - bw - 14, y + rowH / 2 - 15, bw, 30, 8,
                capturing ? "rgba(255,213,74,.25)" : "rgba(10,16,26,.55)");
      g.strokeStyle = "rgba(255,255,255,.16)"; g.lineWidth = 1.2;
      roundRect(g, cx + colW - bw - 14, y + rowH / 2 - 15, bw, 30, 8); g.stroke();
      text(g, cap, cx + colW - 14 - bw / 2, y + rowH / 2 + 6, 16,
           capturing ? "#ffd54a" : PALETTE.text, "center");
    });
  }
  text(g, "Gamepads use their own layout and need no setup. Menu keys cannot be rebound.",
       W / 2, H - 44, 13, PALETTE.dim, "center", "normal");
}

function drawPerks(g) {
  g.fillStyle = Paint.title;
  g.fillRect(0, 0, W, H);
  const stars = totalStars();

  text(g, "PERKS", W / 2, 90, 44, PALETTE.text, "center");
  drawStar(g, W / 2 - 74, 122, 11, "#ffd54a");

  text(g, "pick up to " + PERK_MAX_ACTIVE + " to bring on shift", W / 2, 156, 15, PALETTE.dim, "center", "normal");

  const rowH = 86, x0 = W / 2 - 380, w = 760, y0 = 190;
  PERKS.forEach((pk, i) => {
    const y = y0 + i * (rowH + 10);
    const unlocked = stars >= pk.stars;
    const active = Game.perksActive.includes(pk.key);
    const sel = Game.perkCursor === i;

    g.fillStyle = active ? "rgba(87,199,133,.14)" : "rgba(255,255,255,.05)";
    roundRect(g, x0, y, w, rowH, 14); g.fill();

/** Little glyphs for each perk, drawn plush-style. */
function drawPerkIcon(g, key, cx, cy, lit) {
  g.save();
  g.translate(cx, cy);
  g.globalAlpha = lit ? 1 : 0.35;
  switch (key) {
    case "bays":
      fillRound(g, -15, -10, 30, 22, 6, "#ffffff");
      g.fillStyle = "#c9e6ff"; fillRound(g, -11, -6, 22, 6, 3, "#c9e6ff");
      g.fillStyle = "#8fbfe8"; fillRound(g, -11, 2, 22, 7, 3, "#8fbfe8");
      text(g, "+", 19, 7, 22, "#57c785", "center");
      break;
    case "nurse":
      g.fillStyle = "#ffffff";
      g.beginPath(); g.arc(0, -3, 11, 0, 6.283); g.fill();
      g.fillStyle = "#ff8fa8";
      roundRect(g, -1.6, -10, 3.2, 8, 1.2); g.fill();
      roundRect(g, -4.5, -7.4, 9, 3.2, 1.2); g.fill();
      g.beginPath();
      g.moveTo(0, 13);
      g.bezierCurveTo(-8, 5, -3.5, -1, 0, 4);
      g.bezierCurveTo(3.5, -1, 8, 5, 0, 13);
      g.fill();
      break;
    case "shoes":
      fillRound(g, -14, -2, 24, 11, 5, "#7db2f2");
      fillRound(g, -14, 5, 28, 5, 2.5, "#ffffff");
      g.strokeStyle = "#dfe9f5"; g.lineWidth = 2; g.lineCap = "round";
      g.beginPath(); g.moveTo(9, -8); g.lineTo(16, -8); g.stroke();
      g.beginPath(); g.moveTo(7, -3); g.lineTo(14, -3); g.stroke();
      break;
    case "shelves":
      fillRound(g, -14, -13, 28, 26, 5, "#6fd3b4");
      g.fillStyle = "#eafff8";
      for (let i = 0; i < 3; i++) { roundRect(g, -10, -9 + i * 8, 20, 5, 2); g.fill(); }
      text(g, "+", 17, 6, 20, "#57c785", "center");
      break;
    case "charm":
      g.fillStyle = "#57c785";
      for (let i = 0; i < 4; i++) {
        const ang = i * Math.PI / 2;
        g.beginPath();
        g.ellipse(Math.cos(ang) * 6.5, Math.sin(ang) * 6.5 - 1, 5.5, 4.4, ang, 0, 6.283);
        g.fill();
      }
      g.strokeStyle = "#3d9e63"; g.lineWidth = 2; g.lineCap = "round";
      g.beginPath(); g.moveTo(1, 4); g.quadraticCurveTo(3, 10, 7, 13); g.stroke();
      break;
  }
  g.restore();
}

/** Word-wrap helper for the longer explanatory blocks. */
function wrapText(g, str, x, y, maxW, lineH, size, color) {
  g.font = 'normal ' + size + 'px "Trebuchet MS", "Segoe UI", sans-serif';
  const words = str.split(" ");
  let line = "", ly = y;
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (g.measureText(test).width > maxW && line) {
      text(g, line, x, ly, size, color, "left", "normal");
      line = w; ly += lineH;
      g.font = 'normal ' + size + 'px "Trebuchet MS", "Segoe UI", sans-serif';
    } else line = test;
  }
  if (line) text(g, line, x, ly, size, color, "left", "normal");
}

  text(g, "Wave " + B.wave + " cleared  ·  next up wave " + (B.wave + 1),
       40, 82, 15, PALETTE.dim, "left", "normal");

  // credits
  const cw = 210;
  fillRound(g, W - cw - 40, 30, cw, 60, 12, "rgba(12,20,30,.9)");
  g.strokeStyle = "rgba(111,211,180,.5)"; g.lineWidth = 2;

  if (B.placing) { drawPlacementUI(g); return; }

  // offers
  const n = B.offers.length, ow = 268, gap = 14;
  const x0 = (W - (n * ow + (n - 1) * gap)) / 2;
  for (let i = 0; i < n; i++) {
    const item = B.offers[i], x = x0 + i * (ow + gap), y = 168, h = 250;
    const sel = i === B.cursor;
    const afford = B.credits >= item.cost && !item.bought;

  // your department, at a glance
  const stats = [
    ["Baskets", Game.world.beds.length],
    ["Machines", Game.world.stations.filter(q => q.type !== "basket").length],
    ["Staff", Game.staff.length],
    ["Waiting room", Game.world.waitSlots.length],
    ["Lives", Game.lives + " / " + Game.livesMax]
  ];
  const sw = 900, sx = W / 2 - sw / 2, sy = 442;
  fillRound(g, sx, sy, sw, 56, 12, "rgba(14,22,34,.85)");
  stats.forEach((st, i) => {
    const cx2 = sx + 18 + i * (sw - 36) / stats.length;
    text(g, String(st[1]), cx2, sy + 30, 20, PALETTE.text);
    text(g, st[0], cx2, sy + 47, 11, PALETTE.dim, "left", "normal");
  });

  if (B.message && B.messageT < 4) {
    g.save();
    g.globalAlpha = clamp(4 - B.messageT, 0, 1);
    text(g, B.message, W / 2, 528, 17, "#ffd54a", "center");
    g.restore();
  }

  text(g, "A / D  choose      E  buy      Enter  start wave " + (B.wave + 1) +
          "      H  how to play",
       W / 2, H - 54, 17, PALETTE.text, "center");
  text(g, "Unspent credits carry over — you do not have to buy anything.",
       W / 2, H - 30, 13, PALETTE.dim, "center", "normal");
}

/** Placement mode: a cursor over the floor with live validity feedback. */
function drawPlacementUI(g) {
  const B = Game.builder, pl = B.placing;
  const problem = pl.item.kind === "staff"
    ? (isWalkable(Game.world, pl.x, pl.y) ? null : "Staff need open floor")
    : placementProblem(Game.world, pl.x, pl.y);

  // the cursor, projected onto the floor
  const s0 = projectToScreen(pl.x + 0.5, 0.02, pl.y + 0.5);
  const s1 = projectToScreen(pl.x + 0.5, 0.85, pl.y + 0.5);
  if (s0) {
    g.save();
    g.globalAlpha = 0.55 + 0.35 * Math.sin(performance.now() / 180);
    g.strokeStyle = problem ? "#e4573d" : "#6fd3b4";
    g.lineWidth = 4;
    g.beginPath(); g.ellipse(s0.x, s0.y, 34, 17, 0, 0, 6.283); g.stroke();
    if (s1) {
      g.beginPath(); g.moveTo(s0.x, s0.y); g.lineTo(s1.x, s1.y); g.stroke();
      drawShopIcon(g, pl.item, s1.x, s1.y - 16, 16);
    }
    g.restore();
  }

  const bw = 560, bx = W / 2 - bw / 2, by = 168;
  fillRound(g, bx, by, bw, 104, 14, "rgba(12,20,30,.94)");
  g.strokeStyle = problem ? "#e4573d" : "#6fd3b4"; g.lineWidth = 2;
  roundRect(g, bx, by, bw, 104, 14); g.stroke();
  text(g, "PLACING  " + pl.item.name.toUpperCase(), W / 2, by + 32, 19,
       problem ? "#ffb3a8" : "#6fd3b4", "center");
  text(g, problem || "Looks good — press E to install it here",
       W / 2, by + 60, 15, problem ? "#ffb3a8" : PALETTE.text, "center", "normal");
  text(g, "tile " + pl.x + ", " + pl.y, W / 2, by + 84, 12, PALETTE.dim, "center", "normal");

  text(g, "W A S D  move      E  place      Q or Esc  cancel",
       W / 2, H - 54, 17, PALETTE.text, "center");
}

/** Small pictogram per shop line so the cards are scannable. */
function drawShopIcon(g, item, x, y, r) {
  g.save();
  g.translate(x, y);
  if (item.kind === "station") {
    const col = STATIONS[item.station] ? STATIONS[item.station].color : "#8fd0f0";
    fillRound(g, -r, -r * 0.8, r * 2, r * 1.6, r * 0.3, col);
    if (item.station === "basket") {
      g.fillStyle = "#ffffff";
      fillRound(g, -r * 0.8, -r * 0.6, r * 1.6, r * 0.5, r * 0.2, "#ffffff");
    } else {
      g.strokeStyle = "rgba(255,255,255,.85)"; g.lineWidth = 2; g.lineCap = "round";
      g.beginPath(); g.moveTo(-r * 0.5, 0); g.lineTo(r * 0.5, 0); g.stroke();
    }
  } else if (item.kind === "staff") {
    const L = STAFF_LOOK[item.role];
    g.fillStyle = L ? L.body : "#ffb3c0";
    g.beginPath(); g.arc(0, r * 0.35, r * 0.7, 0, 6.283); g.fill();
    g.fillStyle = "#f2c898";
    g.beginPath(); g.arc(0, -r * 0.5, r * 0.55, 0, 6.283); g.fill();
    g.fillStyle = L ? L.cap : "#ffd7e0";
    g.beginPath(); g.arc(0, -r * 0.72, r * 0.52, Math.PI, 0); g.fill();
  } else if (item.kind === "waitslot") {
    fillRound(g, -r, -r * 0.1, r * 2, r * 0.35, r * 0.15, "#c99a63");
    fillRound(g, -r, -r * 0.75, r * 2, r * 0.4, r * 0.15, "#c99a63");
  } else {
    drawStar(g, 0, 0, r * 0.9, "#ffd54a");
  }
  g.restore();
}

function drawMedalsScreen(g) {
  g.fillStyle = Paint.title;
  g.fillRect(0, 0, W, H);
  text(g, "CAREER", W / 2, 62, 38, PALETTE.text, "center");

  const got = ACHIEVEMENTS.filter(a => Game.achievements[a.key]).length;
  text(g, got + " / " + ACHIEVEMENTS.length + " achievements   ·   " +
       Game.career.treated + " animals sent home   ·   " +
       Game.career.shifts + " shifts   ·   " + Game.xp + " XP",
       W / 2, 92, 16, PALETTE.dim, "center", "normal");

  const cols = 2, cw = 560, ch = 58, gap = 16;
  const x0 = W / 2 - (cols * cw + (cols - 1) * gap) / 2;
  ACHIEVEMENTS.forEach((a, i) => {
    const cx = x0 + (i % cols) * (cw + gap);
    const cy = 124 + Math.floor(i / cols) * (ch + 10);
    const on = !!Game.achievements[a.key];
    fillRound(g, cx, cy, cw, ch, 12, on ? "rgba(255,213,74,.10)" : "rgba(255,255,255,.035)");
    g.strokeStyle = on ? "rgba(255,213,74,.45)" : "rgba(255,255,255,.06)";
    g.lineWidth = 1.5;
    roundRect(g, cx, cy, cw, ch, 12); g.stroke();
    drawStar(g, cx + 32, cy + ch / 2, 15, on ? "#ffd54a" : "rgba(255,255,255,.10)");
    text(g, a.name, cx + 60, cy + 25, 17, on ? PALETTE.text : "#57657a");
    text(g, a.blurb, cx + 60, cy + 44, 13, on ? PALETTE.dim : "#44515f", "left", "normal");
  });

  // save state, and the wipe. Saying whether progress is being kept matters:
  // if localStorage is unavailable the player should know BEFORE they invest an
  // evening in it, not after.
  if (Game.wipeDone > 0) {
    text(g, "Save erased.", W / 2, H - 62, 15, "#ff8f70", "center");
  } else if (!Save.available) {
    text(g, "Progress is not being saved — this browser is blocking local storage.",
         W / 2, H - 62, 13, "#ff8f70", "center", "normal");
  } else if (Game.wipeHold > 0) {
    const f = clamp(Game.wipeHold / WIPE_HOLD, 0, 1);
    g.fillStyle = "rgba(255,255,255,.10)";
    roundRect(g, W / 2 - 120, H - 74, 240, 10, 5); g.fill();
    g.fillStyle = "#ff8f70";
    roundRect(g, W / 2 - 120, H - 74, 240 * f, 10, 5); g.fill();
    text(g, "keep holding to erase everything", W / 2, H - 54, 13, "#ff8f70", "center", "normal");
  } else {
    text(g, "Progress saves automatically   ·   hold  X  to erase it",
         W / 2, H - 62, 13, PALETTE.dim, "center", "normal");
  }
  text(g, "Esc  back", W / 2, H - 30, 16, PALETTE.text, "center");
}

function drawSelect(g) {
  // The two special slots (endless, builder) sit outside the LEVELS array and
  // are navigated by hand, so an out-of-range cursor is one edit away from
  // throwing on selDef.blurb. Clamping here keeps the screen drawable whatever
  // the navigation does.
  Game.selectIndex = clamp(Game.selectIndex | 0, 0, DAILY_SLOT());
  g.fillStyle = Paint.title;
  g.fillRect(0, 0, W, H);

  const stars = totalStars();
  text(g, "SELECT A SHIFT", W / 2, 62, 38, PALETTE.text, "center");

  // measured, centred status line: ★ n/30 · Rank · Mode
  g.font = 'bold 16px "Trebuchet MS", "Segoe UI", sans-serif';
  const parts = [
    { t: stars + " / " + (LEVELS.length * 3), c: "#ffd54a" },
    { t: "·", c: PALETTE.dim },
    { t: rankName(), c: PALETTE.text },
    { t: "·", c: PALETTE.dim },
    { t: Game.playerCount === 1 ? "Solo — eased" : "Co-op", c: PALETTE.dim },
    { t: "·", c: PALETTE.dim },
    { t: DIFFS[Game.difficulty].name, c: DIFFS[Game.difficulty].color }
  ];
  const GAPX = 10, STARW = 26;
  let lineW = STARW;
  for (const pp of parts) lineW += g.measureText(pp.t).width + GAPX;
  let lx = W / 2 - lineW / 2;
  drawStar(g, lx + 8, 82, 11, "#ffd54a");
  lx += STARW;
  for (const pp of parts) {
    text(g, pp.t, lx, 88, 16, pp.c);
    lx += g.measureText(pp.t).width + GAPX;
    g.font = 'bold 16px "Trebuchet MS", "Segoe UI", sans-serif';
  }
  // say out loud that solo is a different set of numbers, so a player coming
  // from co-op does not read the easier shift as something being broken
  if (Game.playerCount === 1)
    text(g, "Playing alone: animals wait longer, you get a fourth life, "
          + "and the score targets are set for one nurse.",
         W / 2, 106, 12, "#6fd3b4", "center", "normal");

  /* The grid used to assume exactly two rows, which broke the moment the
     campaign grew past ten wards: the special-mode row was pinned to row 2 and
     the cards ran off the bottom. Derive the card height from however many rows
     the current LEVELS array needs, so adding wards never needs a layout edit
     again. drawLevelCard lays its contents out from cardH for the same reason. */
  const gap = 12;
  const rows = Math.ceil(LEVELS.length / SELECT_COLS);
  const gridTop = 118, gridBottom = H - 168;      // leaves room for the mode row
  const cardH = Math.min(192, Math.floor((gridBottom - gridTop - (rows - 1) * gap) / rows));
  const cardW = Math.min(210, Math.floor((1112 - (SELECT_COLS - 1) * gap) / SELECT_COLS));
  const total = SELECT_COLS * cardW + (SELECT_COLS - 1) * gap;
  const x0 = (W - total) / 2;

  for (let i = 0; i < LEVELS.length; i++) {
    const col = i % SELECT_COLS, row = Math.floor(i / SELECT_COLS);
    drawLevelCard(g, i, x0 + col * (cardW + gap), gridTop + row * (cardH + gap), cardW, cardH);
  }

  // the two special modes, side by side
  // three mode cards now: endless, builder, daily
  const ey = gridTop + rows * (cardH + gap) + 4, ew = 356, eh = 66, egap = 12;
  const ex = W / 2 - ew * 1.5 - egap;
  const bx2 = W / 2 - ew / 2;
  const dx2 = W / 2 + ew / 2 + egap;
  const selB = Game.selectIndex === BUILDER_SLOT();
  const openB = builderUnlocked();
  g.fillStyle = openB ? "rgba(111,211,180,.16)" : "rgba(255,255,255,.03)";
  roundRect(g, bx2, ey, ew, eh, 14); g.fill();
  g.strokeStyle = selB ? "#ffd54a" : (openB ? "rgba(111,211,180,.6)" : "rgba(255,255,255,.07)");
  g.lineWidth = selB ? 4 : 1.5;
  roundRect(g, bx2, ey, ew, eh, 14); g.stroke();
  drawShopIcon(g, { kind: "station", station: "basket" }, bx2 + 32, ey + 33, 14);
  text(g, "CLINIC BUILDER — waves", bx2 + 58, ey + 30, 18, openB ? PALETTE.text : "#4a5666");
  text(g, openB ? "Build the department between waves." + (Game.builderBest
                    ? "   Best wave  " + Game.builderBest : "")
                : "Unlocks at " + BUILDER_UNLOCK + " stars (you have " + stars + ")",
       bx2 + 58, ey + 50, 13, PALETTE.dim, "left", "normal");

  const selE = Game.selectIndex === ENDLESS_SLOT();
  const openE = endlessUnlocked();
  g.fillStyle = openE ? "rgba(155,93,229,.16)" : "rgba(255,255,255,.03)";
  roundRect(g, ex, ey, ew, eh, 14); g.fill();
  g.strokeStyle = selE ? "#ffd54a" : (openE ? "rgba(155,93,229,.6)" : "rgba(255,255,255,.07)");
  g.lineWidth = selE ? 4 : 1.5;
  roundRect(g, ex, ey, ew, eh, 14); g.stroke();
  text(g, "∞", ex + 30, ey + 46, 30, openE ? "#c39bff" : "#3a4453", "center");
  text(g, "NIGHT SHIFT — endless", ex + 56, ey + 30, 18, openE ? PALETTE.text : "#4a5666");
  text(g, openE ? "No clock. Arrivals tighten forever.   Best  " + Game.endlessBest
                : "Unlocks at " + ENDLESS_UNLOCK + " stars (you have " + stars + ")",
       ex + 56, ey + 50, 13, PALETTE.dim, "left", "normal");

  /* Daily Shift: one ward, one modifier, the same for everyone today. Named on
     the card so you can decide whether today's combination appeals before you
     spend two minutes on it. */
  const plan = dailyPlan(dailyIndex());
  const selD = Game.selectIndex === DAILY_SLOT();
  const dBest = Game.dailyBest[String(plan.day)] || 0;
  g.fillStyle = "rgba(240,176,60,.16)";
  roundRect(g, dx2, ey, ew, eh, 14); g.fill();
  g.strokeStyle = selD ? "#ffd54a" : "rgba(240,176,60,.6)";
  g.lineWidth = selD ? 4 : 1.5;
  roundRect(g, dx2, ey, ew, eh, 14); g.stroke();
  drawStar(g, dx2 + 30, ey + 33, 13, "#f0b03c");
  text(g, "DAILY SHIFT", dx2 + 54, ey + 28, 17, PALETTE.text);
  text(g, LEVELS[plan.ward].name + "  ·  " + plan.mod.name
        + (dBest ? "   Best  " + dBest : ""),
       dx2 + 54, ey + 48, 12.5, PALETTE.dim, "left", "normal");

  /* Every slot the cursor can reach needs an entry here. The Daily card was
     added to the navigation and to the clamp above but not to this chain, so
     highlighting it fell through to LEVELS[17] — undefined — and the screen
     threw on .blurb every frame until the armour bailed to the title. The
     trailing ENDLESS is a belt-and-braces default: a future slot that forgets
     this list draws the wrong blurb instead of taking the screen down. */
  const selDef = Game.selectIndex === ENDLESS_SLOT() ? ENDLESS
               : Game.selectIndex === BUILDER_SLOT() ? builderWaveDef(1)
               : Game.selectIndex === DAILY_SLOT() ? dailyDef(plan)
               : (LEVELS[Game.selectIndex] || ENDLESS);
  text(g, selDef.blurb, W / 2, ey + 104, 16, PALETTE.dim, "center", "normal");

  // the three shift challenges for whatever is highlighted
  if (Game.selectIndex < LEVELS.length) {
    const list = CHALLENGES[Game.selectIndex] || [];
    const done = Game.progress[Game.selectIndex].challenges;
    const cw = 700, cx = W / 2 - cw / 2, cy = ey + 118;
    fillRound(g, cx, cy, cw, 62, 12, "rgba(255,255,255,.04)");
    text(g, "SHIFT CHALLENGES", cx + 14, cy + 19, 11, "#ffd54a");
    list.forEach((c, i) => {
      const tx = cx + 14 + i * (cw - 28) / 3;
      const on = done[i];
      drawMedals(g, null, [on], tx + 7, cy + 42, 7, 1);
      text(g, challengeText(c), tx + 20, cy + 46, 12,
           on ? "#ffd54a" : PALETTE.dim, "left", "normal");
    });
  }

  text(g, "A / D  choose    W / S  row    E  start    P  perks" +
       (Game.perksActive.length ? " (" + Game.perksActive.length + ")" : "") +
       "    T  " + DIFFS[Game.difficulty].name + "    C  medals    H  how to play    Esc  back",
       W / 2, ey + 200, 15, PALETTE.text, "center");

  const saveLevel = Game.level;
  Game.level = selDef;
  drawLegend(g);
  Game.level = saveLevel;
}

function drawLevelCard(g, i, x, y, cardW, cardH) {
  const lvl = LEVELS[i], prog = Game.progress[i];
  const sel = i === Game.selectIndex;
  const locked = !prog.unlocked || demoLocked(i);

  g.fillStyle = locked ? "rgba(255,255,255,.025)" : "rgba(255,255,255,.06)";
  roundRect(g, x, y, cardW, cardH, 13); g.fill();
  g.strokeStyle = sel ? "#ffd54a" : "rgba(255,255,255,.08)";
  g.lineWidth = sel ? 4 : 1.5;
  roundRect(g, x, y, cardW, cardH, 13); g.stroke();

  /* Everything below is measured off cardH so the card stays legible at any
     grid size — the select screen shrinks the cards as the campaign grows. */
  const tall = cardH >= 168;
  const head = tall ? 30 : 25;
  const num = String(i + 1);
  const numSize = tall ? 22 : 18, nameSize = tall ? 15 : 13;
  text(g, num, x + 12, y + head, numSize, locked ? "#3d4a5c" : "#48c3f0");
  g.font = 'bold ' + numSize + 'px "Trebuchet MS", "Segoe UI", sans-serif';
  const numW = g.measureText(num).width;
  text(g, lvl.name, x + 18 + numW + 6, y + head - 1, nameSize, locked ? "#4a5666" : PALETTE.text);

  // mini map — sized to whatever vertical room is left under the header
  const footer = tall ? 62 : 52;
  const my = y + head + 12;
  let mh = Math.max(30, cardH - (head + 12) - footer);
  let mw = mh * (COLS / ROWS);
  if (mw > cardW - 24) { mw = cardW - 24; mh = mw * (ROWS / COLS); }
  const mx = x + (cardW - mw) / 2;
  g.fillStyle = "#4e8172";
  roundRect(g, mx - 3, my - 3, mw + 6, mh + 6, 5); g.fill();
  const px = mw / COLS, py = mh / ROWS;
  for (let ty = 0; ty < ROWS; ty++) {
    for (let tx = 0; tx < COLS; tx++) {
      const ch = lvl.map[ty][tx];
      let col;
      if (ch === "#") col = "#63a897";
      else if (ch === "b") col = "#ffffff";
      else if (ch === "E") col = "#5cb8e6";
      else if (ch === "O") col = "#63cf8e";
      else if (CHAR_TO_STATION[ch]) col = STATIONS[CHAR_TO_STATION[ch]].color;
      else col = "#efe6d4";
      g.fillStyle = locked ? "#1c222a" : col;
      g.fillRect(mx + tx * px, my + ty * py, Math.ceil(px), Math.ceil(py));
    }
  }

  const fy = my + mh + (tall ? 18 : 15);
  let ix = x + 16;
  for (const key of lvl.ailments) {
    g.globalAlpha = locked ? 0.25 : 1;
    drawAilmentIcon(g, key, ix, fy, tall ? 8 : 7);
    g.globalAlpha = 1;
    ix += tall ? 21 : 18;
  }

  // the ward's live systems, so the escalation is visible before you commit
  const sys = wardSystems(lvl);
  sys.forEach((sy, k) => {
    g.globalAlpha = locked ? 0.3 : 1;
    g.fillStyle = sy.col;
    roundRect(g, x + 16 + k * 12, fy + (tall ? 10 : 8), 8, 4, 2); g.fill();
    g.globalAlpha = 1;
  });

  for (let s2 = 0; s2 < 3; s2++) {
    drawStar(g, x + cardW - 58 + s2 * 19, fy, tall ? 9 : 8,
      locked ? "#242c36" : (prog.stars > s2 ? "#ffd54a" : "rgba(255,255,255,.14)"));
  }
  text(g, locked ? "LOCKED" : "Best  " + prog.best, x + cardW / 2, fy + (tall ? 22 : 19),
    tall ? 13 : 12, locked ? "#4a5666" : PALETTE.dim, "center", "normal");
  if (!locked) drawMedals(g, null, prog.challenges, x + cardW / 2 - 20,
                          fy + (tall ? 38 : 33), tall ? 7 : 6);
}

function drawPause(g) {
  g.fillStyle = "rgba(8,12,18,.80)"; g.fillRect(0, 0, W, H);
  g.fillStyle = "rgba(255,255,255,.05)";
  roundRect(g, W / 2 - 250, 220, 500, 320, 18); g.fill();
  g.strokeStyle = "rgba(255,255,255,.10)"; g.lineWidth = 1.5;
  roundRect(g, W / 2 - 250, 220, 500, 320, 18); g.stroke();
  text(g, "PAUSED", W / 2, 288, 42, PALETTE.text, "center");
  /* When the game paused itself, say so. A shift that froze on its own with no
     explanation reads as a bug, and the two reasons it happens — alt-tab and a
     pad going flat — are exactly the moments a player is not looking. */
  if (Game.pauseReason)
    text(g, Game.pauseReason, W / 2, 312, 15, "#ffd54a", "center", "normal");
  const rows = [["Esc", "resume"], ["R", "restart this shift"], ["H", "how to play"],
                ["M", "sound " + (Sound.muted ? "on" : "off")], ["O", "options"],
                ["L", "back to level select"]];
  rows.forEach((r, i) => {
    const y = 336 + i * 40;
    keyCap(g, r[0], W / 2 - 150, y - 17);
    text(g, r[1], W / 2 - 80, y, 19, PALETTE.dim, "left", "normal");
  });
}

function drawResults(g) {
  const r = Game.result;
  // near-opaque: the live HUD and the ward behind were bleeding through the
  // card and competing with the numbers you are meant to be reading
  g.fillStyle = "rgba(8,12,18,.95)"; g.fillRect(0, 0, W, H);

  if (!r.failed && (r.stars === 3 || r.newBest)) {
    const colors = ["#ffd54a", "#48c3f0", "#4ec97a", "#ff7ab8", "#b58bff"];
    for (let i = 0; i < 60; i++) {
      const h1 = Math.sin(i * 999.7) * 0.5 + 0.5;      // stable pseudo-randoms
      const h2 = Math.sin(i * 337.3) * 0.5 + 0.5;
      const h3 = Math.sin(i * 741.1) * 0.5 + 0.5;
      const fall = ((r.t * (40 + h2 * 90) + h1 * H) % (H + 40)) - 20;
      const cx2 = h1 * W + Math.sin(r.t * 2 + i) * 26;
      g.save();
      g.translate(cx2, fall);
      g.rotate(r.t * (1 + h3 * 3) + i);
      g.fillStyle = colors[i % colors.length];
      g.globalAlpha = 0.85;
      g.fillRect(-4, -2.5, 8, 5);
      g.restore();
    }
  }

  g.fillStyle = "rgba(19,26,37,.96)";
  roundRect(g, W / 2 - 330, 74, 660, 690, 20); g.fill();
  g.strokeStyle = r.failed ? "rgba(228,87,61,.45)" : "rgba(63,182,232,.40)";
  g.lineWidth = 2;
  roundRect(g, W / 2 - 330, 74, 660, 690, 20); g.stroke();

  text(g, r.failed ? "SHIFT LOST" : "SHIFT OVER", W / 2, 138, 44, r.failed ? PALETTE.bad : PALETTE.text, "center");
  text(g, r.name || "", W / 2, 166, 17, PALETTE.dim, "center", "normal");

  if (r.builder) {
    text(g, "WAVE " + r.wave, W / 2, 240, 52, "#6fd3b4", "center");
    text(g, r.newBest ? "YOUR DEEPEST RUN YET" : "THE DEPARTMENT FELL", W / 2, 266, 13, PALETTE.dim, "center");
  } else if (r.endless) {
    text(g, fmtTime(r.survived), W / 2, 236, 52, "#8be9ff", "center");
    text(g, "SURVIVED  ·  " + r.wave + " waves", W / 2, 262, 14, PALETTE.dim, "center");
  } else {
    for (let i = 0; i < 3; i++) {
      const lit = i < r.stars && r.t > 0.4 + i * 0.35;
      const pop = lit ? 1 + 0.25 * Math.max(0, 1 - (r.t - (0.4 + i * 0.35)) * 4) : 1;
      g.save();
      g.translate(W / 2 - 92 + i * 92, 240); g.scale(pop, pop);
      drawStar(g, 0, 0, lit ? 38 : 32, lit ? "#ffd54a" : "rgba(255,255,255,.11)");
      g.restore();
    }
  }

  text(g, String(r.score), W / 2, 340, 54, PALETTE.text, "center");
  text(g, "FINAL SCORE", W / 2, 364, 13, PALETTE.dim, "center");
  if (r.newBest) {
    const b = 0.6 + 0.4 * Math.sin(performance.now() / 180);
    g.save(); g.globalAlpha = b;
    text(g, "NEW BEST!", W / 2, 392, 22, "#ffd54a", "center");
    g.restore();
  } else if (r.gainedStars > 0) {
    text(g, "+" + r.gainedStars + (r.gainedStars === 1 ? " NEW STAR" : " NEW STARS"),
         W / 2, 392, 20, "#ffd54a", "center");
  }

  const stats = r.builder ? [
    ["Animals sent home", String(r.treated)],
    ["Trotted off in a huff", String(r.lost)],
    ["Credits earned", String(r.spent || 0)],
    ["Things built", String(r.built || 0)],
    ["Staff hired", String(r.staff || 0)]
  ] : [
    ["Animals sent home", String(r.treated)],
    ["Trotted off in a huff", String(r.lost)],
    ["Best chain", "x" + (r.bestCombo || 0)],
    ["Perfect send-offs", String(r.perfects || 0)],
    ["Clutch saves", String(r.clutches || 0)]
  ];
  stats.forEach((s2, i) => {
    const y = 430 + i * 30;
    text(g, s2[0], W / 2 - 250, y, 16, PALETTE.dim, "left", "normal");
    g.fillStyle = "rgba(255,255,255,.06)";
    g.fillRect(W / 2 - 250, y + 6, 500, 1);
    text(g, s2[1], W / 2 + 250, y, 16, PALETTE.text, "right");
  });

  // shift challenges, ticked off
  if (r.challenges) {
    text(g, "SHIFT CHALLENGES", W / 2, 612, 11, "#ffd54a", "center");
    r.challenges.forEach((c, i) => {
      const cy = 632 + i * 21;
      drawMedals(g, null, [c.met], W / 2 - 236, cy - 4, 7, 1);
      text(g, c.text, W / 2 - 220, cy, 13, c.met ? "#ffd54a" : PALETTE.dim, "left", "normal");
    });
  }
  if (r.xpGain) {
    text(g, "+" + r.xpGain + " XP", W / 2 + 236, 632, 15, "#8be9ff", "right");
    if (r.difficulty) text(g, r.difficulty, W / 2 + 236, 653, 12, PALETTE.dim, "right", "normal");
  }

  if (r.targets) {
    text(g, "Targets  " + r.targets.join("  /  "), W / 2, 706, 14, PALETTE.dim, "center", "normal");
    // The near-miss line is the whole "one more go" hook: knowing you were 180
    // points off three stars is far more motivating than a bare target list.
    const next = r.targets[r.stars];
    if (next !== undefined) {
      const gap = next - r.score;
      const label = "\u2605".repeat(r.stars + 1);
      g.save();
      g.globalAlpha = 0.75 + 0.25 * Math.sin(performance.now() / 300);
      text(g, gap > 0 ? gap + " more for " + label : "next up: " + label,
           W / 2, 728, 16, "#ffd54a", "center");
      g.restore();
    }
  }
  text(g, "E / Enter  continue          R  retry", W / 2, 752, 19, PALETTE.text, "center");
}


/* ---------------------------------------------------------------------
   World-space UI: 2D badges, bars and prompts projected from 3D.
   --------------------------------------------------------------------- */

function drawWorldUI(g) {
  const world = Game.world;

  // --- station status: stock pips and jam warnings ---
  for (const st of world.stations) {
    if (st.type === "basket") continue;
    const info = STATIONS[st.type];
    if (st.stock !== Infinity && st.stock !== undefined && info.stockMax) {
      const s = projectToScreen(st.x + 0.5, 1.05, st.y + 0.5);
      if (s) {
        const max = Math.max(info.stockMax, st.stock);
        const w = max * 8;
        for (let i = 0; i < max; i++) {
          g.fillStyle = i < st.stock ? "#eafff6" : "rgba(20,30,40,.55)";
          roundRect(g, s.x - w / 2 + i * 8, s.y - 4, 5, 5, 1.5); g.fill();
        }
      }
    }
    if (st.jammed) {
      const s = projectToScreen(st.x + 0.5, 1.35, st.y + 0.5);
      if (s) {
        g.save();
        g.globalAlpha = 0.6 + 0.4 * Math.sin(performance.now() / 90);
        fillRound(g, s.x - 13, s.y - 13, 26, 26, 8, PALETTE.warn);
        text(g, "!", s.x, s.y + 7, 20, "#3a2a00", "center");
        g.restore();
      }
    }
  }

  // --- focus rings on whatever each medic faces ---
  for (const p of Game.players) {
    const st = facingStation(world, p, () => true);
    if (!st) continue;
    const s = projectToScreen(st.x + 0.5, 0.02, st.y + 0.5);
    if (!s) continue;
    g.save();
    g.globalAlpha = 0.34 + 0.16 * Math.sin(performance.now() / 260);
    g.strokeStyle = p.color; g.lineWidth = 3;
    g.beginPath(); g.ellipse(s.x, s.y, 26, 13, 0, 0, 6.283); g.stroke();
    g.restore();
  }

  // --- animals ---
  for (const pt of Game.patients) {
    if (pt.state === "gone") continue;
    const carried = pt.state === "carried";
    const carrier = carried ? Game.players.find(q => q.patient === pt) : null;
    if (carried && !carrier) continue;
    const inBed = pt.station && pt.station.type === "basket";
    const wx = (carried ? carrier.x : pt.x) * T2W;
    const wz = (carried ? carrier.y : pt.y) * T2W;
    // clear of the head, not painted across it. The plush rebuild grew the head,
    // so a standing patient's crown now sits near 2.1 world units at CHAR_SCALE
    // and the badge has to clear the ears above that.
    const wy = carried ? 2.72 : (inBed ? bedTopY() + 1.58 : 2.56);
    const s = projectToScreen(wx, wy, wz);
    if (!s) continue;
    drawPatientTag(g, pt, s.x, s.y, carried ? 0.8 : 1);
  }

  // --- medics: prompts, work bars, stamina ---
  for (const p of Game.players) {
    const s = projectToScreen(p.x * T2W, 0.02, p.y * T2W);
    if (!s) continue;
    const lane = p.index * 32;
    if (p.boostT > 0) {
      const k = PICKUP_KINDS.find(q => q.key === p.boost);
      const col = k ? k.color : "#ffd54a";
      g.save();
      g.globalAlpha = p.boostT < 2 ? 0.45 + 0.55 * Math.abs(Math.sin(performance.now() / 110)) : 1;
      fillRound(g, s.x - 26, s.y - 74, 52, 15, 7, "rgba(14,22,34,.82)");
      g.fillStyle = col;
      roundRect(g, s.x - 24, s.y - 72, 48 * clamp(p.boostT / (k ? k.dur : 10), 0, 1), 11, 5); g.fill();
      text(g, p.boost === "coffee" ? "SPEED" : "ADRENALINE", s.x, s.y - 63, 9, "#10202e", "center");
      g.restore();
    }
    /* Which medic is yours is signalled only by scrub colour, which is exactly
       the kind of thing that fails for a colourblind player in a two-player
       game. With marks on, each one carries its slot number. */
    if (Options.marks && Game.players.length > 1) {
      const tag = "P" + (p.index + 1);
      g.fillStyle = "rgba(10,16,26,.86)";
      roundRect(g, s.x - 11, s.y - 40, 22, 15, 5); g.fill();
      g.strokeStyle = p.color; g.lineWidth = 1.5;
      roundRect(g, s.x - 11, s.y - 40, 22, 15, 5); g.stroke();
      text(g, tag, s.x, s.y - 29, 11, "#eaf2ff", "center");
    }
    if (p.stamina !== undefined && p.stamina < Game.staminaMax - 0.02) {
      const f = clamp(p.stamina / Game.staminaMax, 0, 1);
      g.fillStyle = "rgba(14,22,34,.7)";
      roundRect(g, s.x - 13, s.y + 4, 26, 4, 2); g.fill();
      g.fillStyle = f > 0.25 ? "#8be9ff" : "#ff9a6a";
      roundRect(g, s.x - 12, s.y + 5, 24 * f, 2, 1); g.fill();
    }
    if (p.work) {
      const f = clamp(p.work.t / p.work.dur, 0, 1);
      const bx = s.x - 26, by = s.y + 12 + lane;
      g.fillStyle = "rgba(14,22,34,.82)";
      roundRect(g, bx - 2, by - 2, 56, 11, 4); g.fill();
      const gr = g.createLinearGradient(bx, 0, bx + 52, 0);
      gr.addColorStop(0, "#ffd54a"); gr.addColorStop(1, "#fff3b0");
      g.fillStyle = gr;
      roundRect(g, bx, by, 52 * f, 7, 3); g.fill();
      labelPill(g, p.work.label, s.x, by + 13, "#eaf2ff");
    } else if (p.hintT > 0) {
      g.save();
      g.globalAlpha = clamp(p.hintT, 0, 1);
      labelPill(g, p.hint, s.x, s.y + 12 + lane, "#ffd9a0");
      g.restore();
    } else if (p.promptE || p.promptQ) {
      const keys = p.index === 0 ? ["E", "Q"] : ["/", "."];
      let py = s.y + 12 + lane;
      if (p.promptQ) { promptPill(g, keys[1], p.promptQ, s.x, py, "#ffe28a"); py += 17; }
      if (p.promptE) promptPill(g, keys[0], p.promptE, s.x, py, "#a8dcff");
    }
    // exit arrow while carrying someone treated
    if (p.patient && p.patient.done) {
      const ex = projectToScreen(world.exit.x + 0.5, 0.02, world.exit.y + 0.5);
      if (ex) {
        const ang = Math.atan2(ex.y - s.y, ex.x - s.x);
        const rr = 46 + Math.sin(performance.now() / 160) * 5;
        g.save();
        g.translate(s.x + Math.cos(ang) * rr, s.y + Math.sin(ang) * rr);
        g.rotate(ang);
        g.fillStyle = "#3fbf72";
        g.strokeStyle = "rgba(10,30,20,.5)"; g.lineWidth = 1.5;
        g.beginPath();
        g.moveTo(10, 0); g.lineTo(-6, -9); g.lineTo(-1, 0); g.lineTo(-6, 9);
        g.closePath(); g.fill(); g.stroke();
        g.restore();
      }
    }
  }

  // --- shutters: warn before they drop ---
  for (const sh of (world.shutters || [])) {
    const left = shutterCountdown(sh);
    if (sh.closed || left > SHUTTER_WARN) continue;
    const c = sh.cells[Math.floor(sh.cells.length / 2)];
    const s2 = projectToScreen(c.x + 0.5, 1.5, c.y + 0.5);
    if (!s2) continue;
    g.save();
    g.globalAlpha = 0.55 + 0.45 * Math.sin(performance.now() / 90);
    fillRound(g, s2.x - 30, s2.y - 10, 60, 20, 6, PALETTE.warn);
    text(g, "CLOSING", s2.x, s2.y + 5, 11, "#3a2a00", "center");
    g.restore();
  }

  // --- beds awaiting turnover ---
  for (const bd of world.beds) {
    if (!bd.dirty) continue;
    const s2 = projectToScreen(bd.x + 0.5, 1.05, bd.y + 0.5);
    if (!s2) continue;
    if (bd.clean > 0.02) {
      const f = clamp(bd.clean / BED_CLEAN_TIME, 0, 1);
      fillRound(g, s2.x - 24, s2.y - 5, 48, 8, 3, "rgba(14,22,34,.82)");
      g.fillStyle = "#8be9ff";
      roundRect(g, s2.x - 23, s2.y - 4, 46 * f, 6, 2); g.fill();
    } else {
      g.save();
      g.globalAlpha = 0.55 + 0.3 * Math.sin(performance.now() / 420 + bd.x);
      fillRound(g, s2.x - 15, s2.y - 9, 30, 17, 5, "rgba(150,120,90,.92)");
      text(g, "↻", s2.x, s2.y + 4, 14, "#2a1f14", "center");
      g.restore();
    }
  }

  // --- spills: only worth a label while someone is cleaning one ---
  for (const sp of Game.spills) {
    if (sp.mop <= 0.02) continue;
    const s2 = projectToScreen(sp.tx + 0.5, 0.05, sp.ty + 0.5);
    if (!s2) continue;
    const f = clamp(sp.mop / SPILL_MOP, 0, 1);
    fillRound(g, s2.x - 22, s2.y - 4, 44, 7, 3, "rgba(14,22,34,.8)");
    g.fillStyle = "#8be9ff";
    roundRect(g, s2.x - 21, s2.y - 3, 42 * f, 5, 2); g.fill();
  }

  // --- who is who among the hired staff ---
  for (const st of Game.staff) {
    const L = STAFF_LOOK[st.role];
    if (!L) continue;
    const sp = projectToScreen(st.x * T2W, 2.30, st.y * T2W);
    if (!sp) continue;
    g.font = 'bold 10px "Trebuchet MS", "Segoe UI", sans-serif';
    const w = g.measureText(L.label).width + 14;
    fillRound(g, sp.x - w / 2, sp.y - 9, w, 16, 5, "rgba(12,20,30,.8)");
    text(g, L.label, sp.x, sp.y + 3, 10, L.body, "center");
  }

  // --- floating score popups ---
  for (const p of Game.popups) {
    const s = projectToScreen(p.x * T2W, 1.0 + p.t * 0.5, p.y * T2W);
    if (!s) continue;
    g.globalAlpha = clamp(1 - p.t / p.life, 0, 1) * clamp(p.t * 6, 0, 1);
    const rise = 1 + 0.25 * clamp(1 - p.t * 4, 0, 1);
    g.save();
    g.translate(s.x, s.y); g.scale(rise, rise);
    text(g, p.text, 1.5, 1.5, p.size, "rgba(8,12,18,.8)", "center");
    text(g, p.text, 0, 0, p.size, p.color, "center");
    g.restore();
  }
  g.globalAlpha = 1;
}

/** Badge, patience bar, step pips and need bubble above one patient. */
function drawPatientTag(g, pt, x, y, scale) {
  // A patient standing near the top wall projects their badge above the play
  // area, where it is clipped in half. Nudge it back inside.
  const topLimit = PLAY_Y + 26 * scale;
  if (y < topLimit) y = topLimit;
  const frac = clamp(pt.patience / pt.patienceMax, 0, 1);
  const a2 = AILMENTS[pt.ailment];
  const R = 12.5 * scale;

  g.fillStyle = "rgba(18,28,42,.28)";
  g.beginPath(); g.arc(x + 1, y + 2, R, 0, 6.283); g.fill();
  g.fillStyle = "rgba(255,255,255,.96)";
  g.beginPath(); g.arc(x, y, R, 0, 6.283); g.fill();
  g.beginPath();
  g.moveTo(x - 4*scale, y + R * 0.76); g.lineTo(x + 4*scale, y + R * 0.76);
  g.lineTo(x, y + R * 1.36); g.closePath(); g.fill();
  g.strokeStyle = pt.vip ? "#e8b40b" : a2.color; g.lineWidth = 2.2;
  g.beginPath(); g.arc(x, y, R, 0, 6.283); g.stroke();

  // severity ring: a critical case has to be spottable across the room
  if (pt.sev && pt.sev.ring) {
    const pulse = 0.55 + 0.45 * Math.sin(performance.now() / 130);
    g.save();
    g.globalAlpha = pulse;
    g.strokeStyle = pt.sev.ring; g.lineWidth = 3.4;
    g.beginPath(); g.arc(x, y, R + 5 * scale, 0, 6.283); g.stroke();
    g.restore();
  } else if (pt.sev && pt.sev.key === "minor") {
    g.strokeStyle = pt.sev.color; g.lineWidth = 2;
    g.beginPath(); g.arc(x, y, R + 4 * scale, -0.9, 0.9); g.stroke();
  }

  drawAilmentIcon(g, pt.ailment, x, y, 8 * scale);

  /* With ten conditions on the board, hue is doing far more work than it can
     carry for a colourblind player — two of them are greens and two are
     purples. High-contrast marks puts the condition's three-letter tag under
     the badge so the icon and the letters both stand alone. */
  if (Options.marks) {
    const tag = a2.short || pt.ailment.slice(0, 3).toUpperCase();
    const w = 9 + tag.length * 6.2;
    g.fillStyle = "rgba(10,16,26,.88)";
    roundRect(g, x - w / 2, y + R * 1.42, w, 13, 4); g.fill();
    g.strokeStyle = a2.color; g.lineWidth = 1.3;
    roundRect(g, x - w / 2, y + R * 1.42, w, 13, 4); g.stroke();
    text(g, tag, x, y + R * 1.42 + 10, 10, "#eaf2ff", "center");
  }

  // a second condition rides in its own smaller badge below-left
  if (pt.second && !pt.done) {
    const bx2 = x - 15 * scale, by2 = y + 13 * scale, r2 = 8.5 * scale;
    g.fillStyle = "rgba(255,255,255,.96)";
    g.beginPath(); g.arc(bx2, by2, r2, 0, 6.283); g.fill();
    g.strokeStyle = AILMENTS[pt.second].color; g.lineWidth = 1.8;
    g.beginPath(); g.arc(bx2, by2, r2, 0, 6.283); g.stroke();
    drawAilmentIcon(g, pt.second, bx2, by2, 5.5 * scale);
  }
  if (pt.revealed) {
    g.fillStyle = "#b58bff";
    g.beginPath(); g.arc(x + 10*scale, y - 9*scale, 3.6*scale, 0, 6.283); g.fill();
    g.strokeStyle = "#fff"; g.lineWidth = 1; g.stroke();
  }

  // what they still need
  const cur = pt.steps[pt.step];
  if (!pt.done && cur && pt.state === "station") {
    const nx = x + 21 * scale, ny = y + 3 * scale;
    let draw = null;
    if (cur.k === "bedside" && cur.need) draw = () => drawItemIcon(g, cur.need, nx, ny, 7 * scale);
    else if (cur.k === "bedside" && cur.produce) draw = () => drawItemIcon(g, cur.produce, nx, ny, 7 * scale);
    else if (cur.k === "atStation" && pt.station && pt.station.type !== cur.station) {
      const col = STATIONS[cur.station].color;
      draw = () => {
        g.fillStyle = col;
        roundRect(g, nx - 7*scale, ny - 7*scale, 14*scale, 14*scale, 4); g.fill();
        g.strokeStyle = "rgba(255,255,255,.85)"; g.lineWidth = 1.6; g.lineCap = "round";
        g.beginPath(); g.moveTo(nx - 3*scale, ny); g.lineTo(nx + 3*scale, ny); g.stroke();
      };
    }
    if (draw) {
      g.fillStyle = "rgba(255,255,255,.94)";
      g.beginPath(); g.arc(nx, ny, 10 * scale, 0, 6.283); g.fill();
      g.strokeStyle = "rgba(90,120,150,.7)"; g.lineWidth = 1.4;
      g.beginPath(); g.arc(nx, ny, 10 * scale, 0, 6.283); g.stroke();
      draw();
    }
  }

  if (needsTwoLift(pt) && !pt.done) {
    const yy = y - R - 30 * scale;
    g.font = 'bold ' + Math.round(9 * scale) + 'px "Trebuchet MS", "Segoe UI", sans-serif';
    const lw = g.measureText("2 NURSES").width + 12 * scale;
    g.save();
    g.globalAlpha = 0.7 + 0.3 * Math.sin(performance.now() / 200);
    fillRound(g, x - lw / 2, yy, lw, 13 * scale, 4, "#ffd54a");
    text(g, "2 NURSES", x, yy + 10 * scale, 9 * scale, "#3a2a00", "center");
    g.restore();
  }
  if (pt.sev && pt.sev.name && !pt.done) {
    g.font = 'bold ' + Math.round(9 * scale) + 'px "Trebuchet MS", "Segoe UI", sans-serif';
    const tw = g.measureText(pt.sev.name).width + 10 * scale;
    fillRound(g, x - tw / 2, y - R - 15 * scale, tw, 12 * scale, 4, pt.sev.color);
    text(g, pt.sev.name, x, y - R - 6 * scale, 9 * scale, "#20141a", "center");
  }

  drawMeter(g, x - 17 * scale, y + R * 1.5, 34 * scale, 5, frac, pt.done);

  const n = pt.steps.length;
  if (n > 1 && !pt.done) {
    for (let i = 0; i < n; i++) {
      g.fillStyle = i < pt.step ? PALETTE.good : "rgba(255,255,255,.65)";
      g.strokeStyle = "rgba(28,40,58,.75)"; g.lineWidth = 1;
      g.beginPath();
      g.arc(x - (n - 1) * 4.5 * scale + i * 9 * scale, y + R * 1.5 + 12, 3 * scale, 0, 6.283);
      g.fill(); g.stroke();
    }
  }
  if (pt.steps[pt.step] && pt.steps[pt.step].k === "lab") {
    const t = performance.now() / 180;
    g.strokeStyle = "#b58bff"; g.lineWidth = 2.6; g.lineCap = "round";
    g.beginPath(); g.arc(x, y, R + 4, t, t + 2.2); g.stroke();
  }
}

/* ---------------------------------------------------------------------
   Frame composition
   --------------------------------------------------------------------- */

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (!GL.ok) {
    ctx.fillStyle = "#0d1117"; ctx.fillRect(0, 0, W, H);
    if (GL.lost) {
      const blink = 0.55 + 0.45 * Math.sin(performance.now() / 400);
      ctx.save(); ctx.globalAlpha = blink;
      text(ctx, "Graphics paused — restoring…", W / 2, H / 2, 26, "#eaf2ff", "center");
      ctx.restore();
      text(ctx, "The game state is safe.", W / 2, H / 2 + 34, 15, "#8a97a8", "center");
    } else {
      text(ctx, "This game needs WebGL2.", W / 2, H / 2, 26, "#eaf2ff", "center");
    }
    return;
  }

  const inWard = Game.screen === "play" || Game.screen === "paused" ||
                 Game.screen === "results" || Game.screen === "build";

  if (inWard && Game.world) {
    CAM.shake = Options.shake ? Game.shake : 0;
    renderWorld3D(0);
    if (Game.screen !== "build") drawWorldUI(ctx);
    if (Game.flashRed > 0) {
      ctx.save(); ctx.globalAlpha = Game.flashRed * 0.45;
      ctx.fillStyle = "#ff2d2d"; ctx.fillRect(PLAY_X, PLAY_Y, PLAY_W, PLAY_H); ctx.restore();
    }
    if (Game.flashGood > 0) {
      ctx.save(); ctx.globalAlpha = Game.flashGood * 0.18;
      ctx.fillStyle = "#8bffb0"; ctx.fillRect(PLAY_X, PLAY_Y, PLAY_W, PLAY_H); ctx.restore();
    }
    ctx.save();
    ctx.fillStyle = Paint.vignette;
    ctx.translate(PLAY_X, PLAY_Y);
    ctx.fillRect(0, 0, PLAY_W, PLAY_H);
    ctx.restore();
    if (Game.dim > 0) {
      ctx.save();
      ctx.globalAlpha = clamp(Game.dim, 0, 0.7);
      ctx.fillStyle = "#050b14";
      ctx.fillRect(PLAY_X, PLAY_Y, PLAY_W, PLAY_H);
      ctx.restore();
    }
    if (Game.screen !== "build") {
      // the build phase is its own full-screen UI; the shift HUD underneath
      // it is stale information and just bleeds through the scrim
      drawHUD(ctx);
      drawLegend(ctx);
      drawEventChip(ctx);
      drawTutorial(ctx);
      drawBanner(ctx);
    }
    drawToasts(ctx);
    if (Game.screen === "paused") drawPause(ctx);
    if (Game.screen === "results") drawResults(ctx);
    if (Game.screen === "build") drawBuild(ctx);
    return;
  }

  if (Game.screen === "title") { renderShowcase(); drawTitle(ctx); return; }
  if (Game.screen === "chars") { renderPortraits(); drawCharSelect(ctx); return; }
  clearGL(0.043, 0.058, 0.086);
  if (Game.screen === "select") drawSelect(ctx);
  else if (Game.screen === "perks") drawPerks(ctx);
  else if (Game.screen === "medals") drawMedalsScreen(ctx);
  else if (Game.screen === "options") drawOptions(ctx);
  else if (Game.screen === "controls") drawControls(ctx);
  else if (Game.screen === "howto") drawHowTo(ctx);
}

/* ---------------------------------------------------------------------
   12. SCREEN INPUT + MAIN LOOP
   --------------------------------------------------------------------- */

function handleScreenKeys() {
  if (wasPressed("KeyM")) { Sound.muted = !Sound.muted; if (!Sound.muted) Sound.play("menu"); Save.touch(); }
  if (wasPressed("KeyN")) {
    Music.on = !Music.on; Sound.musicOff = !Music.on;
    Sound.play("menu"); Save.touch();
  }

  switch (Game.screen) {
    case "title":
      if (wasPressed("KeyT")) { Game.playerCount = 1; Game.chars = [0, 1]; startLevel(-2); }
      if (wasPressed("KeyO")) { Game.optionsFrom = "title"; Game.screen = "options"; Sound.play("menu"); }
      if (wasPressed("Digit1") || wasPressed("Numpad1")) { Game.playerCount = 1; enterCharSelect(); }
      if (wasPressed("Digit2") || wasPressed("Numpad2")) { Game.playerCount = 2; enterCharSelect(); }
      if (wasPressed("KeyH")) { Game.howToFrom = "title"; Game.screen = "howto"; Sound.play("menu"); }
      break;

    case "chars": {
      const move = (slot, d) => {
        if (Game.charLocked[slot]) return;
        Game.charCursor[slot] = (Game.charCursor[slot] + d + CHARACTERS.length) % CHARACTERS.length;
        Sound.play("menu");
      };
      if (wasPressed("KeyA")) move(0, -1);
      if (wasPressed("KeyD")) move(0, 1);
      if (wasPressed("KeyE")) {
        Game.charLocked[0] = !Game.charLocked[0];
        Sound.play(Game.charLocked[0] ? "done" : "drop");
      }
      if (Game.playerCount === 2) {
        if (wasPressed("ArrowLeft")) move(1, -1);
        if (wasPressed("ArrowRight")) move(1, 1);
        if (wasPressed("Slash")) {
          Game.charLocked[1] = !Game.charLocked[1];
          Sound.play(Game.charLocked[1] ? "done" : "drop");
        }
      }
      const ready = Game.charLocked[0] && (Game.playerCount === 1 || Game.charLocked[1]);
      if (ready) {
        Game.chars = [Game.charCursor[0], Game.charCursor[1]];
        Game.screen = "select";
        Sound.play("levelend");
      }
      if (wasPressed("Escape")) { Game.screen = "title"; Sound.play("menu"); }
      break;
    }

    case "select": {
      const last = DAILY_SLOT();
      const move = (d) => {
        Game.selectIndex = clamp(Game.selectIndex + d, 0, last);
        Sound.play("menu");
      };
      const special = (i) => i >= LEVELS.length;
      /* The mode row is endless | builder | daily, left to right, and it is
         walked as a row rather than by naming the neighbours. The named-pair
         version only knew endless→builder and builder→endless, so the Daily
         card was drawn every frame and could not be selected by any key. */
      if (wasPressed("KeyA") || wasPressed("ArrowLeft")) {
        if (special(Game.selectIndex)) { if (Game.selectIndex > ENDLESS_SLOT()) move(-1); }
        else if (Game.selectIndex % SELECT_COLS !== 0) move(-1);
      }
      if (wasPressed("KeyD") || wasPressed("ArrowRight")) {
        if (special(Game.selectIndex)) { if (Game.selectIndex < DAILY_SLOT()) move(1); }
        else if (Game.selectIndex % SELECT_COLS !== SELECT_COLS - 1
                 && Game.selectIndex + 1 < LEVELS.length) move(1);
      }
      if (wasPressed("KeyW") || wasPressed("ArrowUp")) {
        // up from the mode row lands in the middle of the LAST grid row, not a
        // hard-coded index that assumed a two-row campaign
        if (special(Game.selectIndex)) {
          const lastRow = Math.floor((LEVELS.length - 1) / SELECT_COLS);
          Game.selectIndex = Math.min(LEVELS.length - 1, lastRow * SELECT_COLS + 2);
          Sound.play("menu");
        }
        else if (Game.selectIndex >= SELECT_COLS) move(-SELECT_COLS);
      }
      if (wasPressed("KeyS") || wasPressed("ArrowDown")) {
        if (Game.selectIndex + SELECT_COLS < LEVELS.length) move(SELECT_COLS);
        else if (!special(Game.selectIndex)) { Game.selectIndex = ENDLESS_SLOT(); Sound.play("menu"); }
      }
      if (wasPressed("KeyE") || wasPressed("Enter") || wasPressed("Slash")) {
        /* In a demo build every mode past the first three wards is visible but
           refuses to start. One gate, on the only path that begins a shift. */
        if (Game.selectIndex === ENDLESS_SLOT()) {
          if (endlessUnlocked() && !DEMO) startLevel(-1); else Sound.play("error");
        } else if (Game.selectIndex === BUILDER_SLOT()) {
          if (builderUnlocked() && !DEMO) startBuilderRun(); else Sound.play("error");
        } else if (Game.selectIndex === DAILY_SLOT()) {
          if (!DEMO) startDaily(); else Sound.play("error");
        } else if (Game.progress[Game.selectIndex].unlocked &&
                   !demoLocked(Game.selectIndex)) {
          startLevel(Game.selectIndex);
        } else Sound.play("error");
      }
      if (wasPressed("KeyP")) { Game.screen = "perks"; Sound.play("menu"); }
      if (wasPressed("KeyT")) {
        Game.difficulty = (Game.difficulty + 1) % DIFFS.length; Save.touch();
        Sound.play("menu");
      }
      if (wasPressed("KeyC")) {
        checkLiveAchievements();          // catch anything earned but not yet ticked
        Game.screen = "medals"; Sound.play("menu");
      }
      if (wasPressed("KeyH")) { Game.howToFrom = "select"; Game.screen = "howto"; Sound.play("menu"); }
      if (wasPressed("Escape")) { Game.screen = "title"; Sound.play("menu"); }
      break;
    }

    case "perks": {
      if (wasPressed("KeyW") || wasPressed("ArrowUp")) {
        Game.perkCursor = (Game.perkCursor + PERKS.length - 1) % PERKS.length; Sound.play("menu");
      }
      if (wasPressed("KeyS") || wasPressed("ArrowDown")) {
        Game.perkCursor = (Game.perkCursor + 1) % PERKS.length; Sound.play("menu");
      }
      if (wasPressed("KeyE") || wasPressed("Enter") || wasPressed("Slash")) {
        const pk = PERKS[Game.perkCursor];
        if (totalStars() < pk.stars) { Sound.play("error"); }
        else if (Game.perksActive.includes(pk.key)) {
          Game.perksActive = Game.perksActive.filter(k => k !== pk.key);
          Sound.play("drop");
        } else if (Game.perksActive.length < PERK_MAX_ACTIVE) {
          Game.perksActive.push(pk.key);
          Sound.play("done");
        } else Sound.play("error");
      }
      if (wasPressed("Escape") || wasPressed("KeyP")) { Game.screen = "select"; Sound.play("menu"); }
      break;
    }

    case "options": {
      const n = OPTION_ROWS.length;
      const mv = (d) => { Game.optionCursor = (Game.optionCursor + d + n) % n; Sound.play("menu"); };
      if (wasPressed("KeyW") || wasPressed("ArrowUp")) mv(-1);
      if (wasPressed("KeyS") || wasPressed("ArrowDown")) mv(1);
      const row = OPTION_ROWS[Game.optionCursor];
      const adjust = (d) => {
        if (row.kind === "level") {
          Options[row.key] = clamp(+(Options[row.key] + d * 0.1).toFixed(2), 0, 1);
          Options.apply();
          Sound.play("tick");            // audible, so a volume change is felt
        } else {
          Options[row.key] = !Options[row.key];
          Sound.play(Options[row.key] ? "done" : "drop");
        }
        Save.touch();
      };
      if (wasPressed("KeyA") || wasPressed("ArrowLeft")) adjust(-1);
      if (wasPressed("KeyD") || wasPressed("ArrowRight")) adjust(1);
      if (wasPressed("KeyE") || wasPressed("Enter") || wasPressed("Slash"))
        { if (row.kind === "bool") adjust(1); }
      if (wasPressed("Escape") || wasPressed("KeyO")) {
        Game.screen = Game.optionsFrom || "title"; Sound.play("menu");
      }
      break;
    }

    case "controls": {
      const n = CONTROL_ACTIONS.length * 2;
      if (Game.rebind) break;                 // the keydown listener owns capture
      const mv = (d) => { Game.controlCursor = (Game.controlCursor + d + n) % n; Sound.play("menu"); };
      if (wasPressed("KeyW") || wasPressed("ArrowUp")) mv(-1);
      if (wasPressed("KeyS") || wasPressed("ArrowDown")) mv(1);
      if (wasPressed("KeyA") || wasPressed("ArrowLeft")) mv(-CONTROL_ACTIONS.length);
      if (wasPressed("KeyD") || wasPressed("ArrowRight")) mv(CONTROL_ACTIONS.length);
      if (wasPressed("KeyE") || wasPressed("Enter") || wasPressed("Slash")) {
        Game.rebind = { slot: Math.floor(Game.controlCursor / CONTROL_ACTIONS.length),
                        action: CONTROL_ACTIONS[Game.controlCursor % CONTROL_ACTIONS.length].key };
        Game.rebindMsg = "";
        Sound.play("menu");
      }
      if (wasPressed("KeyR")) { resetControls(); Save.touch(); Sound.play("done"); }
      if (wasPressed("Escape")) {
        Game.rebindMsg = "";
        Game.screen = Game.controlsFrom || "options"; Sound.play("menu");
      }
      break;
    }

    case "medals": {
      /* Wiping a save is the one irreversible thing in the game, so it is a
         deliberate two-second hold rather than a keypress — and it is only
         offered here, on the screen that shows what would be lost. */
      if (Keys.KeyX && Save.available) {
        Game.wipeHold = (Game.wipeHold || 0) + 1 / 60;
        if (Game.wipeHold >= WIPE_HOLD) {
          Save.wipe(); Game.wipeHold = 0; Game.wipeDone = 2.2;
          Sound.play("error");
        }
      } else Game.wipeHold = 0;
      if (Game.wipeDone > 0) Game.wipeDone -= 1 / 60;
      if (wasPressed("Escape") || wasPressed("KeyC") || wasPressed("KeyE") || wasPressed("Enter")) {
        Game.screen = "select"; Sound.play("menu"); Game.wipeHold = 0;
      }
      break;
    }

    case "build": {
      const B = Game.builder;
      if (!B) { Game.screen = "select"; break; }
      if (B.placing) {
        const mv = (dx, dy) => {
          B.placing.x = clamp(B.placing.x + dx, 1, COLS - 2);
          B.placing.y = clamp(B.placing.y + dy, 1, ROWS - 2);
        };
        if (wasPressed("KeyA") || wasPressed("ArrowLeft")) mv(-1, 0);
        if (wasPressed("KeyD") || wasPressed("ArrowRight")) mv(1, 0);
        if (wasPressed("KeyW") || wasPressed("ArrowUp")) mv(0, -1);
        if (wasPressed("KeyS") || wasPressed("ArrowDown")) mv(0, 1);
        if (wasPressed("KeyE") || wasPressed("Enter") || wasPressed("Slash")) confirmPlacement();
        if (wasPressed("KeyQ") || wasPressed("Escape") || wasPressed("Period")) {
          B.placing = null; builderSay("Cancelled"); Sound.play("menu");
        }
        break;
      }
      if (wasPressed("KeyA") || wasPressed("ArrowLeft")) {
        B.cursor = (B.cursor + B.offers.length - 1) % B.offers.length; Sound.play("menu");
      }
      if (wasPressed("KeyD") || wasPressed("ArrowRight")) {
        B.cursor = (B.cursor + 1) % B.offers.length; Sound.play("menu");
      }
      if (wasPressed("KeyE") || wasPressed("Slash")) buyOffer(B.cursor);
      if (wasPressed("Enter")) beginWave(B.wave + 1, false);
      if (wasPressed("KeyH")) { Game.howToFrom = "build"; Game.screen = "howto"; Sound.play("menu"); }
      break;
    }

    case "howto": {
      if (wasPressed("KeyD") || wasPressed("ArrowRight")) {
        Game.howToPage = (Game.howToPage + 1) % HOWTO_PAGES; Sound.play("menu");
      }
      if (wasPressed("KeyA") || wasPressed("ArrowLeft")) {
        Game.howToPage = (Game.howToPage + HOWTO_PAGES - 1) % HOWTO_PAGES; Sound.play("menu");
      }
      if (wasPressed("Escape") || wasPressed("KeyH") || wasPressed("Enter")) {
        Game.screen = Game.howToFrom || "title"; Sound.play("menu");
      }
      break;
    }

    case "play":
      if (wasPressed("Escape")) { Game.screen = "paused"; Game.pauseReason = ""; Sound.play("menu"); }
      break;

    case "paused":
      if (wasPressed("Escape")) { Game.screen = "play"; Game.pauseReason = ""; Sound.play("menu"); }
      if (wasPressed("KeyR")) {
        if (Game.builderMode) { startBuilderRun(); break; }
        startLevel(Game.levelIndex);
      }
      if (wasPressed("KeyH")) { Game.howToFrom = "paused"; Game.screen = "howto"; Sound.play("menu"); }
      if (wasPressed("KeyO")) { Game.optionsFrom = "paused"; Game.screen = "options"; Sound.play("menu"); }
      if (wasPressed("KeyL")) { Game.builderMode = false; Game.screen = "select"; Sound.play("menu"); }
      break;

    case "results":
      if (wasPressed("KeyR")) {
        if (Game.result && Game.result.builder) { startBuilderRun(); break; }
        startLevel(Game.levelIndex);
      }
      if (wasPressed("Escape")) { Game.screen = "select"; Sound.play("menu"); }
      if (wasPressed("KeyE") || wasPressed("Enter") || wasPressed("Slash")) {
        if (Game.result && Game.result.builder) Game.selectIndex = BUILDER_SLOT();
        else if (Game.endless) Game.selectIndex = ENDLESS_SLOT();
        else Game.selectIndex = Math.min(LEVELS.length - 1,
          Game.result.stars >= 1 ? Game.levelIndex + 1 : Game.levelIndex);
        Game.screen = "select";
        Sound.play("menu");
      }
      break;
  }
}

let lastT = performance.now();

/* The frame loop is armored: any exception in update or render used to kill
   requestAnimationFrame permanently — the game froze solid and only a reload
   recovered (this is exactly how the builder-results bug presented). The loop
   now ALWAYS re-arms, resets GL state after a bad frame, and if errors persist
   it retreats to a fresh title screen instead of freezing. */
let _frameErrs = 0, _frameErrSince = 0;

/* Frame-time meter. This container renders through SwiftShader, which is
   software rasterisation — nothing measured here says anything about a real
   GPU. Shipping the meter is how the frame rate finally gets measured: on the
   machine that matters, by the person who owns it. p95 rather than an average
   because the number that ruins a shift is the worst frame, not the mean. */
const Perf = {
  ring: new Float32Array(180),
  i: 0, n: 0, shown: 0, worst: 0, t: 0,
  push(ms) {
    this.ring[this.i] = ms;
    this.i = (this.i + 1) % this.ring.length;
    if (this.n < this.ring.length) this.n++;
  },
  sample(dt) {
    this.t += dt;
    if (this.t < 0.35 || !this.n) return;
    this.t = 0;
    const a = Array.prototype.slice.call(this.ring, 0, this.n).sort((x, y) => x - y);
    this.shown = a[Math.floor(a.length / 2)];                 // median frame
    this.worst = a[Math.min(a.length - 1, Math.floor(a.length * 0.95))];
  },
  draw(g) {
    const fps = this.shown > 0 ? 1000 / this.shown : 0;
    const col = fps >= 55 ? "#6fd3b4" : fps >= 30 ? "#ffd54a" : "#ff8f70";
    const bw = 168, bx = W - bw - 14, by = 14;
    g.fillStyle = "rgba(8,12,18,.72)";
    roundRect(g, bx, by, bw, 46, 9); g.fill();
    g.strokeStyle = "rgba(255,255,255,.12)"; g.lineWidth = 1;
    roundRect(g, bx, by, bw, 46, 9); g.stroke();
    text(g, Math.round(fps) + " fps", bx + 12, by + 22, 18, col);
    text(g, this.shown.toFixed(1) + " ms   p95 " + this.worst.toFixed(1),
         bx + 12, by + 38, 12, PALETTE.dim, "left", "normal");
  }
};

function frame(now) {
  requestAnimationFrame(frame);          // re-armed FIRST: the loop cannot die
  const dt = Math.min(0.05, (now - lastT) / 1000);
  const rawMs = now - lastT;
  lastT = now;
  if (rawMs > 0 && rawMs < 1000) Perf.push(rawMs);
  Perf.sample(dt);

  try {
    // pads first: they assert the same key codes, so everything after this — the
    // menus, movement, wasPressed — needs no knowledge that a pad exists
    Pads.poll();
    handleScreenKeys();

    if (Game.screen === "play") updatePlay(dt);
    else if (Game.screen === "build") {
      if (Game.builder) Game.builder.messageT += dt;
      updateEffects(dt);
    }
    else if (Game.screen === "results") { Game.result.t += dt; updateEffects(dt); }
    else if (Game.screen === "paused") { /* frozen */ }

    render();
    // last, and outside render(), so an overlay can never disturb what it measures
    if (Options.perfHud) Perf.draw(ctx);
    Save.tick(dt);
    clearPressed();
    _frameErrs = 0;
  } catch (err) {
    _frameErrs++;
    if (_frameErrs === 1) { _frameErrSince = now; console.error("frame error:", err); }
    try {
      const gl = GL.gl;
      if (gl) {                          // a mid-pass throw can leave state dirty
        gl.disable(gl.SCISSOR_TEST);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      }
      clearPressed();
      // time-based, not frame-based: at a struggling machine's low fps a frame
      // count would take an age to trip
      if (now - _frameErrSince > 4000 && _frameErrs > 8) {
        console.error("persistent frame errors — returning to title");
        Game.builderMode = false;
        Game.staff = [];
        Game.world = null;
        Game.result = null;
        Game.screen = "title";
        _frameErrs = 0;
      }
    } catch (e2) { /* even the recovery must never kill the loop */ }
  }
}

/* Dev/test hook: lets an automated playtest inspect and drive the game.
   Nothing in the game itself reads from this object. */
window.CodeBlue = {
  Game, LEVELS, AILMENTS, STATIONS, ITEMS, GL, CAM,
  projectToScreen,
  startLevel,
  state: () => ({
    screen: Game.screen,
    time: Game.time,
    score: Game.score,
    lives: Game.lives,
    treated: Game.treated,
    lost: Game.lost,
    players: Game.players.map(p => ({
      x: p.x, y: p.y, tx: Math.floor(p.x / TILE), ty: Math.floor(p.y / TILE),
      item: p.item ? p.item.type : null,
      patient: p.patient ? { id: p.patient.id, ailment: p.patient.ailment, done: p.patient.done, step: p.patient.step } : null,
      work: p.work ? { label: p.work.label, t: p.work.t, dur: p.work.dur } : null,
      hint: p.hintT > 0 ? p.hint : null
    })),
    animals: Game.patients.map(p => ({
      id: p.id, ailment: p.ailment, state: p.state, step: p.step, steps: p.steps.length,
      done: p.done, x: p.x, y: p.y, tx: Math.floor(p.x / TILE), ty: Math.floor(p.y / TILE),
      patience: +(p.patience / p.patienceMax).toFixed(2)
    })),
    stations: Game.world ? Game.world.stations.map(s => ({
      type: s.type, x: s.x, y: s.y, stock: s.stock === Infinity ? "inf" : s.stock,
      occupant: s.occupant ? s.occupant.id : null, jammed: s.jammed, hasDefib: !!s.hasDefib
    })) : [],
    floorItems: Game.floorItems.map(i => ({ type: i.type, tx: Math.floor(i.x / TILE), ty: Math.floor(i.y / TILE) }))
  })
};

Save.load();
Options.apply();
/* A last-chance flush: the debounced write may not have fired yet when the tab
   goes away. pagehide covers the cases visibilitychange and unload miss. */
for (const ev of ["pagehide", "visibilitychange"])
  window.addEventListener(ev, () => { if (Save.dirty) Save.write(); });

requestAnimationFrame(frame);
</script>
</body>

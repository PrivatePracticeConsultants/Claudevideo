/* =====================================================================
   CODE BLUE! — a two-player couch co-op ER game.
   Single file, vanilla JS + Canvas, no dependencies.

   Sections:
     1. Constants & config
     2. Utilities (rng, math, drawing primitives)
     3. Audio (synthesized Web Audio SFX)
     4. Input (shared keyboard, two control sets)
     5. Data (items, ailments, station recipes, levels)
     6. World construction (map parsing, pathfinding)
     7. Entities (players, patients, items, stations)
     8. Interaction resolution (interact key / use key)
     9. Simulation update
    10. Rendering (world, entities, HUD, screens)
    11. State machine & main loop
   ===================================================================== */

/* ---------------------------------------------------------------------
   1. CONSTANTS & CONFIG
   --------------------------------------------------------------------- */

// 1.55x), which is what makes a 40-tile ward playable inside a 3-minute shift.

/* ---------------------------------------------------------------------
   2. UTILITIES
   --------------------------------------------------------------------- */

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const fmtMult = (m) => (Math.round(m * 100) / 100).toString();
const lerp = (a, b, t) => a + (b - a) * t;

/** Small deterministic PRNG (mulberry32). Seeded per level, so the arrival
    sequence is reproducible for identical play; jams and lab reveals also draw
    from this stream, so diverging play diverges the rolls. */
function makeRng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function roundRect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function fillRound(ctx, x, y, w, h, r, color) {
  ctx.fillStyle = color; roundRect(ctx, x, y, w, h, r); ctx.fill();
}

function text(ctx, str, x, y, size, color, align, weight) {
  ctx.font = (weight || "bold") + " " + size + 'px "Trebuchet MS", "Segoe UI", sans-serif';
  ctx.fillStyle = color;
  ctx.textAlign = align || "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillText(str, x, y);
}

function fmtTime(sec) {
  sec = Math.max(0, Math.ceil(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return m + ":" + (s < 10 ? "0" : "") + s;
}

/* ---------------------------------------------------------------------
   3. AUDIO — tiny synthesized SFX, no assets.
   --------------------------------------------------------------------- */

const Sound = {
  ctx: null,
  muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (err) { this.ctx = null; }
  },
  /** One shaped oscillator blip. */
  tone(freq, dur, type, vol, slideTo) {
    if (this.muted || !this.ctx) return;
    const t0 = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type || "square";
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  },
  noise(dur, vol, freq) {
    if (this.muted || !this.ctx) return;
    const n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const bp = this.ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = freq || 900;
    const g = this.ctx.createGain(); g.gain.value = vol || 0.1;
    src.connect(bp); bp.connect(g); g.connect(this.ctx.destination);
    src.start();
  },
  /** Discharge fanfare that climbs with the combo chain. */
  discharge(combo) {
    const step = Math.min(9, Math.max(1, combo)) - 1;
    const root = 523.25 * Math.pow(2, step / 12);   // one semitone per chain link
    this.tone(root, 0.09, "triangle", 0.13);
    setTimeout(() => this.tone(root * 1.26, 0.09, "triangle", 0.13), 80);
    setTimeout(() => this.tone(root * 1.5, 0.17, "triangle", 0.13), 160);
  },
  play(name) {
    switch (name) {
      case "pickup":   this.tone(520, 0.07, "square", 0.09, 720); break;
      case "drop":     this.tone(300, 0.07, "square", 0.08, 220); break;
      case "place":    this.tone(420, 0.10, "triangle", 0.11, 560); break;
      case "tick":     this.tone(700, 0.035, "square", 0.035); break;
      case "step":     this.tone(240, 0.05, "sine", 0.05); break;
      case "done":     this.tone(660, 0.09, "triangle", 0.12, 990); break;
      case "discharge":
        this.tone(660, 0.09, "triangle", 0.13);
        setTimeout(() => this.tone(880, 0.09, "triangle", 0.13), 80);
        setTimeout(() => this.tone(1180, 0.16, "triangle", 0.13), 160);
        break;
      case "spawn":    this.tone(380, 0.09, "sine", 0.08, 470); break;
      case "error":    this.tone(150, 0.13, "sawtooth", 0.09, 90); break;
      case "shock":    this.noise(0.22, 0.16, 1800); this.tone(90, 0.25, "sawtooth", 0.10, 40); break;
      case "charge":   this.tone(300, 0.4, "sawtooth", 0.06, 1200); break;
      case "flatline": this.tone(880, 1.1, "sine", 0.10); break;
      case "leave":    this.tone(300, 0.28, "square", 0.09, 120); break;
      case "lab":      this.tone(760, 0.12, "sine", 0.1, 520); setTimeout(() => this.tone(980, 0.18, "sine", 0.1), 120); break;
      case "menu":     this.tone(600, 0.05, "square", 0.07); break;
      case "star":     this.tone(880, 0.12, "triangle", 0.12, 1320); break;
      case "jam":      this.noise(0.18, 0.12, 400); break;
      case "clutch":
        this.tone(1320, 0.07, "square", 0.11);
        setTimeout(() => this.tone(1760, 0.16, "square", 0.11), 70);
        break;
      case "heart":    this.tone(120, 0.07, "sine", 0.09, 70); break;
      case "siren":
        this.tone(720, 0.30, "sawtooth", 0.07, 980);
        setTimeout(() => this.tone(980, 0.30, "sawtooth", 0.07, 720), 300);
        break;
      case "sprint":   this.noise(0.10, 0.05, 2200); break;
      case "newbest":
        [0, 120, 240, 400].forEach((d, i) =>
          setTimeout(() => this.tone(523 * Math.pow(2, i / 4), 0.18, "triangle", 0.12), d));
        break;
      case "levelend": this.tone(523, 0.15, "triangle", 0.12);
                       setTimeout(() => this.tone(659, 0.15, "triangle", 0.12), 150);
                       setTimeout(() => this.tone(784, 0.30, "triangle", 0.12), 300);
                       break;
    }
  }
};

/* --- background music: a synthesized ambient loop -----------------------
   Two detuned pads over a soft bass pulse; an off-beat tick layer fades in
   while any patient is critical. Runs on a self-correcting setTimeout chain
   against AudioContext time. Toggled with N; M (SFX mute) silences it too. */
const Music = {
  on: true,
  playing: false,
  timer: null,
  step: 0,
  start() {
    if (this.playing) return;
    this.playing = true;
    this.step = 0;
    this.tick();
  },
  stop() { this.playing = false; if (this.timer) clearTimeout(this.timer); },
  note(freq, dur, type, vol) {
    if (!this.on || Sound.muted || !Sound.ctx) return;
    Sound.tone(freq, dur, type, vol);
  },
  tick() {
    if (!this.playing) return;
    const tense = Game.screen === "play" && Game.critical < CRIT_AT;
    const stepDur = tense ? 0.21 : 0.25;            // eighth notes, ~120/96 bpm
    const i = this.step % 32;

    // bass: a slow Am - F - C - G walk, one root per 8 steps
    const roots = [110.0, 87.31, 130.81, 98.0];
    if (i % 8 === 0) this.note(roots[Math.floor(i / 8)], 0.42, "sine", 0.045);
    if (i % 8 === 4) this.note(roots[Math.floor(i / 8)] * 2, 0.2, "sine", 0.022);

    // pad: two detuned triangles on each chord change
    if (i % 8 === 0) {
      const r = roots[Math.floor(i / 8)] * 2;
      this.note(r * 1.5, 1.6, "triangle", 0.016);
      this.note(r * 1.498 * 1.26, 1.6, "triangle", 0.013);
    }

    // sparkle: an occasional high pentatonic ping on menus and calm play
    if (!tense && (i === 6 || i === 22)) {
      const pent = [523.25, 587.33, 659.25, 783.99, 880.0];
      this.note(pent[(this.step >> 3) % pent.length], 0.5, "sine", 0.012);
    }

    // tension layer: off-beat ticks while someone is close to flatlining
    if (tense && i % 2 === 1) this.note(2200, 0.03, "square", 0.018);

    this.step++;
    this.timer = setTimeout(() => this.tick(), stepDur * 1000);
  }
};

const SWALLOW = new Set([

window.addEventListener("keydown", (e) => {
  if (SWALLOW.has(e.code)) e.preventDefault();
  if (!Keys[e.code]) Pressed[e.code] = true;
  Keys[e.code] = true;
  Sound.init();                          // browsers need a gesture before audio
}, { passive: false });

window.addEventListener("keyup", (e) => {
  if (SWALLOW.has(e.code)) e.preventDefault();
  Keys[e.code] = false;
}, { passive: false });

window.addEventListener("blur", () => { for (const k in Keys) Keys[k] = false; });

const wasPressed = (code) => !!Pressed[code];
function clearPressed() { for (const k in Pressed) delete Pressed[k]; }

/* ---------------------------------------------------------------------
   6. WORLD CONSTRUCTION
   --------------------------------------------------------------------- */

const CHAR_TO_STATION = {
  b: "bed", s: "supply", m: "medicine", x: "xray", c: "cast",
  h: "charger", l: "lab", d: "delivery", f: "defibrack"
};

function makeWorld(levelDef) {
  const world = {
    def: levelDef,
    grid: [],            // per-tile: {solid, station|null, entrance, exit}
    stations: [],
    beds: [],
    entrance: { x: 1, y: 1 },
    exit: { x: 1, y: 1 },
    waitSlots: []
  };

  for (let y = 0; y < ROWS; y++) {
    const row = [];
    const line = levelDef.map[y];
    for (let x = 0; x < COLS; x++) {
      const ch = line[x] || "#";
      const cell = { solid: false, station: null, entrance: false, exit: false, x, y };
      if (ch === "#") {
        cell.solid = true;
      } else if (ch === "E") {
        cell.entrance = true; world.entrance = { x, y };
      } else if (ch === "O") {
        cell.exit = true; world.exit = { x, y };
      } else if (CHAR_TO_STATION[ch]) {
        const type = CHAR_TO_STATION[ch];
        const st = {
          type, x, y,
          cx: x * TILE + TILE / 2, cy: y * TILE + TILE / 2,
          occupant: null,
          stock: STATIONS[type].stockMax !== undefined
            ? (levelDef.restock ? STATIONS[type].stockMax : Infinity)
            : Infinity,
          jammed: false,
          flash: 0,
          hasDefib: type === "defibrack"
        };
        cell.solid = true;
        cell.station = st;
        world.stations.push(st);
        if (type === "bed") world.beds.push(st);
      }
      row.push(cell);
    }
    world.grid.push(row);
  }

  if (Game.perksActive && Game.perksActive.includes("bays")) addExtraBeds(world, 2);

  world.waitSlots = computeWaitSlots(world, Math.max(8, (levelDef.maxWaiting || 0) + 3));
  return world;
}

/** Extra Bays perk: convert up to n floor tiles beside existing beds into
    beds — but only where doing so provably keeps the whole ward connected
    and every station reachable. */
function addExtraBeds(world, n) {
  const rng = makeRng((world.def.seed ^ 0xBED5) >>> 0);

  const floodOK = () => {
    const seen = new Set();
    const q = [world.entrance];
    seen.add(world.entrance.x + "," + world.entrance.y);
    let open = 0;
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if (isWalkable(world, x, y)) open++;
    let reached = 0;
    while (q.length) {
      const cur = q.shift();
      reached++;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = cur.x + dx, ny = cur.y + dy, k = nx + "," + ny;
        if (!seen.has(k) && isWalkable(world, nx, ny)) { seen.add(k); q.push({ x: nx, y: ny }); }
      }
    }
    if (reached !== open) return false;
    for (const st of world.stations) {
      let ok = false;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]])
        if (seen.has((st.x + dx) + "," + (st.y + dy))) ok = true;
      if (!ok) return false;
    }
    return true;
  };

  const candidates = [];
  for (const bed of world.beds) {
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const x = bed.x + dx, y = bed.y + dy;
      const cell = cellAt(world, x, y);
      if (!cell || cell.solid || cell.entrance || cell.exit) continue;
      if (!candidates.some(c => c.x === x && c.y === y)) candidates.push({ x, y });
    }
  }
  // deterministic shuffle from the level seed
  for (let i = candidates.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
  }

  let placed = 0;
  for (const cand of candidates) {
    if (placed >= n) break;
    const cell = world.grid[cand.y][cand.x];
    const st = {
      type: "bed", x: cand.x, y: cand.y,
      cx: cand.x * TILE + TILE / 2, cy: cand.y * TILE + TILE / 2,
      occupant: null, stock: Infinity, jammed: false, flash: 0, hasDefib: false, bonus: true
    };
    cell.solid = true; cell.station = st;
    world.stations.push(st); world.beds.push(st);
    if (floodOK()) { placed++; continue; }
    // revert: this spot would pinch the ward shut
    cell.solid = false; cell.station = null;
    world.stations.pop(); world.beds.pop();
  }
}

const inBounds = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS;
const cellAt = (world, tx, ty) => inBounds(tx, ty) ? world.grid[ty][tx] : null;
const tileOf = (px, py) => ({ x: Math.floor(px / TILE), y: Math.floor(py / TILE) });
const isWalkable = (world, tx, ty) => { const c = cellAt(world, tx, ty); return !!c && !c.solid; };

/** Breadth-first flood from the entrance; the first N walkable tiles that are
    not the entrance/exit become the waiting-room slots. */
function computeWaitSlots(world, n) {
  const start = world.entrance;
  const seen = new Set([start.x + "," + start.y]);
  const q = [start];
  const out = [];
  while (q.length && out.length < n) {
    const cur = q.shift();
    const c = cellAt(world, cur.x, cur.y);
    if (c && !c.entrance && !c.exit) out.push({ x: cur.x, y: cur.y });
    const nbrs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (const [dx, dy] of nbrs) {
      const nx = cur.x + dx, ny = cur.y + dy, key = nx + "," + ny;
      if (!seen.has(key) && isWalkable(world, nx, ny)) { seen.add(key); q.push({ x: nx, y: ny }); }
    }
  }
  return out;
}

/** BFS path of tile centres from one tile to another (4-connected). */
function findPath(world, from, to) {
  if (from.x === to.x && from.y === to.y) return [];
  const prev = new Map();
  const startKey = from.x + "," + from.y;
  const seen = new Set([startKey]);
  const q = [from];
  const nbrs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  while (q.length) {
    const cur = q.shift();
    if (cur.x === to.x && cur.y === to.y) {
      const path = [];
      let k = cur.x + "," + cur.y;
      while (k !== startKey) {
        const [px, py] = k.split(",").map(Number);
        path.push({ x: px * TILE + TILE / 2, y: py * TILE + TILE / 2 });
        k = prev.get(k);
        if (k === undefined) return [];
      }
      path.reverse();
      return path;
    }
    for (const [dx, dy] of nbrs) {
      const nx = cur.x + dx, ny = cur.y + dy, key = nx + "," + ny;
      if (!seen.has(key) && isWalkable(world, nx, ny)) {
        seen.add(key); prev.set(key, cur.x + "," + cur.y); q.push({ x: nx, y: ny });
      }
    }
  }
  return [];
}

/* ---------------------------------------------------------------------
   7. ENTITIES
   --------------------------------------------------------------------- */

let nextId = 1;

function makeItem(type, extra) {
  const it = { type, id: nextId++ };
  if (extra) Object.assign(it, extra);
  if (type === "defib_charged") it.charge = DEFIB_CHARGE_LIFE;
  return it;
}

function makePlayer(index, x, y) {
  return {
    index,
    x, y,
    dx: 0, dy: 1,
    item: null,
    patient: null,
    work: null,           // {key, t, dur, action}
    stamina: Game.staminaMax,
    sprinting: false,
    squash: 0,
    bob: 0,
    step: 0,              // walk-cycle phase
    hintT: 0, hint: "",
    boost: null, boostT: 0,
    color: index === 0 ? PALETTE.p1 : PALETTE.p2,
    look: CHARACTERS[Game.chars[index] % CHARACTERS.length],
    ctrl: CONTROLS[index]
  };
}

function makePatient(world, ailmentKey, level) {
  const a = AILMENTS[ailmentKey];
  // VIPs appear from level 3 on (and in endless): double points, thinner patience
  let vip = (Game.levelIndex >= 2 || Game.endless) && Game.rng() < 0.10;
  if (Game.forceVip) { vip = true; Game.forceVip = false; }
  const p = {
    vip,
    id: nextId++,
    ailment: ailmentKey,
    steps: a.steps.map(s => Object.assign({}, s)),
    step: 0,
    x: world.entrance.x * TILE + TILE / 2,
    y: world.entrance.y * TILE + TILE / 2,
    patienceMax: level.patience * a.patienceMul * (vip ? 0.8 : 1) * (Game.diff ? Game.diff.patience : 1),
    patience: level.patience * a.patienceMul * (vip ? 0.8 : 1) * (Game.diff ? Game.diff.patience : 1),
    state: "walking",     // walking | waiting | carried | bed | station | leaving | gone
    path: [],
    slot: null,
    station: null,
    done: false,
    labPending: false,
    revealed: false,
    bob: Math.random() * 6.28,
    flash: 0
  };
  return p;
}

function findOpenTilesNear(world, origin, count) {
  const out = [];
  const seen = new Set();
  const q = [{ x: origin.x, y: origin.y }];
  seen.add(origin.x + "," + origin.y);
  while (q.length && out.length < count + 2) {
    const cur = q.shift();
    if (isWalkable(world, cur.x, cur.y)) out.push(cur);
    for (const [dx, dy] of [[1, 0], [0, 1], [-1, 0], [0, -1]]) {
      const nx = cur.x + dx, ny = cur.y + dy, k = nx + "," + ny;
      if (!seen.has(k) && isWalkable(world, nx, ny)) { seen.add(k); q.push({ x: nx, y: ny }); }
    }
  }
  return out;
}

/* ---------------------------------------------------------------------
   9. INTERACTION
   --------------------------------------------------------------------- */

/** Find the station the player is facing (searching the 8 neighbouring tiles). */
function facingStation(world, p, filter) {
  const tp = tileOf(p.x, p.y);
  let best = null, bestScore = -1;
  for (let oy = -1; oy <= 1; oy++) {
    for (let ox = -1; ox <= 1; ox++) {
      const c = cellAt(world, tp.x + ox, tp.y + oy);
      if (!c || !c.station) continue;
      const st = c.station;
      if (filter && !filter(st)) continue;
      const vx = st.cx - p.x, vy = st.cy - p.y;
      const d = Math.hypot(vx, vy);
      if (d > REACH) continue;
      const dot = (vx / d) * p.dx + (vy / d) * p.dy;
      if (dot < FACE_DOT) continue;
      const score = dot * 2 - d / REACH;
      if (score > bestScore) { bestScore = score; best = st; }
    }
  }
  return best;
}

/** Find a loose patient (waiting or walking) the player is facing. */
function facingPatient(p) {
  let best = null, bestScore = -1;
  for (const pt of Game.patients) {
    if (pt.state !== "waiting" && pt.state !== "walking") continue;
    const vx = pt.x - p.x, vy = pt.y - p.y;
    const d = Math.hypot(vx, vy);
    if (d > 46) continue;
    // Inside your own body radius, "which way am I facing" is meaningless: a
    // sub-pixel offset flips the dot product and the patient becomes
    // impossible to pick up while you stand on top of them. The old guard was
    // d < 1, which is so tight it almost never fired — a medic standing 1px
    // from a patient facing the wrong way could be stuck indefinitely.
    const dot = d < PLAYER_R ? 1 : (vx / d) * p.dx + (vy / d) * p.dy;
    if (dot < 0) continue;
    const score = dot * 2 - d / 46;
    if (score > bestScore) { bestScore = score; best = pt; }
  }
  return best;
}

/** Find a loose item on the floor the player is facing. */
function facingFloorItem(p) {
  let best = null, bestD = 44;
  for (const it of Game.floorItems) {
    const d = Math.hypot(it.x - p.x, it.y - p.y);
    if (d < bestD) { bestD = d; best = it; }
  }
  return best;
}

let SILENT_HINTS = false;
function hint(p, msg) { if (SILENT_HINTS) return; p.hint = msg; p.hintT = 1.6; }

/** E / "/" — pick up, put down, place patients. */
function doInteract(p) {
  const world = Game.world;
  p.squash = 0.18;

  // Carrying a patient: place them on a bed / X-ray, or set them down.
  if (p.patient) {
    const target = facingStation(world, p, st => STATIONS[st.type].holdsPatient && !st.occupant);
    if (target) {
      p.patient.state = "station";
      p.patient.station = target;
      p.patient.x = target.cx; p.patient.y = target.cy - 6;
      target.occupant = p.patient;
      target.flash = 0.3;
      p.patient = null;
      Sound.play("place");
      return;
    }
    // Otherwise set them down on the floor in front (or under) the player.
    const spot = freeSpotInFront(world, p);
    if (spot) {
      const pt = p.patient;
      pt.state = "waiting"; pt.x = spot.x; pt.y = spot.y; pt.path = [];
      pt.slot = null; pt.station = null;
      p.patient = null;
      Sound.play("drop");
    } else {
      hint(p, "No room to set them down");
    }
    return;
  }

  // Carrying an item: drop it (or hand it to a shelf-free floor tile).
  if (p.item) {
    const spot = freeSpotInFront(world, p);
    if (spot) {
      const it = p.item;
      it.x = spot.x; it.y = spot.y;
      Game.floorItems.push(it);
      p.item = null;
      Sound.play("drop");
    } else {
      hint(p, "Nowhere to put that");
    }
    return;
  }

  // Empty-handed: pick something up. Priority: patient in front, patient on a
  // bed/X-ray we face, the defib rack, then a floor item.
  const loose = facingPatient(p);
  if (loose) {
    loose.state = "carried"; loose.path = []; loose.slot = null;
    p.patient = loose;
    Sound.play("pickup");
    return;
  }

  const occupied = facingStation(world, p, st => st.occupant);
  if (occupied) {
    const pt = occupied.occupant;
    occupied.occupant = null;
    pt.state = "carried"; pt.station = null;
    p.patient = pt;
    Sound.play("pickup");
    return;
  }

  const rack = facingStation(world, p, st => st.type === "defibrack" && st.hasDefib);
  if (rack) {
    rack.hasDefib = false;
    p.item = makeItem("defib");
    Sound.play("pickup");
    return;
  }

  const fitem = facingFloorItem(p);
  if (fitem) {
    Game.floorItems.splice(Game.floorItems.indexOf(fitem), 1);
    delete fitem.x; delete fitem.y;
    p.item = fitem;
    Sound.play("pickup");
    return;
  }

  hint(p, "Nothing here");
}

function freeSpotInFront(world, p) {
  const candidates = [
    { x: p.x + p.dx * 34, y: p.y + p.dy * 34 },
    { x: p.x, y: p.y }
  ];
  for (const c of candidates) {
    const t = tileOf(c.x, c.y);
    if (isWalkable(world, t.x, t.y)) return { x: t.x * TILE + TILE / 2, y: t.y * TILE + TILE / 2 };
  }
  return null;
}

/** What would E do right now? Side-effect-free mirror of doInteract, used
    only for the on-screen button prompt. */
function previewInteract(p) {
  const world = Game.world;
  if (p.patient) {
    if (facingStation(world, p, st => STATIONS[st.type].holdsPatient && !st.occupant))
      return p.patient.done ? null : "Place patient";
    return p.patient.done ? null : "Set down";
  }
  if (p.item) {
    const bedded = facingStation(world, p, st => st.occupant && st.type === "bed");
    if (bedded) return null;                      // Q is the star here, keep E quiet
    return "Drop " + ITEMS[p.item.type].name.toLowerCase();
  }
  if (facingPatient(p)) return "Pick up patient";
  if (facingStation(world, p, st => st.occupant)) return "Pick up patient";
  if (facingStation(world, p, st => st.type === "defibrack" && st.hasDefib)) return "Take defib";
  const fi = facingFloorItem(p);
  if (fi) return "Pick up " + ITEMS[fi.type].name.toLowerCase();
  return null;
}

/* --- The "use" key: start or continue a hold-to-work action -------------- */

/** What (if anything) can this player work on right now? Returns a job
    descriptor: {key, dur, run} where run() applies the effect. */
function findJob(p) {
  const world = Game.world;
  if (p.patient) return null;   // hands full of patient

  // 1. Bedside work on the patient we are facing.
  const bedStation = facingStation(world, p, st => st.occupant && st.type === "bed");
  if (bedStation) {
    const pt = bedStation.occupant;
    const step = pt.steps[pt.step];
    if (step && step.k === "bedside") {
      const holdsRight = step.need ? (p.item && p.item.type === step.need) : !p.item;
      if (holdsRight) {
        return {
          key: "bed" + bedStation.x + "," + bedStation.y + ":" + pt.id + ":" + pt.step,
          dur: step.dur,
          label: step.label,
          ptId: pt.id,
          run: () => {
            if (step.need) {
              if (step.need === "defib_charged") {
                p.item = makeItem("defib");         // discharged, still in hand
                Sound.play("shock");
                Game.shake = Math.max(Game.shake, 7);
                burst(pt.x, pt.y, "#ffe066", 16);
              } else {
                p.item = null;
              }
            }
            if (step.produce) p.item = makeItem(step.produce, { pid: pt.id });
            advancePatient(pt);
          }
        };
      }
      if (step.need) hint(p, "Needs " + ITEMS[step.need].name);
    } else if (step && step.k === "lab") {
      hint(p, "Lab is still working");
    } else if (step && step.k === "atStation") {
      hint(p, "Take them to the " + STATIONS[step.station].name);
    }
  }

  // 2. Station work.
  const st = facingStation(world, p, s => RECIPES[s.type] && RECIPES[s.type].length);
  if (!st) return null;

  if (st.jammed) {
    if (p.item) { hint(p, "Free your hands to fix it"); return null; }
    return {
      key: "fix" + st.x + "," + st.y,
      dur: 2.2,
      label: "Repair " + STATIONS[st.type].name,
      run: () => {
        st.jammed = false; st.flash = 0.4;
        popup(st.cx, st.cy - 24, "Fixed!", PALETTE.good);
        Sound.play("done");
      }
    };
  }

  for (const r of RECIPES[st.type]) {
    const holds = r.need ? (p.item && p.item.type === r.need) : !p.item;
    if (!holds) continue;

    if (r.patientStep) {
      const pt = st.occupant;
      if (!pt) { hint(p, "Put a patient on the " + STATIONS[st.type].name); continue; }
      const step = pt.steps[pt.step];
      if (!step || step.k !== "atStation" || step.station !== st.type) { hint(p, "They don't need that"); continue; }
      return {
        key: "st" + st.x + "," + st.y + ":" + pt.id + ":" + pt.step,
        dur: r.dur, label: r.label, ptId: pt.id,
        run: () => {
          if (r.out) p.item = makeItem(r.out);
          advancePatient(pt);
          maybeJam(st);
        }
      };
    }

    if (r.stock && st.stock <= 0) { hint(p, "Empty — restock from the delivery door"); continue; }

    if (r.restock) {
      if (st.stock >= (STATIONS[st.type].stockMax || 0)) { hint(p, "Already full"); continue; }
      return {
        key: "re" + st.x + "," + st.y, dur: r.dur, label: r.label,
        run: () => {
          st.stock = STATIONS[st.type].stockMax;
          p.item = null; st.flash = 0.4;
          popup(st.cx, st.cy - 24, "Restocked", PALETTE.good);
          Sound.play("done");
        }
      };
    }

    if (r.labWork) {
      const pid = p.item.pid;
      return {
        key: "lab" + st.x + "," + st.y + ":" + (pid || 0), dur: r.dur, label: r.label,
        run: () => {
          p.item = null;
          const pt = Game.patients.find(q => q.id === pid && q.state !== "gone");
          if (!pt) { popup(st.cx, st.cy - 24, "Patient gone", PALETTE.dim); return; }
          revealMystery(pt);
        }
      };
    }

    // Plain transform / production recipe.
    return {
      key: "st" + st.x + "," + st.y + ":" + r.label, dur: r.dur, label: r.label,
      run: () => {
        if (r.stock && st.stock !== Infinity) st.stock--;
        p.item = r.out ? makeItem(r.out) : null;
        st.flash = 0.3;
        if (r.out === "defib_charged") Sound.play("charge"); else Sound.play("done");
        maybeJam(st);
      }
    };
  }
  return null;
}

function maybeJam(st) {
  if (!Game.level.jams) return;
  if (st.type !== "xray") return;
  if (Game.rng() < 0.28) {
    st.jammed = true;
    popup(st.cx, st.cy - 26, "JAMMED", PALETTE.warn);
    Sound.play("jam");
  }
}

function revealMystery(pt) {
  const pool = Game.level.ailments.filter(a => a !== "mystery");
  const key = pool[Math.floor(Game.rng() * pool.length)] || "cut";
  const a = AILMENTS[key];
  pt.ailment = key;
  pt.revealed = true;
  pt.steps = a.steps.map(s => Object.assign({}, s));
  pt.step = 0;
  pt.done = false;
  pt.patienceMax = Math.max(pt.patienceMax, Game.level.patience * a.patienceMul);
  pt.patience = Math.min(pt.patienceMax, pt.patience + pt.patienceMax * LAB_REVEAL_BONUS);
  popup(pt.x, pt.y - 30, "It's " + a.name + "!", a.color, true);
  Sound.play("lab");
}

function advancePatient(pt) {
  pt.step++;
  pt.flash = 0.35;
  Sound.play("step");
  if (pt.step >= pt.steps.length) {
    pt.done = true;
    popup(pt.x, pt.y - 30, "Treated!", PALETTE.good);
    Sound.play("done");
    burst(pt.x, pt.y, PALETTE.good, 12);
  }
}

/* ---------------------------------------------------------------------
   10. SIMULATION
   --------------------------------------------------------------------- */

function updatePlayer(p, dt) {
  const world = Game.world;
  const c = p.ctrl;
  let mx = 0, my = 0;
  if (Keys[c.left]) mx -= 1;
  if (Keys[c.right]) mx += 1;
  if (Keys[c.up]) my -= 1;
  if (Keys[c.down]) my += 1;

  const moving = mx !== 0 || my !== 0;
  p.moving = moving;
  const wantSprint = !!Keys[c.sprint] && moving && p.stamina > 0;
  p.sprinting = wantSprint;
  if (wantSprint) {
    if (p.boost !== "adrenaline") p.stamina = Math.max(0, p.stamina - dt);
  } else {
    p.stamina = Math.min(Game.staminaMax, p.stamina + dt * STAMINA_REGEN);
  }

  if (moving) {
    const len = Math.hypot(mx, my);
    mx /= len; my /= len;
    p.dx = mx; p.dy = my;
    let speed = (p.patient ? SPEED_PATIENT : (p.item ? SPEED_ITEM : SPEED_FREE)) * Game.speedMul;
    if (wantSprint) speed *= p.patient ? SPRINT_MUL_PATIENT : SPRINT_MUL;
    if (p.boost === "coffee") speed *= 1.30;
    moveWithCollision(world, p, mx * speed * dt, my * speed * dt);
    p.bob += dt * (wantSprint ? 15 : 11);
    p.step += dt * (wantSprint ? 13 : 9);
  } else {
    p.bob += dt * 2;
  }

  // Interact (edge-triggered)
  if (wasPressed(c.interact)) doInteract(p);

  // Use (held) — progress a job, cancel if the job identity changes.
  if (Keys[c.use]) {
    const job = findJob(p);
    if (!job) {
      p.work = null;
    } else if (!p.work || p.work.key !== job.key) {
      p.work = { key: job.key, t: 0, dur: job.dur * Game.workMul, label: job.label,
                 run: job.run, ptId: job.ptId, tick: 0 };
    } else {
      p.work.run = job.run;                  // keep the closure fresh
      p.work.t += dt;
      p.work.tick += dt;
      if (p.work.tick > 0.22) { p.work.tick = 0; Sound.play("tick"); }
      if (p.work.t >= p.work.dur) {
        const run = p.work.run;
        p.work = null;
        run();
      }
    }
  } else {
    p.work = null;
  }

  // Auto-discharge: walk a treated patient onto the exit tile.
  if (p.patient && p.patient.done) {
    const t = tileOf(p.x, p.y);
    const cell = cellAt(world, t.x, t.y);
    if (cell && cell.exit) dischargePatient(p);
  }

  if (p.hintT > 0) p.hintT -= dt;
  if (p.squash > 0) p.squash -= dt;

  // contextual button prompts (drawn by the renderer)
  if (!p.work) {
    SILENT_HINTS = true;
    p.promptE = previewInteract(p);
    const job = findJob(p);
    p.promptQ = job ? job.label : null;
    SILENT_HINTS = false;
  } else {
    p.promptE = null; p.promptQ = null;
  }
}

function moveWithCollision(world, p, dx, dy) {
  // Axis-separated sweep so sliding along walls feels good.
  let nx = p.x + dx;
  if (!collides(world, nx, p.y)) p.x = nx;
  let ny = p.y + dy;
  if (!collides(world, p.x, ny)) p.y = ny;
  p.x = clamp(p.x, PLAYER_R, PLAY_W - PLAYER_R);
  p.y = clamp(p.y, PLAYER_R, PLAY_H - PLAYER_R);
}

function collides(world, px, py) {
  const r = PLAYER_R;
  const x0 = Math.floor((px - r) / TILE), x1 = Math.floor((px + r) / TILE);
  const y0 = Math.floor((py - r) / TILE), y1 = Math.floor((py + r) / TILE);
  for (let ty = y0; ty <= y1; ty++)
    for (let tx = x0; tx <= x1; tx++)
      if (!isWalkable(world, tx, ty)) return true;
  return false;
}

function dischargePatient(p) {
  const pt = p.patient;
  p.patient = null;
  pt.state = "gone";

  const a = AILMENTS[pt.ailment];
  const frac = pt.patience / pt.patienceMax;
  Game.combo = Game.comboTimer > 0 ? Game.combo + 1 : 1;
  Game.bestCombo = Math.max(Game.bestCombo, Game.combo);
  Game.comboTimer = Game.comboWindow;
  const mult = Math.min(COMBO_MAX, 1 + 0.25 * (Game.combo - 1));

  let base = a.score + Math.round(frac * 100);
  if (pt.vip) base *= 2;
  let callout = null, calloutColor = PALETTE.good;
  if (frac >= Game.perfectAt) {
    base += Math.round(a.score * 0.5);
    callout = "PERFECT!"; calloutColor = "#ffd54a";
    Game.perfects++;
  } else if (frac <= CLUTCH_AT) {
    base += CLUTCH_BONUS;
    callout = "CLUTCH SAVE!"; calloutColor = "#ff7ab8";
    Game.clutches++;
  }

  const surge = Game.event ? EVENT_PAY : 1;
  const gained = Math.round(base * mult * surge * (Game.diff ? Game.diff.scoreMul : 1));
  Game.score += gained;
  Game.treated++;
  Game.byAilment[pt.ailment] = (Game.byAilment[pt.ailment] || 0) + 1;
  if (Game.builderMode && Game.builder) {
    const cr = Math.max(6, Math.round(gained / 7));
    Game.builder.credits += cr;
    Game.builder.totalCredits += cr;
    popup(pt.x, pt.y - 108, "+" + cr + "c", "#6fd3b4");
  }
  Game.career.treated++;
  if (pt.ailment === "cardiac") Game.career.cardiac++;
  if (pt.ailment === "mystery") Game.career.mystery++;
  checkLiveAchievements();
  if (Game.endless && Game.treated % 10 === 0 && Game.lives < 3) {
    Game.lives++;
    popup(pt.x, pt.y - 92, "LIFE RESTORED", "#ff4d6d", true);
    Sound.play("newbest");
  }

  popup(pt.x, pt.y - 26, "+" + gained + (mult > 1 ? "  x" + fmtMult(mult) : ""), pt.vip ? "#ffd54a" : PALETTE.good, true);
  if (surge > 1) popup(pt.x, pt.y - 92, "SURGE PAY", Game.event.def.color);
  if (pt.vip) popup(pt.x, pt.y - 70, "VIP x2", "#ffd54a", true);
  if (callout) popup(pt.x, pt.y - 52, callout, calloutColor, true);
  if (Game.combo >= 3) popup(pt.x, pt.y - 74, "CHAIN x" + Game.combo, "#8be9ff");
  burst(pt.x, pt.y, "#ffe066", 18 + Math.min(20, Game.combo * 3));
  Game.flashGood = 0.35;
  Sound.discharge(Game.combo);
  if (callout === "CLUTCH SAVE!") Sound.play("clutch");
}

function losePatient(pt) {
  pt.state = "gone";
  Game.lost++;
  Game.lives = Math.max(0, Game.lives - 1);
  Game.combo = 0; Game.comboTimer = 0;
  const penalty = 60;
  Game.score = Math.max(0, Game.score - penalty);

  if (Game.level.flatline) {
    popup(pt.x, pt.y - 26, "FLATLINE  -" + penalty, PALETTE.bad, true);
    Game.shake = 16;
    Game.flashRed = 0.5;
    Sound.play("flatline");
    burst(pt.x, pt.y, PALETTE.bad, 20);
  } else {
    popup(pt.x, pt.y - 26, "Stormed out  -" + penalty, PALETTE.bad, true);
    Game.shake = 6;
    Sound.play("leave");
  }

  // free whatever they occupied
  if (pt.station) { pt.station.occupant = null; pt.station = null; }
  for (const p of Game.players) if (p.patient === pt) p.patient = null;
}

function updatePatients(dt) {
  for (const pt of Game.patients) {
    if (pt.state === "gone") continue;
    pt.bob += dt * 3;
    if (pt.flash > 0) pt.flash -= dt;

    // Patience: slower once they are settled in a bed.
    if (!pt.done) {
      const inBed = pt.station && pt.station.type === "bed";
      let rate = inBed ? 0.62 : (pt.state === "station" ? 0.8 : 1.0);
      if (Game.tendedIds && Game.tendedIds.has(pt.id)) rate *= 0.25;
      pt.patience -= dt * rate;
      if (pt.patience <= 0) { losePatient(pt); continue; }
    }

    // Movement for patients that walk themselves in.
    if (pt.state === "walking") {
      if (pt.path.length) {
        const tgt = pt.path[0];
        const vx = tgt.x - pt.x, vy = tgt.y - pt.y;
        const d = Math.hypot(vx, vy);
        if (d < 4) pt.path.shift();
        else { const s = 78 * dt; pt.x += (vx / d) * s; pt.y += (vy / d) * s; }
      } else {
        pt.state = "waiting";
      }
    } else if (pt.state === "carried") {
      const carrier = Game.players.find(p => p.patient === pt);
      if (carrier) { pt.x = carrier.x; pt.y = carrier.y - 26; }
    }
  }
  Game.patients = Game.patients.filter(p => p.state !== "gone");
}

const EASE_IN_SECS = 25;                 // opening window with no brutal cases

/* Which chains can this department physically run? In builder mode a case you
   have no equipment for is not a challenge, it is a guaranteed loss — so those
   patients are diverted to another hospital and never arrive. Building the
   machine is what opens the (higher-scoring) case type. */
function treatableAilments(pool) {
  const have = (t) => Game.world.stations.some(q => q.type === t);
  return pool.filter(a => {
    if (a === "cut") return have("supply");
    if (a === "infection") return have("medicine");
    if (a === "fracture") return have("xray") && have("cast");
    if (a === "cardiac") return have("defibrack") && have("charger");
    if (a === "mystery") return have("lab");
    return true;
  });
}

function chooseAilment() {
  let pool = Game.level.ailments;
  if (Game.builderMode) {
    const ok = treatableAilments(pool);
    if (ok.length) pool = ok;
    else return "cut";                       // a bare ward still gets walk-ins
  }
  if (Game.forceAilment > 0 && pool.includes("infection")) {
    Game.forceAilment--;
    return "infection";
  }
  // Ease into the shift: the first arrivals are never cardiac or mystery,
  // so no seed can deal the two hardest chains as an opening hand.
  if (Game.time < EASE_IN_SECS) {
    const gentle = pool.filter(a => a !== "cardiac" && a !== "mystery");
    if (gentle.length) pool = gentle;
  }
  const r = Game.rng();
  const idx = Math.floor(r * pool.length);
  return pool[clamp(idx, 0, pool.length - 1)];
}

/** Interval between arrivals right now: ramps down across a timed level, and
    keeps tightening forever in endless mode. */
function currentSpawnInterval() {
  const lvl = Game.level;
  if (Game.endless) {
    // asymptotic squeeze: 8.5s at the start, closing on spawnEnd after ~4 min
    return Math.max(lvl.spawnEnd, lvl.spawnStart - Game.time / 26)
           * (Game.diff ? Game.diff.spawn : 1) * Game.spawnMul;
  }
  const t = clamp(Game.time / lvl.duration, 0, 1);
  return lerp(lvl.spawnStart, lvl.spawnEnd, t) * (Game.diff ? Game.diff.spawn : 1) * Game.spawnMul;
}

/** Ambulances arrive on a rhythm, dumping several patients at once. Gives the
    shift a pulse of calm and panic instead of a flat grind. */
function updateWaves(dt) {
  Game.waveTimer -= dt;
  if (Game.waveTimer > 0) return;
  Game.wave++;
  Game.waveTimer = WAVE_EVERY;
  Game.burst = 2 + Math.min(3, Math.floor(Game.wave / 2));
  Game.banner = { text: "AMBULANCE INBOUND", sub: Game.burst + " patients arriving at once", t: 0, urgent: true };
  Sound.play("siren");
}

function updateSpawning(dt) {
  const lvl = Game.level;
  const waiting = Game.patients.filter(p => p.state === "waiting" || p.state === "walking").length;
  Game.spawnTimer -= dt;
  if (Game.spawnTimer > 0) return;

  if (waiting >= lvl.maxWaiting) { Game.spawnTimer = 1.0; return; }

  const free = Game.world.waitSlots.filter(s =>
    !Game.patients.some(p => p.slot && p.slot.x === s.x && p.slot.y === s.y));
  if (!free.length) { Game.spawnTimer = 1.0; return; }

  const pt = makePatient(Game.world, chooseAilment(), lvl);
  const slot = free[Math.floor(Game.rng() * free.length)];
  pt.slot = slot;
  pt.path = findPath(Game.world, Game.world.entrance, slot);
  Game.patients.push(pt);
  Sound.play("spawn");

  // Mid-burst arrivals come almost back to back; otherwise use the ramp.
  if (Game.burst > 0) {
    Game.burst--;
    Game.spawnTimer = 0.55;
  } else {
    Game.spawnTimer = currentSpawnInterval() * (0.82 + Game.rng() * 0.36);
  }
}

function updateItems(dt) {
  // Charged defibs lose their charge; loose defibs are never truly lost.
  const decay = (it) => {
    if (it.type !== "defib_charged") return;
    it.charge -= dt;
    if (it.charge <= 0) {
      it.type = "defib";
      delete it.charge;
      Sound.play("error");
    }
  };
  for (const p of Game.players) if (p.item) decay(p.item);
  for (const it of Game.floorItems) decay(it);
}

function updateEffects(dt) {
  for (const p of Game.popups) { p.t += dt; p.y -= dt * 26; }
  Game.popups = Game.popups.filter(p => p.t < p.life);
  for (const q of Game.particles) {
    q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 240 * dt;
  }
  Game.particles = Game.particles.filter(q => q.t < q.life);
  Game.scoreShown += (Game.score - Game.scoreShown) * Math.min(1, dt * 9);
  if (Math.abs(Game.score - Game.scoreShown) < 0.6) Game.scoreShown = Game.score;
  if (Game.shake > 0) Game.shake = Math.max(0, Game.shake - dt * 26);
  if (Game.flashRed > 0) Game.flashRed = Math.max(0, Game.flashRed - dt * 1.4);
  if (Game.flashGood > 0) Game.flashGood = Math.max(0, Game.flashGood - dt * 2.2);
  for (const st of Game.world.stations) if (st.flash > 0) st.flash -= dt;
  if (Game.banner) { Game.banner.t += dt; if (Game.banner.t > 3.2) Game.banner = null; }
  for (let i = Game.toasts.length - 1; i >= 0; i--) {
    Game.toasts[i].t += dt;
    if (Game.toasts[i].t >= Game.toasts[i].life) Game.toasts.splice(i, 1);
  }
  if (Game.comboTimer > 0) {
    Game.comboTimer -= dt;
    if (Game.comboTimer <= 0) {
      if (Game.combo >= 2) Sound.tone(340, 0.18, "triangle", 0.05, 190);
      Game.combo = 0;
    }
  }
}

/** A heartbeat that quickens while anyone is close to running out. */
function updateHeartMonitor(dt) {
  let worst = 1;
  for (const pt of Game.patients) {
    if (pt.done || pt.state === "gone") continue;
    worst = Math.min(worst, pt.patience / pt.patienceMax);
  }
  Game.critical = worst;
  if (worst >= CRIT_AT) { Game.heartTimer = 0; return; }
  Game.heartTimer -= dt;
  if (Game.heartTimer <= 0) {
    Game.heartTimer = lerp(0.30, 0.78, clamp(worst / CRIT_AT, 0, 1));
    Sound.play("heart");
  }
}

/* First-shift tutorial: six short tips that each wait for the player to
   actually do the thing before moving on. Level 1 only. */
const TUTORIAL_STEPS = [
  { text: "Patients arrive at the blue IN door - walk up and press E to pick one up",
    done: () => Game.players.some(p => p.patient) },
  { text: "Carry them to a bed and press E to tuck them in",
    done: () => Game.patients.some(pt => pt.state === "station") },
  { text: "The bubble shows what they need - fetch it from the matching station",
    done: () => Game.players.some(p => p.item) },
  { text: "Stand at the bed and HOLD the use key to treat them",
    done: () => Game.patients.some(pt => pt.done) || Game.treated > 0 },
  { text: "Healed! Pick them up and walk them to the green OUT tile",
    done: () => Game.treated > 0 },
  { text: "Quick discharges chain into combo multipliers. Good luck out there!",
    done: () => Game.tutorial.t > 5 }
];

function updateTutorial(dt) {
  const tut = Game.tutorial;
  if (!tut || tut.stage >= TUTORIAL_STEPS.length) return;
  tut.t += dt;
  if (tut.t > 2.0 && TUTORIAL_STEPS[tut.stage].done()) {
    tut.stage++;
    tut.t = 0;
    Sound.play("step");
  }
}

/* Nurse Joy: wanders to the most-stressed settled patient and comforts
   them, restoring a chunk of patience. She never treats — that's your job. */
function updateNurse(dt) {
  const nu = Game.nurse;
  if (!nu) return;
  nu.bob += dt * (nu.moving ? 11 : 2);
  if (nu.cooldown > 0) nu.cooldown -= dt;

  // validate current target
  if (nu.target && (nu.target.state !== "station" || nu.target.done ||
      nu.target.patience / nu.target.patienceMax > 0.92)) {
    nu.target = null; nu.path = []; nu.comfort = 0;
  }

  // pick the most urgent settled patient
  if (!nu.target && nu.cooldown <= 0) {
    let best = null, bestFrac = 0.85;
    for (const pt of Game.patients) {
      if (pt.state !== "station" || pt.done) continue;
      const frac = pt.patience / pt.patienceMax;
      if (frac < bestFrac) { bestFrac = frac; best = pt; }
    }
    if (best) {
      nu.target = best;
      const here = tileOf(nu.x, nu.y);
      const st = best.station;
      let goal = null;
      for (const [dx, dy] of [[0, 1], [1, 0], [-1, 0], [0, -1]]) {
        if (isWalkable(Game.world, st.x + dx, st.y + dy)) { goal = { x: st.x + dx, y: st.y + dy }; break; }
      }
      nu.path = goal ? findPath(Game.world, here, goal) : [];
      if (goal && !nu.path.length && (here.x !== goal.x || here.y !== goal.y)) {
        nu.target = null;                       // unreachable from here
      }
    }
  }

  // walk the path
  nu.moving = false;
  if (nu.path.length) {
    const tgt = nu.path[0];
    const vx = tgt.x - nu.x, vy = tgt.y - nu.y;
    const d = Math.hypot(vx, vy);
    if (d < 4) nu.path.shift();
    else {
      const sp = 118 * dt;
      nu.x += (vx / d) * sp; nu.y += (vy / d) * sp;
      nu.dx = vx / d; nu.dy = vy / d;
      nu.moving = true; nu.step = (nu.step || 0) + dt * 9;
    }
    return;
  }

  // beside the bed: comfort
  if (nu.target) {
    const st = nu.target.station;
    if (!st || Math.hypot(st.cx - nu.x, st.cy - nu.y) > 70) { nu.target = null; return; }
    nu.comfort += dt;
    if (nu.comfort >= 1.3) {
      const pt = nu.target;
      // 0.28 every 3.5s out-healed the 0.62/s drain about threefold, which made
      // patience stop mattering entirely; 0.18 every 5s buys back roughly one
      // patient's worth of time, so she helps without playing the game for you
      pt.patience = Math.min(pt.patienceMax, pt.patience + pt.patienceMax * 0.18);
      popup(pt.x, pt.y - 30, "+ \u2665", "#ff8fa8", false);
      Sound.play("place");
      nu.comfort = 0; nu.cooldown = 5.0; nu.target = null;
    }
  }
}


/* ---------------------------------------------------------------------
   Shift events, pickups, and the co-op high five.
   --------------------------------------------------------------------- */

const EVENT_FIRST = 45;         // sec before the first event can fire
const EVENT_GAP   = 42;         // and roughly how long between them after
const EVENT_PAY   = 1.40;       // discharges are worth more while a surge runs
const PICKUP_FIRST = 26;
const PICKUP_GAP   = 30;

/** Pick a random open tile with nothing important on it. */
function randomFreeTile(world) {
  const cands = [];
  for (let y = 1; y < ROWS - 1; y++)
    for (let x = 1; x < COLS - 1; x++) {
      if (!isWalkable(world, x, y)) continue;
      if (x === world.entrance.x && y === world.entrance.y) continue;
      if (x === world.exit.x && y === world.exit.y) continue;
      cands.push({ x, y });
    }
  if (!cands.length) return null;
  return cands[Math.floor(Game.rng() * cands.length)];
}

function updateEvents(dt) {
  // no events on the two tutorial wards — learn the job before it gets weird
  if (Game.levelIndex < 2 && !Game.endless) return;

  if (Game.event) {
    Game.event.t += dt;
    if (Game.event.t >= Game.event.def.dur) {
      // wind the effects back down
      Game.spawnMul = 1; Game.workMul = 1; Game.dim = 0;
      Game.event = null;
      Game.eventTimer = EVENT_GAP * (0.75 + Game.rng() * 0.6);
    } else if (Game.event.def.key === "flicker") {
      // lights stutter for the duration
      Game.dim = 0.35 + 0.25 * Math.sin(Game.event.t * 11);
    }
    return;
  }

  Game.eventTimer -= dt;
  if (Game.eventTimer > 0) return;
  // never fire one in the last stretch — a surprise you cannot answer is
  // just a punishment
  if (!Game.endless && Game.time > Game.level.duration - 30) return;

  // prefer an event this shift has not shown yet
  let pool = EVENTS.filter(e => !Game.eventsSeen.includes(e.key));
  if (!pool.length) { Game.eventsSeen = []; pool = EVENTS.slice(); }
  if (!Game.level.ailments.includes("infection"))
    pool = pool.filter(e => e.key !== "outbreak") ;
  if (!pool.length) pool = EVENTS.slice();
  const def = pool[Math.floor(Game.rng() * pool.length)];
  Game.eventsSeen.push(def.key);
  Game.event = { def, t: 0 };
  Game.banner = { text: def.name, sub: def.sub, t: 0, color: def.color };
  Sound.play("siren");
  Game.shake = Math.max(Game.shake, 6);

  switch (def.key) {
    case "ambulance": Game.burst = 2; Game.spawnTimer = Math.min(Game.spawnTimer, 0.6); break;
    case "outbreak":  Game.forceAilment = 3; Game.spawnTimer = Math.min(Game.spawnTimer, 1.2); break;
    case "flicker":   Game.workMul = 1.30; break;
    case "rush":      Game.spawnMul = 0.70; break;
    case "vip":       Game.forceVip = true; Game.spawnTimer = Math.min(Game.spawnTimer, 1.0); break;
  }
}

/* Pickups: a small active-play reward for noticing something on the floor. */
const PICKUP_KINDS = [
  { key: "coffee",     name: "COFFEE!",     color: "#c98a5f", dur: 11 },
  { key: "adrenaline", name: "ADRENALINE!", color: "#ff7ab8", dur: 9 }
];

function updatePickups(dt) {
  Game.pickupTimer -= dt;
  if (Game.pickupTimer <= 0 && Game.pickups.length < 2) {
    const t = randomFreeTile(Game.world);
    if (t) {
      const kind = PICKUP_KINDS[Math.floor(Game.rng() * PICKUP_KINDS.length)];
      Game.pickups.push({ kind, x: t.x * TILE + TILE / 2, y: t.y * TILE + TILE / 2, t: 0 });
    }
    Game.pickupTimer = PICKUP_GAP * (0.7 + Game.rng() * 0.7);
  }
  for (let i = Game.pickups.length - 1; i >= 0; i--) {
    const pu = Game.pickups[i];
    pu.t += dt;
    if (pu.t > 26) { Game.pickups.splice(i, 1); continue; }   // stale, fades away
    for (const p of Game.players) {
      if (Math.hypot(p.x - pu.x, p.y - pu.y) > 30) continue;
      applyBoost(p, pu.kind);
      Game.pickups.splice(i, 1);
      break;
    }
  }
  // tick boosts down
  for (const p of Game.players) {
    if (p.boostT > 0) {
      p.boostT -= dt;
      if (p.boost === "adrenaline") p.stamina = Game.staminaMax;
      if (p.boostT <= 0) { p.boostT = 0; p.boost = null; }
    }
  }
}

function applyBoost(p, kind) {
  p.boost = kind.key;
  p.boostT = kind.dur;
  popup(p.x, p.y - 40, kind.name, kind.color, true);
  burst(p.x, p.y, kind.color, 16);
  Sound.play("newbest");
  if (kind.key === "adrenaline") p.stamina = Game.staminaMax;
}

/** Both medics side by side, both hitting Use: refill and re-light the chain. */
function updateHighFive(dt) {
  if (Game.highFiveCool > 0) Game.highFiveCool -= dt;
  if (Game.players.length < 2 || Game.highFiveCool > 0) return;
  const [a, b] = Game.players;
  if (Math.hypot(a.x - b.x, a.y - b.y) > 62) return;
  if (!wasPressed(a.ctrl.use) || !wasPressed(b.ctrl.use)) return;

  Game.highFiveCool = 5;
  Game.highFives++;
  for (const p of Game.players) { p.stamina = Game.staminaMax; p.squash = 0.3; }
  if (Game.combo > 0) Game.comboTimer = Game.comboWindow;   // keeps the chain alive
  Game.score += 120;
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  popup(mx, my - 52, "HIGH FIVE!  +120", "#ffd54a", true);
  burst(mx, my - 20, "#ffe066", 22);
  Sound.play("clutch");
  checkLiveAchievements();
}

function updatePlay(dt) {
  Game.time += dt;
  for (const p of Game.players) updatePlayer(p, dt);
  Game.tendedIds = new Set();
  for (const p of Game.players) if (p.work && p.work.ptId) Game.tendedIds.add(p.work.ptId);
  updatePatients(dt);
  updateWaves(dt);
  updateEvents(dt);
  updatePickups(dt);
  updateHighFive(dt);
  updateSpawning(dt);
  updateItems(dt);
  updateNurse(dt);
  updateStaff(dt);
  updateHeartMonitor(dt);
  updateTutorial(dt);
  updateEffects(dt);

  if (Game.builderMode) {
    if (Game.lives <= 0) endBuilderRun();
    else if (Game.time >= Game.level.duration) endWave();
    return;
  }
  if (Game.time >= Game.level.duration || Game.lives <= 0) endLevel();
}

function endBuilderRun() {
  const B = Game.builder;
  B.bestWave = Math.max(B.bestWave || 0, B.wave);
  Game.builderBest = Math.max(Game.builderBest || 0, B.wave);
  Game.career.shifts++;
  const xpGain = Math.round(Game.score / 10) + Game.treated * 5;
  Game.xp += xpGain;
  checkLiveAchievements();
  Game.result = {
    failed: true, stars: 0, newBest: B.wave >= (Game.builderBest || 0),
    builder: true, wave: B.wave, xpGain, challenges: null,
    name: "ER Builder — wave " + B.wave, targets: null,
    score: Game.score, treated: Game.treated, lost: Game.lost,
    bestCombo: Game.bestCombo, perfects: Game.perfects, clutches: Game.clutches,
    spent: B.totalCredits, built: B.bought.length, staff: Game.staff.length,
    t: 0
  };
  Game.screen = "results";
  Game.builderMode = false;
  Sound.play("error");
}

function starsFor(index, score) {
  if (index < 0) return 0;
  const th = LEVELS[index].stars;
  let s = 0;
  for (const t of th) if (score >= t) s++;
  return s;
}

function endLevel() {
  const failed = Game.lives <= 0;
  Game.career.shifts++;
  // XP accrues from every shift, cleared or not, so a losing run still moves
  // something forward
  const xpGain = Math.round(Game.score / 10) + Game.treated * 5;
  Game.xp += xpGain;
  if (Game.treated > 0 && !failed) unlockAch("first");
  if (Game.lost === 0 && Game.treated > 0 && !failed) unlockAch("flawless");
  checkLiveAchievements();

  if (Game.endless) {
    const newBest = Game.score > Game.endlessBest;
    if (newBest) Game.endlessBest = Game.score;
    Game.result = {
      failed, stars: 0, newBest, endless: true, xpGain, challenges: null, newChallenges: 0,
      name: ENDLESS.name, targets: null,
      score: Game.score, treated: Game.treated, lost: Game.lost,
      survived: Game.time, wave: Game.wave,
      bestCombo: Game.bestCombo, perfects: Game.perfects, clutches: Game.clutches,
      t: 0
    };
    Game.screen = "results";
    Sound.play(newBest ? "newbest" : "error");
    return;
  }

  const stars = failed ? 0 : starsFor(Game.levelIndex, Game.score);
  const prog = Game.progress[Game.levelIndex];
  const newBest = Game.score > prog.best;
  if (newBest) prog.best = Game.score;
  const gainedStars = Math.max(0, stars - prog.stars);
  prog.stars = Math.max(prog.stars, stars);
  if (stars >= 1 && Game.levelIndex + 1 < LEVELS.length) Game.progress[Game.levelIndex + 1].unlocked = true;

  // shift challenges: evaluated once, then remembered on the level card
  const list = CHALLENGES[Game.levelIndex] || [];
  const met = list.map(c => challengeMet(c));
  let newChallenges = 0;
  met.forEach((ok, i) => {
    if (ok && !prog.challenges[i]) { prog.challenges[i] = true; newChallenges++; }
  });
  if (stars >= 3 && DIFFS[Game.difficulty].key === "overtime") unlockAch("overtime");
  if (totalStars() >= 15) unlockAch("stars15");
  if (totalStars() >= 30) unlockAch("stars30");

  Game.result = {
    failed, stars, newBest, gainedStars, xpGain,
    challenges: list.map((c, i) => ({ text: challengeText(c), met: met[i] })),
    newChallenges,
    difficulty: DIFFS[Game.difficulty].name,
    name: LEVELS[Game.levelIndex].name, targets: LEVELS[Game.levelIndex].stars,
    score: Game.score, treated: Game.treated, lost: Game.lost,
    bestCombo: Game.bestCombo, perfects: Game.perfects, clutches: Game.clutches,
    t: 0
  };
  Game.screen = "results";
  Sound.play(failed ? "error" : (newBest ? "newbest" : "levelend"));
}

/* Escalation is deliberately gentle on arrivals and steep on variety: new
   ailments are what actually make a wave harder, because each one adds a
   whole procedure chain to juggle. Rates bottom out at values a built-up
   department can genuinely service. */
function builderWaveDef(n) {
  const ail = ["cut", "infection"];
  if (n >= 2) ail.push("fracture");
  if (n >= 3) ail.push("cardiac");
  if (n >= 5) ail.push("mystery");
  const notes = [];
  if (n === 2) notes.push("fractures arriving");
  if (n === 3) notes.push("cardiac arrests arriving");
  if (n === 4) notes.push("shelves now run dry");
  if (n === 5) notes.push("mystery cases arriving");
  if (n === 6) notes.push("equipment starts to jam");
  return {
    name: "Wave " + n,
    blurb: notes.length ? notes.join(" · ") : "Keep the department moving.",
    seed: (0xB0A5 + n * 7919) >>> 0,
    duration: 180,
    patience: Math.max(48, 94 - n * 4),
    spawnStart: Math.max(5.4, 13.0 - n * 0.72),
    spawnEnd: Math.max(4.0, 9.0 - n * 0.55),
    maxWaiting: Math.min(9, 3 + Math.floor(n / 2)),
    ailments: ail,
    stars: null,
    restock: n >= 4,
    jams: n >= 6,
    flatline: n >= 3,
    theme: BUILDER_THEME,
    props: ["bench", "plant", "chair", "cooler", "sign", "locker"],
    map: BUILDER_MAP,
    builder: true
  };
}

  Game.lives = 3;
  Game.treated = 0;
  Game.lost = 0;
  Game.combo = 0;
  Game.comboTimer = 0;
  Game.bestCombo = 0;
  Game.perfects = 0;
  Game.clutches = 0;
  Game.wave = 0;
  Game.waveTimer = WAVE_FIRST;
  Game.burst = 0;
  Game.heartTimer = 0;
  Game.endless = !!def.endless;
  Game.shake = 0;
  Game.flashRed = 0;
  Game.flashGood = 0;
  Game.banner = { text: def.name, sub: def.blurb, t: 0 };
  Game.result = null;
  Game.tutorial = (index === 0) ? { stage: 0, t: 0 } : null;

  if (perkActive("shelves")) {
    for (const st of Game.world.stations) {
      if (st.type === "supply" || st.type === "medicine") {
        st.stock = STATIONS[st.type].stockMax + 2;
      }
    }
  }

  // Drop the players near the exit, on open floor.
  const spawnTiles = findOpenTilesNear(Game.world, Game.world.exit, 2);
  Game.players = [];
  for (let i = 0; i < Game.playerCount; i++) {
    const t = spawnTiles[i] || spawnTiles[0] || { x: 1, y: 1 };
    Game.players.push(makePlayer(i, t.x * TILE + TILE / 2, t.y * TILE + TILE / 2));
  }
  Game.nurse = null;
  if (perkActive("nurse")) {
    const t = spawnTiles[Game.playerCount] || spawnTiles[0] || { x: 1, y: 1 };
    Game.nurse = {
      x: t.x * TILE + TILE / 2, y: t.y * TILE + TILE / 2,
      dx: 0, dy: 1, bob: 0, step: 0, moving: false,
      path: [], target: null, comfort: 0, cooldown: 2
    };
  }

  Game.screen = "play";
  Sound.play("menu");
  Music.start();
}

function findOpenTilesNear(world, origin, count) {
  const out = [];
  const seen = new Set();
  const q = [{ x: origin.x, y: origin.y }];
  seen.add(origin.x + "," + origin.y);
  while (q.length && out.length < count + 2) {
    const cur = q.shift();
    if (isWalkable(world, cur.x, cur.y)) out.push(cur);
    for (const [dx, dy] of [[1, 0], [0, 1], [-1, 0], [0, -1]]) {
      const nx = cur.x + dx, ny = cur.y + dy, k = nx + "," + ny;
      if (!seen.has(k) && isWalkable(world, nx, ny)) { seen.add(k); q.push({ x: nx, y: ny }); }
    }
  }
  return out;
}

/* ---------------------------------------------------------------------
   9. INTERACTION
   --------------------------------------------------------------------- */

/** Find the station the player is facing (searching the 8 neighbouring tiles). */
function facingStation(world, p, filter) {
  const tp = tileOf(p.x, p.y);
  let best = null, bestScore = -1;
  for (let oy = -1; oy <= 1; oy++) {
    for (let ox = -1; ox <= 1; ox++) {
      const c = cellAt(world, tp.x + ox, tp.y + oy);
      if (!c || !c.station) continue;
      const st = c.station;
      if (filter && !filter(st)) continue;
      const vx = st.cx - p.x, vy = st.cy - p.y;
      const d = Math.hypot(vx, vy);
      if (d > REACH) continue;
      const dot = (vx / d) * p.dx + (vy / d) * p.dy;
      if (dot < FACE_DOT) continue;
      const score = dot * 2 - d / REACH;
      if (score > bestScore) { bestScore = score; best = st; }
    }
  }
  return best;
}

/** Find a loose patient (waiting or walking) the player is facing. */
function facingPatient(p) {
  let best = null, bestScore = -1;
  for (const pt of Game.patients) {
    if (pt.state !== "waiting" && pt.state !== "walking") continue;
    const vx = pt.x - p.x, vy = pt.y - p.y;
    const d = Math.hypot(vx, vy);
    if (d > 46) continue;
    // Inside your own body radius, "which way am I facing" is meaningless: a
    // sub-pixel offset flips the dot product and the patient becomes
    // impossible to pick up while you stand on top of them. The old guard was
    // d < 1, which is so tight it almost never fired — a medic standing 1px
    // from a patient facing the wrong way could be stuck indefinitely.
    const dot = d < PLAYER_R ? 1 : (vx / d) * p.dx + (vy / d) * p.dy;
    if (dot < 0) continue;
    const score = dot * 2 - d / 46;
    if (score > bestScore) { bestScore = score; best = pt; }
  }
  return best;
}

/** Find a loose item on the floor the player is facing. */
function facingFloorItem(p) {
  let best = null, bestD = 44;
  for (const it of Game.floorItems) {
    const d = Math.hypot(it.x - p.x, it.y - p.y);
    if (d < bestD) { bestD = d; best = it; }
  }
  return best;
}

let SILENT_HINTS = false;
function hint(p, msg) { if (SILENT_HINTS) return; p.hint = msg; p.hintT = 1.6; }

/** E / "/" — pick up, put down, place patients. */
function doInteract(p) {
  const world = Game.world;
  p.squash = 0.18;

  // Carrying a patient: place them on a bed / X-ray, or set them down.
  if (p.patient) {
    const target = facingStation(world, p, st => STATIONS[st.type].holdsPatient && !st.occupant);
    if (target) {
      p.patient.state = "station";
      p.patient.station = target;
      p.patient.x = target.cx; p.patient.y = target.cy - 6;
      target.occupant = p.patient;
      target.flash = 0.3;
      p.patient = null;
      Sound.play("place");
      return;
    }
    // Otherwise set them down on the floor in front (or under) the player.
    const spot = freeSpotInFront(world, p);
    if (spot) {
      const pt = p.patient;
      pt.state = "waiting"; pt.x = spot.x; pt.y = spot.y; pt.path = [];
      pt.slot = null; pt.station = null;
      p.patient = null;
      Sound.play("drop");
    } else {
      hint(p, "No room to set them down");
    }
    return;
  }

  // Carrying an item: drop it (or hand it to a shelf-free floor tile).
  if (p.item) {
    const spot = freeSpotInFront(world, p);
    if (spot) {
      const it = p.item;
      it.x = spot.x; it.y = spot.y;
      Game.floorItems.push(it);
      p.item = null;
      Sound.play("drop");
    } else {
      hint(p, "Nowhere to put that");
    }
    return;
  }

  // Empty-handed: pick something up. Priority: patient in front, patient on a
  // bed/X-ray we face, the defib rack, then a floor item.
  const loose = facingPatient(p);
  if (loose) {
    loose.state = "carried"; loose.path = []; loose.slot = null;
    p.patient = loose;
    Sound.play("pickup");
    return;
  }

  const occupied = facingStation(world, p, st => st.occupant);
  if (occupied) {
    const pt = occupied.occupant;
    occupied.occupant = null;
    pt.state = "carried"; pt.station = null;
    p.patient = pt;
    Sound.play("pickup");
    return;
  }

  const rack = facingStation(world, p, st => st.type === "defibrack" && st.hasDefib);
  if (rack) {
    rack.hasDefib = false;
    p.item = makeItem("defib");
    Sound.play("pickup");
    return;
  }

  const fitem = facingFloorItem(p);
  if (fitem) {
    Game.floorItems.splice(Game.floorItems.indexOf(fitem), 1);
    delete fitem.x; delete fitem.y;
    p.item = fitem;
    Sound.play("pickup");
    return;
  }

  hint(p, "Nothing here");
}

function freeSpotInFront(world, p) {
  const candidates = [
    { x: p.x + p.dx * 34, y: p.y + p.dy * 34 },
    { x: p.x, y: p.y }
  ];
  for (const c of candidates) {
    const t = tileOf(c.x, c.y);
    if (isWalkable(world, t.x, t.y)) return { x: t.x * TILE + TILE / 2, y: t.y * TILE + TILE / 2 };
  }
  return null;
}

/** What would E do right now? Side-effect-free mirror of doInteract, used
    only for the on-screen button prompt. */
function previewInteract(p) {
  const world = Game.world;
  if (p.patient) {
    if (facingStation(world, p, st => STATIONS[st.type].holdsPatient && !st.occupant))
      return p.patient.done ? null : "Place patient";
    return p.patient.done ? null : "Set down";
  }
  if (p.item) {
    const bedded = facingStation(world, p, st => st.occupant && st.type === "bed");
    if (bedded) return null;                      // Q is the star here, keep E quiet
    return "Drop " + ITEMS[p.item.type].name.toLowerCase();
  }
  if (facingPatient(p)) return "Pick up patient";
  if (facingStation(world, p, st => st.occupant)) return "Pick up patient";
  if (facingStation(world, p, st => st.type === "defibrack" && st.hasDefib)) return "Take defib";
  const fi = facingFloorItem(p);
  if (fi) return "Pick up " + ITEMS[fi.type].name.toLowerCase();
  return null;
}

/* --- The "use" key: start or continue a hold-to-work action -------------- */

/** What (if anything) can this player work on right now? Returns a job
    descriptor: {key, dur, run} where run() applies the effect. */
function findJob(p) {
  const world = Game.world;
  if (p.patient) return null;   // hands full of patient

  // 1. Bedside work on the patient we are facing.
  const bedStation = facingStation(world, p, st => st.occupant && st.type === "bed");
  if (bedStation) {
    const pt = bedStation.occupant;
    const step = pt.steps[pt.step];
    if (step && step.k === "bedside") {
      const holdsRight = step.need ? (p.item && p.item.type === step.need) : !p.item;
      if (holdsRight) {
        return {
          key: "bed" + bedStation.x + "," + bedStation.y + ":" + pt.id + ":" + pt.step,
          dur: step.dur,
          label: step.label,
          ptId: pt.id,
          run: () => {
            if (step.need) {
              if (step.need === "defib_charged") {
                p.item = makeItem("defib");         // discharged, still in hand
                Sound.play("shock");
                Game.shake = Math.max(Game.shake, 7);
                burst(pt.x, pt.y, "#ffe066", 16);
              } else {
                p.item = null;
              }
            }
            if (step.produce) p.item = makeItem(step.produce, { pid: pt.id });
            advancePatient(pt);
          }
        };
      }
      if (step.need) hint(p, "Needs " + ITEMS[step.need].name);
    } else if (step && step.k === "lab") {
      hint(p, "Lab is still working");
    } else if (step && step.k === "atStation") {
      hint(p, "Take them to the " + STATIONS[step.station].name);
    }
  }

  // 2. Station work.
  const st = facingStation(world, p, s => RECIPES[s.type] && RECIPES[s.type].length);
  if (!st) return null;

  if (st.jammed) {
    if (p.item) { hint(p, "Free your hands to fix it"); return null; }
    return {
      key: "fix" + st.x + "," + st.y,
      dur: 2.2,
      label: "Repair " + STATIONS[st.type].name,
      run: () => {
        st.jammed = false; st.flash = 0.4;
        popup(st.cx, st.cy - 24, "Fixed!", PALETTE.good);
        Sound.play("done");
      }
    };
  }

  for (const r of RECIPES[st.type]) {
    const holds = r.need ? (p.item && p.item.type === r.need) : !p.item;
    if (!holds) continue;

    if (r.patientStep) {
      const pt = st.occupant;
      if (!pt) { hint(p, "Put a patient on the " + STATIONS[st.type].name); continue; }
      const step = pt.steps[pt.step];
      if (!step || step.k !== "atStation" || step.station !== st.type) { hint(p, "They don't need that"); continue; }
      return {
        key: "st" + st.x + "," + st.y + ":" + pt.id + ":" + pt.step,
        dur: r.dur, label: r.label, ptId: pt.id,
        run: () => {
          if (r.out) p.item = makeItem(r.out);
          advancePatient(pt);
          maybeJam(st);
        }
      };
    }

    if (r.stock && st.stock <= 0) { hint(p, "Empty — restock from the delivery door"); continue; }

    if (r.restock) {
      if (st.stock >= (STATIONS[st.type].stockMax || 0)) { hint(p, "Already full"); continue; }
      return {
        key: "re" + st.x + "," + st.y, dur: r.dur, label: r.label,
        run: () => {
          st.stock = STATIONS[st.type].stockMax;
          p.item = null; st.flash = 0.4;
          popup(st.cx, st.cy - 24, "Restocked", PALETTE.good);
          Sound.play("done");
        }
      };
    }

    if (r.labWork) {
      const pid = p.item.pid;
      return {
        key: "lab" + st.x + "," + st.y + ":" + (pid || 0), dur: r.dur, label: r.label,
        run: () => {
          p.item = null;
          const pt = Game.patients.find(q => q.id === pid && q.state !== "gone");
          if (!pt) { popup(st.cx, st.cy - 24, "Patient gone", PALETTE.dim); return; }
          revealMystery(pt);
        }
      };
    }

    // Plain transform / production recipe.
    return {
      key: "st" + st.x + "," + st.y + ":" + r.label, dur: r.dur, label: r.label,
      run: () => {
        if (r.stock && st.stock !== Infinity) st.stock--;
        p.item = r.out ? makeItem(r.out) : null;
        st.flash = 0.3;
        if (r.out === "defib_charged") Sound.play("charge"); else Sound.play("done");
        maybeJam(st);
      }
    };
  }
  return null;
}

function maybeJam(st) {
  if (!Game.level.jams) return;
  if (st.type !== "xray") return;
  if (Game.rng() < 0.28) {
    st.jammed = true;
    popup(st.cx, st.cy - 26, "JAMMED", PALETTE.warn);
    Sound.play("jam");
  }
}

function revealMystery(pt) {
  const pool = Game.level.ailments.filter(a => a !== "mystery");
  const key = pool[Math.floor(Game.rng() * pool.length)] || "cut";
  const a = AILMENTS[key];
  pt.ailment = key;
  pt.revealed = true;
  pt.steps = a.steps.map(s => Object.assign({}, s));
  pt.step = 0;
  pt.done = false;
  pt.patienceMax = Math.max(pt.patienceMax, Game.level.patience * a.patienceMul);
  pt.patience = Math.min(pt.patienceMax, pt.patience + pt.patienceMax * LAB_REVEAL_BONUS);
  popup(pt.x, pt.y - 30, "It's " + a.name + "!", a.color, true);
  Sound.play("lab");
}

function advancePatient(pt) {
  pt.step++;
  pt.flash = 0.35;
  Sound.play("step");
  if (pt.step >= pt.steps.length) {
    pt.done = true;
    popup(pt.x, pt.y - 30, "Treated!", PALETTE.good);
    Sound.play("done");
    burst(pt.x, pt.y, PALETTE.good, 12);
  }
}

/* ---------------------------------------------------------------------
   10. SIMULATION
   --------------------------------------------------------------------- */

function updatePlayer(p, dt) {
  const world = Game.world;
  const c = p.ctrl;
  let mx = 0, my = 0;
  if (Keys[c.left]) mx -= 1;
  if (Keys[c.right]) mx += 1;
  if (Keys[c.up]) my -= 1;
  if (Keys[c.down]) my += 1;

  const moving = mx !== 0 || my !== 0;
  p.moving = moving;
  const wantSprint = !!Keys[c.sprint] && moving && p.stamina > 0;
  p.sprinting = wantSprint;
  if (wantSprint) {
    p.stamina = Math.max(0, p.stamina - dt);
  } else {
    p.stamina = Math.min(Game.staminaMax, p.stamina + dt * STAMINA_REGEN);
  }

  if (moving) {
    const len = Math.hypot(mx, my);
    mx /= len; my /= len;
    p.dx = mx; p.dy = my;
    let speed = (p.patient ? SPEED_PATIENT : (p.item ? SPEED_ITEM : SPEED_FREE)) * Game.speedMul;
    if (wantSprint) speed *= p.patient ? SPRINT_MUL_PATIENT : SPRINT_MUL;
    moveWithCollision(world, p, mx * speed * dt, my * speed * dt);
    p.bob += dt * (wantSprint ? 15 : 11);
    p.step += dt * (wantSprint ? 13 : 9);
  } else {
    p.bob += dt * 2;
  }

  // Interact (edge-triggered)
  if (wasPressed(c.interact)) doInteract(p);

  // Use (held) — progress a job, cancel if the job identity changes.
  if (Keys[c.use]) {
    const job = findJob(p);
    if (!job) {
      p.work = null;
    } else if (!p.work || p.work.key !== job.key) {
      p.work = { key: job.key, t: 0, dur: job.dur, label: job.label, run: job.run, ptId: job.ptId, tick: 0 };
    } else {
      p.work.run = job.run;                  // keep the closure fresh
      p.work.t += dt;
      p.work.tick += dt;
      if (p.work.tick > 0.22) { p.work.tick = 0; Sound.play("tick"); }
      if (p.work.t >= p.work.dur) {
        const run = p.work.run;
        p.work = null;
        run();
      }
    }
  } else {
    p.work = null;
  }

  // Auto-discharge: walk a treated patient onto the exit tile.
  if (p.patient && p.patient.done) {
    const t = tileOf(p.x, p.y);
    const cell = cellAt(world, t.x, t.y);
    if (cell && cell.exit) dischargePatient(p);
  }

  if (p.hintT > 0) p.hintT -= dt;
  if (p.squash > 0) p.squash -= dt;

  // contextual button prompts (drawn by the renderer)
  if (!p.work) {
    SILENT_HINTS = true;
    p.promptE = previewInteract(p);
    const job = findJob(p);
    p.promptQ = job ? job.label : null;
    SILENT_HINTS = false;
  } else {
    p.promptE = null; p.promptQ = null;
  }
}

function moveWithCollision(world, p, dx, dy) {
  // Axis-separated sweep so sliding along walls feels good.
  let nx = p.x + dx;
  if (!collides(world, nx, p.y)) p.x = nx;
  let ny = p.y + dy;
  if (!collides(world, p.x, ny)) p.y = ny;
  p.x = clamp(p.x, PLAYER_R, PLAY_W - PLAYER_R);
  p.y = clamp(p.y, PLAYER_R, PLAY_H - PLAYER_R);
}

function collides(world, px, py) {
  const r = PLAYER_R;
  const x0 = Math.floor((px - r) / TILE), x1 = Math.floor((px + r) / TILE);
  const y0 = Math.floor((py - r) / TILE), y1 = Math.floor((py + r) / TILE);
  for (let ty = y0; ty <= y1; ty++)
    for (let tx = x0; tx <= x1; tx++)
      if (!isWalkable(world, tx, ty)) return true;
  return false;
}

function dischargePatient(p) {
  const pt = p.patient;
  p.patient = null;
  pt.state = "gone";

  const a = AILMENTS[pt.ailment];
  const frac = pt.patience / pt.patienceMax;
  Game.combo = Game.comboTimer > 0 ? Game.combo + 1 : 1;
  Game.bestCombo = Math.max(Game.bestCombo, Game.combo);
  Game.comboTimer = Game.comboWindow;
  const mult = Math.min(COMBO_MAX, 1 + 0.25 * (Game.combo - 1));

  let base = a.score + Math.round(frac * 100);
  if (pt.vip) base *= 2;
  let callout = null, calloutColor = PALETTE.good;
  if (frac >= Game.perfectAt) {
    base += Math.round(a.score * 0.5);
    callout = "PERFECT!"; calloutColor = "#ffd54a";
    Game.perfects++;
  } else if (frac <= CLUTCH_AT) {
    base += CLUTCH_BONUS;
    callout = "CLUTCH SAVE!"; calloutColor = "#ff7ab8";
    Game.clutches++;
  }

  const gained = Math.round(base * mult);
  Game.score += gained;
  Game.treated++;
  if (Game.endless && Game.treated % 10 === 0 && Game.lives < 3) {
    Game.lives++;
    popup(pt.x, pt.y - 92, "LIFE RESTORED", "#ff4d6d", true);
    Sound.play("newbest");
  }

  popup(pt.x, pt.y - 26, "+" + gained + (mult > 1 ? "  x" + fmtMult(mult) : ""), pt.vip ? "#ffd54a" : PALETTE.good, true);
  if (pt.vip) popup(pt.x, pt.y - 70, "VIP x2", "#ffd54a", true);
  if (callout) popup(pt.x, pt.y - 52, callout, calloutColor, true);
  if (Game.combo >= 3) popup(pt.x, pt.y - 74, "CHAIN x" + Game.combo, "#8be9ff");
  burst(pt.x, pt.y, "#ffe066", 18 + Math.min(20, Game.combo * 3));
  Game.flashGood = 0.35;
  Sound.discharge(Game.combo);
  if (callout === "CLUTCH SAVE!") Sound.play("clutch");
}

function losePatient(pt) {
  pt.state = "gone";
  Game.lost++;
  Game.lives = Math.max(0, Game.lives - 1);
  Game.combo = 0; Game.comboTimer = 0;
  const penalty = 60;
  Game.score = Math.max(0, Game.score - penalty);

  if (Game.level.flatline) {
    popup(pt.x, pt.y - 26, "FLATLINE  -" + penalty, PALETTE.bad, true);
    Game.shake = 16;
    Game.flashRed = 0.5;
    Sound.play("flatline");
    burst(pt.x, pt.y, PALETTE.bad, 20);
  } else {
    popup(pt.x, pt.y - 26, "Stormed out  -" + penalty, PALETTE.bad, true);
    Game.shake = 6;
    Sound.play("leave");
  }

  // free whatever they occupied
  if (pt.station) { pt.station.occupant = null; pt.station = null; }
  for (const p of Game.players) if (p.patient === pt) p.patient = null;
}

function updatePatients(dt) {
  for (const pt of Game.patients) {
    if (pt.state === "gone") continue;
    pt.bob += dt * 3;
    if (pt.flash > 0) pt.flash -= dt;

    // Patience: slower once they are settled in a bed.
    if (!pt.done) {
      const inBed = pt.station && pt.station.type === "bed";
      let rate = inBed ? 0.62 : (pt.state === "station" ? 0.8 : 1.0);
      if (Game.tendedIds && Game.tendedIds.has(pt.id)) rate *= 0.25;
      pt.patience -= dt * rate;
      if (pt.patience <= 0) { losePatient(pt); continue; }
    }

    // Movement for patients that walk themselves in.
    if (pt.state === "walking") {
      if (pt.path.length) {
        const tgt = pt.path[0];
        const vx = tgt.x - pt.x, vy = tgt.y - pt.y;
        const d = Math.hypot(vx, vy);
        if (d < 4) pt.path.shift();
        else { const s = 78 * dt; pt.x += (vx / d) * s; pt.y += (vy / d) * s; }
      } else {
        pt.state = "waiting";
      }
    } else if (pt.state === "carried") {
      const carrier = Game.players.find(p => p.patient === pt);
      if (carrier) { pt.x = carrier.x; pt.y = carrier.y - 26; }
    }
  }
  Game.patients = Game.patients.filter(p => p.state !== "gone");
}

const EASE_IN_SECS = 25;                 // opening window with no brutal cases

function chooseAilment() {
  let pool = Game.level.ailments;
  // Ease into the shift: the first arrivals are never cardiac or mystery,
  // so no seed can deal the two hardest chains as an opening hand.
  if (Game.time < EASE_IN_SECS) {
    const gentle = pool.filter(a => a !== "cardiac" && a !== "mystery");
    if (gentle.length) pool = gentle;
  }
  const r = Game.rng();
  const idx = Math.floor(r * pool.length);
  return pool[clamp(idx, 0, pool.length - 1)];
}

/** Interval between arrivals right now: ramps down across a timed level, and
    keeps tightening forever in endless mode. */
function currentSpawnInterval() {
  const lvl = Game.level;
  if (Game.endless) {
    // asymptotic squeeze: 8.5s at the start, closing on spawnEnd after ~4 min
    return Math.max(lvl.spawnEnd, lvl.spawnStart - Game.time / 26);
  }
  const t = clamp(Game.time / lvl.duration, 0, 1);
  return lerp(lvl.spawnStart, lvl.spawnEnd, t);
}

/** Ambulances arrive on a rhythm, dumping several patients at once. Gives the
    shift a pulse of calm and panic instead of a flat grind. */
function updateWaves(dt) {
  Game.waveTimer -= dt;
  if (Game.waveTimer > 0) return;
  Game.wave++;
  Game.waveTimer = WAVE_EVERY;
  Game.burst = 2 + Math.min(3, Math.floor(Game.wave / 2));
  Game.banner = { text: "AMBULANCE INBOUND", sub: Game.burst + " patients arriving at once", t: 0, urgent: true };
  Sound.play("siren");
}

function updateSpawning(dt) {
  const lvl = Game.level;
  const waiting = Game.patients.filter(p => p.state === "waiting" || p.state === "walking").length;
  Game.spawnTimer -= dt;
  if (Game.spawnTimer > 0) return;

  if (waiting >= lvl.maxWaiting) { Game.spawnTimer = 1.0; return; }

  const free = Game.world.waitSlots.filter(s =>
    !Game.patients.some(p => p.slot && p.slot.x === s.x && p.slot.y === s.y));
  if (!free.length) { Game.spawnTimer = 1.0; return; }

  const pt = makePatient(Game.world, chooseAilment(), lvl);
  const slot = free[Math.floor(Game.rng() * free.length)];
  pt.slot = slot;
  pt.path = findPath(Game.world, Game.world.entrance, slot);
  Game.patients.push(pt);
  Sound.play("spawn");

  // Mid-burst arrivals come almost back to back; otherwise use the ramp.
  if (Game.burst > 0) {
    Game.burst--;
    Game.spawnTimer = 0.55;
  } else {
    Game.spawnTimer = currentSpawnInterval() * (0.82 + Game.rng() * 0.36);
  }
}

function updateItems(dt) {
  // Charged defibs lose their charge; loose defibs are never truly lost.
  const decay = (it) => {
    if (it.type !== "defib_charged") return;
    it.charge -= dt;
    if (it.charge <= 0) {
      it.type = "defib";
      delete it.charge;
      Sound.play("error");
    }
  };
  for (const p of Game.players) if (p.item) decay(p.item);
  for (const it of Game.floorItems) decay(it);
}

function updateEffects(dt) {
  for (const p of Game.popups) { p.t += dt; p.y -= dt * 26; }
  Game.popups = Game.popups.filter(p => p.t < p.life);
  for (const q of Game.particles) {
    q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 240 * dt;
  }
  Game.particles = Game.particles.filter(q => q.t < q.life);
  Game.scoreShown += (Game.score - Game.scoreShown) * Math.min(1, dt * 9);
  if (Math.abs(Game.score - Game.scoreShown) < 0.6) Game.scoreShown = Game.score;
  if (Game.shake > 0) Game.shake = Math.max(0, Game.shake - dt * 26);
  if (Game.flashRed > 0) Game.flashRed = Math.max(0, Game.flashRed - dt * 1.4);
  if (Game.flashGood > 0) Game.flashGood = Math.max(0, Game.flashGood - dt * 2.2);
  for (const st of Game.world.stations) if (st.flash > 0) st.flash -= dt;
  if (Game.banner) { Game.banner.t += dt; if (Game.banner.t > 3.2) Game.banner = null; }
  if (Game.comboTimer > 0) {
    Game.comboTimer -= dt;
    if (Game.comboTimer <= 0) {
      if (Game.combo >= 2) Sound.tone(340, 0.18, "triangle", 0.05, 190);
      Game.combo = 0;
    }
  }
}

/** A heartbeat that quickens while anyone is close to running out. */
function updateHeartMonitor(dt) {
  let worst = 1;
  for (const pt of Game.patients) {
    if (pt.done || pt.state === "gone") continue;
    worst = Math.min(worst, pt.patience / pt.patienceMax);
  }
  Game.critical = worst;
  if (worst >= CRIT_AT) { Game.heartTimer = 0; return; }
  Game.heartTimer -= dt;
  if (Game.heartTimer <= 0) {
    Game.heartTimer = lerp(0.30, 0.78, clamp(worst / CRIT_AT, 0, 1));
    Sound.play("heart");
  }
}

/* First-shift tutorial: six short tips that each wait for the player to
   actually do the thing before moving on. Level 1 only. */
const TUTORIAL_STEPS = [
  { text: "Patients arrive at the blue IN door - walk up and press E to pick one up",
    done: () => Game.players.some(p => p.patient) },
  { text: "Carry them to a bed and press E to tuck them in",
    done: () => Game.patients.some(pt => pt.state === "station") },
  { text: "The bubble shows what they need - fetch it from the matching station",
    done: () => Game.players.some(p => p.item) },
  { text: "Stand at the bed and HOLD the use key to treat them",
    done: () => Game.patients.some(pt => pt.done) || Game.treated > 0 },
  { text: "Healed! Pick them up and walk them to the green OUT tile",
    done: () => Game.treated > 0 },
  { text: "Quick discharges chain into combo multipliers. Good luck out there!",
    done: () => Game.tutorial.t > 5 }
];

function updateTutorial(dt) {
  const tut = Game.tutorial;
  if (!tut || tut.stage >= TUTORIAL_STEPS.length) return;
  tut.t += dt;
  if (tut.t > 2.0 && TUTORIAL_STEPS[tut.stage].done()) {
    tut.stage++;
    tut.t = 0;
    Sound.play("step");
  }
}

/* Nurse Joy: wanders to the most-stressed settled patient and comforts
   them, restoring a chunk of patience. She never treats — that's your job. */
function updateNurse(dt) {
  const nu = Game.nurse;
  if (!nu) return;
  nu.bob += dt * (nu.moving ? 11 : 2);
  if (nu.cooldown > 0) nu.cooldown -= dt;

  // validate current target
  if (nu.target && (nu.target.state !== "station" || nu.target.done ||
      nu.target.patience / nu.target.patienceMax > 0.92)) {
    nu.target = null; nu.path = []; nu.comfort = 0;
  }

  // pick the most urgent settled patient
  if (!nu.target && nu.cooldown <= 0) {
    let best = null, bestFrac = 0.85;
    for (const pt of Game.patients) {
      if (pt.state !== "station" || pt.done) continue;
      const frac = pt.patience / pt.patienceMax;
      if (frac < bestFrac) { bestFrac = frac; best = pt; }
    }
    if (best) {
      nu.target = best;
      const here = tileOf(nu.x, nu.y);
      const st = best.station;
      let goal = null;
      for (const [dx, dy] of [[0, 1], [1, 0], [-1, 0], [0, -1]]) {
        if (isWalkable(Game.world, st.x + dx, st.y + dy)) { goal = { x: st.x + dx, y: st.y + dy }; break; }
      }
      nu.path = goal ? findPath(Game.world, here, goal) : [];
      if (goal && !nu.path.length && (here.x !== goal.x || here.y !== goal.y)) {
        nu.target = null;                       // unreachable from here
      }
    }
  }

  // walk the path
  nu.moving = false;
  if (nu.path.length) {
    const tgt = nu.path[0];
    const vx = tgt.x - nu.x, vy = tgt.y - nu.y;
    const d = Math.hypot(vx, vy);
    if (d < 4) nu.path.shift();
    else {
      const sp = 118 * dt;
      nu.x += (vx / d) * sp; nu.y += (vy / d) * sp;
      nu.dx = vx / d; nu.dy = vy / d;
      nu.moving = true; nu.step = (nu.step || 0) + dt * 9;
    }
    return;
  }

  // beside the bed: comfort
  if (nu.target) {
    const st = nu.target.station;
    if (!st || Math.hypot(st.cx - nu.x, st.cy - nu.y) > 70) { nu.target = null; return; }
    nu.comfort += dt;
    if (nu.comfort >= 1.3) {
      const pt = nu.target;
      // 0.28 every 3.5s out-healed the 0.62/s drain about threefold, which made
      // patience stop mattering entirely; 0.18 every 5s buys back roughly one
      // patient's worth of time, so she helps without playing the game for you
      pt.patience = Math.min(pt.patienceMax, pt.patience + pt.patienceMax * 0.18);
      popup(pt.x, pt.y - 30, "+ \u2665", "#ff8fa8", false);
      Sound.play("place");
      nu.comfort = 0; nu.cooldown = 5.0; nu.target = null;
    }
  }
}

function updatePlay(dt) {
  Game.time += dt;
  for (const p of Game.players) updatePlayer(p, dt);
  Game.tendedIds = new Set();
  for (const p of Game.players) if (p.work && p.work.ptId) Game.tendedIds.add(p.work.ptId);
  updatePatients(dt);
  updateWaves(dt);
  updateSpawning(dt);
  updateItems(dt);
  updateNurse(dt);
  updateHeartMonitor(dt);
  updateTutorial(dt);
  updateEffects(dt);

  if (Game.time >= Game.level.duration || Game.lives <= 0) endLevel();
}

function starsFor(index, score) {
  if (index < 0) return 0;
  const th = LEVELS[index].stars;
  let s = 0;
  for (const t of th) if (score >= t) s++;
  return s;
}

function endLevel() {
  const failed = Game.lives <= 0;

  if (Game.endless) {
    const newBest = Game.score > Game.endlessBest;
    if (newBest) Game.endlessBest = Game.score;
    Game.result = {
      failed, stars: 0, newBest, endless: true,
      name: ENDLESS.name, targets: null,
      score: Game.score, treated: Game.treated, lost: Game.lost,
      survived: Game.time, wave: Game.wave,
      bestCombo: Game.bestCombo, perfects: Game.perfects, clutches: Game.clutches,
      t: 0
    };
    Game.screen = "results";
    Sound.play(newBest ? "newbest" : "error");
    return;
  }

  const stars = failed ? 0 : starsFor(Game.levelIndex, Game.score);
  const prog = Game.progress[Game.levelIndex];
  const newBest = Game.score > prog.best;
  if (newBest) prog.best = Game.score;
  const gainedStars = Math.max(0, stars - prog.stars);
  prog.stars = Math.max(prog.stars, stars);
  if (stars >= 1 && Game.levelIndex + 1 < LEVELS.length) Game.progress[Game.levelIndex + 1].unlocked = true;

  Game.result = {
    failed, stars, newBest, gainedStars,
    name: LEVELS[Game.levelIndex].name, targets: LEVELS[Game.levelIndex].stars,
    score: Game.score, treated: Game.treated, lost: Game.lost,
    bestCombo: Game.bestCombo, perfects: Game.perfects, clutches: Game.clutches,
    t: 0
  };
  Game.screen = "results";
  Sound.play(failed ? "error" : (newBest ? "newbest" : "levelend"));
}

/* =====================================================================
   10.5  3D ENGINE  (WebGL2, written from scratch — no libraries)

   The simulation is untouched: it still runs on the 32x16 pixel grid.
   Sim (x, y) maps to world (X, Z) at one tile per unit; +Y is up.
   ===================================================================== */

const T2W = 1 / TILE;                 // sim pixels -> world units
const WALL_Y = 1.15;                  // wall height in world units
const LIGHT_DIR = [-0.42, -1.0, -0.38];

/* ---------------- minimal mat4 / vec3 ---------------- */

function m4() { return new Float32Array(16); }
function m4Identity(o) {
  o[0]=1;o[1]=0;o[2]=0;o[3]=0; o[4]=0;o[5]=1;o[6]=0;o[7]=0;
  o[8]=0;o[9]=0;o[10]=1;o[11]=0; o[12]=0;o[13]=0;o[14]=0;o[15]=1; return o;
}
/** out = a * b  (column-major, so `b` is applied first) */
function m4Mul(o, a, b) {
  for (let c = 0; c < 4; c++) {
    const b0 = b[c*4], b1 = b[c*4+1], b2 = b[c*4+2], b3 = b[c*4+3];
    o[c*4]   = a[0]*b0 + a[4]*b1 + a[8]*b2  + a[12]*b3;
    o[c*4+1] = a[1]*b0 + a[5]*b1 + a[9]*b2  + a[13]*b3;
    o[c*4+2] = a[2]*b0 + a[6]*b1 + a[10]*b2 + a[14]*b3;
    o[c*4+3] = a[3]*b0 + a[7]*b1 + a[11]*b2 + a[15]*b3;
  }
  return o;
}
function m4Perspective(o, fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
  o.fill(0);
  o[0] = f / aspect; o[5] = f; o[10] = (far + near) * nf;
  o[11] = -1; o[14] = 2 * far * near * nf;
  return o;
}
function m4Ortho(o, l, r, b, t, n, f) {
  o.fill(0);
  o[0] = 2/(r-l); o[5] = 2/(t-b); o[10] = -2/(f-n); o[15] = 1;
  o[12] = -(r+l)/(r-l); o[13] = -(t+b)/(t-b); o[14] = -(f+n)/(f-n);
  return o;
}
function m4LookAt(o, ex, ey, ez, cx, cy, cz, ux, uy, uz) {
  let zx = ex-cx, zy = ey-cy, zz = ez-cz;
  let l = Math.hypot(zx, zy, zz) || 1; zx/=l; zy/=l; zz/=l;
  let xx = uy*zz - uz*zy, xy = uz*zx - ux*zz, xz = ux*zy - uy*zx;
  l = Math.hypot(xx, xy, xz) || 1; xx/=l; xy/=l; xz/=l;
  const yx = zy*xz - zz*xy, yy = zz*xx - zx*xz, yz = zx*xy - zy*xx;
  o[0]=xx; o[1]=yx; o[2]=zx; o[3]=0;
  o[4]=xy; o[5]=yy; o[6]=zy; o[7]=0;
  o[8]=xz; o[9]=yz; o[10]=zz; o[11]=0;
  o[12]=-(xx*ex+xy*ey+xz*ez);
  o[13]=-(yx*ex+yy*ey+yz*ez);
  o[14]=-(zx*ex+zy*ey+zz*ez);
  o[15]=1;
  return o;
}
/** Translate * RotateY * Scale — all our objects need only this. */
function m4TRS(o, px, py, pz, ry, sx, sy, sz) {
  const c = Math.cos(ry), s = Math.sin(ry);
  o[0]=c*sx;  o[1]=0;    o[2]=-s*sx; o[3]=0;
  o[4]=0;     o[5]=sy;   o[6]=0;     o[7]=0;
  o[8]=s*sz;  o[9]=0;    o[10]=c*sz; o[11]=0;
  o[12]=px;   o[13]=py;  o[14]=pz;   o[15]=1;
  return o;
}
/** Normal matrix for a TRS with only Y rotation + scale: inverse-transpose. */
function m3NormalFromTRS(o, ry, sx, sy, sz) {
  const c = Math.cos(ry), s = Math.sin(ry);
  const ix = 1/(sx||1), iy = 1/(sy||1), iz = 1/(sz||1);
  o[0]=c*ix; o[1]=0;  o[2]=-s*ix;
  o[3]=0;    o[4]=iy; o[5]=0;
  o[6]=s*iz; o[7]=0;  o[8]=c*iz;
  return o;
}

/* ---------------- colour helper ---------------- */

const _colCache = Object.create(null);
function rgb(hex) {
  let v = _colCache[hex];
  if (v) return v;
  const n = parseInt(hex.slice(1), 16);
  v = [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
  _colCache[hex] = v;
  return v;
}

/* ---------------- mesh builder ---------------- */

function MB() { this.p = []; this.n = []; this.c = []; this.i = []; }

MB.prototype.vert = function (x, y, z, nx, ny, nz, col) {
  this.p.push(x, y, z);
  this.n.push(nx, ny, nz);
  this.c.push(col[0], col[1], col[2]);
  return this.p.length / 3 - 1;
};
MB.prototype.tri = function (a, b, c) { this.i.push(a, b, c); };
/** Emit a quad with the winding that makes its normal face `nrm`. */
MB.prototype.quad = function (a, b, c, d, nx, ny, nz) {
  const p = this.p;
  const ux = p[b*3]-p[a*3], uy = p[b*3+1]-p[a*3+1], uz = p[b*3+2]-p[a*3+2];
  const vx = p[d*3]-p[a*3], vy = p[d*3+1]-p[a*3+1], vz = p[d*3+2]-p[a*3+2];
  const cx2 = uy*vz - uz*vy, cy2 = uz*vx - ux*vz, cz2 = ux*vy - uy*vx;
  if (cx2*nx + cy2*ny + cz2*nz >= 0) { this.tri(a,b,c); this.tri(a,c,d); }
  else { this.tri(a,d,c); this.tri(a,c,b); }
};

/** Ellipsoid. segU around Y, segV pole to pole. */
function mbSphere(mb, cx, cy, cz, rx, ry, rz, col, segU, segV) {
  segU = segU || 14; segV = segV || 10;
  const base = mb.p.length / 3;
  for (let j = 0; j <= segV; j++) {
    const v = j / segV * Math.PI, sv = Math.sin(v), cv = Math.cos(v);
    for (let i = 0; i <= segU; i++) {
      const u = i / segU * Math.PI * 2, su = Math.sin(u), cu = Math.cos(u);
      const nx = sv * cu, ny = cv, nz = sv * su;
      // normal of an ellipsoid is the gradient, not the position direction
      let gx = nx / rx, gy = ny / ry, gz = nz / rz;
      const gl2 = Math.hypot(gx, gy, gz) || 1;
      mb.vert(cx + nx*rx, cy + ny*ry, cz + nz*rz, gx/gl2, gy/gl2, gz/gl2, col);
    }
  }
  for (let j = 0; j < segV; j++) {
    for (let i = 0; i < segU; i++) {
      const a = base + j*(segU+1) + i, b = a + 1, c = a + segU + 1, d = c + 1;
      mb.tri(a, c, b); mb.tri(b, c, d);
    }
  }
}

/** Hemisphere (upper half), used for scrub caps. */
function mbDome(mb, cx, cy, cz, rx, ry, rz, col, segU, segV) {
  segU = segU || 14; segV = segV || 6;
  const base = mb.p.length / 3;
  for (let j = 0; j <= segV; j++) {
    const v = j / segV * (Math.PI / 2), sv = Math.cos(v), cv = Math.sin(v);
    for (let i = 0; i <= segU; i++) {
      const u = i / segU * Math.PI * 2, su = Math.sin(u), cu = Math.cos(u);
      const nx = sv * cu, ny = cv, nz = sv * su;
      let gx = nx / rx, gy = ny / ry, gz = nz / rz;
      const gl2 = Math.hypot(gx, gy, gz) || 1;
      mb.vert(cx + nx*rx, cy + ny*ry, cz + nz*rz, gx/gl2, gy/gl2, gz/gl2, col);
    }
  }
  for (let j = 0; j < segV; j++) {
    for (let i = 0; i < segU; i++) {
      const a = base + j*(segU+1) + i, b = a + 1, c = a + segU + 1, d = c + 1;
      mb.tri(a, c, b); mb.tri(b, c, d);
    }
  }
}

/** Cylinder along Y with optional caps. */
function mbCylinder(mb, cx, cy, cz, rTop, rBot, h, col, seg, caps) {
  seg = seg || 16;
  const y0 = cy - h / 2, y1 = cy + h / 2;
  const base = mb.p.length / 3;
  const slope = (rBot - rTop) / h;
  for (let i = 0; i <= seg; i++) {
    const u = i / seg * Math.PI * 2, su = Math.sin(u), cu = Math.cos(u);
    let nx = cu, ny = slope, nz = su;
    const l = Math.hypot(nx, ny, nz) || 1;
    mb.vert(cx + cu*rBot, y0, cz + su*rBot, nx/l, ny/l, nz/l, col);
    mb.vert(cx + cu*rTop, y1, cz + su*rTop, nx/l, ny/l, nz/l, col);
  }
  for (let i = 0; i < seg; i++) {
    const a = base + i*2, b = a + 1, c = a + 2, d = a + 3;
    mb.tri(a, c, b); mb.tri(b, c, d);
  }
  if (caps !== false) {
    const tc = mb.vert(cx, y1, cz, 0, 1, 0, col);
    for (let i = 0; i < seg; i++) {
      const u0 = i/seg*Math.PI*2, u1 = (i+1)/seg*Math.PI*2;
      const p0 = mb.vert(cx + Math.cos(u0)*rTop, y1, cz + Math.sin(u0)*rTop, 0,1,0, col);
      const p1 = mb.vert(cx + Math.cos(u1)*rTop, y1, cz + Math.sin(u1)*rTop, 0,1,0, col);
      mb.tri(tc, p0, p1);
    }
    const bc = mb.vert(cx, y0, cz, 0, -1, 0, col);
    for (let i = 0; i < seg; i++) {
      const u0 = i/seg*Math.PI*2, u1 = (i+1)/seg*Math.PI*2;
      const p0 = mb.vert(cx + Math.cos(u0)*rBot, y0, cz + Math.sin(u0)*rBot, 0,-1,0, col);
      const p1 = mb.vert(cx + Math.cos(u1)*rBot, y0, cz + Math.sin(u1)*rBot, 0,-1,0, col);
      mb.tri(bc, p1, p0);
    }
  }
}

/**
 * Rounded box, assembled from 6 flat faces, 12 quarter-cylinder edges and
 * 8 sphere octants. Seams weld exactly because every part shares the same
 * angular parameterisation.
 */
function mbRoundedBox(mb, cx, cy, cz, hx, hy, hz, r, col, seg) {
  seg = seg || 3;
  r = Math.min(r, hx * 0.999, hy * 0.999, hz * 0.999);
  const ax = hx - r, ay = hy - r, az = hz - r;

  // --- 6 flat faces ---
  const F = [
    [[1,0,0],[0,1,0],[0,0,1], hx, ay, az],
    [[-1,0,0],[0,0,1],[0,1,0], hx, az, ay],
    [[0,1,0],[0,0,1],[1,0,0], hy, az, ax],
    [[0,-1,0],[1,0,0],[0,0,1], hy, ax, az],
    [[0,0,1],[1,0,0],[0,1,0], hz, ax, ay],
    [[0,0,-1],[0,1,0],[1,0,0], hz, ay, ax]
  ];
  for (const [n, u, v, off, hu, hv] of F) {
    const ox = cx + n[0]*off, oy = cy + n[1]*off, oz = cz + n[2]*off;
    const idx = [];
    for (const [su, sv] of [[-1,-1],[1,-1],[1,1],[-1,1]]) {
      idx.push(mb.vert(
        ox + u[0]*hu*su + v[0]*hv*sv,
        oy + u[1]*hu*su + v[1]*hv*sv,
        oz + u[2]*hu*su + v[2]*hv*sv,
        n[0], n[1], n[2], col));
    }
    mb.quad(idx[0], idx[1], idx[2], idx[3], n[0], n[1], n[2]);
  }

  // --- 12 edges (quarter cylinders) ---
  // axis 0=X (arc in YZ), 1=Y (arc in ZX), 2=Z (arc in XY)
  const edges = [
    [0, 'y', 'z'], [1, 'z', 'x'], [2, 'x', 'y']
  ];
  for (const [axis, p1, p2] of edges) {
    const half = axis === 0 ? ax : axis === 1 ? ay : az;
    for (const s1 of [-1, 1]) for (const s2 of [-1, 1]) {
      const ring = [];
      for (let k = 0; k <= seg; k++) {
        const a = k / seg * Math.PI / 2, ca = Math.cos(a), sa = Math.sin(a);
        const n = { x: 0, y: 0, z: 0 };
        n[p1] = s1 * ca; n[p2] = s2 * sa;
        const cOff = { x: 0, y: 0, z: 0 };
        cOff[p1] = s1 * (axis === 0 ? (p1 === 'y' ? ay : az) : axis === 1 ? (p1 === 'z' ? az : ax) : (p1 === 'x' ? ax : ay));
        cOff[p2] = s2 * (axis === 0 ? (p2 === 'z' ? az : ay) : axis === 1 ? (p2 === 'x' ? ax : az) : (p2 === 'y' ? ay : ax));
        const lo = { x: cx, y: cy, z: cz }, hi = { x: cx, y: cy, z: cz };
        const axKey = axis === 0 ? 'x' : axis === 1 ? 'y' : 'z';
        lo[axKey] -= half; hi[axKey] += half;
        const a0 = mb.vert(lo.x + cOff.x + n.x*r, lo.y + cOff.y + n.y*r, lo.z + cOff.z + n.z*r, n.x, n.y, n.z, col);
        const a1 = mb.vert(hi.x + cOff.x + n.x*r, hi.y + cOff.y + n.y*r, hi.z + cOff.z + n.z*r, n.x, n.y, n.z, col);
        ring.push([a0, a1, n]);
      }
      for (let k = 0; k < seg; k++) {
        const [q0, q1, n] = ring[k], [w0, w1] = ring[k + 1];
        mb.quad(q0, q1, w1, w0, n.x, n.y, n.z);
      }
    }
  }

  // --- 8 corners (sphere octants) ---
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1]) {
    const ox = cx + sx*ax, oy = cy + sy*ay, oz = cz + sz*az;
    const grid = [];
    for (let j = 0; j <= seg; j++) {
      const el = j / seg * Math.PI / 2, ce = Math.cos(el), se = Math.sin(el);
      const row = [];
      for (let i = 0; i <= seg; i++) {
        const az2 = i / seg * Math.PI / 2;
        const nx = sx * ce * Math.cos(az2), ny = sy * se, nz = sz * ce * Math.sin(az2);
        row.push(mb.vert(ox + nx*r, oy + ny*r, oz + nz*r, nx, ny, nz, col));
      }
      grid.push(row);
    }
    for (let j = 0; j < seg; j++) {
      for (let i = 0; i < seg; i++) {
        const p = mb.p;
        const a = grid[j][i], b = grid[j][i+1], c = grid[j+1][i], d = grid[j+1][i+1];
        // outward normal at the patch centre decides winding
        const nx = p[a*3] - ox, ny = p[a*3+1] - oy, nz = p[a*3+2] - oz;
        mb.quad(a, b, d, c, nx, ny, nz);
      }
    }
  }
}

/** Flat quad from four explicit corners. */
function mbQuad(mb, pts, col, nx, ny, nz) {
  const idx = pts.map(p => mb.vert(p[0], p[1], p[2], nx, ny, nz, col));
  mb.quad(idx[0], idx[1], idx[2], idx[3], nx, ny, nz);
}

/** Torus in the XY plane (used for spectacles). */
function mbTorus(mb, cx, cy, cz, R, r, col, segU, segV) {
  segU = segU || 16; segV = segV || 8;
  const base = mb.p.length / 3;
  for (let i = 0; i <= segU; i++) {
    const u = i / segU * Math.PI * 2, cu = Math.cos(u), su = Math.sin(u);
    for (let j = 0; j <= segV; j++) {
      const v = j / segV * Math.PI * 2, cv = Math.cos(v), sv = Math.sin(v);
      const nx = cu * cv, ny = su * cv, nz = sv;
      mb.vert(cx + (R + r*cv)*cu, cy + (R + r*cv)*su, cz + r*sv, nx, ny, nz, col);
    }
  }
  for (let i = 0; i < segU; i++) {
    for (let j = 0; j < segV; j++) {
      const a = base + i*(segV+1) + j, b = a + segV + 1, c = a + 1, d = b + 1;
      mb.tri(a, b, c); mb.tri(c, b, d);
    }
  }
}

/* ---------------- GL core ---------------- */

const GL = {
  gl: null, ok: false,
  prog: null, shadowProg: null,
  shadowFB: null, shadowTex: null, SHADOW_RES: 2048,
  view: m4(), proj: m4(), viewProj: m4(), lightVP: m4(),
  _model: m4(), _mvp: m4(), _nrm: new Float32Array(9),
  camEye: [16, 18, 26]
};

function glCompile(gl, type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    throw new Error("shader: " + gl.getShaderInfoLog(sh));
  }
  return sh;
}
function glProgram(gl, vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, glCompile(gl, gl.VERTEX_SHADER, vs));
  gl.attachShader(p, glCompile(gl, gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, "aPos");
  gl.bindAttribLocation(p, 1, "aNrm");
  gl.bindAttribLocation(p, 2, "aCol");
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    throw new Error("link: " + gl.getProgramInfoLog(p));
  }
  // cache uniform locations
  p.u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    p.u[info.name.replace("[0]", "")] = gl.getUniformLocation(p, info.name);
  }
  return p;
}

/** Upload a MB into GPU buffers. */
function glMesh(mb) {
  const gl = GL.gl;
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const mk = (data, loc, size) => {
    const b = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
    return b;
  };
  mk(mb.p, 0, 3); mk(mb.n, 1, 3); mk(mb.c, 2, 3);
  const ib = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
  const big = mb.p.length / 3 > 65535;
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,
    big ? new Uint32Array(mb.i) : new Uint16Array(mb.i), gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  return { vao, count: mb.i.length, type: big ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT };
}

/* ---------------- shaders ---------------- */

const VS_MAIN = `#version 300 es
in vec3 aPos; in vec3 aNrm; in vec3 aCol;
uniform mat4 uMVP, uModel, uLightVP;
uniform mat3 uNrmMat;
out vec3 vNrm; out vec3 vCol; out vec3 vWorld; out vec4 vLight;
void main() {
  vec4 wp = uModel * vec4(aPos, 1.0);
  vWorld = wp.xyz;
  vNrm = normalize(uNrmMat * aNrm);
  vCol = aCol;
  vLight = uLightVP * wp;
  gl_Position = uMVP * vec4(aPos, 1.0);
}`;

const FS_MAIN = `#version 300 es
precision highp float;
precision highp sampler2DShadow;
in vec3 vNrm; in vec3 vCol; in vec3 vWorld; in vec4 vLight;
uniform vec3 uCam;
uniform vec3 uLightDir;      // surface -> light, normalised
uniform vec3 uTint;
uniform float uEmissive;
uniform float uShadowTexel;
uniform float uAmb;          // hemisphere fill strength
uniform float uKey;          // sun strength
uniform float uShadowOn;     // 0 on menu passes: no shadow map is valid there
uniform sampler2DShadow uShadow;
out vec4 frag;

float shadowFactor() {
  if (uShadowOn < 0.5) return 1.0;
  vec3 pc = vLight.xyz / vLight.w;
  pc = pc * 0.5 + 0.5;
  if (pc.z >= 1.0 || pc.x < 0.0 || pc.x > 1.0 || pc.y < 0.0 || pc.y > 1.0) return 1.0;
  float bias = 0.0022;
  float s = 0.0;
  for (int y = -1; y <= 1; y++) {
    for (int x = -1; x <= 1; x++) {
      vec2 off = vec2(float(x), float(y)) * uShadowTexel * 1.25;
      s += texture(uShadow, vec3(pc.xy + off, pc.z - bias));
    }
  }
  return s / 9.0;
}

void main() {
  vec3 albedo = vCol * uTint;
  vec3 N = normalize(vNrm);
  vec3 V = normalize(uCam - vWorld);
  vec3 L = uLightDir;

  float ndl = dot(N, L);
  float wrapped = clamp((ndl + 0.32) / 1.32, 0.0, 1.0);
  float sh = shadowFactor();

  vec3 sky = vec3(0.74, 0.82, 0.94);
  vec3 grd = vec3(0.46, 0.40, 0.33);
  vec3 amb = mix(grd, sky, N.y * 0.5 + 0.5) * uAmb;
  vec3 sun = vec3(1.00, 0.96, 0.89) * (wrapped * uKey) * (0.38 + 0.62 * sh);

  vec3 H = normalize(L + V);
  float spec = pow(max(dot(N, H), 0.0), 46.0) * 0.32 * sh * step(0.02, ndl);
  float rim = pow(1.0 - max(dot(N, V), 0.0), 3.2) * 0.20;

  vec3 c = albedo * (amb + sun) + vec3(spec) + vec3(0.52, 0.70, 0.95) * rim;
  c = mix(c, albedo * 1.15, uEmissive);
  // gentle filmic-ish shoulder so highlights do not clip harshly
  c = c / (c + vec3(0.92)) * 1.62;
  frag = vec4(c, 1.0);
}`;

const VS_SHADOW = `#version 300 es
in vec3 aPos;
uniform mat4 uMVP;
void main() { gl_Position = uMVP * vec4(aPos, 1.0); }`;

const FS_SHADOW = `#version 300 es
precision highp float;
void main() {}`;

/* ---------------- engine bootstrap ---------------- */

const MESH = {};

function initGL(canvas3d) {
  const gl = canvas3d.getContext("webgl2", {
    antialias: true, alpha: false, depth: true, powerPreference: "high-performance"
  });
  if (!gl) return false;
  GL.gl = gl;
  GL.prog = glProgram(gl, VS_MAIN, FS_MAIN);
  GL.shadowProg = glProgram(gl, VS_SHADOW, FS_SHADOW);

  // shadow map: a depth texture sampled with hardware comparison
  GL.shadowTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, GL.shadowTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.DEPTH_COMPONENT24, GL.SHADOW_RES, GL.SHADOW_RES,
                0, gl.DEPTH_COMPONENT, gl.UNSIGNED_INT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_MODE, gl.COMPARE_REF_TO_TEXTURE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_FUNC, gl.LEQUAL);
  GL.shadowFB = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, GL.shadowFB);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, GL.shadowTex, 0);
  gl.drawBuffers([gl.NONE]);
  gl.readBuffer(gl.NONE);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  // unit primitives, all white so uTint can colour them
  const W = [1, 1, 1];
  let mb = new MB(); mbSphere(mb, 0, 0, 0, 1, 1, 1, W, 18, 12); MESH.sphere = glMesh(mb);
  mb = new MB(); mbSphere(mb, 0, 0, 0, 1, 1, 1, W, 10, 7);      MESH.sphereLo = glMesh(mb);
  mb = new MB(); mbDome(mb, 0, 0, 0, 1, 1, 1, W, 18, 8);        MESH.dome = glMesh(mb);
  mb = new MB(); mbRoundedBox(mb, 0, 0, 0, 1, 1, 1, 0.16, W, 3); MESH.box = glMesh(mb);
  mb = new MB(); mbRoundedBox(mb, 0, 0, 0, 1, 1, 1, 0.45, W, 4); MESH.boxSoft = glMesh(mb);
  mb = new MB(); mbCylinder(mb, 0, 0, 0, 1, 1, 1, W, 18, true);  MESH.cyl = glMesh(mb);
  mb = new MB(); mbCylinder(mb, 0, 0, 0, 0.01, 1, 1, W, 16, true); MESH.cone = glMesh(mb);
  mb = new MB(); mbTorus(mb, 0, 0, 0, 1, 0.16, W, 20, 8);        MESH.torus = glMesh(mb);

  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);
  GL.ok = true;
  return true;
}

/* ---------------- draw helpers ---------------- */

let _pass = "main";

function drawMesh(mesh, px, py, pz, ry, sx, sy, sz, color, emissive) {
  const gl = GL.gl;
  m4TRS(GL._model, px, py, pz, ry || 0, sx, sy, sz);
  if (_pass === "shadow") {
    m4Mul(GL._mvp, GL.lightVP, GL._model);
    gl.uniformMatrix4fv(GL.shadowProg.u.uMVP, false, GL._mvp);
  } else {
    m4Mul(GL._mvp, GL.viewProj, GL._model);
    m3NormalFromTRS(GL._nrm, ry || 0, sx, sy, sz);
    const p = GL.prog;
    gl.uniformMatrix4fv(p.u.uMVP, false, GL._mvp);
    gl.uniformMatrix4fv(p.u.uModel, false, GL._model);
    gl.uniformMatrix3fv(p.u.uNrmMat, false, GL._nrm);
    gl.uniform3fv(p.u.uTint, color || [1, 1, 1]);
    gl.uniform1f(p.u.uEmissive, emissive || 0);
  }
  gl.bindVertexArray(mesh.vao);
  gl.drawElements(gl.TRIANGLES, mesh.count, mesh.type, 0);
}

/* ---------------- level geometry ---------------- */

/** Merge the wall grid into maximal rectangles so the ward is a handful of
    solid blocks instead of hundreds of tiles. */
function greedyRects(test) {
  const used = new Uint8Array(COLS * ROWS);
  const out = [];
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (used[y * COLS + x] || !test(x, y)) continue;
      let w = 1;
      while (x + w < COLS && test(x + w, y) && !used[y * COLS + x + w]) w++;
      let h = 1;
      grow: while (y + h < ROWS) {
        for (let i = 0; i < w; i++) {
          if (!test(x + i, y + h) || used[(y + h) * COLS + x + i]) break grow;
        }
        h++;
      }
      for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) used[(y + j) * COLS + x + i] = 1;
      out.push({ x, y, w, h });
    }
  }
  return out;
}

const MAT = {
  floor:    "#f5ecdb",
  floorAlt: "#efe4cf",
  wall:     "#a9e0d4",
  wallTop:  "#c2ebe1",
  base:     "#7cc4b4",
  bedFrame: "#fbfdff",
  bedSheet: "#eef5fc",
  metal:    "#c9d4de"
};

/** Build the whole static level: floor, walls, decor, station bodies. */
function buildLevelMesh(world) {
  const mb = new MB();
  const rng = makeRng((world.def.seed ^ 0x51ed) >>> 0);
  const isWall = (x, y) => { const c = cellAt(world, x, y); return !c || (c.solid && !c.station); };

  /* ---- floor: subdivided so baked light pools have somewhere to live ---- */
  const SUB = 2, gw = COLS * SUB, gh = ROWS * SUB, step = 1 / SUB;
  const lights = [];
  for (let ly = 2; ly < ROWS; ly += 5) {
    for (let lx = 3; lx < COLS; lx += 6) {
      if (isWalkable(world, lx, ly)) lights.push([lx + 0.5, ly + 0.5]);
    }
  }
  const fc = rgb(MAT.floor), fa = rgb(MAT.floorAlt);
  const shadeAt = (wx, wz) => {
    let lit = 0;
    for (const [lx, lz] of lights) {
      const d = Math.hypot(wx - lx, wz - lz);
      lit += Math.max(0, 1 - d / 3.6);
    }
    lit = Math.min(0.13, lit * 0.11);
    const t = ((Math.floor(wx) + Math.floor(wz)) & 1) ? 0 : 1;
    const b = t ? fa : fc;
    const n = (rng() - 0.5) * 0.03;
    return [
      clamp(b[0] * (1 + lit) + n, 0, 1),
      clamp(b[1] * (1 + lit) + n, 0, 1),
      clamp(b[2] * (1 + lit * 0.92) + n, 0, 1)
    ];
  };
  for (let j = 0; j < gh; j++) {
    for (let i = 0; i < gw; i++) {
      const x0 = i * step, z0 = j * step, x1 = x0 + step, z1 = z0 + step;
      const c = shadeAt(x0 + step / 2, z0 + step / 2);
      mbQuad(mb, [[x0,0,z0],[x1,0,z0],[x1,0,z1],[x0,0,z1]], c, 0, 1, 0);
    }
  }

  /* ---- wayfinding stripe, painted just above the floor ---- */
  const way = findPath(world, world.entrance, world.exit);
  if (way.length) {
    const stripe = rgb("#ffb3c4");
    let px = world.entrance.x + 0.5, pz = world.entrance.y + 0.5;
    for (const w of way) {
      const nx = w.x * T2W, nz = w.y * T2W;
      const dx = nx - px, dz = nz - pz, len = Math.hypot(dx, dz) || 1;
      const ox = -dz / len * 0.07, oz = dx / len * 0.07;
      mbQuad(mb, [[px+ox,0.012,pz+oz],[nx+ox,0.012,nz+oz],[nx-ox,0.012,nz-oz],[px-ox,0.012,pz-oz]],
             stripe, 0, 1, 0);
      px = nx; pz = nz;
    }
  }

  /* ---- entrance / exit mats ---- */
  const mat = (tile, col) => {
    mbRoundedBox(mb, tile.x + 0.5, 0.018, tile.y + 0.5, 0.44, 0.018, 0.44, 0.14, rgb(col), 2);
  };
  mat(world.entrance, "#63bde8");
  mat(world.exit, "#6ad39a");

  /* ---- walls as merged blocks ---- */
  const wallCol = rgb(MAT.wall), topCol = rgb(MAT.wallTop), baseCol = rgb(MAT.base);
  const rects = greedyRects(isWall);
  for (const r of rects) {
    const cx = r.x + r.w / 2, cz = r.y + r.h / 2;
    const hx = r.w / 2, hz = r.h / 2;
    mbRoundedBox(mb, cx, WALL_Y / 2, cz, hx, WALL_Y / 2, hz, 0.14, wallCol, 3);
    // a lighter cap inlay so the tops read as a finished surface
    mbRoundedBox(mb, cx, WALL_Y + 0.005, cz, hx - 0.10, 0.02, hz - 0.10, 0.06, topCol, 2);
    // skirting board around the base
    mbRoundedBox(mb, cx, 0.055, cz, hx + 0.015, 0.055, hz + 0.015, 0.03, baseCol, 2);
  }
  world.wallRects = rects;

  /* ---- wall decor ---- */
  buildDecor(mb, world, rng, isWall);

  /* ---- station bodies (dynamic bits are drawn per frame) ---- */
  for (const st of world.stations) {
    const cx = st.x + 0.5, cz = st.y + 0.5;
    if (st.type === "bed") {
      mbRoundedBox(mb, cx, 0.10, cz, 0.30, 0.10, 0.42, 0.05, rgb(MAT.metal), 2);   // chassis
      mbRoundedBox(mb, cx, 0.24, cz, 0.40, 0.09, 0.46, 0.07, rgb(MAT.bedFrame), 3); // mattress
      mbRoundedBox(mb, cx, 0.38, cz - 0.28, 0.30, 0.06, 0.13, 0.05, rgb("#ffffff"), 3); // pillow
      mbRoundedBox(mb, cx, 0.30, cz + 0.47, 0.34, 0.16, 0.03, 0.03, rgb(MAT.metal), 2); // footboard
    } else {
      const info = STATIONS[st.type];
      const body = rgb(info.color), edge = rgb(info.edge);
      const h = st.type === "delivery" ? 0.92 : 0.72;
      mbRoundedBox(mb, cx, h / 2, cz, 0.42, h / 2, 0.42, 0.10, body, 3);
      mbRoundedBox(mb, cx, h + 0.02, cz, 0.36, 0.03, 0.36, 0.03, edge, 2);   // top trim
      buildStationDetail(mb, st, cx, cz, h);
    }
  }
  return glMesh(mb);
}

/** Per-machine silhouette details so each station is identifiable in 3D. */
function buildStationDetail(mb, st, cx, cz, h) {
  const white = rgb("#ffffff"), dark = rgb("#3c4657");
  switch (st.type) {
    case "supply":
      for (let i = 0; i < 3; i++) {
        mbRoundedBox(mb, cx, 0.20 + i * 0.20, cz + 0.40, 0.30, 0.045, 0.05, 0.02, white, 2);
      }
      break;
    case "medicine":
      mbRoundedBox(mb, cx, h * 0.62, cz + 0.42, 0.07, 0.20, 0.03, 0.02, white, 2);
      mbRoundedBox(mb, cx, h * 0.62, cz + 0.42, 0.20, 0.07, 0.03, 0.02, white, 2);
      break;
    case "xray":
      mbCylinder(mb, cx, h + 0.30, cz, 0.05, 0.05, 0.55, rgb(MAT.metal), 10, true);
      mbRoundedBox(mb, cx, h + 0.58, cz, 0.26, 0.10, 0.20, 0.06, dark, 3);
      mbSphere(mb, cx, h + 0.50, cz + 0.10, 0.09, 0.09, 0.09, rgb("#cfeeff"), 12, 8);
      break;
    case "cast":
      mbCylinder(mb, cx, h + 0.10, cz, 0.22, 0.26, 0.20, rgb("#fdf6e6"), 16, true);
      break;
    case "charger":
      mbRoundedBox(mb, cx, h + 0.16, cz, 0.10, 0.16, 0.05, 0.03, rgb("#fff3c4"), 2);
      break;
    case "lab":
      mbCylinder(mb, cx - 0.12, h + 0.14, cz, 0.06, 0.11, 0.28, rgb("#efe6ff"), 14, true);
      mbCylinder(mb, cx + 0.12, h + 0.10, cz + 0.06, 0.05, 0.09, 0.20, rgb("#dcc6ff"), 14, true);
      break;
    case "delivery":
      mbRoundedBox(mb, cx, h * 0.55, cz + 0.42, 0.34, 0.30, 0.03, 0.03, rgb("#f7e7d2"), 2);
      break;
    case "defibrack":
      mbRoundedBox(mb, cx, h + 0.10, cz, 0.30, 0.10, 0.30, 0.05, rgb("#ffd9d1"), 2);
      break;
  }
}

/** Plants, posters, windows and a clock, placed deterministically. */
function buildDecor(mb, world, rng, isWall) {
  const spots = [];
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++)
      if (isWall(x, y)) spots.push({ x, y, boundary: y === 0 || y === ROWS - 1 || x === 0 || x === COLS - 1 });

  let gap = 0;
  for (const sp of spots) {
    gap++;
    const cx = sp.x + 0.5, cz = sp.y + 0.5;
    const roll = rng();
    const southOpen = isWalkable(world, sp.x, sp.y + 1);

    if (sp.boundary && southOpen && sp.x % 5 === 2) {
      // window punched into the wall face
      mbQuad(mb, [[cx-0.30, 0.34, cz+0.501],[cx+0.30, 0.34, cz+0.501],
                  [cx+0.30, 0.94, cz+0.501],[cx-0.30, 0.94, cz+0.501]],
             rgb("#bfe6f7"), 0, 0, 1);
      mbRoundedBox(mb, cx, 0.64, cz + 0.505, 0.34, 0.34, 0.015, 0.05, rgb("#eaf6fb"), 2);
      mbQuad(mb, [[cx-0.27, 0.37, cz+0.515],[cx+0.27, 0.37, cz+0.515],
                  [cx+0.27, 0.91, cz+0.515],[cx-0.27, 0.91, cz+0.515]],
             rgb("#a9dcf2"), 0, 0, 1);
      continue;
    }
    if (gap < 3) continue;
    if (roll < 0.14) {                       // potted plant on top of the wall
      mbCylinder(mb, cx, WALL_Y + 0.10, cz, 0.15, 0.11, 0.20, rgb("#e08a5f"), 12, true);
      mbSphere(mb, cx, WALL_Y + 0.30, cz, 0.20, 0.17, 0.20, rgb("#79c98a"), 12, 8);
      mbSphere(mb, cx - 0.10, WALL_Y + 0.24, cz + 0.06, 0.12, 0.10, 0.12, rgb("#93d99f"), 10, 7);
      gap = 0;
    } else if (roll < 0.24 && southOpen) {   // poster on the wall face
      mbQuad(mb, [[cx-0.22, 0.42, cz+0.502],[cx+0.22, 0.42, cz+0.502],
                  [cx+0.22, 0.92, cz+0.502],[cx-0.22, 0.92, cz+0.502]],
             rgb("#fffdf6"), 0, 0, 1);
      mbQuad(mb, [[cx-0.15, 0.54, cz+0.508],[cx+0.15, 0.54, cz+0.508],
                  [cx+0.15, 0.80, cz+0.508],[cx-0.15, 0.80, cz+0.508]],
             rgb(roll < 0.19 ? "#ef5d6b" : "#7db2f2"), 0, 0, 1);
      gap = 0;
    } else if (roll < 0.28 && southOpen) {   // wall clock
      mbCylinder(mb, cx, 0.80, cz + 0.50, 0.16, 0.16, 0.05, rgb("#ffffff"), 16, true);
      gap = 0;
    }
  }

  // red cross sign over the entrance
  const e = world.entrance;
  if (isWall(e.x, e.y - 1)) {
    const cx = e.x + 0.5, cz = e.y - 0.5;
    mbRoundedBox(mb, cx, WALL_Y + 0.22, cz, 0.26, 0.26, 0.06, 0.05, rgb("#ffffff"), 2);
    mbRoundedBox(mb, cx, WALL_Y + 0.22, cz - 0.07, 0.07, 0.19, 0.03, 0.02, rgb("#ef5d6b"), 2);
    mbRoundedBox(mb, cx, WALL_Y + 0.22, cz - 0.07, 0.19, 0.07, 0.03, 0.02, rgb("#ef5d6b"), 2);
  }
}

/* ---------------- character rendering ---------------- */

/** Rotate a local offset into world space around the character's facing. */
function _lx(ox, ry, lx, lz) { return ox + lx * Math.cos(ry) + lz * Math.sin(ry); }
function _lz(oz, ry, lx, lz) { return oz - lx * Math.sin(ry) + lz * Math.cos(ry); }

const SKIN_DEFAULT = "#ffdcb8";

/**
 * One plush medic / patient / nurse.
 * o = { wx, wz, ry, bob, step, moving, body, look, scale, y, tucked, mood }
 */
const CHAR_SCALE = 1.85;

function drawCharacter3D(o) {
  const S = (o.scale || 1) * CHAR_SCALE;
  const ox = o.wx, oz = o.wz, ry = o.ry || 0;
  const y0 = (o.y || 0);
  const bob = Math.sin(o.bob || 0) * 0.012 * S;
  const swing = o.moving ? Math.sin(o.step || 0) * 0.10 * S : 0;
  const look = o.look || {};
  const skin = rgb(look.skin || SKIN_DEFAULT);
  const body = rgb(o.body || "#e9eff7");
  const P = (lx, ly, lz) => [_lx(ox, ry, lx * S, lz * S), y0 + ly * S + bob, _lz(oz, ry, lx * S, lz * S)];
  const shadowPass = _pass === "shadow";

  // feet
  if (!o.tucked) {
    let p = P(-0.15, 0.07, swing);
    drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry, 0.11*S, 0.07*S, 0.14*S, rgb("#5b6b80"));
    p = P(0.15, 0.07, -swing);
    drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry, 0.11*S, 0.07*S, 0.14*S, rgb("#5b6b80"));
  }

  // torso
  let p = P(0, 0.34, 0);
  drawMesh(shadowPass ? MESH.sphereLo : MESH.sphere, p[0], p[1], p[2], ry,
           0.29*S, 0.28*S, 0.26*S, body);

  if (!shadowPass) {
    // chest cross
    p = P(0, 0.36, 0.24);
    drawMesh(MESH.box, p[0], p[1], p[2], ry, 0.030*S, 0.085*S, 0.02*S, rgb("#ffffff"));
    drawMesh(MESH.box, p[0], p[1], p[2], ry, 0.075*S, 0.034*S, 0.02*S, rgb("#ffffff"));
    // mitten hands
    p = P(-0.30, 0.36 + swing * 0.4, 0.10);
    drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry, 0.105*S, 0.105*S, 0.105*S, body);
    p = P(0.30, 0.36 - swing * 0.4, 0.10);
    drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry, 0.105*S, 0.105*S, 0.105*S, body);
  }

  // head
  const HY = 0.80;
  p = P(0, HY, 0);
  drawMesh(shadowPass ? MESH.sphereLo : MESH.sphere, p[0], p[1], p[2], ry,
           0.31*S, 0.31*S, 0.31*S, skin);
  if (shadowPass) return;

  // eyes: dark bead + specular pip, set into the face
  for (const sx of [-1, 1]) {
    p = P(sx * 0.108, HY + 0.035, 0.288);
    drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry, 0.060*S, 0.074*S, 0.052*S, rgb("#33292b"));
    p = P(sx * 0.128, HY + 0.075, 0.300);
    drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry, 0.026*S, 0.026*S, 0.026*S, rgb("#ffffff"), 0.9);
  }
  // blush
  for (const sx of [-1, 1]) {
    p = P(sx * 0.215, HY - 0.055, 0.225);
    drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry, 0.072*S, 0.046*S, 0.032*S, rgb("#ff9aab"));
  }

  // hair
  const hair = rgb(look.hair || "#5b4635");
  if (look.style === "curls") {
    for (const dx of [-0.20, -0.10, 0, 0.10, 0.20]) {
      p = P(dx, HY + 0.10, -0.16);
      drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry, 0.100*S, 0.090*S, 0.100*S, hair);
    }
  } else if (look.style === "puffs") {
    for (const sx of [-1, 1]) {
      p = P(sx * 0.335, HY + 0.02, -0.02);
      drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry, 0.135*S, 0.135*S, 0.135*S, hair);
    }
    p = P(0, HY + 0.06, -0.12);
    drawMesh(MESH.dome, p[0], p[1], p[2], ry, 0.29*S, 0.20*S, 0.29*S, hair);
  } else if (look.style === "fringe") {
    p = P(0, HY + 0.115, 0.175);
    drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry, 0.245*S, 0.085*S, 0.215*S, hair);
  }

  if (look.acc === "hijab") {
    const hc = rgb(look.accColor || "#7fd8c8");
    p = P(0, HY - 0.02, -0.04);
    drawMesh(MESH.sphere, p[0], p[1], p[2], ry, 0.345*S, 0.345*S, 0.295*S, hc);
    p = P(0, HY - 0.30, 0.02);
    drawMesh(MESH.sphereLo, p[0], p[1], p[2], ry, 0.20*S, 0.13*S, 0.16*S, hc);
  } else {
    // scrub cap
    const cap = rgb(o.cap || "#8fd0f0");
    p = P(0, HY + 0.135, -0.02);
    drawMesh(MESH.dome, p[0], p[1], p[2], ry, 0.318*S, 0.245*S, 0.318*S, cap);
    p = P(0, HY + 0.135, -0.02);
    drawMesh(MESH.cyl, p[0], p[1], p[2], ry, 0.328*S, 0.048*S, 0.328*S, cap);
    p = P(0, HY + 0.36, 0.0);
    drawMesh(MESH.box, p[0], p[1], p[2], ry, 0.022*S, 0.055*S, 0.03*S, rgb("#ffffff"));
    drawMesh(MESH.box, p[0], p[1], p[2], ry, 0.055*S, 0.022*S, 0.03*S, rgb("#ffffff"));
    if (look.acc === "catcap") {
      for (const sx of [-1, 1]) {
        p = P(sx * 0.20, HY + 0.42, -0.03);
        drawMesh(MESH.cone, p[0], p[1], p[2], ry, 0.10*S, 0.17*S, 0.06*S, cap);
      }
    }
  }
  if (look.acc === "glasses") {
    for (const sx of [-1, 1]) {
      p = P(sx * 0.112, HY + 0.045, 0.300);
      drawMesh(MESH.torus, p[0], p[1], p[2], ry, 0.085*S, 0.085*S, 0.085*S, rgb("#4a4038"));
    }
  }
}

/* ---------------- camera ---------------- */

const CAM = { pitch: 0.93, yaw: 0, dist: 26, tx: 16, ty: 0, tz: 8, shake: 0 };

function buildCamera(aspect, orbit) {
  const yaw = CAM.yaw + (orbit || 0);
  const cp = Math.cos(CAM.pitch), sp = Math.sin(CAM.pitch);
  const ex = CAM.tx + Math.sin(yaw) * CAM.dist * cp;
  const ey = CAM.ty + CAM.dist * sp;
  const ez = CAM.tz + Math.cos(yaw) * CAM.dist * cp;
  let sx = 0, sy = 0;
  if (CAM.shake > 0) {
    sx = (Math.random() - 0.5) * CAM.shake * 0.02;
    sy = (Math.random() - 0.5) * CAM.shake * 0.02;
  }
  GL.camEye[0] = ex; GL.camEye[1] = ey; GL.camEye[2] = ez;
  m4LookAt(GL.view, ex, ey, ez, CAM.tx + sx, CAM.ty + sy, CAM.tz, 0, 1, 0);
  m4Perspective(GL.proj, 0.62, aspect, 0.5, 90);
  m4Mul(GL.viewProj, GL.proj, GL.view);
}

/** Pull the camera back until the whole ward is inside the frame. */
function fitCamera(aspect) {
  const corners = [];
  for (const x of [0, COLS]) for (const z of [0, ROWS]) for (const y of [0, WALL_Y + 0.6]) corners.push([x, y, z]);
  let lo = 12, hi = 70;
  for (let it = 0; it < 26; it++) {
    const mid = (lo + hi) / 2;
    CAM.dist = mid;
    buildCamera(aspect, 0);
    let fits = true;
    for (const c of corners) {
      const m = GL.viewProj;
      const cw = m[3]*c[0] + m[7]*c[1] + m[11]*c[2] + m[15];
      if (cw <= 0.01) { fits = false; break; }
      const nx = (m[0]*c[0] + m[4]*c[1] + m[8]*c[2] + m[12]) / cw;
      const ny = (m[1]*c[0] + m[5]*c[1] + m[9]*c[2] + m[13]) / cw;
      if (Math.abs(nx) > 0.995 || Math.abs(ny) > 0.985) { fits = false; break; }
    }
    if (fits) hi = mid; else lo = mid;
  }
  CAM.dist = hi;
  buildCamera(aspect, 0);
}

function projectToScreen(wx, wy, wz) {
  const m = GL.viewProj;
  const cw = m[3]*wx + m[7]*wy + m[11]*wz + m[15];
  if (cw <= 0.001) return null;
  const nx = (m[0]*wx + m[4]*wy + m[8]*wz + m[12]) / cw;
  const ny = (m[1]*wx + m[5]*wy + m[9]*wz + m[13]) / cw;
  return {
    x: PLAY_X + (nx * 0.5 + 0.5) * PLAY_W,
    y: PLAY_Y + (1 - (ny * 0.5 + 0.5)) * PLAY_H
  };
}

/* ---------------- scene assembly ---------------- */

function bedTopY() { return 0.34; }

/** Everything dynamic in the ward, for whichever pass is active. */
function drawSceneEntities() {
  const world = Game.world;

  // bed blankets (colour tracks occupancy)
  for (const st of world.stations) {
    if (st.type !== "bed") continue;
    const cx = st.x + 0.5, cz = st.y + 0.5;
    if (_pass !== "shadow") {
      drawMesh(MESH.boxSoft, cx, 0.40, cz + 0.10, 0, 0.395, 0.085, 0.34,
               rgb(st.occupant ? "#ff9fb6" : "#a8d4f5"));
      drawMesh(MESH.boxSoft, cx, 0.45, cz - 0.20, 0, 0.395, 0.055, 0.09,
               rgb("#ffffff"));
    }
  }

  // loose items
  for (const it of Game.floorItems) {
    const t = performance.now() / 600 + it.id;
    drawItem3D(it.type, it.x * T2W, 0.16 + Math.sin(t) * 0.02, it.y * T2W, t * 0.4);
  }

  // patients not being carried
  for (const pt of Game.patients) {
    if (pt.state === "carried") continue;
    drawPatient3D(pt);
  }

  // medics
  for (const p of Game.players) drawPlayer3D(p);
  if (Game.nurse) drawNurse3D(Game.nurse);
}

const HAIRS = ["#6b5140", "#3f3833", "#8a5a33", "#54646e"];

function patientLook(pt) {
  return { skin: pt.done ? "#ffddb8" : "#fbd4a8", hair: HAIRS[pt.id % 4], style: "fringe", acc: "none" };
}

function drawPatient3D(pt) {
  const inBed = pt.station && pt.station.type === "bed";
  const wx = pt.x * T2W, wz = pt.y * T2W;
  drawCharacter3D({
    wx, wz,
    ry: inBed ? 0 : Math.PI,
    y: inBed ? bedTopY() + 0.04 : 0,
    bob: pt.bob, step: pt.bob * 1.6, moving: pt.state === "walking",
    body: pt.done ? "#b9edcb" : "#e9eff7",
    cap: pt.done ? "#8ce0a8" : "#dfe7f2",
    look: patientLook(pt),
    tucked: inBed,
    scale: 0.92
  });
  if (inBed && _pass !== "shadow") {
    // duvet drawn over the lower body
    drawMesh(MESH.boxSoft, wx, bedTopY() + 0.13, wz + 0.14, 0,
             0.385, 0.105, 0.30, rgb(pt.done ? "#93e5b0" : "#ff9fb6"));
  }
  if (pt.vip && _pass !== "shadow") {
    const t = performance.now() / 700;
    drawMesh(MESH.torus, wx, (inBed ? bedTopY() + 0.04 : 0) + 1.28, wz, t,
             0.13, 0.13, 0.13, rgb("#ffd54a"), 0.75);
  }
}

function drawPlayer3D(p) {
  const ry = Math.atan2(p.dx || 0, p.dy || 1);
  const wx = p.x * T2W, wz = p.y * T2W;
  const squash = p.squash > 0 ? Math.sin((p.squash / 0.18) * Math.PI) * 0.10 : 0;
  drawCharacter3D({
    wx, wz, ry,
    bob: p.bob, step: p.step || 0, moving: !!p.moving,
    body: p.index === 0 ? "#4fb8e8" : "#ff8f70",
    cap: p.index === 0 ? "#4fb8e8" : "#ff8f70",
    look: p.look || CHARACTERS[p.index % CHARACTERS.length],
    scale: 1 + squash * 0.5
  });
  if (_pass === "shadow") return;

  // carried patient rides on the shoulders; items float in front
  if (p.patient) {
    drawCharacter3D({
      wx: _lx(wx, ry, 0, -0.12), wz: _lz(wz, ry, 0, -0.12), ry,
      y: 1.16, bob: p.bob * 0.5, step: 0, moving: false,
      body: p.patient.done ? "#b9edcb" : "#e9eff7",
      cap: p.patient.done ? "#8ce0a8" : "#dfe7f2",
      look: patientLook(p.patient), scale: 0.72
    });
  } else if (p.item) {
    const bobY = Math.sin(p.bob * 0.6) * 0.02;
    drawItem3D(p.item.type, _lx(wx, ry, 0, 0.34), 0.62 + bobY, _lz(wz, ry, 0, 0.34), ry);
  }
}

function drawNurse3D(nu) {
  const ry = Math.atan2(nu.dx || 0, nu.dy || 1);
  drawCharacter3D({
    wx: nu.x * T2W, wz: nu.y * T2W, ry,
    bob: nu.bob, step: nu.step || 0, moving: !!nu.moving,
    body: "#ffffff", cap: "#ffd7e0",
    look: { skin: "#f6cfa6", hair: "#8a5a33", style: "fringe", acc: "none" },
    scale: 0.95
  });
}

/* ---------------- passes ---------------- */

function renderWorld3D(orbit) {
  const gl = GL.gl;
  const world = Game.world;
  if (!world.mesh) world.mesh = buildLevelMesh(world);

  // the ward camera owns its own framing; menus must not leak theirs in
  CAM.tx = COLS / 2; CAM.ty = 0; CAM.tz = ROWS / 2; CAM.pitch = 0.93;
  if (!world.camDist) {
    fitCamera(PLAY_W / PLAY_H);
    world.camDist = CAM.dist * 0.93;      // crop the empty corners a little
  }
  CAM.dist = world.camDist;

  // ---- shadow pass ----
  const cx = COLS / 2, cz = ROWS / 2;
  const L = LIGHT_DIR;
  const ll = Math.hypot(L[0], L[1], L[2]);
  const lx = -L[0]/ll, ly = -L[1]/ll, lz = -L[2]/ll;      // surface -> light
  const D = 24;
  const lightView = m4();
  m4LookAt(lightView, cx + lx*D, ly*D, cz + lz*D, cx, 0, cz, 0, 1, 0);
  const lightProj = m4();
  m4Ortho(lightProj, -19, 19, -13, 13, 1, 52);
  m4Mul(GL.lightVP, lightProj, lightView);

  gl.bindFramebuffer(gl.FRAMEBUFFER, GL.shadowFB);
  gl.viewport(0, 0, GL.SHADOW_RES, GL.SHADOW_RES);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.useProgram(GL.shadowProg);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.FRONT);                                   // peter-panning guard
  _pass = "shadow";
  drawMesh(world.mesh, 0, 0, 0, 0, 1, 1, 1);
  drawSceneEntities();
  gl.cullFace(gl.BACK);

  // ---- main pass ----
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(PLAY_X, H - (PLAY_Y + PLAY_H), PLAY_W, PLAY_H);
  gl.scissor(PLAY_X, H - (PLAY_Y + PLAY_H), PLAY_W, PLAY_H);
  gl.enable(gl.SCISSOR_TEST);
  gl.clearColor(0.055, 0.075, 0.105, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  buildCamera(PLAY_W / PLAY_H, orbit);
  gl.useProgram(GL.prog);
  const u = GL.prog.u;
  gl.uniform3fv(u.uCam, GL.camEye);
  gl.uniform3f(u.uLightDir, lx, ly, lz);
  gl.uniformMatrix4fv(u.uLightVP, false, GL.lightVP);
  gl.uniform1f(u.uShadowTexel, 1 / GL.SHADOW_RES);
  gl.uniform1f(u.uAmb, 0.46); gl.uniform1f(u.uKey, 0.78);
  gl.uniform1f(u.uShadowOn, 1);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, GL.shadowTex);
  gl.uniform1i(u.uShadow, 0);
  _pass = "main";
  drawMesh(world.mesh, 0, 0, 0, 0, 1, 1, 1);
  drawSceneEntities();
  gl.disable(gl.SCISSOR_TEST);
}

/**
 * Pick a few long open corridor runs for the title medics to pace along.
 * Straight runs of free tiles only, so nobody ever walks through a wall.
 */
function showcaseLanes(world) {
  const runs = [];
  for (let y = 1; y < ROWS - 1; y++) {
    let x = 1;
    while (x < COLS - 1) {
      if (world.grid[y][x].solid) { x++; continue; }
      let e = x;
      while (e < COLS - 1 && !world.grid[y][e].solid) e++;
      if (e - x >= 7) runs.push({ y, x0: x + 0.5, x1: e - 1.5 });
      x = e + 1;
    }
  }
  runs.sort((a, b) => (b.x1 - b.x0) - (a.x1 - a.x0));
  const picked = [];
  for (const r of runs) {
    if (picked.every(p => Math.abs(p.y - r.y) >= 3)) picked.push(r);
    if (picked.length === 3) break;
  }
  return picked;
}

/** Title backdrop: the ward, slowly orbiting, with a shift on the floor. */
let _showcase = null;
function renderShowcase() {
  const gl = GL.gl;
  if (!_showcase) {
    const keep = Game.perksActive;
    Game.perksActive = [];
    _showcase = makeWorld(LEVELS[0]);
    Game.perksActive = keep;
  }
  if (!_showcase.mesh) _showcase.mesh = buildLevelMesh(_showcase);

  const t = performance.now() / 9000;
  const keep = { d: CAM.dist, p: CAM.pitch, tx: CAM.tx, ty: CAM.ty, tz: CAM.tz };
  // framed as a hero shot in the upper-middle band, clear of the control panels
  CAM.tx = COLS / 2; CAM.ty = -2.6; CAM.tz = ROWS / 2;
  CAM.pitch = 0.80;
  fitCamera(W / H);
  CAM.dist *= 1.16;
  buildCamera(W / H, Math.sin(t) * 0.42);
  Object.assign(CAM, { pitch: keep.p });

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.disable(gl.SCISSOR_TEST);
  gl.clearColor(0.043, 0.058, 0.086, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.useProgram(GL.prog);
  const u = GL.prog.u;
  const L = LIGHT_DIR, ll = Math.hypot(L[0], L[1], L[2]);
  m4Identity(GL.lightVP);
  gl.uniform3fv(u.uCam, GL.camEye);
  gl.uniform3f(u.uLightDir, -L[0]/ll, -L[1]/ll, -L[2]/ll);
  gl.uniformMatrix4fv(u.uLightVP, false, GL.lightVP);
  gl.uniform1f(u.uShadowTexel, 1 / GL.SHADOW_RES);
  // dimmer than gameplay: the menu type has to stay readable on top of it
  gl.uniform1f(u.uAmb, 0.38); gl.uniform1f(u.uKey, 0.62);
  gl.uniform1f(u.uShadowOn, 0);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, GL.shadowTex);
  gl.uniform1i(u.uShadow, 0);
  _pass = "main";
  drawMesh(_showcase.mesh, 0, 0, 0, 0, 1, 1, 1);

  // a shift on duty: medics pacing the corridors so the ward is not a dead set
  if (!_showcase.lanes) _showcase.lanes = showcaseLanes(_showcase);
  const now = performance.now() / 1000;
  const tints = ["#4fb8e8", "#ff8f70", "#8be9c0"];
  _showcase.lanes.forEach((ln, i) => {
    const span = ln.x1 - ln.x0;
    const phase = now * 0.30 + i * 0.7;
    const u01 = (Math.sin(phase) + 1) / 2;          // ping-pong along the run
    const tx = ln.x0 + span * u01;
    const dir = Math.cos(phase) >= 0 ? 1 : -1;
    drawCharacter3D({
      wx: tx, wz: ln.y + 0.5,
      ry: dir > 0 ? Math.PI / 2 : -Math.PI / 2,
      bob: now * 9, step: now * 9, moving: true,
      body: tints[i], cap: tints[i],
      look: CHARACTERS[(i * 2 + 1) % CHARACTERS.length]
    });
  });

  CAM.dist = keep.d; CAM.pitch = keep.p;
  CAM.tx = keep.tx; CAM.ty = keep.ty; CAM.tz = keep.tz;
}

/** Six medics on a turntable for the character picker. */
function renderPortraits() {
  const gl = GL.gl;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.disable(gl.SCISSOR_TEST);
  gl.clearColor(0.043, 0.058, 0.086, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  const n = CHARACTERS.length;
  const keep = { d: CAM.dist, p: CAM.pitch, tx: CAM.tx, ty: CAM.ty, tz: CAM.tz };
  CAM.tx = 0; CAM.ty = 0.30; CAM.tz = 0; CAM.pitch = 0.20; CAM.dist = 15.0;
  buildCamera(W / H, 0);
  gl.useProgram(GL.prog);
  const u = GL.prog.u;
  // portrait key light sits beside the camera so faces are lit, not silhouetted
  const kl = Math.hypot(0.34, 0.60, 0.72);
  m4Identity(GL.lightVP);
  gl.uniform3fv(u.uCam, GL.camEye);
  gl.uniform3f(u.uLightDir, -0.34/kl, 0.60/kl, 0.72/kl);
  gl.uniformMatrix4fv(u.uLightVP, false, GL.lightVP);
  gl.uniform1f(u.uShadowTexel, 1 / GL.SHADOW_RES);
  gl.uniform1f(u.uAmb, 0.78); gl.uniform1f(u.uKey, 0.92);
  gl.uniform1f(u.uShadowOn, 0);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, GL.shadowTex);
  gl.uniform1i(u.uShadow, 0);
  _pass = "main";

  const t = performance.now() / 1000;
  for (let i = 0; i < n; i++) {
    const sel = Game.charCursor[0] === i || (Game.playerCount === 2 && Game.charCursor[1] === i);
    const spread = 2.5;
    const wx = (i - (n - 1) / 2) * spread;
    drawCharacter3D({
      wx, wz: 0, ry: Math.sin(t * 0.6 + i) * 0.5,
      bob: t * 2 + i, step: 0, moving: false,
      body: Game.charCursor[1] === i && Game.charCursor[0] !== i ? "#ff8f70" : "#4fb8e8",
      cap: Game.charCursor[1] === i && Game.charCursor[0] !== i ? "#ff8f70" : "#4fb8e8",
      look: CHARACTERS[i],
      scale: sel ? 1.12 : 0.94
    });
  }
  CAM.dist = keep.d; CAM.pitch = keep.p;
  CAM.tx = keep.tx; CAM.ty = keep.ty; CAM.tz = keep.tz;
}

function clearGL(r, g2, b) {
  const gl = GL.gl;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.disable(gl.SCISSOR_TEST);
  gl.clearColor(r, g2, b, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
}

/* ---------------------------------------------------------------------
   11. RENDERING

   The static parts of a level (floor, walls, painted decals) are baked once
   into an offscreen canvas; only entities and lighting are redrawn per frame.
   --------------------------------------------------------------------- */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const canvas3d = document.getElementById("gl");
const stack = document.getElementById("stack");

function fitCanvas() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  const w = Math.floor(W * s), h = Math.floor(H * s);
  for (const c of [canvas, canvas3d]) {
    c.style.width = w + "px";
    c.style.height = h + "px";
  }
  stack.style.width = w + "px";
  stack.style.height = h + "px";
}
window.addEventListener("resize", fitCanvas);
fitCanvas();
initGL(canvas3d);

/* --- cached paints ------------------------------------------------------ */

const Paint = {};
function initPaints() {
  const v = ctx.createRadialGradient(PLAY_W / 2, PLAY_H / 2, PLAY_H * 0.30,
                                     PLAY_W / 2, PLAY_H / 2, PLAY_H * 0.95);
  v.addColorStop(0, "rgba(0,0,0,0)");
  v.addColorStop(1, "rgba(95,70,45,0.20)");
  Paint.vignette = v;

  const hud = ctx.createLinearGradient(0, 0, 0, HUD_H);
  hud.addColorStop(0, "#1b2636");
  hud.addColorStop(1, "#111925");
  Paint.hud = hud;

  const t = ctx.createLinearGradient(0, 0, 0, H);
  t.addColorStop(0, "#0b1220");
  t.addColorStop(0.55, "#101b2c");
  t.addColorStop(1, "#0a1018");
  Paint.title = t;
}
initPaints();
